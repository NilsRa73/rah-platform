plugins {
    id 'com.android.application'
}

def releaseKeystorePath = System.getenv('RAH_ANDROID_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('RAH_ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('RAH_ANDROID_KEY_ALIAS')
def releaseKeyPassword = System.getenv('RAH_ANDROID_KEY_PASSWORD')
def hasReleaseSigning = releaseKeystorePath &&
        releaseStorePassword &&
        releaseKeyAlias &&
        releaseKeyPassword &&
        file(releaseKeystorePath).exists()

android {
    namespace 'com.rah.stormtv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.rah.stormtv'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    signingConfigs {
        if (hasReleaseSigning) {
            create('release') {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.getByName('release')
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
}
