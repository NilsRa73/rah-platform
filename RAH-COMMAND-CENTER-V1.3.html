<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08090c">
<title>RAH Raven Command Center v1.3 Stable</title>
<style>
html,body{margin:0;min-height:100%;background:#08090c;color:#f1efe7;font-family:Inter,Segoe UI,system-ui,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;padding:24px}.card{max-width:680px;border:1px solid #303640;border-radius:16px;background:#11141a;padding:24px}.gold{color:#f2d47d}.muted{color:#9da3ae}.bad{color:#ffb4b4}
</style>
</head>
<body>
<div class="boot"><div class="card"><strong class="gold">RAH RAVEN · CC 1.3 STABLE</strong><h1>Loading policy-bound Command Center…</h1><p class="muted" id="status">Loading the immutable v1.2 UI surface and Stable v1.3 policy core.</p></div></div>
<script>
(async function(){
'use strict';
const SOURCE='RAH-COMMAND-CENTER-V1.2.html';
const MARKER='<script src="rah-command-center-core.js"><\/script><script>';
const INJECTION='<script src="rah-command-center-core.js"><\/script><script src="rah-command-center-core-v1.3.js"><\/script><script>window.RAHCommandCenterCore=window.RAHCommandCenterCoreV13;<\/script><script>';
const status=document.getElementById('status');
try{
  const sourceUrl=new URL(SOURCE,window.location.href);
  if(sourceUrl.origin!==window.location.origin)throw new Error('Stable source must be same-origin.');
  const response=await fetch(sourceUrl.href,{cache:'no-store',credentials:'same-origin',redirect:'follow'});
  if(!response.ok)throw new Error('Rollback v1.2 surface unavailable ('+response.status+').');
  if(new URL(response.url).origin!==window.location.origin)throw new Error('Cross-origin redirect rejected.');
  const rollbackHtml=await response.text();
  const first=rollbackHtml.indexOf(MARKER);
  if(first<0||rollbackHtml.indexOf(MARKER,first+MARKER.length)>=0)throw new Error('Expected unique rollback core marker not found.');
  let stableHtml=rollbackHtml.replace(MARKER,INJECTION);
  stableHtml=stableHtml.replace('<title>RAH Raven Command Center v1.2.0</title>','<title>RAH Raven Command Center v1.3.0</title>');
  stableHtml=stableHtml.replace('CC v1.2.0 · Raven 2.0.32','CC v1.3.0 · Raven 2.0.32');
  stableHtml=stableHtml.replace('RAH Raven Command Center v1.2 · session-bound enrollment','RAH Raven Command Center v1.3 · policy-bound enrollment');
  document.open();
  document.write(stableHtml);
  document.close();
}catch(error){
  status.className='bad';
  status.textContent='Stable failed closed: '+(error&&error.message?error.message:'unknown loader error');
}
})();
</script>
</body>
</html>
