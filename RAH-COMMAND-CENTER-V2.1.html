<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08090c"><title>RAH Raven Command Center v2.1 Stable</title><style>html,body{margin:0;min-height:100%;background:#08090c;color:#f1efe7;font-family:Inter,Segoe UI,system-ui,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;padding:24px}.card{max-width:800px;border:1px solid #303640;border-radius:16px;background:#11141a;padding:24px}.gold{color:#f2d47d}.muted{color:#9da3ae}.bad{color:#ffb4b4}</style></head>
<body><div class="boot"><div class="card"><strong class="gold">RAH RAVEN · CC 2.1 STABLE</strong><h1>Loading manual Fleet Snapshot Command Center…</h1><p class="muted" id="status">Stable 2.1 pins the gated Manual Fleet Snapshot Candidate. Fleet refresh remains explicit, token-proof authenticated and memory-only.</p></div></div>
<script>
(async function(){
'use strict';
const SOURCE='RAH-COMMAND-CENTER-V2.1-CANDIDATE.html';
const CANDIDATE_TAG='<script src="rah-command-center-core-v2.1-candidate.js"><\\/script>';
const STABLE_TAG='<script src="rah-command-center-core-v2.1-candidate.js"><\\/script><script src="rah-command-center-core-v2.1.js"><\\/script><script>window.RAHCommandCenterFleetSnapshotCandidate=window.RAHCommandCenterCoreV21;<\\/script>';
const status=document.getElementById('status');
try{
  const sourceUrl=new URL(SOURCE,window.location.href);
  if(sourceUrl.origin!==window.location.origin)throw new Error('Stable implementation source must be same-origin.');
  const response=await fetch(sourceUrl.href,{cache:'no-store',credentials:'same-origin',redirect:'follow'});
  if(!response.ok)throw new Error('Pinned CC 2.1 Candidate unavailable ('+response.status+').');
  if(new URL(response.url).origin!==window.location.origin)throw new Error('Cross-origin redirect rejected.');
  let html=await response.text();
  const required=['rah-command-center-core-v2.1-candidate.js','RAH Raven Command Center v2.1 Candidate','MANUAL FLEET SNAPSHOT','window.RAHCommandCenterFleetSnapshotCandidate'];
  for(const marker of required)if(!html.includes(marker))throw new Error('Expected pinned Candidate marker missing: '+marker);
  const first=html.indexOf(CANDIDATE_TAG);
  if(first<0||html.indexOf(CANDIDATE_TAG,first+CANDIDATE_TAG.length)>=0)throw new Error('Expected unique Candidate core marker not found.');
  html=html.replace(CANDIDATE_TAG,STABLE_TAG);
  html=html.replaceAll('RAH Raven Command Center v2.1 Candidate','RAH Raven Command Center v2.1 Stable');
  html=html.replaceAll('v2.1 Candidate','v2.1 Stable');
  html=html.replaceAll('Candidate failed closed','Stable failed closed');
  document.open();document.write(html);document.close();
}catch(error){status.className='bad';status.textContent='Stable failed closed: '+(error&&error.message?error.message:'unknown loader error');}
})();
</script></body></html>
