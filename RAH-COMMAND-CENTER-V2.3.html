<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08090c"><title>RAH Raven Command Center v2.3 Stable</title><style>html,body{margin:0;min-height:100%;background:#08090c;color:#f1efe7;font-family:Inter,Segoe UI,system-ui,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;padding:24px}.card{max-width:800px;border:1px solid #303640;border-radius:16px;background:#11141a;padding:24px}.gold{color:#f2d47d}.muted{color:#9da3ae}.bad{color:#ffb4b4}</style></head>
<body><div class="boot"><div class="card"><strong class="gold">RAH RAVEN · CC 2.3 STABLE</strong><h1>Loading registry-bound Fleet Snapshot Command Center…</h1><p class="muted" id="status">Stable 2.3 pins the gated registry-binding Candidate. Exact Node1.3 / 4 capabilities / 3 actions / 5 routes remain unchanged.</p></div></div>
<script>
(async function(){
'use strict';
const SOURCE='RAH-COMMAND-CENTER-V2.3-CANDIDATE.html';
const status=document.getElementById('status');
function replaceOnce(text,from,to,label){const first=text.indexOf(from);if(first<0||text.indexOf(from,first+from.length)>=0)throw new Error('Expected unique '+label+' marker missing.');return text.slice(0,first)+to+text.slice(first+from.length)}
try{
  const sourceUrl=new URL(SOURCE,window.location.href);
  if(sourceUrl.origin!==window.location.origin)throw new Error('Stable implementation source must be same-origin.');
  const response=await fetch(sourceUrl.href,{cache:'no-store',credentials:'same-origin',redirect:'follow'});
  if(!response.ok)throw new Error('Pinned CC 2.3 Candidate unavailable ('+response.status+').');
  if(new URL(response.url).origin!==window.location.origin)throw new Error('Cross-origin redirect rejected.');
  let html=await response.text();
  for(const marker of ['RAH Raven Command Center v2.3 Candidate','rah-command-center-core-v2.3-candidate.js','window.RAHCommandCenterFleetRegistryBindingCandidate','pruneFleetSnapshotRows(fleetRows,devices)'])if(!html.includes(marker))throw new Error('Expected pinned Candidate marker missing: '+marker);
  const oldCore="await loadLocalScript('rah-command-center-core-v2.1.js');await loadLocalScript('rah-command-center-core-v2.2-candidate.js');await loadLocalScript('rah-command-center-core-v2.2.js');await loadLocalScript('rah-command-center-core-v2.3-candidate.js');const core=window.RAHCommandCenterFleetRegistryBindingCandidate;if(!core||core.CC_VERSION!=='2.3.0-candidate')throw Error('CC 2.3 Candidate core failed closed.');";
  const stableCore="await loadLocalScript('rah-command-center-core-v2.1.js');await loadLocalScript('rah-command-center-core-v2.2-candidate.js');await loadLocalScript('rah-command-center-core-v2.2.js');await loadLocalScript('rah-command-center-core-v2.3-candidate.js');await loadLocalScript('rah-command-center-core-v2.3.js');const core=window.RAHCommandCenterCoreV23;if(!core||core.CC_VERSION!=='2.3.0')throw Error('CC 2.3 Stable core failed closed.');";
  html=replaceOnce(html,oldCore,stableCore,'CC 2.3 core promotion');
  html=html.replaceAll('RAH Raven Command Center v2.3 Candidate','RAH Raven Command Center v2.3 Stable');
  html=html.replaceAll('v2.3 Candidate','v2.3 Stable');
  html=html.replaceAll('CC 2.3 CANDIDATE','CC 2.3 STABLE');
  html=html.replaceAll('Candidate failed closed','Stable failed closed');
  document.open();document.write(html);document.close();
}catch(error){status.className='bad';status.textContent='Stable failed closed: '+(error&&error.message?error.message:'unknown loader error');}
})();
</script></body></html>
