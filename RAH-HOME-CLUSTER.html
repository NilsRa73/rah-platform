<!doctype html>
<html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAH Home Cluster</title>
<style>:root{color-scheme:dark;--gold:#f2ca62;--line:#5d4719;--muted:#aaa;--good:#78e3a7;--bad:#ff9696}*{box-sizing:border-box}body{margin:0;background:#070707;color:#f7f1df;font:16px Segoe UI,Arial,sans-serif;padding:22px;min-height:100vh}main{max-width:1150px;margin:auto}h1,h2{color:var(--gold)}a,button,input,select{font:inherit;border:1px solid #8e6c20;background:#201805;color:#ffe493;border-radius:10px;padding:10px 12px;text-decoration:none}.primary{background:linear-gradient(135deg,#ffe88d,#b97a10);color:#181005;border:0;font-weight:800}.bar,.buttons,.form{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}.panel,.card{background:#111;border:1px solid var(--line);border-radius:16px;padding:16px}.sub{color:var(--muted)}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:12px;color:#f4d77f}.leader{border-color:#b98a23}.good{color:var(--good)}.items{display:grid;gap:8px}.item{display:flex;gap:10px;justify-content:space-between;align-items:center;background:#090909;border:1px solid #30260f;border-radius:10px;padding:10px}.notice{margin:14px 0;padding:12px;border:1px solid var(--line);border-radius:12px}</style></head><body><main>
<div class="bar"><div><h1>🧠 RAH HOME CLUSTER</h1><div class="sub">Prototype v0.1 · klarerte noder → lokal cluster-plan → simulert jobbkø</div></div><div class="buttons"><a href="RAH-HOME-TRUST.html">Home Trust</a><a href="RAH-HOME-CONTROL.html">Home Control</a></div></div>
<section class="panel" style="margin:16px 0"><h2>Cluster-status</h2><p class="sub">Denne prototypen planlegger og simulerer fordeling lokalt. Den sender ikke jobber over nettverket ennå.</p><div id="summary"></div><div id="notice" class="notice" hidden></div></section>
<section><h2>Klarerte noder</h2><div id="nodes" class="grid"></div></section>
<section class="panel" style="margin-top:18px"><h2>Jobbkø</h2><div class="form"><input id="taskName" placeholder="Oppgave, f.eks. Render video" style="flex:1 1 260px"><select id="taskKind"><option>Generell</option><option>AI</option><option>Render</option><option>Analyse</option><option>Backup</option></select><button id="addTask" class="primary">Legg i kø</button><button id="runSim">Simuler fordeling</button><button id="clearTasks">Tøm kø</button></div><div id="tasks" class="items" style="margin-top:12px"></div></section>
<script>
const HOME_KEY='rah-home-control-v03',TRUST_KEY='rah-home-trust-v01',CLUSTER_KEY='rah-home-cluster-v01';
const $=id=>document.getElementById(id);
function read(k,fallback){try{const raw=localStorage.getItem(k);return raw?JSON.parse(raw):fallback}catch{return fallback}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch{return false}}
function fp(d){return[d.id||'',d.ip||'',d.name||''].join('|')}
function home(){const x=read(HOME_KEY,null);return x&&Array.isArray(x.devices)?x:null}
function trust(){const x=read(TRUST_KEY,{version:1,devices:{}});return x&&x.devices?x:{version:1,devices:{}}}
function cluster(){const x=read(CLUSTER_KEY,{version:1,leaderId:null,enabledIds:[],tasks:[]});return x&&x.version===1&&Array.isArray(x.enabledIds)&&Array.isArray(x.tasks)?x:{version:1,leaderId:null,enabledIds:[],tasks:[]}}
function tell(t){const e=$('notice');e.textContent=t;e.hidden=false}
function eligible(){const h=home(),tr=trust();if(!h)return[];return h.devices.filter(d=>tr.devices[fp(d)]&&tr.devices[fp(d)].trusted)}
function updateCluster(mutator){const c=cluster(),before=JSON.parse(JSON.stringify(c));mutator(c);if(!save(CLUSTER_KEY,c)){save(CLUSTER_KEY,before);tell('Cluster-planen kunne ikke lagres. Endringen ble rullet tilbake.');return false}render();return true}
function render(){const list=eligible(),c=cluster(),root=$('nodes');root.textContent='';const ids=new Set(list.map(d=>d.id));c.enabledIds=c.enabledIds.filter(id=>ids.has(id));if(c.leaderId&&!ids.has(c.leaderId))c.leaderId=null;save(CLUSTER_KEY,c);if(!list.length){root.innerHTML='<div class="panel sub">Ingen klarerte enheter. Klarer minst én enhet i RAH Home Trust først.</div>'}list.forEach(d=>{const enabled=c.enabledIds.includes(d.id),leader=c.leaderId===d.id,card=document.createElement('article');card.className='card'+(leader?' leader':'');const h=document.createElement('h2');h.textContent=d.name;const badge=document.createElement('span');badge.className='pill';badge.textContent=leader?'LEDER':(enabled?'WORKER':'TILGJENGELIG');const p=document.createElement('p');p.className='sub';p.textContent=(d.ip||'Ikke satt')+' · '+(d.connection||'Ukjent')+' · '+(d.role||'Ubestemt');const buttons=document.createElement('div');buttons.className='buttons';const toggle=document.createElement('button');toggle.textContent=enabled?'Fjern worker':'Bruk som worker';toggle.onclick=()=>updateCluster(x=>{x.enabledIds=enabled?x.enabledIds.filter(id=>id!==d.id):[...new Set([...x.enabledIds,d.id])]});const lead=document.createElement('button');lead.className='primary';lead.textContent=leader?'Er leder':'Sett som leder';lead.onclick=()=>updateCluster(x=>{x.leaderId=d.id;x.enabledIds=[...new Set([...x.enabledIds,d.id])]});buttons.append(toggle,lead);card.append(h,badge,p,buttons);root.appendChild(card)});const leader=list.find(d=>d.id===c.leaderId);$('summary').textContent=list.length+' klarerte · '+c.enabledIds.length+' aktive cluster-noder · leder: '+(leader?leader.name:'ikke valgt')+' · '+c.tasks.length+' oppgaver';renderTasks()}
function renderTasks(){const c=cluster(),root=$('tasks');root.textContent='';if(!c.tasks.length){root.innerHTML='<div class="sub">Ingen oppgaver i kø.</div>';return}c.tasks.forEach((t,i)=>{const row=document.createElement('div');row.className='item';const text=document.createElement('span');text.textContent=t.name+' · '+t.kind+' · '+t.status+(t.assignedTo?' → '+t.assignedTo:'');const b=document.createElement('button');b.textContent='Fjern';b.onclick=()=>updateCluster(x=>x.tasks.splice(i,1));row.append(text,b);root.appendChild(row)})}
$('addTask').onclick=()=>{const name=$('taskName').value.trim();if(!name)return tell('Skriv et oppgavenavn først.');updateCluster(c=>c.tasks.push({id:'task-'+Date.now().toString(36),name,kind:$('taskKind').value,status:'I kø',assignedTo:null}));$('taskName').value=''};
$('runSim').onclick=()=>{const list=eligible(),c=cluster(),workers=list.filter(d=>c.enabledIds.includes(d.id));if(!workers.length)return tell('Velg minst én aktiv cluster-node først.');updateCluster(x=>{let n=0;x.tasks.forEach(t=>{if(t.status==='I kø'){t.status='Simulert fordelt';t.assignedTo=workers[n%workers.length].name;n++}})});tell('Fordelingen er simulert lokalt. Ingen nettverksjobb ble sendt.')};
$('clearTasks').onclick=()=>updateCluster(c=>{c.tasks=[]});render();
</script></main></body></html>
