set default=0
set timeout=15
set menu_color_normal=light-gray/black
set menu_color_highlight=yellow/black

if loadfont /boot/grub/font.pf2 ; then
  set gfxmode=auto
  insmod all_video
  terminal_output gfxterm
fi

menuentry "RAH OS // STANDARD" --hotkey=1 {
  linux @KERNEL_LIVE@ @APPEND_LIVE@ rah.profile=standard
  initrd @INITRD_LIVE@
}

menuentry "RAH NOVA VI // CONTROLLER MODE" --hotkey=2 {
  linux @KERNEL_LIVE@ @APPEND_LIVE@ rah.profile=nova
  initrd @INITRD_LIVE@
}

menuentry "RAH GHOST & RESCUE // TOOLS" --hotkey=3 {
  linux @KERNEL_LIVE@ @APPEND_LIVE@ rah.profile=rescue
  initrd @INITRD_LIVE@
}

menuentry "RAH FORGE // AI + DEV + RAVEN" --hotkey=4 {
  linux @KERNEL_LIVE@ @APPEND_LIVE@ rah.profile=forge
  initrd @INITRD_LIVE@
}

menuentry "RAH ARCADE NEXUS // RETRO + MEDIA" --hotkey=5 {
  linux @KERNEL_LIVE@ @APPEND_LIVE@ rah.profile=arcade
  initrd @INITRD_LIVE@
}

submenu "Advanced / install" {
  menuentry "Live safe graphics / recovery" {
    linux @KERNEL_LIVE@ @LB_BOOTAPPEND_LIVE_FAILSAFE@ rah.profile=rescue
    initrd @INITRD_LIVE@
  }

  if [ "@ENABLE_INSTALL_MENU@" = "true" ]; then
    menuentry "Install RAH OS base (graphical Debian installer)" {
      linux @KERNEL_GI@ @APPEND_GI@
      initrd @INITRD_GI@
    }
  fi

  if [ "@ENABLE_MEMTEST@" = "true" ]; then
    menuentry "Memory diagnostic" {
      linux @MEMTEST_BIN@
    }
  fi
}
