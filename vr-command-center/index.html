<!doctype html>
<html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RAH VR Command Center R1</title>
<script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
<style>body{margin:0;background:#06080c;font-family:Arial,sans-serif}#help{position:fixed;z-index:10;top:12px;left:12px;max-width:420px;padding:14px;background:#080b11dc;color:#f1d38b;border:1px solid #a98a46;border-radius:12px;font-size:13px}#help b{color:#fff}#help button{background:#a98a46;color:#080808;border:0;padding:8px 12px;border-radius:8px;cursor:pointer}#notice{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);z-index:10;color:white;background:#101b2fdd;border:1px solid #be9b4c;padding:10px 18px;border-radius:8px;display:none}</style></head><body>
<div id="help"><b>RAH VR COMMAND CENTER · R1</b><br>Quest 3: Trykk <b>VR</b> nederst til høyre. Bruk kontroller-trigger eller håndsporing med klyp (pinch) for knappene. Du kan også klikke på knappene i vanlig nettleser.<br><br><button onclick="document.getElementById('help').style.display='none'">Skjul hjelp</button></div><div id="notice"></div>
<a-scene background="color: #060910" renderer="antialias: true; colorManagement: true" vr-mode-ui="enabled: true" webxr="optionalFeatures: local-floor, bounded-floor, hand-tracking" raycaster="objects: .clickable" cursor="rayOrigin: mouse">
<a-assets></a-assets>
<a-entity position="0 0 0"><a-cylinder position="0 -0.07 0" radius="5.5" height="0.12" color="#151b24"></a-cylinder><a-torus position="0 0.015 0" radius="4.5" radius-tubular="0.018" rotation="90 0 0" color="#bd9146"></a-torus><a-torus position="0 0.02 0" radius="2.7" radius-tubular="0.012" rotation="90 0 0" color="#455f94"></a-torus></a-entity>
<a-entity light="type: ambient; color: #9aacca; intensity: 0.75"></a-entity><a-entity light="type: point; color: #ffc874; intensity: 1.5; distance: 12" position="0 4 -2"></a-entity><a-entity light="type: point; color: #527bfa; intensity: 0.65; distance: 9" position="-3 2 1"></a-entity>
<a-entity id="rig" position="0 0 0"><a-camera position="0 1.6 0" look-controls wasd-controls><a-entity cursor="fuse: false; rayOrigin: entity" raycaster="objects: .clickable; far: 15" position="0 0 -0.6" geometry="primitive: ring; radiusInner: 0.008; radiusOuter: 0.012" material="color: #ffda82; shader: flat"></a-entity></a-camera>
<a-entity id="leftController" laser-controls="hand: left" raycaster="objects: .clickable; far: 10; showLine: true" line="color: #dfbb69; opacity: 0.85"></a-entity>
<a-entity id="rightController" laser-controls="hand: right" raycaster="objects: .clickable; far: 10; showLine: true" line="color: #dfbb69; opacity: 0.85"></a-entity>
<a-entity id="leftHand" hand-tracking-controls="hand: left; modelColor: #deb974" hand-pinch-click=""></a-entity><a-entity id="rightHand" hand-tracking-controls="hand: right; modelColor: #deb974" hand-pinch-click=""></a-entity></a-entity>
<a-entity position="0 2.62 -3.3"><a-box width="5.25" height="0.12" depth="0.25" color="#bf9146"></a-box><a-text value="RAH  AI  STUDIOS" align="center" width="5.2" color="#ffda8c" position="0 -0.36 0.14"></a-text><a-text value="VIRTUAL COMMAND CENTER  /  R1" align="center" width="3.7" color="#9bbaff" position="0 -0.69 0.14"></a-text></a-entity>
<a-entity position="0 1.5 -3.5"><a-box width="4.8" height="1.3" depth="0.12" color="#101923" material="metalness:.4; roughness:.45"></a-box><a-plane width="4.58" height="1.08" position="0 0 .07" color="#101b2c"></a-plane><a-text value="VELKOMMEN TIL RAH VR" color="#f7d58e" width="4.6" align="center" position="0 .3 .08"></a-text><a-text id="mainStatus" value="Begge styremetoder: Quest-kontrollere + handsporing\n\nDette er en lokal UI-demo. Ingen PC-tilkobling er aktiv." color="#d2e5ff" width="3.9" align="center" position="0 -.11 .08"></a-text></a-entity>
<a-entity id="buttonRow" position="0 .55 -3.23"></a-entity>
<a-entity position="-3.25 1.55 -2.6" rotation="0 35 0"><a-box width="1.7" height="1.6" depth=".1" color="#302617"></a-box><a-text value="RAVEN COMMANDER" color="#ffe09a" width="1.55" align="center" position="0 .58 .07"></a-text><a-text value="HOVED-PC\nSTATUS: IKKE TILKOBLET" color="#fff" width="1.45" align="center" position="0 .05 .07"></a-text></a-entity>
<a-entity position="3.25 1.55 -2.6" rotation="0 -35 0"><a-box width="1.7" height="1.6" depth=".1" color="#17233c"></a-box><a-text value="AI WORKER" color="#a3c9ff" width="1.55" align="center" position="0 .58 .07"></a-text><a-text value="HP OMEN\nSTATUS: IKKE TILKOBLET" color="#fff" width="1.45" align="center" position="0 .05 .07"></a-text></a-entity>
<a-entity position="0 4 -4.7"><a-cone radius-bottom=".9" radius-top="0" height="1.5" color="#b18a49" position="-2.8 0 0"></a-cone><a-cone radius-bottom=".9" radius-top="0" height="1.5" color="#b18a49" position="2.8 0 0"></a-cone></a-entity>
<a-sky color="#05070f"></a-sky></a-scene>
<script>
AFRAME.registerComponent('hand-pinch-click',{init:function(){const el=this.el;el.addEventListener('pinchstarted',()=>{const scene=el.sceneEl;const hand=el.components['hand-tracking-controls'];if(!hand)return;const tip=hand.indexTipPosition;if(!tip)return;const pos=new THREE.Vector3().copy(tip);let closest=null,dist=.17;scene.querySelectorAll('.clickable').forEach(btn=>{const world=new THREE.Vector3();btn.object3D.getWorldPosition(world);const d=world.distanceTo(pos);if(d<dist){closest=btn;dist=d}});if(closest)closest.emit('click');});}});
const buttons=[['RAH AI NEWS','news'],['GOOSE','goose'],['AGENTER','agents'],['KINO','cinema']];const row=document.getElementById('buttonRow');buttons.forEach(([label,key],i)=>{const x=(i-1.5)*1.2;const box=document.createElement('a-box');box.setAttribute('class','clickable');box.setAttribute('position',`${x} 0 0`);box.setAttribute('width','1.08');box.setAttribute('height','.48');box.setAttribute('depth','.12');box.setAttribute('color',i%2?'#1a3651':'#755420');box.setAttribute('material','metalness:0.5;roughness:0.35');box.setAttribute('data-action',key);row.append(box);const text=document.createElement('a-text');text.setAttribute('value',label);text.setAttribute('align','center');text.setAttribute('width','1.55');text.setAttribute('color','#ffffff');text.setAttribute('position',`${x} 0 .076`);row.append(text);box.addEventListener('click',()=>activate(label));box.addEventListener('mouseenter',()=>box.setAttribute('color','#b78b43'));box.addEventListener('mouseleave',()=>box.setAttribute('color',i%2?'#1a3651':'#755420'));});
function activate(label){document.getElementById('mainStatus').setAttribute('value',`${label} VALGT\n\nDemoknapp aktivert. Integrasjon med tjenester\nkrever separat, godkjent tilkobling.`);const n=document.getElementById('notice');n.textContent=`${label}: demoknapp aktivert`;n.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>n.style.display='none',2600)}
</script></body></html>
