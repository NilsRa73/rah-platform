name: Integrate Mission Engine

on:
  push:
    branches: [main]
    paths:
      - mission-engine.js
      - .github/workflows/integrate-mission-engine.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Command Center
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          hook = '  <script src="mission-engine.js?v=1.5" defer></script>\n'
          if 'mission-engine.js?v=1.5' not in text:
              marker = '  <script src="cloud-sync.js?v=1.0" defer></script>\n'
              if marker not in text:
                  raise SystemExit('cloud-sync hook not found')
              text = text.replace(marker, marker + hook)
          text = text.replace('RAH Raven Command Center v1.4', 'RAH Raven Command Center v1.5')
          text = text.replace('v1.4 • ONLINE', 'v1.5 • ONLINE')
          text = text.replace('Command Center handler • v1.4', 'Command Center handler • v1.5')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Validate integration
        run: |
          grep -q 'mission-engine.js?v=1.5' index.html
          grep -q 'cloud-sync.js?v=1.0' index.html
          grep -q 'vision-module.js?v=1.3' index.html
      - name: Commit integration
        run: |
          git config user.name "RAH Raven Builder"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "feat: integrate resumable Mission Control v1.5"
          git push
