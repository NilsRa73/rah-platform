name: Finalize CC Updater v2 Candidate
on:
  push:
    branches: ['agent/rah-cc-updater-v2-candidate']
    paths: ['.github/workflows/finalize-cc-updater-v2-candidate.yml']
permissions:
  contents: write
  pull-requests: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rah-cc-updater-v2-candidate
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Merge current main and repair workflow formatting only
        shell: bash
        run: |
          git config user.name 'RAH CC Updater Gate'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin main --quiet
          git merge --no-edit origin/main
          sed -i 's/^permissions:{contents: read}$/permissions: {contents: read}/' .github/workflows/validate-cc-updater-v2-candidate.yml
          git add .github/workflows/validate-cc-updater-v2-candidate.yml
          if ! git diff --cached --quiet; then git commit -m 'RAH CC Updater v2 — fix Candidate workflow YAML'; fi
      - name: Require Candidate-only diff
        shell: bash
        run: |
          allowed='^(UPDATE-RAH-COMMAND-CENTER-V2\.ps1|RAH-CC-UPDATER-V2-VERSION\.json|tests/rah-cc-updater-v2-candidate\.test\.mjs|\.github/workflows/validate-cc-updater-v2-candidate\.yml|\.github/workflows/finalize-cc-updater-v2-candidate\.yml)$'
          bad="$(git diff --name-only origin/main...HEAD|grep -Ev "$allowed"||true)";test -z "$bad" || { echo "$bad";exit 1; }
      - name: Parse Candidate PowerShell
        shell: pwsh
        run: |
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile('UPDATE-RAH-COMMAND-CENTER-V2.ps1',[ref]$null,[ref]$errors)|Out-Null
          if($errors.Count -gt 0){$errors|Format-List;exit 1}
      - name: Candidate and product security gates
        run: |
          node --test tests/rah-cc-updater-v2-candidate.test.mjs
          node --test tests/rah-command-center-packaging.test.mjs
          node --test tests/rah-cc17-stable-release.test.mjs
          python3 -m unittest tests/test_rah_node_agent_stable_v13.py -v
          node --test tests/rah-raven-updater-v2-stable.test.mjs
          node --test tests/raven-release-gate.test.mjs
          node --test tests/rah-cc17-raven-master-sync.test.mjs
      - name: Remove finalizer and push exact tested head
        shell: bash
        run: |
          git rm .github/workflows/finalize-cc-updater-v2-candidate.yml
          git commit -m 'RAH CC Updater v2 — remove temporary Candidate finalizer'
          git push origin HEAD:agent/rah-cc-updater-v2-candidate
      - name: Mark PR ready and merge exact tested head
        shell: bash
        run: |
          PR="$(gh pr list --repo "$GITHUB_REPOSITORY" --head 'agent/rah-cc-updater-v2-candidate' --base main --state open --json number --jq '.[0].number')";test -n "$PR"
          if [ "$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = 'true' ]; then gh pr ready "$PR" --repo "$GITHUB_REPOSITORY"; fi
          HEAD_SHA="$(git rev-parse HEAD)"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$PR/merge" -f sha="$HEAD_SHA" -f merge_method='merge' -f commit_title='RAH Command Center Updater v2 — package integrity Candidate' -f commit_message='Merge inactive CC Updater v2 after full-stage, Git-blob integrity, rollback, canonical CC/Node and Raven updater/release gates pass. Root CC updater activation remains separate.' --jq '.merged'
