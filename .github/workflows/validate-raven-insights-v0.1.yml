name: Validate Raven Insights v0.1

on:
  push:
    branches:
      - main
      - 'raven-insights/**'
    paths:
      - 'RAH-RAVEN-INSIGHTS.html'
      - 'RAH-RAVEN-INSIGHTS-VERSION.json'
      - 'RAH-RAVEN-CHRONICLE-VERSION.json'
      - 'RAH-RAVEN-VERSION.json'
      - 'tests/raven-insights-v0.1.test.mjs'
      - 'tests/raven-chronicle-v17.test.mjs'
      - 'tests/raven-release-gate.test.mjs'
      - '.github/workflows/validate-raven-insights-v0.1.yml'
  pull_request:
    paths:
      - 'RAH-RAVEN-INSIGHTS.html'
      - 'RAH-RAVEN-INSIGHTS-VERSION.json'
      - 'RAH-RAVEN-CHRONICLE-VERSION.json'
      - 'RAH-RAVEN-VERSION.json'
      - 'tests/raven-insights-v0.1.test.mjs'
      - 'tests/raven-chronicle-v17.test.mjs'
      - 'tests/raven-release-gate.test.mjs'
      - '.github/workflows/validate-raven-insights-v0.1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Insights explicit-local boundary
        run: node tests/raven-insights-v0.1.test.mjs
      - name: Preserve Chronicle v1.7 Stable contract
        run: node tests/raven-chronicle-v17.test.mjs
      - name: Preserve Raven 2.0.32 nine-core gate
        run: node tests/raven-release-gate.test.mjs
      - name: Parse Insights browser runtime
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('RAH-RAVEN-INSIGHTS.html','utf8');
          const scripts=[...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];
          if(scripts.length!==1) throw new Error('Expected one inline Insights script');
          new Function(scripts[0][1]);
          console.log('Insights inline runtime parses');
          NODE
