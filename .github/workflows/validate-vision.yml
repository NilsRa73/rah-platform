name: Validate Raven Vision Legacy Compatibility

on:
  push:
    paths:
      - vision-module.js
      - vision.html
      - index.html
      - tests/vision-module-local-boundary.test.mjs
      - .github/workflows/validate-vision.yml
  pull_request:
    paths:
      - vision-module.js
      - vision.html
      - index.html
      - tests/vision-module-local-boundary.test.mjs
      - .github/workflows/validate-vision.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check vision-module.js
      - name: Check active legacy full-page Vision JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('vision.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:[^>]*)>([\s\S]*?)</script>',html)
          assert scripts, 'vision.html contains no inline JavaScript'
          Path('/tmp/vision-html.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/vision-html.js
      - name: Check Command Center compatibility integration
        shell: python
        run: |
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          assert html.count('vision-module.js?v=1.3') == 1
          for element_id in ("vision", "visionFile", "visionPreview", "visionNote", "visionStatus", "visionResult", "analyzeVision"):
              assert f'id="{element_id}"' in html, f"Missing #{element_id}"
          print("Legacy Vision compatibility integration is valid")
      - name: Validate legacy Vision loopback-only network boundary
        run: node tests/vision-module-local-boundary.test.mjs
