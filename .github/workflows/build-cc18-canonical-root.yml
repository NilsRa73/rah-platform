name: Build CC 1.8 Canonical Root
on:
  push:
    branches: ['agent/rah-cc-v1.8-canonical-root']
    paths:
      - 'tools/build-cc18-canonical-root.mjs'
      - '.github/workflows/build-cc18-canonical-root.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rah-cc-v1.8-canonical-root
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Generate bounded canonical root
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/build-cc18-canonical-root.mjs')
          s=p.read_text()
          needle="assert.match(up,/manifest\\.version-ne\"1\\.8\\.0\"/);"
          patch="""const fixedAllowStart=up.indexOf('$AllowedPackageFiles=@(');\nconst fixedStampStart=up.indexOf('$Stamp=',fixedAllowStart);\nassert.ok(fixedAllowStart>=0&&fixedStampStart>fixedAllowStart,'transformed updater allowlist block not found');\nup=up.slice(0,fixedAllowStart)+allowBlock+up.slice(fixedStampStart);\n"""
          assert needle in s
          p.write_text(s.replace(needle,patch+needle,1))
          PY
          node tools/build-cc18-canonical-root.mjs
          git checkout -- tools/build-cc18-canonical-root.mjs
      - name: Require exact build scope
        shell: bash
        run: |
          allowed='^(RAH-COMMAND-CENTER-VERSION\.json|DOBBELTKLIKK-HER-START-RAH-COMMAND-CENTER\.bat|START-RAH-NODE-AGENT\.bat|START-RAH-NODE-AGENT\.sh|UPDATE-RAH-COMMAND-CENTER\.ps1|tests/rah-command-center-packaging\.test\.mjs|\.github/workflows/validate-rah-command-center\.yml)$'
          bad="$(git diff --name-only | grep -Ev "$allowed" || true)"
          test -z "$bad" || { echo "$bad"; exit 1; }
          test "$(git diff --name-only | wc -l)" -eq 7
      - name: Canonical package and one-shot gates
        run: |
          node --test tests/rah-command-center-packaging.test.mjs
          node --test tests/rah-cc18-one-shot-mutating-approval.test.mjs
          node --test tests/rah-cc18-stable-release.test.mjs
      - name: Preserve Node 1.3 live boundary
        run: python3 -m unittest tests/test_rah_node_agent_stable_v13.py -v
      - name: Preserve Raven release gate
        run: node --test tests/raven-release-gate.test.mjs
      - name: Parse updater scripts
        shell: pwsh
        run: |
          [void][scriptblock]::Create((Get-Content -LiteralPath ./UPDATE-RAH-COMMAND-CENTER.ps1 -Raw))
          [void][scriptblock]::Create((Get-Content -LiteralPath ./UPDATE-RAH-RAVEN.ps1 -Raw))
      - name: Commit generated root and remove temporary builder
        shell: bash
        run: |
          git config user.name 'RAH CC Canonical Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add RAH-COMMAND-CENTER-VERSION.json DOBBELTKLIKK-HER-START-RAH-COMMAND-CENTER.bat START-RAH-NODE-AGENT.bat START-RAH-NODE-AGENT.sh UPDATE-RAH-COMMAND-CENTER.ps1 tests/rah-command-center-packaging.test.mjs .github/workflows/validate-rah-command-center.yml
          git rm tools/build-cc18-canonical-root.mjs .github/workflows/build-cc18-canonical-root.yml
          git commit -m 'RAH Command Center v1.8 — canonical root package'
          git push origin HEAD:agent/rah-cc-v1.8-canonical-root
