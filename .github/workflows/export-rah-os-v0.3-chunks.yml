name: Export RAH OS v0.3 download chunks

on:
  push:
    branches:
      - rah-os-v0.3-download-chunks
    paths:
      - .github/workflows/export-rah-os-v0.3-chunks.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified RAH OS v0.3 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10599435527/zip"             -o /tmp/rah-os-v0.3.zip
          mkdir -p /tmp/rah-os
          unzip -q /tmp/rah-os-v0.3.zip -d /tmp/rah-os
          find /tmp/rah-os -maxdepth 3 -type f -printf '%p %s bytes\n'

      - name: Verify and split ISO
        run: |
          set -euo pipefail
          ISO="$(find /tmp/rah-os -type f -name 'RAH-OS-Raven-v0.3-amd64.iso' -print -quit)"
          test -n "$ISO"
          ACTUAL="$(sha256sum "$ISO" | awk '{print $1}')"
          EXPECTED="f5117662c8c0a3be8876e90c5e5cc79ea025bcffe486a68493f3bfb9973298d5"
          test "$ACTUAL" = "$EXPECTED"
          mkdir -p parts
          split -b 400M -d -a 2 "$ISO" "parts/RAH-OS-Raven-v0.3-amd64.iso.part-"
          printf '%s  %s\n' "$EXPECTED" 'RAH-OS-Raven-v0.3-amd64.iso' > parts/RAH-OS-Raven-v0.3-amd64.iso.sha256
          ls -lh parts/

      - name: Upload part 00
        if: ${{ hashFiles('parts/*.part-00') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: RAH-OS-v0.3-part-00
          path: parts/RAH-OS-Raven-v0.3-amd64.iso.part-00
          compression-level: 0
      - name: Upload part 01
        if: ${{ hashFiles('parts/*.part-01') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: RAH-OS-v0.3-part-01
          path: parts/RAH-OS-Raven-v0.3-amd64.iso.part-01
          compression-level: 0
      - name: Upload part 02
        if: ${{ hashFiles('parts/*.part-02') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: RAH-OS-v0.3-part-02
          path: parts/RAH-OS-Raven-v0.3-amd64.iso.part-02
          compression-level: 0
      - name: Upload part 03
        if: ${{ hashFiles('parts/*.part-03') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: RAH-OS-v0.3-part-03
          path: parts/RAH-OS-Raven-v0.3-amd64.iso.part-03
          compression-level: 0
      - name: Upload part 04
        if: ${{ hashFiles('parts/*.part-04') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: RAH-OS-v0.3-part-04
          path: parts/RAH-OS-Raven-v0.3-amd64.iso.part-04
          compression-level: 0
      - name: Upload part 05
        if: ${{ hashFiles('parts/*.part-05') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: RAH-OS-v0.3-part-05
          path: parts/RAH-OS-Raven-v0.3-amd64.iso.part-05
          compression-level: 0
      - name: Upload part 06
        if: ${{ hashFiles('parts/*.part-06') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: RAH-OS-v0.3-part-06
          path: parts/RAH-OS-Raven-v0.3-amd64.iso.part-06
          compression-level: 0
      - name: Upload part 07
        if: ${{ hashFiles('parts/*.part-07') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: RAH-OS-v0.3-part-07
          path: parts/RAH-OS-Raven-v0.3-amd64.iso.part-07
          compression-level: 0
      - name: Upload part 08
        if: ${{ hashFiles('parts/*.part-08') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: RAH-OS-v0.3-part-08
          path: parts/RAH-OS-Raven-v0.3-amd64.iso.part-08
          compression-level: 0
      - name: Upload part 09
        if: ${{ hashFiles('parts/*.part-09') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: RAH-OS-v0.3-part-09
          path: parts/RAH-OS-Raven-v0.3-amd64.iso.part-09
          compression-level: 0
      - name: Upload part 10
        if: ${{ hashFiles('parts/*.part-10') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: RAH-OS-v0.3-part-10
          path: parts/RAH-OS-Raven-v0.3-amd64.iso.part-10
          compression-level: 0
      - name: Upload part 11
        if: ${{ hashFiles('parts/*.part-11') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: RAH-OS-v0.3-part-11
          path: parts/RAH-OS-Raven-v0.3-amd64.iso.part-11
          compression-level: 0
      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: RAH-OS-v0.3-checksum-direct
          path: parts/RAH-OS-Raven-v0.3-amd64.iso.sha256
          compression-level: 0
