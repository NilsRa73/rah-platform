name: Validate Project Brain Cloud Sync

on:
  push:
    branches: [main]
    paths:
      - index.html
      - cloud-sync.js
      - RAH-RAVEN-CLOUD-SYNC-VERSION.json
      - RAH-RAVEN-VERSION.json
      - supabase/**
      - tests/cloud-sync.test.mjs
      - .github/workflows/validate-cloud-sync.yml
      - .github/workflows/integrate-cloud-sync.yml
  pull_request:
    paths:
      - index.html
      - cloud-sync.js
      - RAH-RAVEN-CLOUD-SYNC-VERSION.json
      - RAH-RAVEN-VERSION.json
      - supabase/**
      - tests/cloud-sync.test.mjs
      - .github/workflows/validate-cloud-sync.yml
      - .github/workflows/integrate-cloud-sync.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate explicit-only Cloud Sync contract
        run: |
          node --check cloud-sync.js
          node tests/cloud-sync.test.mjs
          node tests/raven-release-gate.test.mjs
