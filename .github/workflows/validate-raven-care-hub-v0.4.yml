name: Validate Raven Care Hub v0.4 Historical Rollback

on:
  push:
    paths:
      - 'RAH-RAVEN-CARE-HUB-V0.4-STABLE.html'
      - 'RAH-RAVEN-CARE-HUB-V0.4-STABLE.json'
      - 'tests/raven-care-hub-v0.4.test.mjs'
      - '.github/workflows/validate-raven-care-hub-v0.4.yml'
  pull_request:
    paths:
      - 'RAH-RAVEN-CARE-HUB-V0.4-STABLE.html'
      - 'RAH-RAVEN-CARE-HUB-V0.4-STABLE.json'
      - 'tests/raven-care-hub-v0.4.test.mjs'
      - '.github/workflows/validate-raven-care-hub-v0.4.yml'

permissions:
  contents: read

jobs:
  historical-rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate frozen Care Hub v0.4 rollback bytes and boundary
        run: node tests/raven-care-hub-v0.4.test.mjs
