name: Validate Raven Care Hub v0.4

on:
  push:
    paths:
      - 'RAH-RAVEN-CARE-HUB.html'
      - 'RAH-RAVEN-CARE-HUB-VERSION.json'
      - 'RAH-RAVEN-CARE-VERSION.json'
      - 'RAH-RAVEN-CASE-CENTER-VERSION.json'
      - 'RAH-RAVEN-FRISTVAKT-VERSION.json'
      - 'RAH-RAVEN-HEALTH-FATIGUE-VERSION.json'
      - 'RAH-RAVEN-FASTLEGE-VERSION.json'
      - 'tests/raven-care-hub-v0.4.test.mjs'
      - 'tests/raven-care-v0.1.test.mjs'
      - 'tests/raven-case-center-v16.test.mjs'
      - 'tests/raven-fristvakt-v0.2.test.mjs'
      - 'tests/raven-health-fatigue-v0.2.test.mjs'
      - 'tests/raven-fastlege-v0.3.test.mjs'
      - 'tests/raven-release-gate.test.mjs'
      - '.github/workflows/validate-raven-care-hub-v0.4.yml'
  pull_request:
    paths:
      - 'RAH-RAVEN-CARE-HUB.html'
      - 'RAH-RAVEN-CARE-HUB-VERSION.json'
      - 'RAH-RAVEN-CARE-VERSION.json'
      - 'RAH-RAVEN-CASE-CENTER-VERSION.json'
      - 'RAH-RAVEN-FRISTVAKT-VERSION.json'
      - 'RAH-RAVEN-HEALTH-FATIGUE-VERSION.json'
      - 'RAH-RAVEN-FASTLEGE-VERSION.json'
      - 'tests/raven-care-hub-v0.4.test.mjs'
      - 'tests/raven-care-v0.1.test.mjs'
      - 'tests/raven-case-center-v16.test.mjs'
      - 'tests/raven-fristvakt-v0.2.test.mjs'
      - 'tests/raven-health-fatigue-v0.2.test.mjs'
      - 'tests/raven-fastlege-v0.3.test.mjs'
      - 'tests/raven-release-gate.test.mjs'
      - '.github/workflows/validate-raven-care-hub-v0.4.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Care Hub v0.4 navigation-only boundary
        run: node tests/raven-care-hub-v0.4.test.mjs
      - name: Preserve Raven Care v0.1 Stable contract
        run: node tests/raven-care-v0.1.test.mjs
      - name: Preserve Case Center v1.6 Stable contract
        run: node tests/raven-case-center-v16.test.mjs
      - name: Preserve Fristvakt v0.2 Stable contract
        run: node tests/raven-fristvakt-v0.2.test.mjs
      - name: Preserve Health & Fatigue v0.2 Stable contract
        run: node tests/raven-health-fatigue-v0.2.test.mjs
      - name: Preserve Fastlegevisning v0.3 Stable contract
        run: node tests/raven-fastlege-v0.3.test.mjs
      - name: Preserve Raven 2.0.32 Stable release gate
        run: node tests/raven-release-gate.test.mjs
