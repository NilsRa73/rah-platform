name: Build Raven Core v1.12 Stable Gate

on:
  push:
    branches:
      - core/raven-core-v1.12-stable-gate
    paths:
      - '.github/scripts/build_raven_core_v1_12_stable_gate.py'
      - '.github/workflows/build-raven-core-v1.12-stable-gate.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: core/raven-core-v1.12-stable-gate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Raven Core v1.12 stable gate
        run: python .github/scripts/build_raven_core_v1_12_stable_gate.py
      - name: Validate stable metadata and Raven contract
        run: |
          node tests/raven-core-local-boundary.test.mjs
          node tests/raven-core-demo.test.mjs
          node tests/raven-core-context.test.mjs
          node tests/raven-core-chatgpt-status.test.mjs
          node tests/raven-core-chatgpt-handoff-center.test.mjs
          node tests/raven-release-gate.test.mjs
          node --check raven-checkpoint-policy.js
      - name: Assert Raven Core and stable runtimes remain untouched
        run: |
          git diff --exit-code -- \
            RAH-RAVEN-CORE-DEMO.html \
            RAH-RAVEN-VISION-CORE.html raven-vision-core.js \
            RAH-RAVEN-COUNCIL.html raven-council.js \
            RAH-RAVEN-AGENT-RUNNER.html desktop-bridge/agent_runner.py \
            RAH-RAVEN-MEMORY-SYNC.html raven-chronicle-sync.js \
            RAH-RAVEN-MISSION-CONTROL.html \
            RAH-RAVEN-PROJECT.html raven-checkpoint-policy.js
      - name: Commit stable metadata and tests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            RAH-RAVEN-CORE-VERSION.json \
            RAH-RAVEN-VERSION.json \
            tests/raven-core-local-boundary.test.mjs \
            tests/raven-release-gate.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Promote Raven Core v1.12 stable gate metadata'
          git push origin HEAD:core/raven-core-v1.12-stable-gate
