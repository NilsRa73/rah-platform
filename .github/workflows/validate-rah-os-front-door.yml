name: Validate RAH OS Front Door

on:
  pull_request:
    paths:
      - 'START-HER-RAH-OS.cmd'
      - 'INSTALL-RAH-OS.cmd'
      - 'RAH-OS-CONTROL.ps1'
      - 'RAH-OS-SELFTEST.ps1'
      - 'ACCEPT-RAH-OS-v0.6.cmd'
      - 'ACCEPT-RAH-OS-v0.6.ps1'
      - 'RUN-RAH-OS-v0.6-HOVED-PC-ACCEPTANCE.cmd'
      - 'RUN-RAH-OS-v0.6-HOVED-PC-ACCEPTANCE.ps1'
      - 'RAH-OS-v0.6-HOVED-PC-ONE-CLICK.cmd'
      - 'REPAIR-RAH-OS.cmd'
      - 'RAH-OS.md'
      - 'tests/test_rah_os_front_door.py'
      - '.github/workflows/validate-rah-os-front-door.yml'
  push:
    branches: [ main ]
    paths:
      - 'START-HER-RAH-OS.cmd'
      - 'INSTALL-RAH-OS.cmd'
      - 'RAH-OS-CONTROL.ps1'
      - 'RAH-OS-SELFTEST.ps1'
      - 'ACCEPT-RAH-OS-v0.6.cmd'
      - 'ACCEPT-RAH-OS-v0.6.ps1'
      - 'RUN-RAH-OS-v0.6-HOVED-PC-ACCEPTANCE.cmd'
      - 'RUN-RAH-OS-v0.6-HOVED-PC-ACCEPTANCE.ps1'
      - 'RAH-OS-v0.6-HOVED-PC-ONE-CLICK.cmd'
      - 'REPAIR-RAH-OS.cmd'
      - 'RAH-OS.md'
      - 'tests/test_rah_os_front_door.py'
      - '.github/workflows/validate-rah-os-front-door.yml'

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $errors = $null
          foreach($file in @('.\RAH-OS-CONTROL.ps1','.\RAH-OS-SELFTEST.ps1','.\ACCEPT-RAH-OS-v0.6.ps1','.\RUN-RAH-OS-v0.6-HOVED-PC-ACCEPTANCE.ps1')){
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$null,
              [ref]$errors
            ) | Out-Null
            if($errors.Count){
              $errors | ForEach-Object {
                Write-Error ($file + ':' + $_.Extent.StartLineNumber + ':' + $_.Extent.StartColumnNumber + ': ' + $_.Message)
              }
              exit 1
            }
          }

      - name: Validate XAML block
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $text = Get-Content -LiteralPath '.\RAH-OS-CONTROL.ps1' -Raw
          $m = [regex]::Match($text, "(?s)\[xml\]\`$xaml\s*=\s*@'\r?\n(.*?)\r?\n'@")
          if(-not $m.Success){ throw 'WPF XAML here-string not found.' }
          [xml]$x = $m.Groups[1].Value
          if($x.Window.Title -ne 'RAH Raven OS'){ throw 'Unexpected WPF window title.' }

      - name: Acceptance engine self-test
        shell: powershell
        run: |
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".\ACCEPT-RAH-OS-v0.6.ps1" -SelfTest
          if ($LASTEXITCODE -ne 0) { throw "RAH OS v0.6 acceptance self-test failed with exit code $LASTEXITCODE" }

      - name: HOVED-PC runner self-test
        shell: powershell
        run: |
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".\RUN-RAH-OS-v0.6-HOVED-PC-ACCEPTANCE.ps1" -SelfTest
          if ($LASTEXITCODE -ne 0) { throw "HOVED-PC runner self-test failed with exit code $LASTEXITCODE" }

      - name: Contract tests
        shell: powershell
        run: |
          python -m unittest discover -s tests -p "test_rah_os_front_door.py" -v
