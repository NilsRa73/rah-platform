name: Validate Raven Release Gate

on:
  workflow_dispatch:
  push:
    paths:
      - 'RAH-RAVEN-VERSION.json'
      - 'RAH-RAVEN-VISION-VERSION.json'
      - 'RAH-RAVEN-*.html'
      - 'RAH-HOME-CONTROL.html'
      - 'raven-*.js'
      - 'desktop-bridge/**'
      - 'tests/raven-*.test.mjs'
      - 'INSTALL-RAH-AI-STUDIOS.*'
      - 'UPDATE-RAH-RAVEN.ps1'
      - 'DOBBELTKLIKK-HER-START-RAH-RAVEN.bat'
      - 'START-RAH-RAVEN-V2.bat'
      - '.github/workflows/validate-raven-release-gate.yml'
  pull_request:
    paths:
      - 'RAH-RAVEN-VERSION.json'
      - 'RAH-RAVEN-VISION-VERSION.json'
      - 'RAH-RAVEN-*.html'
      - 'RAH-HOME-CONTROL.html'
      - 'raven-*.js'
      - 'desktop-bridge/**'
      - 'tests/raven-*.test.mjs'
      - 'INSTALL-RAH-AI-STUDIOS.*'
      - 'UPDATE-RAH-RAVEN.ps1'
      - 'DOBBELTKLIKK-HER-START-RAH-RAVEN.bat'
      - 'START-RAH-RAVEN-V2.bat'
      - '.github/workflows/validate-raven-release-gate.yml'

permissions:
  contents: read

jobs:
  semantic-release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check shared JavaScript syntax
        run: |
          node --check raven-handoff-receipt.js
          node --check raven-handoff-history-lite.js
          node --check raven-checkpoint-policy.js
          node --check raven-vision-core.js
          node --check raven-council.js
          node --check raven-chronicle-sync.js
      - name: Run Raven 2.0.32 temporary stable gate with Vision v0.6 stable and Council v0.3 safety patch
        run: |
          node tests/raven-release-gate.test.mjs
          node tests/raven-checkpoint-policy.test.mjs
          node tests/raven-handoff-receipt-policy.test.mjs
          node tests/raven-handoff-history-lite-policy.test.mjs
          node tests/raven-now-v2.test.mjs
          node tests/raven-mission-control.test.mjs
          node tests/raven-project-focus.test.mjs
          node tests/raven-core-demo.test.mjs
          node tests/raven-core-context.test.mjs
          node tests/raven-core-chatgpt-status.test.mjs
          node tests/raven-core-chatgpt-handoff-center.test.mjs
          node tests/raven-chatgpt-handoff-session.test.mjs
          node tests/raven-chatgpt-handoff-entry.test.mjs
          node tests/raven-chatgpt-handoff-source-return.test.mjs
          node tests/raven-chatgpt-handoff-resume.test.mjs
          node tests/raven-chatgpt-handoff-receipt.test.mjs
          node tests/raven-chatgpt-handoff-history-lite.test.mjs
          node tests/raven-chatgpt-handoff-recall.test.mjs
          node tests/raven-vision-core.test.mjs
          node tests/raven-vision-local-boundary.test.mjs
          node tests/raven-council.test.mjs
          node tests/raven-agent-runner.test.mjs
      - name: Check Bridge Python syntax
        run: python -m py_compile desktop-bridge/raven_bridge.py desktop-bridge/agent_runner.py desktop-bridge/chronicle_insights.py desktop-bridge/chronicle_ai.py

  windows-release-gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run aggregate release identity check
        shell: powershell
        run: |
          node tests/raven-release-gate.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Parse PowerShell entry points
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @('INSTALL-RAH-AI-STUDIOS.ps1','UPDATE-RAH-RAVEN.ps1')) {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }; exit 1 }
          }
      - name: Validate one-click entry chain
        shell: powershell
        run: |
          $installer = Get-Content 'INSTALL-RAH-AI-STUDIOS.ps1' -Raw
          $updater = Get-Content 'UPDATE-RAH-RAVEN.ps1' -Raw
          $bootstrap = Get-Content 'INSTALL-RAH-AI-STUDIOS.bat' -Raw
          $starter = Get-Content 'DOBBELTKLIKK-HER-START-RAH-RAVEN.bat' -Raw
          $launcher = Get-Content 'START-RAH-RAVEN-V2.bat' -Raw
          if ($installer -notmatch 'UPDATE-RAH-RAVEN\.ps1') { throw 'Installer does not call updater.' }
          if ($updater -notmatch 'START-RAH-RAVEN-V2\.bat') { throw 'Updater does not launch Raven.' }
          if ($bootstrap -notmatch 'INSTALL-RAH-AI-STUDIOS\.ps1') { throw 'Bootstrap does not download installer.' }
          if ($starter -notmatch 'UPDATE-RAH-RAVEN\.ps1') { throw 'Desktop starter does not refresh updater.' }
          if ($launcher -notmatch 'set "RAVEN_URL=%~dp0RAH-RAVEN-NOW-V2\.html"') { throw 'Launcher does not open Raven Now v2.' }
          Write-Host 'Raven 2.0.32 Windows temporary stable gate with Vision v0.6 stable + Council v0.3 safety patch: OK'
