name: Validate RAH AI Investigator 1.0 Stable Windows EXE

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/rah-ai-investigator/source/rah_investigator.py'
      - 'apps/rah-ai-investigator/RAH-INVESTIGATOR-VERSION.json'
      - 'apps/rah-ai-investigator/RAH-INVESTIGATOR-STABLE-RELEASE.json'
      - 'tests/rah-ai-investigator-rc2-windows-exe.test.mjs'
      - '.github/workflows/validate-rah-ai-investigator-rc2-windows-exe.yml'
  push:
    branches: [main]
    paths:
      - 'apps/rah-ai-investigator/source/rah_investigator.py'
      - 'apps/rah-ai-investigator/RAH-INVESTIGATOR-VERSION.json'
      - 'apps/rah-ai-investigator/RAH-INVESTIGATOR-STABLE-RELEASE.json'
      - 'tests/rah-ai-investigator-rc2-windows-exe.test.mjs'
      - '.github/workflows/validate-rah-ai-investigator-rc2-windows-exe.yml'

permissions:
  contents: read

jobs:
  build-and-self-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Stable EXE source contract
        run: node --test tests/rah-ai-investigator-rc2-windows-exe.test.mjs
      - name: Run canonical Stable source self-test
        shell: pwsh
        run: |
          python apps/rah-ai-investigator/source/rah_investigator.py self-test
          if($LASTEXITCODE -ne 0){throw 'Stable source self-test failed'}
      - name: Install CI-only EXE builder
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "pyinstaller>=6,<7"
          if($LASTEXITCODE -ne 0){throw 'PyInstaller installation failed'}
      - name: Build Stable one-file Investigator EXE
        shell: pwsh
        run: |
          $dist=Join-Path $env:RUNNER_TEMP 'investigator-exe-dist'
          $work=Join-Path $env:RUNNER_TEMP 'investigator-exe-build'
          $spec=Join-Path $env:RUNNER_TEMP 'investigator-exe-spec'
          New-Item -ItemType Directory -Path $dist,$work,$spec -Force|Out-Null
          python -m PyInstaller --noconfirm --clean --onefile --console --name RAH-AI-Investigator-1.0 --distpath $dist --workpath $work --specpath $spec apps\rah-ai-investigator\source\rah_investigator.py
          if($LASTEXITCODE -ne 0){throw 'Stable Investigator EXE build failed'}
          "INVESTIGATOR_EXE=$dist\RAH-AI-Investigator-1.0.exe"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify built EXE and deterministic self-test
        shell: pwsh
        run: |
          if(-not(Test-Path $env:INVESTIGATOR_EXE -PathType Leaf)){throw 'Stable EXE missing'}
          if((Get-Item $env:INVESTIGATOR_EXE).Length -lt 1000000){throw 'Stable EXE unexpectedly small'}
          & $env:INVESTIGATOR_EXE self-test
          if($LASTEXITCODE -ne 0){throw 'Stable EXE self-test failed'}
      - name: Run Stable EXE normalize smoke test
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'Investigator Stable EXE smoke'
          New-Item -ItemType Directory -Path $root -Force|Out-Null
          $input=Join-Path $root 'sample.txt'
          $output=Join-Path $root 'case.json'
          @'
Account: https://example.com/Stable.User
Mail: STABLE.TEST@example.com
Seen 2026-09-20
'@|Set-Content $input -Encoding utf8
          & $env:INVESTIGATOR_EXE normalize $input --out $output
          if($LASTEXITCODE -ne 0){throw 'Stable EXE normalize failed'}
          $case=Get-Content $output -Raw|ConvertFrom-Json
          if($case.version -ne '1.0.0'){throw 'Stable EXE case version drift'}
          if($case.normalizer.localOnly -ne $true -or $case.normalizer.networkRequests -ne $false -or $case.normalizer.externalToolExecution -ne $false -or $case.normalizer.sourceMutation -ne $false){throw 'Stable EXE local-only boundary drift'}
          if($case.identifiers.emails -notcontains 'stable.test@example.com'){throw 'Stable EXE normalization result drift'}
      - name: Preserve Stable lifecycle
        shell: pwsh
        run: |
          $m=Get-Content apps/rah-ai-investigator/RAH-INVESTIGATOR-VERSION.json -Raw|ConvertFrom-Json
          if($m.version -ne '1.0.0' -or $m.stage -ne 'stable'){throw 'Investigator Stable lifecycle drift'}
          if($m.stable_release_gate.status -ne 'passed' -or -not $m.stable_release_gate.runtime_files_frozen){throw 'Stable release gate drift'}
          if($m.authority_delta -ne 'none' -or $m.network_requests_in_core -ne $false -or $m.external_tool_auto_execution -ne $false){throw 'Investigator authority boundary drift'}
      - name: SHA-256 and upload Stable EXE
        shell: pwsh
        run: |
          $hash=(Get-FileHash $env:INVESTIGATOR_EXE -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  RAH-AI-Investigator-1.0.exe"|Set-Content ($env:INVESTIGATOR_EXE+'.sha256.txt') -Encoding ASCII
      - uses: actions/upload-artifact@v4
        with:
          name: rah-ai-investigator-v1.0-stable-windows-exe
          path: |
            ${{ env.INVESTIGATOR_EXE }}
            ${{ env.INVESTIGATOR_EXE }}.sha256.txt
          if-no-files-found: error
          retention-days: 30
