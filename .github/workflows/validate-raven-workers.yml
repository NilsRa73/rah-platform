name: Validate Raven Workers

on:
  push:
    branches:
      - raven-worker-v1
      - raven-workers-v1.0.2
      - anythingllm-control-clean
  pull_request:
    paths:
      - 'desktop-bridge/RAH-RAVEN-WORKERS.cmd'
      - 'desktop-bridge/RAH-ANYTHINGLLM.cmd'
      - '.github/workflows/validate-raven-workers.yml'

jobs:
  raven-workers:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: CMD help paths execute
        shell: cmd
        run: |
          call desktop-bridge\RAH-RAVEN-WORKERS.cmd help > workers-help.txt
          findstr /C:"RAH Raven Workers v1.0.2" workers-help.txt
          findstr /C:"fixed safe worker suite" workers-help.txt
          findstr /C:"archive-compatible SCOUT" workers-help.txt
          call desktop-bridge\RAH-ANYTHINGLLM.cmd help > anythingllm-help.txt
          findstr /C:"RAH AnythingLLM Control" anythingllm-help.txt

      - name: Require fixed worker roles and archive-safe capabilities
        shell: pwsh
        run: |
          $text = Get-Content desktop-bridge/RAH-RAVEN-WORKERS.cmd -Raw
          foreach ($required in @(
            'SCOUT', 'GUARD', 'TESTER', 'DOCTOR',
            'project-files', 'test-bridge-security', 'test-council', 'test-vision-core',
            'http://127.0.0.1:18765/health', 'http://127.0.0.1:18765/agent/run'
          )) {
            if (-not $text.Contains($required)) { throw "Missing required worker marker: $required" }
          }
          if ($text.Contains('call :agent_job "git-status" "SCOUT"')) {
            throw 'SCOUT must not depend on .git in archive-installed runtime'
          }

      - name: Require stability gate before workers
        shell: pwsh
        run: |
          $text = Get-Content desktop-bridge/RAH-RAVEN-WORKERS.cmd -Raw
          foreach ($required in @('council_proxy','vision_monitor_capture','local_device_adapter','agent_runner','download_manager')) {
            if (-not $text.Contains($required)) { throw "Missing TRUE GREEN health flag: $required" }
          }
          if (-not $text.Contains('Workers did not run')) { throw 'Missing blocked-on-unhealthy behavior' }

      - name: Require honest aggregate result
        shell: pwsh
        run: |
          $text = Get-Content desktop-bridge/RAH-RAVEN-WORKERS.cmd -Raw
          foreach ($required in @(
            'FAILURES=0', 'WARNINGS=0', 'FAILURES+=1', 'WARNINGS+=1',
            'OVERALL: PASS', 'OVERALL: PASS WITH WARNING', 'OVERALL: FAIL',
            'exit /b 5', 'exit /b 6'
          )) {
            if (-not $text.Contains($required)) { throw "Missing aggregate status marker: $required" }
          }

      - name: Validate AnythingLLM helper contract
        shell: pwsh
        run: |
          $text = Get-Content desktop-bridge/RAH-ANYTHINGLLM.cmd -Raw
          foreach ($required in @(
            'MintplexLabs.AnythingLLM',
            'https://anythingllm.com/download',
            'C:\RAH\State\AnythingLLM',
            'Developer API',
            'API-TOKEN.txt'
          )) {
            if (-not $text.Contains($required)) { throw "Missing AnythingLLM marker: $required" }
          }
          $lower = $text.ToLowerInvariant()
          foreach ($bad in @('api-token.txt" echo','authorization: bearer','setx ','reg add ','invoke-expression','iex ')) {
            if ($lower.Contains($bad)) { throw "AnythingLLM helper violates safe setup boundary: $bad" }
          }

      - name: Reject destructive or arbitrary execution shortcuts
        shell: pwsh
        run: |
          $text = (Get-Content desktop-bridge/RAH-RAVEN-WORKERS.cmd -Raw).ToLowerInvariant()
          foreach ($bad in @('rmdir /s','rd /s','del /s','format ','diskpart',' -encodedcommand ',' -enc ')) {
            if ($text.Contains($bad)) { throw "Rejected destructive/opaque marker: $bad" }
          }
          foreach ($bad in @('githubusercontent.com/','queue.json','invoke-expression','iex ')) {
            if ($text.Contains($bad)) { throw "Worker must not accept remote command/job input: $bad" }
          }

      - name: Require local result boundary
        shell: pwsh
        run: |
          $text = Get-Content desktop-bridge/RAH-RAVEN-WORKERS.cmd -Raw
          if (-not $text.Contains('C:\RAH\AgentWork')) { throw 'Results must stay under C:\RAH\AgentWork' }
          if (-not $text.Contains('C:\RAH\Logs\RavenWorkers')) { throw 'Worker logs boundary missing' }
