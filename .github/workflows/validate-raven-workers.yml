name: Validate Raven Workers

on:
  push:
    branches:
      - raven-worker-v1
      - raven-workers-v1.0.2
      - raven-worker-control-v1
      - raven-autopilot-v1a-final
      - anythingllm-control-clean
      - observer-screen-router-v1
      - observer-live-surface-v1
      - observer-doctor-autopilot-v1
    paths:
      - 'desktop-bridge/RAH-RAVEN-WORKERS.cmd'
      - 'desktop-bridge/RAH-RAVEN-WORKER-CONTROL.cmd'
      - 'desktop-bridge/RAH-RAVEN-AUTOPILOT.cmd'
      - 'desktop-bridge/RAH-RAVEN-HUB.cmd'
      - 'desktop-bridge/RAH-OBSERVER-WALL.cmd'
      - 'desktop-bridge/RAH-OBSERVER-LIVE.cmd'
      - 'desktop-bridge/RAH-OBSERVER-DOCTOR.cmd'
      - 'desktop-bridge/observer_doctor.py'
      - 'desktop-bridge/RAH-ANYTHINGLLM.cmd'
      - '.github/workflows/validate-raven-workers.yml'
  pull_request:
    paths:
      - 'desktop-bridge/RAH-RAVEN-WORKERS.cmd'
      - 'desktop-bridge/RAH-RAVEN-WORKER-CONTROL.cmd'
      - 'desktop-bridge/RAH-RAVEN-AUTOPILOT.cmd'
      - 'desktop-bridge/RAH-RAVEN-HUB.cmd'
      - 'desktop-bridge/RAH-OBSERVER-WALL.cmd'
      - 'desktop-bridge/RAH-OBSERVER-LIVE.cmd'
      - 'desktop-bridge/RAH-OBSERVER-DOCTOR.cmd'
      - 'desktop-bridge/observer_doctor.py'
      - 'desktop-bridge/RAH-ANYTHINGLLM.cmd'
      - '.github/workflows/validate-raven-workers.yml'

jobs:
  raven-workers:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: CMD help paths execute
        shell: cmd
        run: |
          call desktop-bridge\RAH-RAVEN-WORKERS.cmd help > workers-help.txt
          findstr /C:"RAH Raven Workers v1.0.2" workers-help.txt
          findstr /C:"archive-compatible SCOUT" workers-help.txt
          call desktop-bridge\RAH-RAVEN-WORKER-CONTROL.cmd help > worker-control-help.txt
          findstr /C:"RAH Raven Worker Control v1.0" worker-control-help.txt
          call desktop-bridge\RAH-RAVEN-AUTOPILOT.cmd help > autopilot-help.txt
          findstr /C:"RAH Raven Autopilot v1.1" autopilot-help.txt
          findstr /C:"Observer/The Wall" autopilot-help.txt
          call desktop-bridge\RAH-OBSERVER-DOCTOR.cmd help > observer-doctor-help.txt
          findstr /C:"RAH Observer Doctor v1.0" observer-doctor-help.txt
          findstr /C:"diagnose read-only" observer-doctor-help.txt
          call desktop-bridge\RAH-RAVEN-HUB.cmd help > hub-help.txt
          findstr /C:"RAH Raven HUB v1.4" hub-help.txt
          findstr /C:"observer-doctor" hub-help.txt
          findstr /C:"livewall" hub-help.txt
          findstr /C:"observer" hub-help.txt
          call desktop-bridge\RAH-OBSERVER-LIVE.cmd help > live-help.txt
          findstr /C:"RAH Observer Live Wall v1.0" live-help.txt
          call desktop-bridge\RAH-ANYTHINGLLM.cmd help > anythingllm-help.txt
          findstr /C:"RAH AnythingLLM Control" anythingllm-help.txt

      - name: Compile Observer Doctor
        shell: pwsh
        run: python -m py_compile desktop-bridge/observer_doctor.py

      - name: Require fixed worker roles and archive-safe capabilities
        shell: pwsh
        run: |
          $text = Get-Content desktop-bridge/RAH-RAVEN-WORKERS.cmd -Raw
          foreach ($required in @('SCOUT','GUARD','TESTER','DOCTOR','project-files','test-bridge-security','test-council','test-vision-core','http://127.0.0.1:18765/health','http://127.0.0.1:18765/agent/run')) {
            if (-not $text.Contains($required)) { throw "Missing required worker marker: $required" }
          }
          if ($text.Contains('call :agent_job "git-status" "SCOUT"')) { throw 'SCOUT must not depend on .git' }

      - name: Require Worker Control contract
        shell: pwsh
        run: |
          $text = Get-Content desktop-bridge/RAH-RAVEN-WORKER-CONTROL.cmd -Raw
          foreach ($required in @('C:\RAH\AgentWork','LATEST.txt','LATEST-RUN.txt','project-files','test-bridge-security','test-council','test-vision-core','NEED REPAIR','PASS WITH WARNING','GREEN / PASS','clip.exe','RAH Raven Workers Startup','RAH Raven Workers Hourly')) {
            if (-not $text.Contains($required)) { throw "Missing Worker Control marker: $required" }
          }
          if ($text.Contains('git-status')) { throw 'Worker Control must be archive-safe' }

      - name: Require Observer Doctor contract
        shell: pwsh
        run: |
          $py = Get-Content desktop-bridge/observer_doctor.py -Raw
          foreach ($required in @('DOCTOR_VERSION = "1.0.0"','OBSERVER-LATEST.txt','OBSERVER-LATEST.json','127.0.0.1:18765','127.0.0.1:18766','127.0.0.1:18767','RustDesk','spacedesk','scrcpy','Phone Link','Bluetooth','Wireless Display','RAH MultiRoom','Missing optional integrations are PLAN, not FAIL')) {
            if (-not $py.Contains($required)) { throw "Missing Observer Doctor marker: $required" }
          }
          $cmd = Get-Content desktop-bridge/RAH-OBSERVER-DOCTOR.cmd -Raw
          foreach ($required in @('RAH Observer Doctor v1.0','SAFE] Starting Observer Control Wall server','SAFE] Starting Observer Live Wall server','OBSERVER-LATEST.txt','selftest','copy')) {
            if (-not $cmd.Contains($required)) { throw "Missing Observer Doctor CMD marker: $required" }
          }
          foreach ($bad in @('winget ','Invoke-Expression','iex ','schtasks /Create','queue.json','githubusercontent.com/')) {
            if ($py.ToLowerInvariant().Contains($bad.ToLowerInvariant()) -or $cmd.ToLowerInvariant().Contains($bad.ToLowerInvariant())) { throw "Observer Doctor crosses SAFE boundary: $bad" }
          }

      - name: Require Autopilot contract
        shell: pwsh
        run: |
          $text = Get-Content desktop-bridge/RAH-RAVEN-AUTOPILOT.cmd -Raw
          foreach ($required in @('RAH Raven Autopilot v1.1','C:\RAH\AgentWork','AUTOPILOT-LATEST.txt','AUTOPILOT-DIAGNOSIS.txt','OBSERVER-LATEST.txt','RAH-OBSERVER-DOCTOR.cmd','Scope: Raven Core + Workers + Observer/The Wall.','[ASK]','[PLAN]','[PASS]')) {
            if (-not $text.Contains($required)) { throw "Missing Autopilot marker: $required" }
          }
          foreach ($forbidden in @('winget ','schtasks /Create','githubusercontent.com/','queue.json','git-status')) {
            if ($text.ToLowerInvariant().Contains($forbidden.ToLowerInvariant())) { throw "Autopilot crosses SAFE boundary: $forbidden" }
          }

      - name: Require HUB contract
        shell: pwsh
        run: |
          $text = Get-Content desktop-bridge/RAH-RAVEN-HUB.cmd -Raw
          foreach ($required in @('RAH Raven HUB v1.4','RAH-RAVEN-CMD.cmd','RAH-RAVEN-WORKERS.cmd','RAH-RAVEN-WORKER-CONTROL.cmd','RAH-RAVEN-AUTOPILOT.cmd','RAH-OBSERVER-WALL.cmd','RAH-OBSERVER-LIVE.cmd','RAH-OBSERVER-DOCTOR.cmd','RAH-ANYTHINGLLM.cmd','OBSERVER LIVE WALL','OBSERVER CONTROL WALL','OBSERVER DOCTOR','if /I "%~1"=="observer-doctor"','127.0.0.1:18767','127.0.0.1:18766')) {
            if (-not $text.Contains($required)) { throw "Missing HUB marker: $required" }
          }

      - name: Require stability gate before workers
        shell: pwsh
        run: |
          $text = Get-Content desktop-bridge/RAH-RAVEN-WORKERS.cmd -Raw
          foreach ($required in @('council_proxy','vision_monitor_capture','local_device_adapter','agent_runner','download_manager')) {
            if (-not $text.Contains($required)) { throw "Missing TRUE GREEN health flag: $required" }
          }
          foreach ($file in @('desktop-bridge/RAH-RAVEN-WORKER-CONTROL.cmd','desktop-bridge/RAH-RAVEN-AUTOPILOT.cmd')) {
            $gate = Get-Content $file -Raw
            foreach ($required in @('council_proxy','vision_monitor_capture','local_device_adapter','agent_runner','download_manager')) {
              if (-not $gate.Contains($required)) { throw "$file missing TRUE GREEN gate: $required" }
            }
          }

      - name: Require honest aggregate result
        shell: pwsh
        run: |
          $text = Get-Content desktop-bridge/RAH-RAVEN-WORKERS.cmd -Raw
          foreach ($required in @('FAILURES=0','WARNINGS=0','FAILURES+=1','WARNINGS+=1','OVERALL: PASS','OVERALL: PASS WITH WARNING','OVERALL: FAIL','exit /b 5','exit /b 6')) {
            if (-not $text.Contains($required)) { throw "Missing aggregate status marker: $required" }
          }

      - name: Reject destructive or arbitrary execution shortcuts
        shell: pwsh
        run: |
          foreach ($file in @('desktop-bridge/RAH-RAVEN-WORKERS.cmd','desktop-bridge/RAH-RAVEN-WORKER-CONTROL.cmd','desktop-bridge/RAH-RAVEN-AUTOPILOT.cmd','desktop-bridge/RAH-RAVEN-HUB.cmd','desktop-bridge/RAH-OBSERVER-LIVE.cmd','desktop-bridge/RAH-OBSERVER-DOCTOR.cmd','desktop-bridge/observer_doctor.py')) {
            $text = (Get-Content $file -Raw).ToLowerInvariant()
            foreach ($bad in @('rmdir /s','rd /s','del /s','format ','diskpart',' -encodedcommand ',' -enc ','queue.json','invoke-expression','iex ')) {
              if ($text.Contains($bad)) { throw "$file contains rejected marker: $bad" }
            }
          }

      - name: Require local result boundary
        shell: pwsh
        run: |
          foreach ($file in @('desktop-bridge/RAH-RAVEN-WORKERS.cmd','desktop-bridge/RAH-RAVEN-WORKER-CONTROL.cmd','desktop-bridge/RAH-RAVEN-AUTOPILOT.cmd','desktop-bridge/RAH-OBSERVER-DOCTOR.cmd','desktop-bridge/observer_doctor.py')) {
            $local = Get-Content $file -Raw
            if (-not $local.Contains('C:\RAH\AgentWork')) { throw "$file must stay inside AgentWork boundary" }
          }
