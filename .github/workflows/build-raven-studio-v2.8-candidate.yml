name: Build Raven Studio v2.8 Candidate

on:
  push:
    branches:
      - studio/raven-studio-v2.8-version-sync
    paths:
      - '.github/scripts/build_raven_studio_v2_8_candidate.py'
      - '.github/workflows/build-raven-studio-v2.8-candidate.yml'

permissions:
  contents: write

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/raven-studio-v2.8-version-sync
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Raven Studio v2.8 candidate
        run: python .github/scripts/build_raven_studio_v2_8_candidate.py
      - name: Validate Studio candidate and aggregate Raven contract
        run: |
          node tests/raven-studio.test.mjs
          node tests/raven-chatgpt-handoff-entry.test.mjs
          node tests/raven-chatgpt-handoff-receipt.test.mjs
          node tests/raven-chatgpt-handoff-history-lite.test.mjs
          node tests/raven-chatgpt-handoff-recall.test.mjs
          node tests/raven-release-gate.test.mjs
          node --check raven-handoff-receipt.js
          node --check raven-handoff-history-lite.js
      - name: Check Studio inline JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('RAH-RAVEN-START.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:[^>]*)>([\s\S]*?)</script>',html)
          Path('/tmp/raven-studio.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/raven-studio.js
      - name: Assert Studio runtime change is footer-only
        run: |
          test "$(git diff --numstat -- RAH-RAVEN-START.html | awk '{print $1 ":" $2}')" = "1:1"
          git diff -- RAH-RAVEN-START.html | grep -F -- '-<p class="footer">RAH Raven Studio v2.8 · Raven 2.0.30 · Launcher 3.0 · Local-first · Ingen skjult skjermfangst, mikrofon eller kamera.</p>'
          git diff -- RAH-RAVEN-START.html | grep -F -- '+<p class="footer">RAH Raven Studio v2.8 · Raven 2.0.32 · Launcher 3.0 · Local-first · Ingen skjult skjermfangst, mikrofon eller kamera.</p>'
      - name: Assert eight stable runtimes and Home Control remain untouched
        run: |
          git diff --exit-code -- \
            RAH-RAVEN-VISION-CORE.html raven-vision-core.js \
            RAH-RAVEN-COUNCIL.html raven-council.js \
            RAH-RAVEN-AGENT-RUNNER.html desktop-bridge/agent_runner.py \
            RAH-RAVEN-MEMORY-SYNC.html raven-chronicle-sync.js \
            RAH-RAVEN-MISSION-CONTROL.html \
            RAH-RAVEN-PROJECT.html \
            RAH-RAVEN-CORE-DEMO.html \
            RAH-RAVEN-NOW-V2.html \
            RAH-HOME-CONTROL.html \
            raven-checkpoint-policy.js
      - name: Commit Studio candidate files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            RAH-RAVEN-START.html \
            RAH-RAVEN-STUDIO-VERSION.json \
            RAH-RAVEN-VERSION.json \
            tests/raven-studio.test.mjs \
            tests/raven-release-gate.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Sync Raven Studio v2.8 stable contract'
          git push origin HEAD:studio/raven-studio-v2.8-version-sync
