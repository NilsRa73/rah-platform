name: Build Memory Sync v0.2 Boundary

on:
  push:
    branches:
      - memory/memory-sync-v0.2-boundary
    paths:
      - '.github/scripts/build_memory_sync_v0_2.py'
      - '.github/workflows/build-memory-sync-v0.2-boundary.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: memory/memory-sync-v0.2-boundary
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Memory Sync v0.2 candidate
        run: python .github/scripts/build_memory_sync_v0_2.py
      - name: Validate Memory Sync candidate and aggregate Raven contract
        run: |
          node --check raven-chronicle-sync.js
          node tests/raven-memory-sync.test.mjs
          node tests/raven-release-gate.test.mjs
      - name: Commit candidate runtime and contract files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RAH-RAVEN-MEMORY-SYNC.html RAH-RAVEN-MEMORY-SYNC-VERSION.json RAH-RAVEN-VERSION.json tests/raven-memory-sync.test.mjs tests/raven-release-gate.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Memory Sync v0.2 local Bridge boundary candidate'
          git push origin HEAD:memory/memory-sync-v0.2-boundary
