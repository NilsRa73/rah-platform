name: Build RAH Case Center v1.6 Stable Gate

on:
  workflow_dispatch:
  push:
    branches:
      - case-center/v1.6-stable-gate
    paths:
      - '.github/scripts/build_case_center_v1_6_stable.py'
      - '.github/workflows/build-case-center-v1.6-stable-gate.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: case-center/v1.6-stable-gate
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install bridge dependencies
        run: python -m pip install -r desktop-bridge/requirements.txt

      - name: Apply stable metadata gate
        run: python .github/scripts/build_case_center_v1_6_stable.py

      - name: Run frozen Case Center regressions
        run: |
          python -m py_compile desktop-bridge/server_v16.py desktop-bridge/raven_bridge.py
          cd desktop-bridge
          python -m unittest -v test_case_v16.py
          python test_raven_bridge_security.py
          python test_chronicle_v17.py
          cd ..
          node tests/raven-case-center-v16.test.mjs
          node tests/raven-release-gate.test.mjs

      - name: Assert Stable Gate metadata-only scope
        shell: python
        run: |
          import shutil
          import subprocess
          shutil.rmtree('.github/scripts/__pycache__', ignore_errors=True)
          shutil.rmtree('desktop-bridge/__pycache__', ignore_errors=True)
          expected={
            'RAH-RAVEN-CASE-CENTER-VERSION.json',
            'RAH-RAVEN-VERSION.json',
            'tests/raven-case-center-v16.test.mjs',
          }
          changed=set(subprocess.check_output(['git','status','--short'],text=True).splitlines())
          paths={line[3:] for line in changed if len(line)>=4}
          assert paths==expected,(paths,expected)
          print('Case Center Stable Gate scope: metadata/tests only')

      - name: Commit Case Center stable contract
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RAH-RAVEN-CASE-CENTER-VERSION.json RAH-RAVEN-VERSION.json tests/raven-case-center-v16.test.mjs
          git commit -m 'Freeze RAH Case Center v1.6 stable contract'
          git push origin HEAD:case-center/v1.6-stable-gate
