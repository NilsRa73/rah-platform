name: Build RAH AI Photos v1.0 Stable Candidate

on:
  push:
    branches:
      - rah-ai-photos-v1.0-stable
    paths:
      - '.github/workflows/build-rah-ai-photos-v1.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rah-ai-photos-v1.0-stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build v1.0 candidate
        run: python .github/scripts/build_rah_ai_photos_v1.py
      - name: Validate runtime candidate
        run: |
          node --check rah-ai-photos.js
          node --check rah-ai-photos-local-ai.js
          node --check rah-ai-photos-backup.js
          node tests/rah-ai-photos.test.mjs
          node tests/rah-ai-photos-backup.test.mjs
      - name: Commit v1.0 candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RAH-AI-PHOTOS.html RAH-AI-PHOTOS-VERSION.json rah-ai-photos.js rah-ai-photos-backup.js tests/rah-ai-photos.test.mjs tests/rah-ai-photos-backup.test.mjs tests/rah-ai-photos-v1-release-gate.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Build RAH AI Photos Golden Gallery v1.0 stable candidate'
          git push origin HEAD:rah-ai-photos-v1.0-stable
