name: Repair Raven 2.0.32 Vision v0.6 Contract

on:
  push:
    branches:
      - raven-2.0.32-vision-v0.6-package-contract
    paths:
      - '.github/workflows/repair-raven-2.0.32-vision-v0.6-contract.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: raven-2.0.32-vision-v0.6-package-contract
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair Raven package contract
        run: python .github/scripts/repair_raven_2_0_32_vision_v0_6_contract.py
      - name: Validate repaired contract
        run: |
          node tests/raven-release-gate.test.mjs
          node tests/raven-vision-core.test.mjs
          node tests/raven-vision-local-boundary.test.mjs
      - name: Commit repaired contract
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RAH-RAVEN-VERSION.json tests/raven-release-gate.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Align Raven 2.0.32 package contract with Vision v0.6 safety patch'
          git push origin HEAD:raven-2.0.32-vision-v0.6-package-contract
