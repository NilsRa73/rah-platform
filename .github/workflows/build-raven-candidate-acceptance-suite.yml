name: Build Raven Candidate Acceptance Status Suite

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'START-RAH-CANDIDATE-SUITE.bat'
      - 'RAH-CANDIDATE-ACCEPTANCE-CENTER.ps1'
      - 'RAH-CANDIDATE-ACCEPTANCE-CENTER.bat'
      - 'RAH-CANDIDATE-ACCEPTANCE-CENTER.md'
      - 'RAH-RAVEN-STUDIO-V2.9-CANDIDATE.json'
      - 'RAH-RAVEN-STUDIO-V3.0.json'
      - 'RAH-RAVEN-DAILY-DRIVER-VERSION.json'
      - 'apps/rah-ai-investigator/RAH-INVESTIGATOR-VERSION.json'
      - '.github/workflows/build-raven-candidate-acceptance-suite.yml'
  pull_request:
    paths:
      - 'START-RAH-CANDIDATE-SUITE.bat'
      - 'RAH-CANDIDATE-ACCEPTANCE-CENTER.ps1'
      - 'RAH-CANDIDATE-ACCEPTANCE-CENTER.bat'
      - 'RAH-CANDIDATE-ACCEPTANCE-CENTER.md'
      - 'RAH-RAVEN-STUDIO-V2.9-CANDIDATE.json'
      - 'RAH-RAVEN-STUDIO-V3.0.json'
      - 'RAH-RAVEN-DAILY-DRIVER-VERSION.json'
      - 'apps/rah-ai-investigator/RAH-INVESTIGATOR-VERSION.json'
      - '.github/workflows/build-raven-candidate-acceptance-suite.yml'

permissions:
  contents: read

jobs:
  build-windows-status-suite:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate status starter
        shell: cmd
        run: START-RAH-CANDIDATE-SUITE.bat --self-test

      - name: Build minimal status ZIP
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $files=@(
            'START-RAH-CANDIDATE-SUITE.bat',
            'RAH-CANDIDATE-ACCEPTANCE-CENTER.bat',
            'RAH-CANDIDATE-ACCEPTANCE-CENTER.ps1',
            'RAH-CANDIDATE-ACCEPTANCE-CENTER.md',
            'RAH-RAVEN-STUDIO-V2.9-CANDIDATE.json',
            'RAH-RAVEN-STUDIO-V3.0.json',
            'RAH-RAVEN-DAILY-DRIVER-VERSION.json',
            'apps/rah-ai-investigator/RAH-INVESTIGATOR-VERSION.json'
          )
          $dist=Join-Path $PWD 'dist-candidate-status'
          $stage=Join-Path $dist 'RAH-Candidate-Acceptance-Status'
          Remove-Item $dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stage|Out-Null
          foreach($rel in $files){
            if(-not(Test-Path -LiteralPath $rel -PathType Leaf)){throw "Missing status file: $rel"}
            $dest=Join-Path $stage ($rel -replace '/','\')
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $dest)|Out-Null
            Copy-Item -LiteralPath $rel -Destination $dest
          }
          if((Get-ChildItem $stage -Recurse -File).Count -ne 8){throw 'Status suite closure must contain exactly 8 files'}
          $zip=Join-Path $dist 'RAH-Raven-Candidate-Acceptance-Status-Windows.zip'
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal
          $hash=(Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          "$hash  RAH-Raven-Candidate-Acceptance-Status-Windows.zip"|Set-Content -Encoding ASCII ($zip+'.sha256.txt')

      - uses: actions/upload-artifact@v7
        with:
          name: RAH-Raven-Candidate-Acceptance-Status-Windows
          path: |
            dist-candidate-status/RAH-Raven-Candidate-Acceptance-Status-Windows.zip
            dist-candidate-status/RAH-Raven-Candidate-Acceptance-Status-Windows.zip.sha256.txt
          if-no-files-found: error
          retention-days: 14
