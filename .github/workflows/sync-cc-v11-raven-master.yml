name: Sync CC v1.1 Raven master
on:
  push:
    branches: ['agent/rah-cc-v1.1-one-time-action-challenge']
    paths:
      - 'tools/sync-command-center-v11-raven-master.mjs'
      - '.github/workflows/sync-cc-v11-raven-master.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Generate Raven master metadata sync
        run: node tools/sync-command-center-v11-raven-master.mjs
      - name: Verify metadata-only diff
        run: test "$(git diff --name-only)" = "RAH-RAVEN-VERSION.json"
      - name: Command Center v1.1 Stable gate
        run: node --test tests/rah-command-center-v11.test.mjs
      - name: Project Registry synchronized Stable gate
        run: node --test tests/raven-project-registry-v0.1.test.mjs
      - name: Raven release gate
        run: node --test tests/raven-release-gate.test.mjs
      - name: Raven one-click current Stable CC contract
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const raven=JSON.parse(fs.readFileSync('RAH-RAVEN-VERSION.json','utf8'));
          const cc=JSON.parse(fs.readFileSync('RAH-COMMAND-CENTER-VERSION.json','utf8'));
          if(cc.version!=='1.1.0'||cc.stage!=='stable'||cc.release_gate?.status!=='passed')throw new Error('CC v1.1 Stable manifest mismatch');
          if(!raven.files.includes(cc.entry))throw new Error('Raven master does not list current Stable CC entry');
          if(!raven.summary.includes(`RAH Raven Command Center v${cc.version}`))throw new Error('Raven master does not name current Stable CC');
          if(!fs.existsSync(cc.entry))throw new Error('Current Stable CC entry missing from package');
          console.log('One-click manifest chain includes current Stable CC:',cc.entry);
          NODE
      - name: Commit Raven master sync
        run: |
          git config user.name "RAH Raven Builder"
          git config user.email "actions@users.noreply.github.com"
          git add RAH-RAVEN-VERSION.json
          git commit -m "Sync Raven master metadata to Command Center v1.1"
          git push
