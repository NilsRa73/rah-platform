name: Validate Raven Updater v2 Candidate

on:
  pull_request:
    paths:
      - 'UPDATE-RAH-RAVEN-V2.ps1'
      - 'RAH-RAVEN-UPDATER-V2-VERSION.json'
      - 'tests/rah-raven-updater-v2-candidate.test.mjs'
      - '.github/workflows/validate-raven-updater-v2-candidate.yml'
  push:
    branches: [main]
    paths:
      - 'UPDATE-RAH-RAVEN-V2.ps1'
      - 'RAH-RAVEN-UPDATER-V2-VERSION.json'
      - 'tests/rah-raven-updater-v2-candidate.test.mjs'
      - '.github/workflows/validate-raven-updater-v2-candidate.yml'

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Candidate-only scope guard
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch origin main --quiet
          allowed='^(UPDATE-RAH-RAVEN-V2\.ps1|RAH-RAVEN-UPDATER-V2-VERSION\.json|tests/rah-raven-updater-v2-candidate\.test\.mjs|\.github/workflows/validate-raven-updater-v2-candidate\.yml)$'
          bad="$(git diff --name-only origin/main...HEAD | grep -Ev "$allowed" || true)"
          if [ -n "$bad" ]; then echo "$bad"; exit 1; fi
      - name: Parse Updater v2 PowerShell
        shell: pwsh
        run: |
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile('UPDATE-RAH-RAVEN-V2.ps1',[ref]$null,[ref]$errors)|Out-Null
          if($errors.Count -gt 0){$errors|Format-List;exit 1}
      - name: Validate Updater v2 Candidate security model
        run: node --test tests/rah-raven-updater-v2-candidate.test.mjs
      - name: Preserve canonical CC 1.7 package
        run: node --test tests/rah-command-center-packaging.test.mjs
      - name: Preserve CC 1.7 Stable release
        run: node --test tests/rah-cc17-stable-release.test.mjs
      - name: Preserve Stable Node 1.3 live token-proof
        run: python3 -m unittest tests/test_rah_node_agent_stable_v13.py -v
      - name: Preserve Raven 2.0.32 release gate
        run: node --test tests/raven-release-gate.test.mjs
