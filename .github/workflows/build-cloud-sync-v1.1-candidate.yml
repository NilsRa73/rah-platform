name: Build RAH Project Brain Cloud Sync v1.1 Candidate

on:
  workflow_dispatch:
  push:
    branches:
      - cloud-sync/v1.1-explicit-boundary
    paths:
      - .github/scripts/build_cloud_sync_v1_1_candidate.py
      - .github/workflows/build-cloud-sync-v1.1-candidate.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloud-sync/v1.1-explicit-boundary
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply candidate patch with freeze guard
        run: python .github/scripts/build_cloud_sync_v1_1_candidate.py
      - name: Validate candidate semantics
        run: |
          node --check cloud-sync.js
          node tests/cloud-sync.test.mjs
          node tests/raven-release-gate.test.mjs
      - name: Assert candidate product scope
        run: |
          python - <<'PY'
          import subprocess
          allowed = {
              'cloud-sync.js',
              'RAH-RAVEN-CLOUD-SYNC-VERSION.json',
              'RAH-RAVEN-VERSION.json',
              'tests/cloud-sync.test.mjs',
          }
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          extra = changed - allowed
          missing = allowed - changed
          if extra or missing:
              raise SystemExit(f'Unexpected candidate diff. extra={sorted(extra)} missing={sorted(missing)} changed={sorted(changed)}')
          print('Candidate diff scope OK:', sorted(changed))
          PY
      - name: Commit candidate product patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud-sync.js RAH-RAVEN-CLOUD-SYNC-VERSION.json RAH-RAVEN-VERSION.json tests/cloud-sync.test.mjs
          git commit -m "Harden Project Brain Cloud Sync v1.1 explicit boundary"
          git push
