name: Build Agent Runner v0.3 Stable Gate

on:
  push:
    branches:
      - agent/agent-runner-v0.3-stable-gate
    paths:
      - '.github/scripts/build_agent_runner_v0_3_stable_gate.py'
      - '.github/workflows/build-agent-runner-v0.3-stable-gate.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/agent-runner-v0.3-stable-gate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Agent Runner v0.3 stable gate
        run: python .github/scripts/build_agent_runner_v0_3_stable_gate.py
      - name: Validate stable gate metadata and aggregate Raven contract
        run: |
          node tests/raven-release-gate.test.mjs
          node tests/raven-agent-runner.test.mjs
          python -m py_compile desktop-bridge/agent_runner.py desktop-bridge/raven_bridge.py
      - name: Commit stable gate metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RAH-RAVEN-AGENT-RUNNER-VERSION.json RAH-RAVEN-VERSION.json tests/raven-release-gate.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Freeze Agent Runner v0.3 stable contract'
          git push origin HEAD:agent/agent-runner-v0.3-stable-gate
