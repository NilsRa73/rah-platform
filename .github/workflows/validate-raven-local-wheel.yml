name: Validate Raven Local Wheel

on:
  push:
    branches:
      - raven-local-wheel-v1
  pull_request:
    paths:
      - 'RAH-RAVEN-WHEEL.html'
      - 'desktop-bridge/observer_live_server.py'
      - 'desktop-bridge/RAH-OBSERVER-LIVE.cmd'
      - 'desktop-bridge/RAH-RAVEN-HUB.cmd'
      - '.github/workflows/validate-raven-local-wheel.yml'

jobs:
  wheel:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile local server
        shell: pwsh
        run: python -m py_compile desktop-bridge/observer_live_server.py

      - name: Validate loopback read-only wheel route
        shell: pwsh
        run: |
          $text = Get-Content desktop-bridge/observer_live_server.py -Raw
          foreach ($required in @(
            'HOST = "127.0.0.1"',
            'PORT = 18767',
            'WHEEL_UI = PROJECT_ROOT / "RAH-RAVEN-WHEEL.html"',
            '@app.get("/wheel")',
            '"wheel": True',
            'request.method != "GET"',
            'arbitrary_commands',
            'fixed_path'
          )) {
            if (-not $text.Contains($required)) { throw "Missing local-wheel server marker: $required" }
          }
          foreach ($bad in @('0.0.0.0','@app.post','request.get_json','request.args','subprocess','os.startfile','shell=True')) {
            if ($text.Contains($bad)) { throw "Wheel server crossed read-only boundary: $bad" }
          }

      - name: Validate wheel UI contract
        shell: pwsh
        run: |
          $text = Get-Content RAH-RAVEN-WHEEL.html -Raw
          foreach ($required in @(
            'RAH RAVEN WHEEL',
            'LOCAL CONTROL SURFACE',
            'COPY HANDOFF',
            "fetch('/health'",
            "fetch('/doctor'",
            "fetch('/handoff'",
            'navigator.clipboard.writeText',
            'http://127.0.0.1:18765/vision/ui',
            'http://127.0.0.1:18766/observer/ui',
            'https://chatgpt.com/'
          )) {
            if (-not $text.Contains($required)) { throw "Missing wheel UI marker: $required" }
          }
          $lower = $text.ToLowerInvariant()
          foreach ($bad in @('eval(','new function(','method:''post''','method: "post"','websocket','powershell','cmd.exe','shell:','127.0.0.1:18765/run','/execute','/command')) {
            if ($lower.Contains($bad.ToLowerInvariant())) { throw "Wheel UI contains rejected active-execution marker: $bad" }
          }

      - name: Validate launch helpers
        shell: cmd
        run: |
          call desktop-bridge\RAH-OBSERVER-LIVE.cmd help > live-help.txt
          findstr /C:"RAH Observer Live Wall + Raven Wheel v1.1" live-help.txt
          findstr /C:"RAH-OBSERVER-LIVE.cmd wheel" live-help.txt
          call desktop-bridge\RAH-RAVEN-HUB.cmd help > hub-help.txt
          findstr /C:"RAH Raven HUB v1.5" hub-help.txt
          findstr /C:"wheel           Open local Raven Wheel" hub-help.txt

      - name: Reject global website injection
        shell: pwsh
        run: |
          $changed = @('RAH-RAVEN-WHEEL.html','desktop-bridge/observer_live_server.py','desktop-bridge/RAH-OBSERVER-LIVE.cmd','desktop-bridge/RAH-RAVEN-HUB.cmd')
          foreach ($file in $changed) {
            $text = Get-Content $file -Raw
            foreach ($bad in @('@match        http://*/*','@match        https://*/*','GM_xmlhttpRequest','GM_openInTab')) {
              if ($text.Contains($bad)) { throw "$file unexpectedly contains global userscript capability: $bad" }
            }
          }

      - name: Reject destructive shortcuts
        shell: pwsh
        run: |
          foreach ($file in @('RAH-RAVEN-WHEEL.html','desktop-bridge/observer_live_server.py','desktop-bridge/RAH-OBSERVER-LIVE.cmd','desktop-bridge/RAH-RAVEN-HUB.cmd')) {
            $text = (Get-Content $file -Raw).ToLowerInvariant()
            foreach ($bad in @('invoke-expression','iex ','encodedcommand','rmdir /s','rd /s','del /s','format ','diskpart','queue.json',' -enc ')) {
              if ($text.Contains($bad)) { throw "$file contains rejected marker: $bad" }
            }
          }
