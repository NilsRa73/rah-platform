name: Build Raven Fristvakt v0.2 Stable Gate

on:
  push:
    branches:
      - 'fristvakt/v0.2-stable-gate'
    paths:
      - '.github/scripts/build_fristvakt_v0_2_stable.py'
      - '.github/workflows/build-fristvakt-v0.2-stable-gate.yml'

permissions:
  contents: write

jobs:
  stable-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and validate runtime-frozen Stable Gate
        run: python .github/scripts/build_fristvakt_v0_2_stable.py
      - name: Commit Stable Gate metadata and test contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RAH-RAVEN-FRISTVAKT-VERSION.json RAH-RAVEN-VERSION.json tests/raven-fristvakt-v0.2.test.mjs
          if git diff --cached --quiet; then
            echo "No Stable Gate changes to commit"
          else
            git commit -m "RAH Raven Fristvakt v0.2 — stable gate"
            git push
          fi
