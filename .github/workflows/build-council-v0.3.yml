name: Build Raven Council v0.3

on:
  push:
    branches:
      - raven-council-v0.3-local-boundary
    paths:
      - '.github/workflows/build-council-v0.3.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: raven-council-v0.3-local-boundary
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Council v0.3
        run: python .github/scripts/build_council_v0_3.py
      - name: Validate Council v0.3
        run: |
          node --check raven-council.js
          node tests/raven-council.test.mjs
          node tests/raven-release-gate.test.mjs
      - name: Commit Council v0.3 runtime and contracts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RAH-RAVEN-COUNCIL.html raven-council.js RAH-RAVEN-VERSION.json tests/raven-council.test.mjs tests/raven-release-gate.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Build Raven Council v0.3 local boundary'
          git push origin HEAD:raven-council-v0.3-local-boundary
