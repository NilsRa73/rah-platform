name: Validate CC 1.4 Stable Readiness Historical Reference

on:
  push:
    paths:
      - 'RAH-CC14-STABLE-PROMOTION-GATE.json'
      - 'tests/rah-cc14-stable-promotion-gate.test.mjs'
      - 'rah-command-center-core-v1.4-candidate.js'
      - 'RAH-COMMAND-CENTER-V1.4-CANDIDATE.html'
      - 'RAH-EPHEMERAL-APPROVAL-CANDIDATE.json'
      - 'RAH-CC14-STABLE-RELEASE.json'
      - '.github/workflows/validate-cc14-stable-readiness.yml'
  pull_request:
    paths:
      - 'RAH-CC14-STABLE-PROMOTION-GATE.json'
      - 'tests/rah-cc14-stable-promotion-gate.test.mjs'
      - 'rah-command-center-core-v1.4-candidate.js'
      - 'RAH-COMMAND-CENTER-V1.4-CANDIDATE.html'
      - 'RAH-EPHEMERAL-APPROVAL-CANDIDATE.json'
      - 'RAH-CC14-STABLE-RELEASE.json'
      - '.github/workflows/validate-cc14-stable-readiness.yml'

permissions:
  contents: read

jobs:
  historical-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify frozen CC 1.4 / Node 0.9 runtime blobs
        shell: bash
        run: |
          test "$(git hash-object rah-command-center-core-v1.4.js)" = "0e376b28b420760365321a31e963aef8b17d7a87"
          test "$(git hash-object RAH-COMMAND-CENTER-V1.4.html)" = "4645dec79201cc630b6f9d39ad6138cc7c1f2183"
          test "$(git hash-object rah-node-agent-v0.9.py)" = "e8774e3dc93e1a4bb431994b5020be0e6354023a"
      - name: CC 1.4 Candidate reference gate
        run: node --test tests/rah-ephemeral-approval-candidate.test.mjs
      - name: Historical CC 1.4 readiness evidence
        run: node --test tests/rah-cc14-stable-promotion-gate.test.mjs
