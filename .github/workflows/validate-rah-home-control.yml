name: Validate RAH Home Control

on:
  workflow_dispatch:
  push:
    paths:
      - 'RAH-HOME-CONTROL.html'
      - 'RAH-HOME-CONTROL-VERSION.json'
      - 'RAH-HOME-CONTROL-ROADMAP.md'
      - 'tests/rah-home-control.test.mjs'
      - 'tests/rah-home-control-backup.test.mjs'
      - 'tests/rah-home-control-stable.test.mjs'
      - 'tests/test_home_control_stable_contract.py'
      - '.github/workflows/validate-rah-home-control.yml'
  pull_request:
    paths:
      - 'RAH-HOME-CONTROL.html'
      - 'RAH-HOME-CONTROL-VERSION.json'
      - 'RAH-HOME-CONTROL-ROADMAP.md'
      - 'tests/rah-home-control.test.mjs'
      - 'tests/rah-home-control-backup.test.mjs'
      - 'tests/rah-home-control-stable.test.mjs'
      - 'tests/test_home_control_stable_contract.py'
      - '.github/workflows/validate-rah-home-control.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Home Control runtime safety baseline
        run: node tests/rah-home-control.test.mjs
      - name: Validate Home Control backup restore baseline
        run: node tests/rah-home-control-backup.test.mjs
      - name: Validate Home Control Stable release baseline
        run: node tests/rah-home-control-stable.test.mjs
      - name: Validate Home Control v1.24 Stable contract
        run: python tests/test_home_control_stable_contract.py
