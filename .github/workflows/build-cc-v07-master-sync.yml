name: Build Command Center v0.7 Raven master sync
on:
  push:
    branches:
      - agent/rah-cc-v0.7-master-sync-r2
    paths:
      - 'tools/sync-command-center-v07-master.mjs'
      - '.github/workflows/build-cc-v07-master-sync.yml'
permissions:
  contents: write
jobs:
  sync:
    if: github.event.head_commit.message == 'Run Command Center v0.7 master sync builder on latest main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Patch Raven master metadata only
        run: node tools/sync-command-center-v07-master.mjs
      - name: Preserve Raven release gate
        run: node --test tests/raven-release-gate.test.mjs
      - name: Preserve Daily Brief Stable contract
        run: node --test tests/raven-daily-brief-v0.1.test.mjs
      - name: Verify only Raven master changed
        run: |
          git diff --check
          test "$(git diff --name-only | sort)" = "RAH-RAVEN-VERSION.json"
      - name: Commit generated metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RAH-RAVEN-VERSION.json
          git commit -m "Sync Raven master metadata for Command Center v0.7"
          git push
