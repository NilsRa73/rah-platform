name: Validate CC 2.2 Raven Master Sync (Historical)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a349dea18149977e4640c1c16a4ddfb44b9167cf
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate historical CC 2.2 Raven master sync authority-neutral delta
        run: node --test tests/rah-cc22-raven-master-sync.test.mjs
      - name: Preserve Raven 2.0.32 frozen release gate at CC2.2 snapshot
        run: node --test tests/raven-release-gate.test.mjs
      - name: Preserve canonical CC 2.2 generation 7 trust chain
        run: node --test tests/rah-cc22-canonical-generation7.test.mjs
      - name: Preserve Stable Node Agent 1.3 live token-proof and negative boundaries
        run: python3 -m unittest tests/test_rah_node_agent_stable_v13.py -v
