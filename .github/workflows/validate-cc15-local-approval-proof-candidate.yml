name: Validate CC 1.5 Local Approval Proof Candidate Reference

on:
  push:
    paths:
      - 'rah-command-center-core-v1.5-candidate.js'
      - 'RAH-COMMAND-CENTER-V1.5-CANDIDATE.html'
      - 'RAH-NODE-LOCAL-APPROVAL-PROOF-CANDIDATE.json'
      - 'tests/rah-cc15-local-approval-proof-candidate.test.mjs'
      - 'tests/rah-cc15-browser-candidate.test.mjs'
      - 'tests/rah-local-approval-proof-integrated-candidate.test.mjs'
      - 'rah-node-agent-v1.0-candidate.py'
      - 'tests/test_rah_node_agent_local_approval_candidate.py'
      - '.github/workflows/validate-cc15-local-approval-proof-candidate.yml'
  pull_request:
    paths:
      - 'rah-command-center-core-v1.5-candidate.js'
      - 'RAH-COMMAND-CENTER-V1.5-CANDIDATE.html'
      - 'RAH-NODE-LOCAL-APPROVAL-PROOF-CANDIDATE.json'
      - 'tests/rah-cc15-local-approval-proof-candidate.test.mjs'
      - 'tests/rah-cc15-browser-candidate.test.mjs'
      - 'tests/rah-local-approval-proof-integrated-candidate.test.mjs'
      - 'rah-node-agent-v1.0-candidate.py'
      - 'tests/test_rah_node_agent_local_approval_candidate.py'
      - '.github/workflows/validate-cc15-local-approval-proof-candidate.yml'

permissions:
  contents: read

jobs:
  integrated-candidate-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify frozen source Stable 1.4 / Node 0.9 blobs
        shell: bash
        run: |
          test "$(git hash-object rah-command-center-core-v1.4.js)" = "0e376b28b420760365321a31e963aef8b17d7a87"
          test "$(git hash-object RAH-COMMAND-CENTER-V1.4.html)" = "4645dec79201cc630b6f9d39ad6138cc7c1f2183"
          test "$(git hash-object rah-node-agent-v0.9.py)" = "e8774e3dc93e1a4bb431994b5020be0e6354023a"
      - name: Re-run Node Agent 1.0 Candidate runtime
        run: python3 -m unittest tests/test_rah_node_agent_local_approval_candidate.py
      - name: Validate CC 1.5 Candidate core
        run: node --test tests/rah-cc15-local-approval-proof-candidate.test.mjs
      - name: Validate CC 1.5 Candidate browser integration
        run: node --test tests/rah-cc15-browser-candidate.test.mjs
      - name: Validate integrated Candidate manifest and rollback evidence
        run: node --test tests/rah-local-approval-proof-integrated-candidate.test.mjs
