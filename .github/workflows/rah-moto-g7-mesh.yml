name: RAH Moto G7 Mesh APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/moto-g7-mesh/app/**'
      - 'android/moto-g7-mesh/build.gradle'
      - 'android/moto-g7-mesh/settings.gradle'
      - '.github/workflows/rah-moto-g7-mesh.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 35
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          if [ -z "$SDKMANAGER" ]; then echo 'No sdkmanager on runner'; exit 1; fi
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug
        working-directory: android/moto-g7-mesh
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RAH-MOTO-G7-MESH-v1-DEBUG-APK
          path: android/moto-g7-mesh/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
