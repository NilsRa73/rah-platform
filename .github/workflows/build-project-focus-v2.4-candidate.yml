name: Build Project Focus v2.4 Candidate

on:
  push:
    branches:
      - project/project-focus-v2.4-stale-guard
    paths:
      - '.github/scripts/build_project_focus_v2_4_candidate.py'
      - '.github/workflows/build-project-focus-v2.4-candidate.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project/project-focus-v2.4-stale-guard
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Project Focus v2.4 candidate
        run: python .github/scripts/build_project_focus_v2_4_candidate.py
      - name: Validate Project Focus candidate and Raven contract
        run: |
          node tests/raven-project-focus.test.mjs
          node tests/raven-release-gate.test.mjs
          node --check raven-checkpoint-policy.js
      - name: Assert frozen components remain untouched
        run: |
          git diff --exit-code -- RAH-RAVEN-VISION-CORE.html RAH-RAVEN-COUNCIL.html RAH-RAVEN-AGENT-RUNNER.html RAH-RAVEN-MEMORY-SYNC.html RAH-RAVEN-MISSION-CONTROL.html
      - name: Commit candidate files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RAH-RAVEN-PROJECT.html RAH-RAVEN-PROJECT-FOCUS-VERSION.json RAH-RAVEN-VERSION.json tests/raven-project-focus.test.mjs tests/raven-release-gate.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Harden Project Focus v2.4 stale selection boundary'
          git push origin HEAD:project/project-focus-v2.4-stale-guard
