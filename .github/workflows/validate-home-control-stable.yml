name: Validate RAH Home Control Stable

on:
  push:
    branches: [main]
    paths:
      - 'RAH-HOME-CONTROL.html'
      - 'RAH-HOME-CONTROL-ROADMAP.md'
      - 'tests/test_home_control_stable_contract.py'
      - 'tests/test_home_control_task_queue_contract.py'
      - '.github/workflows/validate-home-control-stable.yml'
  pull_request:
    paths:
      - 'RAH-HOME-CONTROL.html'
      - 'RAH-HOME-CONTROL-ROADMAP.md'
      - 'tests/test_home_control_stable_contract.py'
      - 'tests/test_home_control_task_queue_contract.py'
      - '.github/workflows/validate-home-control-stable.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stable-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate RAH Home Control Stable contract
        run: python tests/test_home_control_stable_contract.py

      - name: Validate local task queue rollback contract
        run: python tests/test_home_control_task_queue_contract.py
