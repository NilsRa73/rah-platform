name: Generate Project Focus v2.4 Stable CI

on:
  push:
    branches:
      - project/project-focus-v2.4-stable-gate
    paths:
      - '.github/scripts/generate_project_focus_v2_4_stable_ci.py'
      - '.github/workflows/generate-project-focus-v2.4-stable-ci.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project/project-focus-v2.4-stable-gate
      - name: Generate stable CI copies
        run: python .github/scripts/generate_project_focus_v2_4_stable_ci.py
      - name: Sanity-check generated contracts
        run: |
          grep -F "project_focus':'2.4'" .ci-generated/validate-raven-one-click.yml
          grep -F "Project Focus v2.4 stable test" .ci-generated/validate-raven-package.yml
          grep -F "six stable core components" .ci-generated/validate-raven-release-gate.yml
      - name: Commit generated copies only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ci-generated/validate-raven-package.yml .ci-generated/validate-raven-one-click.yml .ci-generated/validate-raven-release-gate.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Generate Project Focus v2.4 stable CI contracts'
          git push origin HEAD:project/project-focus-v2.4-stable-gate
