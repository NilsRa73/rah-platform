name: Validate Policy Stable Promotion Gate

on:
  push:
    paths:
      - 'RAH-POLICY-STABLE-PROMOTION-GATE.json'
      - 'tests/rah-policy-stable-promotion-gate.test.mjs'
      - 'RAH-CAPABILITY-ALLOWLIST-CONTRACT.json'
      - 'RAH-CAPABILITY-ALLOWLIST-CANDIDATE.json'
      - 'RAH-COMMAND-CENTER-V1.2.html'
      - 'RAH-COMMAND-CENTER-V1.3-CANDIDATE.html'
      - 'rah-command-center-core.js'
      - 'rah-command-center-core-v1.3-candidate.js'
      - 'rah-node-agent.py'
      - 'rah-node-agent-v0.9-candidate.py'
      - 'tests/rah-capability-allowlist-contract.test.mjs'
      - 'tests/rah-policy-id-candidate.test.mjs'
      - 'tests/test_rah_node_agent_policy_candidate.py'
      - '.github/workflows/validate-policy-stable-promotion-gate.yml'
  pull_request:
    paths:
      - 'RAH-POLICY-STABLE-PROMOTION-GATE.json'
      - 'tests/rah-policy-stable-promotion-gate.test.mjs'
      - 'RAH-CAPABILITY-ALLOWLIST-CONTRACT.json'
      - 'RAH-CAPABILITY-ALLOWLIST-CANDIDATE.json'
      - 'RAH-COMMAND-CENTER-V1.2.html'
      - 'RAH-COMMAND-CENTER-V1.3-CANDIDATE.html'
      - 'rah-command-center-core.js'
      - 'rah-command-center-core-v1.3-candidate.js'
      - 'rah-node-agent.py'
      - 'rah-node-agent-v0.9-candidate.py'
      - 'tests/rah-capability-allowlist-contract.test.mjs'
      - 'tests/rah-policy-id-candidate.test.mjs'
      - 'tests/test_rah_node_agent_policy_candidate.py'
      - '.github/workflows/validate-policy-stable-promotion-gate.yml'

permissions:
  contents: read

jobs:
  promotion-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stable allowlist guard
        run: node --test tests/rah-capability-allowlist-contract.test.mjs
      - name: Candidate policy and browser gate
        run: node --test tests/rah-policy-id-candidate.test.mjs
      - name: Candidate Node Agent live gate
        run: python3 -m unittest tests/test_rah_node_agent_policy_candidate.py
      - name: Promotion readiness and rollback gate
        run: node --test tests/rah-policy-stable-promotion-gate.test.mjs
