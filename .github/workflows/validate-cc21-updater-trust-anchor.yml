name: Validate CC 2.1 Updater Trust Anchor (Historical)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-historical-cc21:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7c82213c5726b9be77ae47b849af511046b40086
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Re-run immutable CC 2.1 updater trust-anchor evidence
        run: node --test tests/rah-cc21-updater-trust-anchor.test.mjs
