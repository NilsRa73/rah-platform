name: Build CC 2.0 Canonical Root
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/build-cc20-canonical-root.yml']
permissions:
  contents: write
  pull-requests: read
jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/rah-cc-v2.0-canonical-root'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rah-cc-v2.0-canonical-root
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Generate canonical v2.0 root package
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const manifestPath='RAH-COMMAND-CENTER-VERSION.json';
          const m=JSON.parse(fs.readFileSync(manifestPath,'utf8'));
          if(m.version!=='1.9.0'||m.stage!=='stable'||m.entry!=='RAH-COMMAND-CENTER-V1.9.html'||m.runtime!=='rah-command-center-core-v1.9.js'||m.stable_release_manifest!=='RAH-CC19-NODE13-STABLE-RELEASE.json'||m.canonical_package_generation!==4||m.package_files.length!==37)throw new Error('Unexpected canonical v1.9 baseline');
          const v20=['RAH-COMMAND-CENTER-V2.0.html','RAH-COMMAND-CENTER-V2.0-CANDIDATE.html','rah-command-center-core-v2.0-candidate.js','rah-command-center-core-v2.0.js','RAH-CC20-PRECOMMITTED-REQUESTER-CONTEXT-CANDIDATE.json','RAH-CC20-NODE13-STABLE-RELEASE.json'];
          for(const f of v20)if(m.package_files.includes(f))throw new Error('v2.0 artifact already in closure: '+f);
          m.version='2.0.0';m.entry='RAH-COMMAND-CENTER-V2.0.html';m.runtime='rah-command-center-core-v2.0.js';m.previous_stable_version='1.9.0';m.package_files=[...v20,...m.package_files];
          m.features.canonical_package_dependency_count=43;delete m.features.canonical_v19_package;m.features.canonical_v20_package=true;
          Object.assign(m.features,{precommitted_requester_context:true,precommitted_requester_context_version:'rah-cc-precommitted-requester-context-v1',precommitted_requester_context_required_actions:['rustdesk.launch','rustdesk.connect'],precommitted_requester_context_storage_read_required:false,precommitted_requester_context_generated_at_arm:true,precommitted_requester_context_secure_random_required:true,precommitted_requester_context_math_random_fallback:false,precommitted_requester_context_raw_memory_only:true,precommitted_requester_context_raw_persistence:false,precommitted_requester_context_ticket_digest_only:true,precommitted_requester_context_digest_bound:true,precommitted_requester_context_same_value_reused_for_confirmation_and_execution:true,precommitted_requester_context_consume_on_mismatch:true});
          m.release_gate.gate_version='2.3.0';m.release_gate.requires_tests=['tests/rah-command-center-packaging.test.mjs','tests/rah-cc20-precommitted-requester-context.test.mjs','tests/rah-cc20-stable-release.test.mjs','tests/test_rah_node_agent_stable_v13.py'];m.stable_release_manifest='RAH-CC20-NODE13-STABLE-RELEASE.json';m.canonical_package_generation=5;
          fs.writeFileSync(manifestPath,JSON.stringify(m,null,2)+'\n');
          function once(s,a,b,n){const c=s.split(a).length-1;if(c!==1)throw new Error(n+' anchor count '+c);return s.replace(a,b)}
          let launcher=fs.readFileSync('DOBBELTKLIKK-HER-START-RAH-COMMAND-CENTER.bat','utf8');launcher=launcher.replaceAll('RAH-COMMAND-CENTER-V1.9.html','RAH-COMMAND-CENTER-V2.0.html').replaceAll('v1.9.0 STABLE','v2.0.0 STABLE').replaceAll('i v1.9;','i v2.0;');fs.writeFileSync('DOBBELTKLIKK-HER-START-RAH-COMMAND-CENTER.bat',launcher);
          let nb=fs.readFileSync('START-RAH-NODE-AGENT.bat','utf8');nb=once(nb,'for v1.9-pakken.','for v2.0-pakken.','node help');fs.writeFileSync('START-RAH-NODE-AGENT.bat',nb);
          let up=fs.readFileSync('UPDATE-RAH-COMMAND-CENTER.ps1','utf8').replace(/\r\n/g,'\n');
          up=once(up,'$AllowedPackageFiles=@(\n  "RAH-COMMAND-CENTER-V1.9.html",','$AllowedPackageFiles=@(\n  "RAH-COMMAND-CENTER-V2.0.html",\n  "RAH-COMMAND-CENTER-V2.0-CANDIDATE.html",\n  "rah-command-center-core-v2.0-candidate.js",\n  "rah-command-center-core-v2.0.js",\n  "RAH-CC20-PRECOMMITTED-REQUESTER-CONTEXT-CANDIDATE.json",\n  "RAH-CC20-NODE13-STABLE-RELEASE.json",\n  "RAH-COMMAND-CENTER-V1.9.html",','updater allowlist');
          const repl=[['$Release.commandCenterVersion-ne"1.9.0"','$Release.commandCenterVersion-ne"2.0.0"'],['Description="Start RAH Raven Command Center v1.9 Stable"','Description="Start RAH Raven Command Center v2.0 Stable"'],['Starter eksplisitt RAH Command Center v1.9 pakkeoppdatering.','Starter eksplisitt RAH Command Center v2.0 pakkeoppdatering.'],['$manifest.version-ne"1.9.0"','$manifest.version-ne"2.0.0"'],['canonical v1.9 Stable','canonical v2.0 Stable'],['[string]$manifest.entry-ne"RAH-COMMAND-CENTER-V1.9.html"','[string]$manifest.entry-ne"RAH-COMMAND-CENTER-V2.0.html"'],['[string]$manifest.runtime-ne"rah-command-center-core-v1.9.js"','[string]$manifest.runtime-ne"rah-command-center-core-v2.0.js"'],['$releasePath-ne"RAH-CC19-NODE13-STABLE-RELEASE.json"','$releasePath-ne"RAH-CC20-NODE13-STABLE-RELEASE.json"'],['Command Center v1.9 Stable klar','Command Center v2.0 Stable klar'],['Command Center v1.9 Stable er klar.','Command Center v2.0 Stable er klar.']];
          for(const[a,b]of repl)up=once(up,a,b,'updater '+a);fs.writeFileSync('UPDATE-RAH-COMMAND-CENTER.ps1',up);
          const files=[...v20,...m.package_files.slice(6)];
          fs.writeFileSync('tests/rah-command-center-packaging.test.mjs',`import test from'node:test';\nimport assert from'node:assert/strict';\nimport fs from'node:fs';\nconst m=JSON.parse(fs.readFileSync('RAH-COMMAND-CENTER-VERSION.json','utf8'));\nconst release=JSON.parse(fs.readFileSync('RAH-CC20-NODE13-STABLE-RELEASE.json','utf8'));\nconst up=fs.readFileSync('UPDATE-RAH-COMMAND-CENTER.ps1','utf8');\nconst launcher=fs.readFileSync('DOBBELTKLIKK-HER-START-RAH-COMMAND-CENTER.bat','utf8');\nconst nodeBat=fs.readFileSync('START-RAH-NODE-AGENT.bat','utf8');\nconst nodeSh=fs.readFileSync('START-RAH-NODE-AGENT.sh','utf8');\nconst files=${JSON.stringify(files)};\n\ntest('canonical v2.0 Stable package closure',()=>{assert.equal(m.version,'2.0.0');assert.equal(m.stage,'stable');assert.equal(m.entry,'RAH-COMMAND-CENTER-V2.0.html');assert.equal(m.runtime,'rah-command-center-core-v2.0.js');assert.equal(m.previous_stable_version,'1.9.0');assert.equal(m.stable_release_manifest,'RAH-CC20-NODE13-STABLE-RELEASE.json');assert.equal(m.canonical_package_generation,5);assert.equal(m.release_gate.status,'passed');assert.equal(m.release_gate.runtime_files_frozen,true);assert.equal(m.development_paused,true);assert.deepEqual(m.package_files,files);assert.equal(files.length,43);for(const f of files)assert.ok(fs.existsSync(f),f)});\ntest('canonical launcher is offline and opens v2.0 Stable',()=>{assert.match(launcher,/RAH-COMMAND-CENTER-V2\\.0\\.html/);assert.match(launcher,/v2\\.0\\.0 STABLE/);assert.doesNotMatch(launcher,/Invoke-WebRequest|curl\\b|wget\\b|https?:\\/\\//i)});\ntest('Node launchers retain exact Stable Node 1.3',()=>{assert.match(nodeBat,/rah-node-agent-v1\\.3\\.py/);assert.match(nodeSh,/rah-node-agent-v1\\.3\\.py/)});\ntest('manual updater pins exact immutable 43-file closure and v2.0 release',()=>{for(const f of files)assert.ok(up.includes('"'+f+'"'),f);assert.match(up,/Resolve-VerifiedRepositoryCommit/);assert.match(up,/commit\\.verification\\.verified/);assert.match(up,/Assert-FixedPackageContract/);assert.match(up,/Assert-StableReleaseContract/);assert.match(up,/manifest\\.version-ne"2\\.0\\.0"/);assert.match(up,/RAH-CC20-NODE13-STABLE-RELEASE\\.json/)});\ntest('canonical authority stays frozen and requester context is precommitted',()=>{assert.equal(release.commandCenterVersion,'2.0.0');assert.equal(release.nodeAgentVersion,'1.3.0');assert.equal(release.nodeRuntimeChange,false);assert.deepEqual(release.authoritySurface.capabilities,['compute','storage','display','remote-desktop']);assert.deepEqual(release.authoritySurface.actions,['storage-summary.read','rustdesk.launch','rustdesk.connect']);assert.deepEqual(release.authoritySurface.businessRoutes,['/health','/actions','/storage','/launch/rustdesk','/handoff/rustdesk']);const p=release.precommittedRequesterContext;assert.equal(p.generatedAtArm,true);assert.equal(p.rawRequesterContextMemoryOnly,true);assert.equal(p.rawRequesterContextPersistent,false);assert.equal(p.ticketStoresRequesterContextDigestOnly,true);assert.equal(p.bindsRequesterContextDigest,true);assert.equal(p.sameContextUsedForNodeLocalConfirmationAndExecution,true);assert.equal(p.singleUse,true);assert.equal(p.consumeBeforeNodeLocalConfirmation,true);assert.equal(p.consumeOnContextMismatch,true);assert.equal(p.mathRandomFallback,false);assert.equal(release.retainedImmutableIntent.bindsEndpointIpv4,true);assert.equal(release.retainedImmutableIntent.bindsCapabilitySnapshot,true);assert.equal(m.features.precommitted_requester_context,true);assert.equal(m.features.precommitted_requester_context_raw_persistence,false);assert.equal(m.features.precommitted_requester_context_math_random_fallback,false)});\n`);
          let wf=fs.readFileSync('.github/workflows/validate-rah-command-center.yml','utf8');wf=wf.replaceAll('Canonical v1.9','Canonical v2.0').replaceAll('canonical v1.9','canonical v2.0').replaceAll('v1.9 immutable-intent Candidate','v2.0 precommitted requester-context Candidate').replaceAll('tests/rah-cc19-immutable-mutating-intent.test.mjs','tests/rah-cc20-precommitted-requester-context.test.mjs').replaceAll('CC 1.9 Stable','CC 2.0 Stable').replaceAll('tests/rah-cc19-stable-release.test.mjs','tests/rah-cc20-stable-release.test.mjs');
          const anchor="      - 'RAH-COMMAND-CENTER-V1.9.html'";const add="      - 'RAH-COMMAND-CENTER-V2.0.html'\n      - 'RAH-COMMAND-CENTER-V2.0-CANDIDATE.html'\n      - 'rah-command-center-core-v2.0.js'\n      - 'rah-command-center-core-v2.0-candidate.js'\n      - 'RAH-CC20-PRECOMMITTED-REQUESTER-CONTEXT-CANDIDATE.json'\n      - 'RAH-CC20-NODE13-STABLE-RELEASE.json'\n"+anchor;wf=wf.replace(anchor,add).replace(anchor,add);fs.writeFileSync('.github/workflows/validate-rah-command-center.yml',wf);
          NODE
      - name: Validate generated canonical package
        run: |
          node --test tests/rah-command-center-packaging.test.mjs
          node --test tests/rah-cc20-precommitted-requester-context.test.mjs
          node --test tests/rah-cc20-stable-release.test.mjs
          python3 -m unittest tests/test_rah_node_agent_stable_v13.py -v
          node --test tests/raven-release-gate.test.mjs
      - name: Parse updater
        shell: pwsh
        run: |
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile('UPDATE-RAH-COMMAND-CENTER.ps1',[ref]$null,[ref]$errors)|Out-Null
          if($errors.Count -gt 0){$errors|Format-List;exit 1}
      - name: Require exact permanent scope, self-delete and push
        shell: bash
        run: |
          git config user.name 'RAH CC Canonical Builder'
          git config user.email 'actions@users.noreply.github.com'
          rm -rf __pycache__ tests/__pycache__
          git rm .rah-trigger-cc20-canonical .github/workflows/build-cc20-canonical-root.yml
          changed="$(git status --short | sed 's/^...//' | sort)"
          expected="$(printf '%s\n' '.github/workflows/build-cc20-canonical-root.yml' '.github/workflows/validate-rah-command-center.yml' '.rah-trigger-cc20-canonical' 'DOBBELTKLIKK-HER-START-RAH-COMMAND-CENTER.bat' 'RAH-COMMAND-CENTER-VERSION.json' 'START-RAH-NODE-AGENT.bat' 'UPDATE-RAH-COMMAND-CENTER.ps1' 'tests/rah-command-center-packaging.test.mjs' | sort)"
          test "$changed" = "$expected" || { echo "$changed"; exit 1; }
          git add -A
          git commit -m 'RAH Command Center v2.0 — canonical Stable root package'
          git push origin HEAD:agent/rah-cc-v2.0-canonical-root
