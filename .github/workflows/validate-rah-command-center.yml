name: Validate RAH Command Center Canonical v1.7
on:
  pull_request:
    paths:
      - 'RAH-COMMAND-CENTER-VERSION.json'
      - 'DOBBELTKLIKK-HER-START-RAH-COMMAND-CENTER.bat'
      - 'START-RAH-NODE-AGENT.bat'
      - 'START-RAH-NODE-AGENT.sh'
      - 'UPDATE-RAH-COMMAND-CENTER.ps1'
      - 'RAH-COMMAND-CENTER-V1.7.html'
      - 'RAH-COMMAND-CENTER-V1.7-CANDIDATE.html'
      - 'rah-command-center-core-v1.7.js'
      - 'rah-command-center-core-v1.7-candidate.js'
      - 'rah-node-agent-v1.3.py'
      - 'rah-node-agent-v1.3-candidate.py'
      - 'RAH-CC17-NODE13-STABLE-RELEASE.json'
      - 'tests/rah-command-center-packaging.test.mjs'
      - 'tests/rah-cc17-stable-release.test.mjs'
      - 'tests/test_rah_node_agent_stable_v13.py'
      - '.github/workflows/validate-rah-command-center.yml'
  push:
    branches: [main]
    paths:
      - 'RAH-COMMAND-CENTER-VERSION.json'
      - 'DOBBELTKLIKK-HER-START-RAH-COMMAND-CENTER.bat'
      - 'START-RAH-NODE-AGENT.bat'
      - 'START-RAH-NODE-AGENT.sh'
      - 'UPDATE-RAH-COMMAND-CENTER.ps1'
      - 'RAH-COMMAND-CENTER-V1.7.html'
      - 'RAH-COMMAND-CENTER-V1.7-CANDIDATE.html'
      - 'rah-command-center-core-v1.7.js'
      - 'rah-command-center-core-v1.7-candidate.js'
      - 'rah-node-agent-v1.3.py'
      - 'rah-node-agent-v1.3-candidate.py'
      - 'RAH-CC17-NODE13-STABLE-RELEASE.json'
      - 'tests/rah-command-center-packaging.test.mjs'
      - 'tests/rah-cc17-stable-release.test.mjs'
      - 'tests/test_rah_node_agent_stable_v13.py'
      - '.github/workflows/validate-rah-command-center.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Preserve root v1.2 compatibility core
        run: node --test tests/rah-command-center-core.test.mjs
      - name: Preserve historical v0.5 through v1.1 artifacts
        run: |
          node --test tests/rah-command-center-v05.test.mjs
          node --test tests/rah-command-center-v06.test.mjs
          node --test tests/rah-command-center-v07.test.mjs
          node --test tests/rah-command-center-v08.test.mjs
          node --test tests/rah-command-center-v09.test.mjs
          node --test tests/rah-command-center-v10.test.mjs
          node --test tests/rah-command-center-v11.test.mjs
      - name: Preserve v1.2 historical UI agent and compatibility-core sections
        run: |
          RAH_CC_V12_SECTION=ui node --test tests/rah-command-center-v12.test.mjs
          RAH_CC_V12_SECTION=agent node --test tests/rah-command-center-v12.test.mjs
          RAH_CC_V12_SECTION=core node --test tests/rah-command-center-v12.test.mjs
      - name: Validate canonical v1.7 package closure
        run: node --test tests/rah-command-center-packaging.test.mjs
      - name: Re-run CC 1.7 Stable release pins
        run: node --test tests/rah-cc17-stable-release.test.mjs
      - name: Re-run Stable Node Agent 1.3 live token-proof gate
        run: python3 -m unittest tests/test_rah_node_agent_stable_v13.py -v
      - name: Parse manual PowerShell updater scripts
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('UPDATE-RAH-COMMAND-CENTER.ps1', [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('UPDATE-RAH-RAVEN.ps1', [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
      - name: Preserve frozen Raven release gate
        run: node --test tests/raven-release-gate.test.mjs
      - name: Preserve Raven Project Registry stable contract
        run: node --test tests/raven-project-registry-v0.1.test.mjs
      - name: Preserve Raven Daily Brief stable contract
        run: node --test tests/raven-daily-brief-v0.1.test.mjs
      - name: Preserve Raven Health and Fatigue stable contract
        run: node --test tests/raven-health-fatigue-v0.2.test.mjs
      - name: Preserve Raven Care stable contract
        run: node --test tests/raven-care-v0.1.test.mjs
      - name: Preserve Raven Fristvakt stable contract
        run: node --test tests/raven-fristvakt-v0.2.test.mjs
