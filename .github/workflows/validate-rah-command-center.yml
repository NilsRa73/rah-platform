name: Validate RAH Command Center Canonical v2.4 Generation 9

on:
  pull_request:
    paths:
      - 'RAH-COMMAND-CENTER-VERSION.json'
      - 'RAH-COMMAND-CENTER-V*.html'
      - 'RAH-CC*.json'
      - 'RAH-NODE*.json'
      - 'rah-command-center-core*.js'
      - 'rah-node-agent*.py'
      - 'DOBBELTKLIKK-HER-START-RAH-COMMAND-CENTER.bat'
      - 'START-RAH-NODE-AGENT*.bat'
      - 'START-RAH-NODE-AGENT*.sh'
      - 'UPDATE-RAH-COMMAND-CENTER.ps1'
      - 'UPDATE-RAH-RAVEN.ps1'
      - 'tests/rah-command-center*.mjs'
      - 'tests/rah-cc*.mjs'
      - 'tests/test_rah_node_agent_stable_v13.py'
      - 'tests/test_rah_node_agent_stable_v14.py'
      - '.github/workflows/validate-rah-command-center.yml'
  push:
    branches: [main]
    paths:
      - 'RAH-COMMAND-CENTER-VERSION.json'
      - 'RAH-COMMAND-CENTER-V*.html'
      - 'RAH-CC*.json'
      - 'RAH-NODE*.json'
      - 'rah-command-center-core*.js'
      - 'rah-node-agent*.py'
      - 'DOBBELTKLIKK-HER-START-RAH-COMMAND-CENTER.bat'
      - 'START-RAH-NODE-AGENT*.bat'
      - 'START-RAH-NODE-AGENT*.sh'
      - 'UPDATE-RAH-COMMAND-CENTER.ps1'
      - 'UPDATE-RAH-RAVEN.ps1'
      - 'tests/rah-command-center*.mjs'
      - 'tests/rah-cc*.mjs'
      - 'tests/test_rah_node_agent_stable_v13.py'
      - 'tests/test_rah_node_agent_stable_v14.py'
      - '.github/workflows/validate-rah-command-center.yml'

permissions:
  contents: read

jobs:
  canonical:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Preserve root v1.2 compatibility core
        run: node --test tests/rah-command-center-core.test.mjs
      - name: Preserve historical v0.5 through v1.1 artifacts
        run: |
          node --test tests/rah-command-center-v05.test.mjs
          node --test tests/rah-command-center-v06.test.mjs
          node --test tests/rah-command-center-v07.test.mjs
          node --test tests/rah-command-center-v08.test.mjs
          node --test tests/rah-command-center-v09.test.mjs
          node --test tests/rah-command-center-v10.test.mjs
          node --test tests/rah-command-center-v11.test.mjs
      - name: Preserve v1.2 historical UI agent and compatibility-core sections
        run: |
          RAH_CC_V12_SECTION=ui node --test tests/rah-command-center-v12.test.mjs
          RAH_CC_V12_SECTION=agent node --test tests/rah-command-center-v12.test.mjs
          RAH_CC_V12_SECTION=core node --test tests/rah-command-center-v12.test.mjs

      - name: Preserve versioned CC 2.3 Candidate and Stable regression
        run: |
          node --test tests/rah-cc23-fleet-snapshot-registry-binding.test.mjs
          node --test tests/rah-cc23-stable-readiness.test.mjs
          node --test tests/rah-cc23-stable-release.test.mjs
      - name: Preserve Stable Node Agent 1.3 historical gate
        run: python3 -m unittest tests/test_rah_node_agent_stable_v13.py -v

      - name: Validate CC 2.4 Raven Commander Candidate and Stable
        run: |
          node tests/rah-cc24-raven-commander-candidate.test.mjs
          node tests/rah-cc24-raven-commander-ui.test.mjs
          node tests/rah-cc24-stable-release.test.mjs
      - name: Validate canonical v2.4 generation 9 package closure
        run: node --test tests/rah-command-center-packaging.test.mjs
      - name: Validate canonical generation 9 immutable package and rollback contract
        run: node --test tests/rah-cc24-canonical-generation9.test.mjs

      - name: Parse manual PowerShell updater scripts
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('UPDATE-RAH-COMMAND-CENTER.ps1', [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('UPDATE-RAH-RAVEN.ps1', [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
      - name: Preserve frozen Raven release gate
        run: node --test tests/raven-release-gate.test.mjs

  node14-current:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Node 1.4 Candidate and Stable
        run: python -m py_compile rah-node-agent-v1.4-candidate.py rah-node-agent-v1.4.py tests/test_rah_node_agent_stable_v14.py
      - name: Validate current Stable Node 1.4 Raven status boundary
        run: python tests/test_rah_node_agent_stable_v14.py
