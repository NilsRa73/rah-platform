      - 'tests/rah-cc21-fleet-snapshot.test.mjs'
      - 'tests/rah-cc21-stable-release.test.mjs'
      - 'tests/rah-cc21-canonical-dependency-integrity.test.mjs'
      - 'tests/rah-cc21-downloaded-blob-verification.test.mjs'
      - 'tests/rah-cc21-transactional-package-staging.test.mjs'
      - 'tests/rah-cc21-updater-trust-anchor.test.mjs'
      - 'tests/rah-cc21-crash-recovery-candidate.test.mjs'
      - 'tests/rah-cc21-crash-recovery-readiness.test.mjs'
      - 'tests/rah-cc21-crash-recovery-stable-gate.test.mjs'
      - 'tests/rah-cc21-crash-recovery-stable-release.test.mjs'
      - 'tests/test_rah_node_agent_stable_v13.py'
      - '.github/workflows/validate-rah-command-center.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Preserve root v1.2 compatibility core
        run: node --test tests/rah-command-center-core.test.mjs
      - name: Preserve historical v0.5 through v1.1 artifacts
        run: |
          node --test tests/rah-command-center-v05.test.mjs
          node --test tests/rah-command-center-v06.test.mjs
          node --test tests/rah-command-center-v07.test.mjs
          node --test tests/rah-command-center-v08.test.mjs
          node --test tests/rah-command-center-v09.test.mjs
          node --test tests/rah-command-center-v10.test.mjs
          node --test tests/rah-command-center-v11.test.mjs
      - name: Preserve v1.2 historical UI agent and compatibility-core sections
        run: |
          RAH_CC_V12_SECTION=ui node --test tests/rah-command-center-v12.test.mjs
          RAH_CC_V12_SECTION=agent node --test tests/rah-command-center-v12.test.mjs
          RAH_CC_V12_SECTION=core node --test tests/rah-command-center-v12.test.mjs
      - name: Validate canonical v2.1 package closure
        run: node --test tests/rah-command-center-packaging.test.mjs
      - name: Re-run v2.1 Manual Fleet Snapshot Candidate matrix
        run: node --test tests/rah-cc21-fleet-snapshot.test.mjs
      - name: Re-run CC 2.1 Stable release pins
        run: node --test tests/rah-cc21-stable-release.test.mjs
      - name: Re-run CC 2.1 canonical dependency integrity
        run: node --test tests/rah-cc21-canonical-dependency-integrity.test.mjs
      - name: Re-run CC 2.1 downloaded Git blob verification
        run: node --test tests/rah-cc21-downloaded-blob-verification.test.mjs
      - name: Re-run CC 2.1 transactional package staging
        run: node --test tests/rah-cc21-transactional-package-staging.test.mjs
      - name: Re-run CC 2.1 updater trust anchor
        run: node --test tests/rah-cc21-updater-trust-anchor.test.mjs
      - name: Re-run CC 2.1 crash-recovery Candidate evidence
        run: node --test tests/rah-cc21-crash-recovery-candidate.test.mjs
      - name: Re-run CC 2.1 crash-recovery Stable Gate
        run: node --test tests/rah-cc21-crash-recovery-stable-gate.test.mjs
      - name: Re-run CC 2.1 crash-recovery Stable release
        run: node --test tests/rah-cc21-crash-recovery-stable-release.test.mjs
      - name: Re-run Stable Node Agent 1.3 live token-proof gate
        run: python3 -m unittest tests/test_rah_node_agent_stable_v13.py -v
      - name: Parse manual PowerShell updater scripts
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('UPDATE-RAH-COMMAND-CENTER.ps1', [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('UPDATE-RAH-RAVEN.ps1', [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
      - name: Preserve frozen Raven release gate
        run: node --test tests/raven-release-gate.test.mjs
