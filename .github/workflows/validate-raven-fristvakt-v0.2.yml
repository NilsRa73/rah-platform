name: Validate Raven Fristvakt v0.2

on:
  push:
    branches:
      - main
      - 'fristvakt/**'
    paths:
      - 'RAH-RAVEN-FRISTVAKT.html'
      - 'RAH-RAVEN-FRISTVAKT-VERSION.json'
      - 'RAH-RAVEN-VERSION.json'
      - 'tests/raven-fristvakt-v0.2.test.mjs'
      - 'tests/rah-command-center-v04.test.mjs'
      - 'tests/rah-command-center-v06.test.mjs'
      - 'tests/rah-command-center-v07.test.mjs'
      - 'tests/rah-command-center-v08.test.mjs'
      - 'tests/rah-cc23-stable-release.test.mjs'
      - 'tests/rah-cc23-canonical-generation8.test.mjs'
      - 'tests/rah-command-center-packaging.test.mjs'
      - 'tests/rah-cc24-canonical-generation9.test.mjs'
      - 'tests/test_rah_node_agent_stable_v13.py'
      - 'tests/test_rah_node_agent_stable_v14.py'
      - '.github/workflows/validate-raven-fristvakt-v0.2.yml'
  pull_request:
    paths:
      - 'RAH-RAVEN-FRISTVAKT.html'
      - 'RAH-RAVEN-FRISTVAKT-VERSION.json'
      - 'RAH-RAVEN-VERSION.json'
      - 'tests/raven-fristvakt-v0.2.test.mjs'
      - 'tests/rah-command-center-v04.test.mjs'
      - 'tests/rah-command-center-v06.test.mjs'
      - 'tests/rah-command-center-v07.test.mjs'
      - 'tests/rah-command-center-v08.test.mjs'
      - 'tests/rah-cc23-stable-release.test.mjs'
      - 'tests/rah-cc23-canonical-generation8.test.mjs'
      - 'tests/rah-command-center-packaging.test.mjs'
      - 'tests/rah-cc24-canonical-generation9.test.mjs'
      - 'tests/test_rah_node_agent_stable_v13.py'
      - 'tests/test_rah_node_agent_stable_v14.py'
      - '.github/workflows/validate-raven-fristvakt-v0.2.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Fristvakt privacy and rights boundary
        run: node tests/raven-fristvakt-v0.2.test.mjs
      - name: Parse inline Fristvakt runtime
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('RAH-RAVEN-FRISTVAKT.html','utf8');
          const scripts=[...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];
          if(scripts.length!==1) throw new Error('Expected one inline Fristvakt script');
          new Function(scripts[0][1]);
          console.log('Fristvakt inline runtime parses');
          NODE
      - name: Preserve Raven aggregate release gate
        run: node tests/raven-release-gate.test.mjs
      - name: Preserve Raven Care stable contract
        run: node tests/raven-care-v0.1.test.mjs
      - name: Preserve Case Center stable contract
        run: node tests/raven-case-center-v16.test.mjs
      - name: Preserve historical Command Center v0.4 artifact required by Fristvakt gate
        run: node tests/rah-command-center-v04.test.mjs
      - name: Preserve historical Command Center v0.6 through v0.8 artifacts
        run: |
          node tests/rah-command-center-v06.test.mjs
          node tests/rah-command-center-v07.test.mjs
          node tests/rah-command-center-v08.test.mjs
      - name: Preserve historical CC 2.3 generation 8 immutable trust
        run: |
          node --test tests/rah-cc23-stable-release.test.mjs
          node --test tests/rah-cc23-canonical-generation8.test.mjs
      - name: Validate current CC 2.4 generation 9 canonical trust
        run: |
          node --test tests/rah-command-center-packaging.test.mjs
          node --test tests/rah-cc24-canonical-generation9.test.mjs
      - name: Preserve historical Node Agent 1.3 security boundary
        run: python3 -m unittest tests/test_rah_node_agent_stable_v13.py -v
      - name: Validate current Node Agent 1.4 Raven status boundary
        run: python tests/test_rah_node_agent_stable_v14.py
