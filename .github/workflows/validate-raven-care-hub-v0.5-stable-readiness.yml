name: Validate Raven Care Hub v0.5 Historical Readiness

on:
  push:
    paths:
      - 'RAH-RAVEN-CARE-HUB-V0.4-STABLE.html'
      - 'RAH-RAVEN-CARE-HUB-V0.4-STABLE.json'
      - 'RAH-RAVEN-CARE-HUB-V0.5-CANDIDATE.html'
      - 'RAH-RAVEN-CARE-HUB-V0.5-CANDIDATE.json'
      - 'RAH-RAVEN-CARE-HUB-V0.5-STABLE-READINESS.json'
      - 'tests/raven-care-hub-v0.5-stable-readiness.test.mjs'
      - '.github/workflows/validate-raven-care-hub-v0.5-stable-readiness.yml'
  pull_request:
    paths:
      - 'RAH-RAVEN-CARE-HUB-V0.4-STABLE.html'
      - 'RAH-RAVEN-CARE-HUB-V0.4-STABLE.json'
      - 'RAH-RAVEN-CARE-HUB-V0.5-CANDIDATE.html'
      - 'RAH-RAVEN-CARE-HUB-V0.5-CANDIDATE.json'
      - 'RAH-RAVEN-CARE-HUB-V0.5-STABLE-READINESS.json'
      - 'tests/raven-care-hub-v0.5-stable-readiness.test.mjs'
      - '.github/workflows/validate-raven-care-hub-v0.5-stable-readiness.yml'

permissions:
  contents: read

jobs:
  historical-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate immutable v0.4 rollback and v0.5 Candidate readiness pins
        run: node tests/raven-care-hub-v0.5-stable-readiness.test.mjs
      - name: Preserve v0.5 Candidate boundary
        run: node tests/raven-care-hub-v0.5-candidate.test.mjs
      - name: Preserve historical v0.4 rollback boundary
        run: node tests/raven-care-hub-v0.4.test.mjs
