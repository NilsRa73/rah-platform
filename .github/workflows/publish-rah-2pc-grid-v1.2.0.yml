name: Publish RAH Raven 2-PC Grid v1.2.0

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-rah-2pc-grid-v1.2.0.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and verify annotated release tag
        shell: bash
        run: |
          set -euo pipefail
          TARGET='0c4c6301932ad7b8146eebf824e5dcb16ca11a52'
          TAG='rah-2pc-grid-v1.2.0'
          git cat-file -e "${TARGET}^{commit}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git fetch --force --tags origin "refs/tags/${TAG}:refs/tags/${TAG}"
            test "$(git cat-file -t "refs/tags/${TAG}")" = 'tag'
            test "$(git rev-parse "${TAG}^{commit}")" = "${TARGET}"
          else
            git config user.name 'RAH Release Bot'
            git config user.email 'actions@users.noreply.github.com'
            git tag -a "${TAG}" "${TARGET}" -m 'RAH Raven 2-PC Grid v1.2.0'
            test "$(git cat-file -t "refs/tags/${TAG}")" = 'tag'
            test "$(git rev-parse "${TAG}^{commit}")" = "${TARGET}"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Build exact release package
        shell: bash
        run: |
          set -euo pipefail
          TARGET='0c4c6301932ad7b8146eebf824e5dcb16ca11a52'
          mkdir -p dist
          FILES=(
            INSTALL-RAH-2PC-GRID.cmd
            START-HER-RAH-2PC-GRID.cmd
            VERIFY-RAH-2PC-GRID.cmd
            COMPLETE-RAH-2PC-GRID.cmd
            RAH-RAVEN-2PC-GUI.ps1
            RAH-2PC-CLIENT.ps1
            RAH-2PC-ACCEPTANCE.ps1
            RAH-HARDWARE-INVENTORY.ps1
            RAH-HARDWARE-REGISTRY.ps1
            RAH-2PC-GRID.md
          )
          git archive --format=zip --output=dist/RAH-Raven-2PC-Grid-v1.2.0.zip "${TARGET}" "${FILES[@]}"
          git show "${TARGET}:INSTALL-RAH-2PC-GRID.cmd" > dist/INSTALL-RAH-2PC-GRID.cmd
          (cd dist && sha256sum RAH-Raven-2PC-Grid-v1.2.0.zip INSTALL-RAH-2PC-GRID.cmd > SHA256SUMS.txt)
          test -s dist/RAH-Raven-2PC-Grid-v1.2.0.zip
          test -s dist/INSTALL-RAH-2PC-GRID.cmd
          test -s dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='rah-2pc-grid-v1.2.0'
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release already exists; verifying."
          else
            gh release create "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title 'RAH Raven 2-PC Grid v1.2.0' \
              --notes-file RAH-2PC-GRID-RELEASE-v1.2.0.md \
              dist/RAH-Raven-2PC-Grid-v1.2.0.zip \
              dist/INSTALL-RAH-2PC-GRID.cmd \
              dist/SHA256SUMS.txt
          fi
          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json tagName,name,isDraft,isPrerelease,url
