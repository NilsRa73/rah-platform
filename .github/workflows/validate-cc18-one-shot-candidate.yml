name: Validate CC 1.8 One-Shot Candidate
on:
  pull_request:
    paths:
      - 'rah-command-center-core-v1.8-candidate.js'
      - 'RAH-COMMAND-CENTER-V1.8-CANDIDATE.html'
      - 'RAH-CC18-ONE-SHOT-MUTATING-APPROVAL-CANDIDATE.json'
      - 'tests/rah-cc18-one-shot-mutating-approval.test.mjs'
      - '.github/workflows/validate-cc18-one-shot-candidate.yml'
  push:
    branches: [main]
    paths:
      - 'rah-command-center-core-v1.8-candidate.js'
      - 'RAH-COMMAND-CENTER-V1.8-CANDIDATE.html'
      - 'RAH-CC18-ONE-SHOT-MUTATING-APPROVAL-CANDIDATE.json'
      - 'tests/rah-cc18-one-shot-mutating-approval.test.mjs'
      - '.github/workflows/validate-cc18-one-shot-candidate.yml'
permissions: {contents: read}
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Candidate-only scope guard
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch origin main --quiet
          allowed='^(rah-command-center-core-v1\.8-candidate\.js|RAH-COMMAND-CENTER-V1\.8-CANDIDATE\.html|RAH-CC18-ONE-SHOT-MUTATING-APPROVAL-CANDIDATE\.json|tests/rah-cc18-one-shot-mutating-approval\.test\.mjs|\.github/workflows/validate-cc18-one-shot-candidate\.yml)$'
          bad="$(git diff --name-only origin/main...HEAD|grep -Ev "$allowed"||true)"
          test -z "$bad" || { echo "$bad"; exit 1; }
      - name: Validate v1.8 one-shot core and UI contract
        run: node --test tests/rah-cc18-one-shot-mutating-approval.test.mjs
      - name: Preserve current canonical CC package baseline
        run: node --test tests/rah-command-center-packaging.test.mjs
      - name: Preserve CC 1.7 and Stable Node 1.3 security gates
        run: |
          node --test tests/rah-cc17-stable-release.test.mjs
          python3 -m unittest tests/test_rah_node_agent_stable_v13.py -v
      - name: Preserve current Raven release gate
        run: node --test tests/raven-release-gate.test.mjs
