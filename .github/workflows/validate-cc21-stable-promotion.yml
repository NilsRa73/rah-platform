name: Validate CC 2.1 Stable Promotion
on:
  pull_request:
    paths:
      - 'RAH-COMMAND-CENTER-V2.1.html'
      - 'rah-command-center-core-v2.1.js'
      - 'RAH-CC21-NODE13-STABLE-RELEASE.json'
      - 'tests/rah-cc21-stable-release.test.mjs'
      - '.github/workflows/validate-cc21-stable-promotion.yml'
      - 'RAH-CC21-STABLE-PROMOTION-GATE.json'
      - 'RAH-CC21-FLEET-SNAPSHOT-CANDIDATE.json'
      - 'RAH-COMMAND-CENTER-V2.1-CANDIDATE.html'
      - 'rah-command-center-core-v2.1-candidate.js'
      - 'RAH-CC20-NODE13-STABLE-RELEASE.json'
      - 'RAH-COMMAND-CENTER-V2.0.html'
      - 'rah-command-center-core-v2.0.js'
      - 'rah-node-agent-v1.3.py'
  push:
    branches:
      - main
      - 'agent/cc21-stable-promotion'
    paths:
      - 'RAH-COMMAND-CENTER-V2.1.html'
      - 'rah-command-center-core-v2.1.js'
      - 'RAH-CC21-NODE13-STABLE-RELEASE.json'
      - 'tests/rah-cc21-stable-release.test.mjs'
      - '.github/workflows/validate-cc21-stable-promotion.yml'
      - 'RAH-CC21-STABLE-PROMOTION-GATE.json'
      - 'RAH-CC21-FLEET-SNAPSHOT-CANDIDATE.json'
      - 'RAH-COMMAND-CENTER-V2.1-CANDIDATE.html'
      - 'rah-command-center-core-v2.1-candidate.js'
      - 'RAH-CC20-NODE13-STABLE-RELEASE.json'
      - 'RAH-COMMAND-CENTER-V2.0.html'
      - 'rah-command-center-core-v2.0.js'
      - 'rah-node-agent-v1.3.py'
permissions:
  contents: read
jobs:
  stable-promotion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Stable promotion scope guard
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch origin main --quiet
          allowed='^(RAH-COMMAND-CENTER-V2\.1\.html|rah-command-center-core-v2\.1\.js|RAH-CC21-NODE13-STABLE-RELEASE\.json|tests/rah-cc21-stable-release\.test\.mjs|\.github/workflows/validate-cc21-stable-promotion\.yml)$'
          bad="$(git diff --name-only origin/main...HEAD | grep -Ev "$allowed" || true)"
          if [ -n "$bad" ]; then
            echo 'Stable promotion modified files outside the versioned Stable/test/workflow allowlist:'
            echo "$bad"
            exit 1
          fi
      - name: Preserve canonical CC 2.0 root package
        run: node --test tests/rah-command-center-packaging.test.mjs tests/rah-cc20-stable-release.test.mjs
      - name: Re-run merged CC 2.1 Candidate gate
        run: node --test tests/rah-cc21-fleet-snapshot.test.mjs
      - name: Re-run CC 2.1 Stable readiness gate
        run: node --test tests/rah-cc21-stable-readiness.test.mjs
      - name: Preserve Node Agent 1.3 token-proof boundary
        run: python3 -m unittest tests/test_rah_node_agent_stable_v13.py -v
      - name: Validate versioned CC 2.1 Stable release
        run: node --test tests/rah-cc21-stable-release.test.mjs
