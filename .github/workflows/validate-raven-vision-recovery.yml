name: Validate Raven Vision Recovery

on:
  push:
    branches:
      - agent/raven-vision-autostart-recovery
    paths:
      - 'desktop-bridge/raven_recover.py'
      - 'desktop-bridge/start-raven-vision.bat'
      - '.github/workflows/validate-raven-vision-recovery.yml'
  pull_request:
    paths:
      - 'desktop-bridge/raven_recover.py'
      - 'desktop-bridge/start-raven-vision.bat'
      - '.github/workflows/validate-raven-vision-recovery.yml'

permissions:
  contents: read

jobs:
  raven-vision-recovery:
    runs-on: windows-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create Bridge venv and install dependencies
        shell: cmd
        run: |
          python -m venv desktop-bridge\.venv
          desktop-bridge\.venv\Scripts\python.exe -m pip install --disable-pip-version-check -r desktop-bridge\requirements.txt

      - name: Compile Raven recovery and core entrypoints
        shell: cmd
        run: |
          desktop-bridge\.venv\Scripts\python.exe -m py_compile desktop-bridge\raven_recover.py desktop-bridge\raven_bridge.py desktop-bridge\server_v16.py desktop-bridge\server_v17.py desktop-bridge\local_device_adapter.py

      - name: Require PowerShell-free Vision launcher
        shell: cmd
        run: |
          findstr /I /C:"powershell" desktop-bridge\start-raven-vision.bat && exit /b 1 || exit /b 0

      - name: Run Raven Bridge security regression suite
        shell: cmd
        working-directory: desktop-bridge
        env:
          RAH_CHRONICLE_DIR: ${{ runner.temp }}\rah-chronicle
          RAH_DOWNLOAD_MANAGER_STATE: ${{ runner.temp }}\rah-download-state\state.json
          RAH_RAVEN_VAULT: ${{ runner.temp }}\rah-vault
          RAH_DOWNLOADS_DIR: ${{ runner.temp }}\rah-incoming
        run: |
          .venv\Scripts\python.exe test_raven_bridge_security.py

      - name: Recover Bridge from fully stopped state
        shell: cmd
        env:
          RAH_ROOT: ${{ runner.temp }}\RAH
        run: |
          desktop-bridge\.venv\Scripts\python.exe desktop-bridge\raven_recover.py

      - name: Require canonical live health
        shell: cmd
        run: |
          desktop-bridge\.venv\Scripts\python.exe -c "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:18765/health',timeout=3)); req=('ok','council_proxy','vision_monitor_capture','local_device_adapter'); assert all(d.get(k) is True for k in req); print('RAVEN RECOVERY GREEN')"

      - name: Cleanup test Bridge
        if: always()
        shell: pwsh
        run: |
          $listeners = @(Get-NetTCPConnection -LocalPort 18765 -State Listen -ErrorAction SilentlyContinue)
          foreach ($listener in $listeners) {
            Stop-Process -Id ([int]$listener.OwningProcess) -Force -ErrorAction SilentlyContinue
          }
