name: Historical Policy Reference - Ephemeral Approval / Node0.9

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-ephemeral-approval:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate historical capability and policy contract
        run: node --test tests/rah-capability-allowlist-contract.test.mjs
      - name: Validate historical Node Agent 0.9 live gate
        run: python3 -m unittest tests/test_rah_node_agent_stable_v09.py
      - name: Validate historical ephemeral approval Candidate evidence
        run: node --test tests/rah-ephemeral-approval-candidate.test.mjs
