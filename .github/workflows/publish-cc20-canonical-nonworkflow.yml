name: Publish CC 2.0 Canonical Non-Workflow Files
on:
  push:
    branches: ['agent/rah-cc-v2.0-canonical-root']
    paths: ['.github/workflows/publish-cc20-canonical-nonworkflow.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rah-cc-v2.0-canonical-root
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Reuse already-gated builder transform
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('.github/workflows/build-cc20-canonical-root.yml').read_text().splitlines()
          start=next(i for i,x in enumerate(lines) if "node <<'NODE'" in x)+1
          end=next(i for i in range(start,len(lines)) if lines[i].strip()=='NODE')
          script='\n'.join((x[10:] if x.startswith('          ') else x) for x in lines[start:end])+'\n'
          Path('/tmp/build-cc20.js').write_text(script)
          PY
          node /tmp/build-cc20.js
          git checkout -- .github/workflows/validate-rah-command-center.yml
          rm -rf __pycache__ tests/__pycache__
      - name: Revalidate publishable product set
        run: |
          node --test tests/rah-command-center-packaging.test.mjs
          node --test tests/rah-cc20-precommitted-requester-context.test.mjs
          node --test tests/rah-cc20-stable-release.test.mjs
          python3 -m unittest tests/test_rah_node_agent_stable_v13.py -v
          node --test tests/raven-release-gate.test.mjs
      - name: Parse updater and publish only five non-workflow root files
        shell: pwsh
        run: |
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile('UPDATE-RAH-COMMAND-CENTER.ps1',[ref]$null,[ref]$errors)|Out-Null
          if($errors.Count -gt 0){$errors|Format-List;exit 1}
      - name: Commit exact non-workflow scope
        shell: bash
        run: |
          rm -rf __pycache__ tests/__pycache__
          changed="$(git status --short | sed 's/^...//' | sort)"
          expected="$(printf '%s\n' 'DOBBELTKLIKK-HER-START-RAH-COMMAND-CENTER.bat' 'RAH-COMMAND-CENTER-VERSION.json' 'START-RAH-NODE-AGENT.bat' 'UPDATE-RAH-COMMAND-CENTER.ps1' 'tests/rah-command-center-packaging.test.mjs' | sort)"
          test "$changed" = "$expected" || { echo "$changed"; exit 1; }
          git config user.name 'RAH CC Canonical Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add DOBBELTKLIKK-HER-START-RAH-COMMAND-CENTER.bat RAH-COMMAND-CENTER-VERSION.json START-RAH-NODE-AGENT.bat UPDATE-RAH-COMMAND-CENTER.ps1 tests/rah-command-center-packaging.test.mjs
          git commit -m 'RAH Command Center v2.0 — canonical root product files'
          git push origin HEAD:agent/rah-cc-v2.0-canonical-root
