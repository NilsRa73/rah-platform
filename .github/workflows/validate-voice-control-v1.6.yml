name: Validate Voice Control v1.6

on:
  push:
    branches: [main]
    paths:
      - index.html
      - voice-control-v1.6.js
      - tests/voice-control-v1.6.test.mjs
      - .github/workflows/validate-voice-control-v1.6.yml
  pull_request:
    paths:
      - index.html
      - voice-control-v1.6.js
      - tests/voice-control-v1.6.test.mjs

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/voice-control-v1.6.test.mjs
