name: Build Isolated CC23 Generation 8 Updater

on:
  pull_request:
    branches:
      - release/cc23-updater-generation8-base

permissions:
  contents: write

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/cc23-updater-generation8'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch updater to immutable CC23 generation 8 release
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('UPDATE-RAH-COMMAND-CENTER.ps1')
          s=p.read_text(encoding='utf-8')
          old_commit='9f2f69859d96155e7400924c5624f5ee734886bf'
          new_commit='1f5339841958bf0c2b4e737a5307f00029f8cf68'
          assert s.count(old_commit)==1 and new_commit not in s
          s=s.replace(old_commit,new_commit,1)
          old_start='$AllowedPackageFiles=@(\n  "RAH-COMMAND-CENTER-V2.2.html",'
          new_start='$AllowedPackageFiles=@(\n  "RAH-COMMAND-CENTER-V2.3.html",\n  "RAH-COMMAND-CENTER-V2.3-CANDIDATE.html",\n  "rah-command-center-core-v2.3-candidate.js",\n  "rah-command-center-core-v2.3.js",\n  "RAH-CC23-FLEET-SNAPSHOT-REGISTRY-BINDING-CANDIDATE.json",\n  "RAH-CC23-NODE13-STABLE-RELEASE.json",\n  "RAH-COMMAND-CENTER-V2.2.html",'
          assert s.count(old_start)==1
          s=s.replace(old_start,new_start,1)
          assert s.count('$JournalReadinessId="rah-cc22-crash-recovery-journal-readiness-v1"')==1
          s=s.replace('$JournalReadinessId="rah-cc22-crash-recovery-journal-readiness-v1"','$JournalReadinessId="rah-cc23-crash-recovery-journal-readiness-v1"',1)
          s=s.replace('den pinnede CC 2.2-releasen','den pinnede CC 2.3-releasen')
          a=s.index('function Assert-StableReleaseContract{')
          b=s.index('function Assert-ExactPropertySet{',a)
          contract='''function Assert-StableReleaseContract{param($Release)if($Release.stage-ne"stable-release"){throw "Stable release-manifest har feil stage."};if($Release.commandCenterVersion-ne"2.3.0"-or $Release.nodeAgentVersion-ne"1.3.0"){throw "Stable release-manifest har uventet CC/Node-versjon."};if($Release.nodeActionsProtocol-ne"rah-node-actions-v7"-or $Release.authProtocol-ne"rah-node-auth-v2"-or $Release.policyId-ne"rah-capability-allowlist-v1"){throw "Stable release-manifest har uventet protokoll/policy."};$caps=@($Release.authoritySurface.capabilities);$actions=@($Release.authoritySurface.actions);$routes=@($Release.authoritySurface.businessRoutes);if(($caps -join ",")-ne"compute,storage,display,remote-desktop"){throw "Stable release har uventet capability authority."};if(($actions -join ",")-ne"storage-summary.read,rustdesk.launch,rustdesk.connect"){throw "Stable release har uventet action authority."};if(($routes -join ",")-ne"/health,/actions,/storage,/launch/rustdesk,/handoff/rustdesk"){throw "Stable release har uventet route authority."};$r=$Release.registryBinding;if($r.version-ne"rah-cc-fleet-snapshot-registry-binding-v1"-or$r.policy-ne"prune-row-on-registry-identity-drift"-or($r.identityFields -join ",")-ne"deviceId,endpointIp,sessionId"-or-not$r.pruneRemovedDevice-or-not$r.pruneEndpointChange-or-not$r.pruneNodeSessionChange-or$r.samePageSignal-ne"device-grid-mutation-observer"-or$r.crossTabSignal-ne"storage-event-exact-device-registry-key"-or-not$r.snapshotMemoryOnly-or$r.snapshotPersistence-or$r.tokenPersistence-or$r.timers-or$r.backgroundPolling-or$r.networkDiscovery-or$r.automaticRemoteControl-or$r.nodeRuntimeChange){throw "Stable release har uventet registry-bound Fleet Snapshot boundary."};if($Release.retainedCc22.failurePolicy-ne"invalidate-selected-row-on-refresh-failure"-or-not$Release.retainedCc22.selectedRowInvalidatedBeforeFailureRender){throw "Stable release har mistet CC2.2 failed-refresh boundary."}}\n'''
          s=s[:a]+contract+s[b:]
          repl={
            '$files.Count-ne56':'$files.Count-ne62',
            'for($i=0;$i-lt56;$i++)':'for($i=0;$i-lt62;$i++)',
            'if($Files.Count-ne56)':'if($Files.Count-ne62)',
            'annet enn 56 filer':'annet enn 62 filer',
            '$TransactionFiles.Count-ne56-or@($TransactionFiles|Select-Object -Unique).Count-ne56':'$TransactionFiles.Count-ne62-or@($TransactionFiles|Select-Object -Unique).Count-ne62',
            'ikke eksakt 56 unike filer':'ikke eksakt 62 unike filer',
            '$manifest.version-ne"2.2.0"':'$manifest.version-ne"2.3.0"',
            'canonical v2.2 Stable':'canonical v2.3 Stable',
            '[string]$manifest.entry-ne"RAH-COMMAND-CENTER-V2.2.html"-or[string]$manifest.runtime-ne"rah-command-center-core-v2.2.js"':'[string]$manifest.entry-ne"RAH-COMMAND-CENTER-V2.3.html"-or[string]$manifest.runtime-ne"rah-command-center-core-v2.3.js"',
            '$releasePath-ne"RAH-CC22-NODE13-STABLE-RELEASE.json"':'$releasePath-ne"RAH-CC23-NODE13-STABLE-RELEASE.json"',
            'Start RAH Raven Command Center v2.2 Stable':'Start RAH Raven Command Center v2.3 Stable',
            'Starter RAH Command Center v2.2 crash-recoverable transactional update.':'Starter RAH Command Center v2.3 crash-recoverable transactional update.',
            'Command Center v2.2 crash-recoverable update committed':'Command Center v2.3 crash-recoverable update committed',
            'RAH Command Center v2.2 Stable er klar.':'RAH Command Center v2.3 Stable er klar.'
          }
          for old,new in repl.items():
              assert old in s,old
              s=s.replace(old,new)
          assert old_commit not in s
          assert '$JournalReadinessId="rah-cc22-crash-recovery-journal-readiness-v1"' not in s
          assert 'Count-ne56' not in s and 'lt56' not in s
          assert '$ReleaseCommit="'+new_commit+'"' in s
          assert '$JournalReadinessId="rah-cc23-crash-recovery-journal-readiness-v1"' in s
          assert '$manifest.version-ne"2.3.0"' in s
          assert '$releasePath-ne"RAH-CC23-NODE13-STABLE-RELEASE.json"' in s
          for x in ['RAH-COMMAND-CENTER-V2.3.html','RAH-COMMAND-CENTER-V2.3-CANDIDATE.html','rah-command-center-core-v2.3-candidate.js','rah-command-center-core-v2.3.js','RAH-CC23-FLEET-SNAPSHOT-REGISTRY-BINDING-CANDIDATE.json','RAH-CC23-NODE13-STABLE-RELEASE.json']:
              assert s.count('"'+x+'"')>=1,x
          assert 'compute,storage,display,remote-desktop' in s
          assert 'storage-summary.read,rustdesk.launch,rustdesk.connect' in s
          assert '/health,/actions,/storage,/launch/rustdesk,/handoff/rustdesk' in s
          p.write_text(s,encoding='utf-8')
          print('CC23 generation8 updater patch PASS')
          PY
      - name: Parse and validate updater contract
        shell: pwsh
        run: |
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile('UPDATE-RAH-COMMAND-CENTER.ps1',[ref]$null,[ref]$errors)|Out-Null
          if($errors.Count -gt 0){$errors|Format-List;exit 1}
          $raw=Get-Content -LiteralPath 'UPDATE-RAH-COMMAND-CENTER.ps1' -Raw
          if($raw -notmatch '1f5339841958bf0c2b4e737a5307f00029f8cf68'){throw 'new verified release commit missing'}
          if($raw -notmatch 'RAH-CC23-NODE13-STABLE-RELEASE.json'){throw 'CC23 Stable release missing'}
          if($raw -notmatch 'Count-ne62'){throw '62-file transaction contract missing'}
          if($raw -match 'Count-ne56|lt56'){throw 'stale generation7 transaction contract remains'}
          if($raw -match '9f2f69859d96155e7400924c5624f5ee734886bf'){throw 'old release trust target remains'}
      - name: Remove builder/request and commit updater output
        run: |
          rm -f .github/workflows/build-cc23-generation8-updater.yml RAH-CC23-UPDATER-BUILD-REQUEST.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A && git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build CC 2.3 generation 8 immutable updater'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
