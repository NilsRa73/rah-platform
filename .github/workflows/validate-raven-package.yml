name: Validate Raven Package

on:
  push:
    paths:
      - "RAH-RAVEN-VERSION.json"
      - "RAH-RAVEN-VISION-VERSION.json"
      - "RAH-RAVEN-COUNCIL-VERSION.json"
      - "UPDATE-RAH-RAVEN.ps1"
      - "UPDATE-AND-START-RAH-RAVEN.bat"
      - "START-RAH-RAVEN-V2.bat"
      - "RAH-RAVEN-*.html"
      - "raven-*.js"
      - "desktop-bridge/**"
      - "tests/raven-release-gate.test.mjs"
      - "tests/raven-council.test.mjs"
      - ".github/workflows/validate-raven-package.yml"
  pull_request:
    paths:
      - "RAH-RAVEN-VERSION.json"
      - "RAH-RAVEN-VISION-VERSION.json"
      - "RAH-RAVEN-COUNCIL-VERSION.json"
      - "UPDATE-RAH-RAVEN.ps1"
      - "UPDATE-AND-START-RAH-RAVEN.bat"
      - "START-RAH-RAVEN-V2.bat"
      - "RAH-RAVEN-*.html"
      - "raven-*.js"
      - "desktop-bridge/**"
      - "tests/raven-release-gate.test.mjs"
      - "tests/raven-council.test.mjs"
      - ".github/workflows/validate-raven-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate package manifest and release gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path, PurePosixPath
          manifest=json.loads(Path('RAH-RAVEN-VERSION.json').read_text(encoding='utf-8'))
          assert manifest['product']=='RAH Raven'
          assert manifest['version']=='2.0.32'
          assert manifest['launcher']=='3.0'
          gate=manifest['release_gate']
          assert gate['stage']=='temporary-stable'
          assert gate['temporary_stable_target']=='2.0.32'
          assert gate['runtime_feature_change'] is False
          assert gate['frozen_from']=='2.0.31'
          assert gate['development_paused'] is True
          assert gate['change_policy']=='bugfix-only-until-explicit-reopen'
          assert gate['component_versions']['raven_vision']=='0.6'
          assert gate['component_versions']['raven_council']=='0.3'
          assert gate['bugfix_component_updates']['raven_vision']=='0.6'
          assert gate['bugfix_component_updates']['raven_council']=='0.3'
          assert gate['stable_components']=={'raven_vision':'0.6','raven_council':'0.3'}
          files=manifest['files']
          assert isinstance(files,list) and files
          assert len(files)==len(set(files)), 'Duplicate paths in manifest'
          for raw in files:
            path=PurePosixPath(raw)
            assert not path.is_absolute()
            assert '..' not in path.parts
            assert Path(raw).is_file(), f'Missing package file: {raw}'
          privacy=manifest['privacy']
          for forbidden in ('keylogging','clipboard_capture','hidden_microphone','hidden_camera','automatic_sending','hidden_screen_capture','council_external_bridge_addresses_allowed'):
            assert privacy[forbidden] is False
          for required in ('raven-handoff-receipt.js','raven-handoff-history-lite.js','raven-checkpoint-policy.js','RAH-RAVEN-VISION-VERSION.json','RAH-RAVEN-COUNCIL-VERSION.json'):
            assert required in files
          assert privacy['recommended_checkpoint_policy_shared_module'] is True
          assert privacy['recommended_checkpoint_module_read_only'] is True
          assert privacy['recommended_checkpoint_module_no_storage_writes'] is True
          assert privacy['chatgpt_handoff_history_shared_policy_read_only'] is True
          assert privacy['chatgpt_handoff_history_shared_policy_no_network'] is True
          assert privacy['chatgpt_handoff_receipt_shared_policy_read_only'] is True
          assert privacy['chatgpt_handoff_receipt_shared_policy_no_network'] is True
          assert privacy['vision_local_bridge_only'] is True
          assert privacy['vision_external_bridge_addresses_allowed'] is False
          assert privacy['vision_helper_version_synced'] is True
          assert privacy['council_local_bridge_only'] is True
          assert privacy['council_helper_version_synced'] is True
          assert privacy['council_stable'] is True
          vision=json.loads(Path('RAH-RAVEN-VISION-VERSION.json').read_text(encoding='utf-8'))
          assert vision['version']=='0.6.0'
          assert vision['stage']=='stable'
          council=json.loads(Path('RAH-RAVEN-COUNCIL-VERSION.json').read_text(encoding='utf-8'))
          assert council['version']=='0.3.0'
          assert council['stage']=='stable'
          assert council['development_paused'] is True
          assert council['features']['local_bridge_only'] is True
          assert council['features']['external_bridge_addresses_allowed'] is False
          assert council['features']['bridge_tools_executed'] is False
          assert council['features']['bridge_automatic_actions'] is False
          print(f"Manifest OK: {manifest['version']} temporary stable with Vision {gate['component_versions']['raven_vision']} + Council {gate['component_versions']['raven_council']} stable and {len(files)} files")
          PY

      - name: Run aggregate release identity test
        run: node tests/raven-release-gate.test.mjs

      - name: Run Council v0.3 stable test
        run: node tests/raven-council.test.mjs

      - name: Parse PowerShell updater
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "UPDATE-RAH-RAVEN.ps1"),[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "PowerShell updater syntax: OK"

      - name: Check shared policy module syntax
        run: |
          node --check raven-handoff-receipt.js
          node --check raven-handoff-history-lite.js
          node --check raven-checkpoint-policy.js
          node --check raven-vision-core.js
          node --check raven-council.js

      - name: Check bootstrap safety markers
        run: |
          grep -F "NilsRa73/rah-platform" UPDATE-AND-START-RAH-RAVEN.bat
          grep -F "creating a backup" UPDATE-AND-START-RAH-RAVEN.bat
          grep -F "Get-SafeTargetPath" UPDATE-RAH-RAVEN.ps1
          grep -F ".rah-backups" UPDATE-RAH-RAVEN.ps1
          if grep -qi "signed" UPDATE-AND-START-RAH-RAVEN.bat; then
            echo "Updater must not claim cryptographic signing"
            exit 1
          fi
