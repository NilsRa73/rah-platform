name: Validate RAH Home Finalize v1

on:
  push:
    branches: [main]
    paths:
      - 'RAH-HOME-FINALIZE.ps1'
      - 'START-HER-RAH-HOME.cmd'
      - 'RAH-WINDOWS-PYTHON-CONSOLE-GUARD.ps1'
      - 'RAH-HOME-DIAGNOSTICS.ps1'
      - 'RAH-HOME-ACCEPTANCE.ps1'
      - 'RAH-HOME-INSTALL.ps1'
      - 'RAH-HOME-NODE-AGENT.ps1'
      - 'RAH-HOME-NODE-CLIENT.ps1'
      - 'RAH-HOME-NODE-JOB.ps1'
      - 'RAH-HOME-CLUSTER-CONTROLLER.ps1'
      - 'tests/test_home_finalize_contract.py'
      - 'tests/RAH-HOME-FINALIZE-RUNTIME-TEST.ps1'
      - '.github/workflows/validate-rah-home-finalize-v1.yml'
  pull_request:
    paths:
      - 'RAH-HOME-FINALIZE.ps1'
      - 'START-HER-RAH-HOME.cmd'
      - 'RAH-WINDOWS-PYTHON-CONSOLE-GUARD.ps1'
      - 'RAH-HOME-DIAGNOSTICS.ps1'
      - 'RAH-HOME-ACCEPTANCE.ps1'
      - 'RAH-HOME-INSTALL.ps1'
      - 'RAH-HOME-NODE-AGENT.ps1'
      - 'RAH-HOME-NODE-CLIENT.ps1'
      - 'RAH-HOME-NODE-JOB.ps1'
      - 'RAH-HOME-CLUSTER-CONTROLLER.ps1'
      - 'tests/test_home_finalize_contract.py'
      - 'tests/RAH-HOME-FINALIZE-RUNTIME-TEST.ps1'
      - '.github/workflows/validate-rah-home-finalize-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Finalize static contract
        run: python tests/test_home_finalize_contract.py

  windows-runtime:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Parse Finalize, Python guard and Black Box PowerShell
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($p in @('RAH-HOME-FINALIZE.ps1','RAH-WINDOWS-PYTHON-CONSOLE-GUARD.ps1','RAH-HOME-DIAGNOSTICS.ps1','tests/RAH-HOME-FINALIZE-RUNTIME-TEST.ps1')) {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $p),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){ throw "${p} parse failed: $($errors[0].Message)" }
          }
      - name: Black Box diagnostics self test
        shell: powershell
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\RAH-HOME-DIAGNOSTICS.ps1 -SelfTest
      - name: Python console guard self test
        shell: powershell
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\RAH-WINDOWS-PYTHON-CONSOLE-GUARD.ps1 -SelfTest
      - name: Python 3.13 console guard runtime
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'rah-python-console-guard'
          try {
            powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\RAH-WINDOWS-PYTHON-CONSOLE-GUARD.ps1 -InstallRoot $root -PersistUserSetting
            if($LASTEXITCODE -ne 0){ throw "Python guard failed with exit $LASTEXITCODE" }
            $report=Get-Content -Raw (Join-Path $root 'reports\rah-python-console-guard.json') | ConvertFrom-Json
            if($report.pythonDetected -ne $true){ throw 'Python 3.13 was not detected.' }
            if([string]$report.pythonVersion -notmatch '^3\.13\.'){ throw "Expected Python 3.13, got $($report.pythonVersion)" }
            if($report.basicReplRequired -ne $true){ throw 'Python 3.13 did not activate basic REPL guard.' }
            if($report.probeOk -ne $true){ throw 'Python non-interactive probe failed.' }
            if([Environment]::GetEnvironmentVariable('PYTHON_BASIC_REPL','User') -ne '1'){ throw 'User PYTHON_BASIC_REPL was not persisted.' }
            $env:PYTHON_BASIC_REPL='1'
            $probe=& python -c "import sys; print('RAH_PYTHON_313_OK:'+sys.version.split()[0])"
            if($LASTEXITCODE -ne 0 -or $probe -notmatch '^RAH_PYTHON_313_OK:3\.13\.'){ throw 'Guarded Python 3.13 smoke test failed.' }
          }
          finally {
            [Environment]::SetEnvironmentVariable('PYTHON_BASIC_REPL',$null,'User')
          }
      - name: Finalize built-in self test
        shell: powershell
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\RAH-HOME-FINALIZE.ps1 -SelfTest
      - name: Full Worker to Leader runtime
        shell: powershell
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\tests\RAH-HOME-FINALIZE-RUNTIME-TEST.ps1
      - name: One-click CMD bootstrap against PR content
        if: github.event_name == 'pull_request'
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $env:PYTHON_BASIC_REPL='1'
          $server = Start-Process python -ArgumentList '-m','http.server','8765','--bind','127.0.0.1' -WorkingDirectory $PWD -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 1
            $env:RAH_URL='http://127.0.0.1:8765/RAH-HOME-FINALIZE.ps1'
            $env:RAH_GUARD_URL='http://127.0.0.1:8765/RAH-WINDOWS-PYTHON-CONSOLE-GUARD.ps1'
            $env:RAH_DIAG_URL='http://127.0.0.1:8765/RAH-HOME-DIAGNOSTICS.ps1'
            & cmd.exe /d /c 'START-HER-RAH-HOME.cmd --self-test'
            if($LASTEXITCODE -ne 0){ throw "CMD bootstrap failed with exit $LASTEXITCODE" }
          }
          finally {
            Remove-Item Env:RAH_URL -ErrorAction SilentlyContinue
            Remove-Item Env:RAH_GUARD_URL -ErrorAction SilentlyContinue
            Remove-Item Env:RAH_DIAG_URL -ErrorAction SilentlyContinue
            if($server -and -not $server.HasExited){ Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue }
          }
      - name: One-click CMD bootstrap against main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: cmd
        run: START-HER-RAH-HOME.cmd --self-test
