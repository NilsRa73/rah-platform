name: Validate RAH Home Finalize v1

on:
  push:
    branches: [main]
    paths:
      - 'RAH-HOME-FINALIZE.ps1'
      - 'START-HER-RAH-HOME.cmd'
      - 'RAH-HOME-ACCEPTANCE.ps1'
      - 'RAH-HOME-INSTALL.ps1'
      - 'RAH-HOME-NODE-AGENT.ps1'
      - 'RAH-HOME-NODE-CLIENT.ps1'
      - 'RAH-HOME-NODE-JOB.ps1'
      - 'RAH-HOME-CLUSTER-CONTROLLER.ps1'
      - 'tests/test_home_finalize_contract.py'
      - 'tests/RAH-HOME-FINALIZE-RUNTIME-TEST.ps1'
      - '.github/workflows/validate-rah-home-finalize-v1.yml'
  pull_request:
    paths:
      - 'RAH-HOME-FINALIZE.ps1'
      - 'START-HER-RAH-HOME.cmd'
      - 'RAH-HOME-ACCEPTANCE.ps1'
      - 'RAH-HOME-INSTALL.ps1'
      - 'RAH-HOME-NODE-AGENT.ps1'
      - 'RAH-HOME-NODE-CLIENT.ps1'
      - 'RAH-HOME-NODE-JOB.ps1'
      - 'RAH-HOME-CLUSTER-CONTROLLER.ps1'
      - 'tests/test_home_finalize_contract.py'
      - 'tests/RAH-HOME-FINALIZE-RUNTIME-TEST.ps1'
      - '.github/workflows/validate-rah-home-finalize-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Finalize static contract
        run: python tests/test_home_finalize_contract.py

  windows-runtime:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse Finalize PowerShell
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($p in @('RAH-HOME-FINALIZE.ps1','tests/RAH-HOME-FINALIZE-RUNTIME-TEST.ps1')) {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $p),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){ throw "${p} parse failed: $($errors[0].Message)" }
          }
      - name: Finalize built-in self test
        shell: powershell
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\RAH-HOME-FINALIZE.ps1 -SelfTest
      - name: Full Worker to Leader runtime
        shell: powershell
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\tests\RAH-HOME-FINALIZE-RUNTIME-TEST.ps1
      - name: One-click CMD bootstrap against PR content
        if: github.event_name == 'pull_request'
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $server = Start-Process python -ArgumentList '-m','http.server','8765','--bind','127.0.0.1' -WorkingDirectory $PWD -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 1
            $env:RAH_URL='http://127.0.0.1:8765/RAH-HOME-FINALIZE.ps1'
            & cmd.exe /d /c 'START-HER-RAH-HOME.cmd --self-test'
            if($LASTEXITCODE -ne 0){ throw "CMD bootstrap failed with exit $LASTEXITCODE" }
          }
          finally {
            Remove-Item Env:RAH_URL -ErrorAction SilentlyContinue
            if($server -and -not $server.HasExited){ Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue }
          }
      - name: One-click CMD bootstrap against main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: cmd
        run: START-HER-RAH-HOME.cmd --self-test
