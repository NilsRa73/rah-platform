name: Build Raven 2.0.21 ChatGPT Handoff Center

on:
  push:
    branches: [raven-2.0.21-chatgpt-handoff-center]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: raven-2.0.21-chatgpt-handoff-center
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Core ChatGPT handoff center
        shell: python
        run: |
          from pathlib import Path
          import json

          core=Path('RAH-RAVEN-CORE-DEMO.html')
          text=core.read_text(encoding='utf-8')
          text=text.replace('RAH Raven Core Workflow v1.6','RAH Raven Core Workflow v1.7')
          text=text.replace('Core v1.6 · STATUS HANDOFF','Core v1.7 · CHATGPT HANDOFF')
          text=text.replace('RAH-Raven-Core-v1.6-','RAH-Raven-Core-v1.7-')
          css_marker='.privacy{font-size:13px;color:#aaa38f}'
          css_add='.handoff-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:13px}.handoff-card{background:#0b1016;border:1px solid var(--line);border-radius:14px;padding:15px}.handoff-card strong{display:block;color:var(--gold2);font-size:18px;margin-bottom:5px}.handoff-card p{margin:5px 0 12px;color:var(--muted);font-size:13px}.handoff-step{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#211a0c;border:1px solid #70591d;color:var(--gold2);font-weight:900;margin-right:7px}.handoff-note{margin-top:12px;border-left:4px solid var(--gold);background:#16140e;border-radius:9px;padding:12px 14px;color:#d8d3c8}'
          if css_marker not in text: raise SystemExit('Core privacy CSS marker not found')
          text=text.replace(css_marker,css_add+css_marker,1)
          text=text.replace('@media(max-width:900px){.summary,.context-grid,.direction-grid{grid-template-columns:1fr}', '@media(max-width:900px){.summary,.context-grid,.direction-grid,.handoff-grid{grid-template-columns:1fr}',1)
          stored='<section class="panel">\n  <div class="row" style="justify-content:space-between"><h2 style="margin:0">Hva kjernen har lagret</h2><div class="row"><button class="btn primary" id="copyCoreStatus">KOPIER RAVEN STATUS TIL CHATGPT</button><button class="btn" id="downloadCoreStatus">LAST NED STATUS TXT</button><button class="btn" id="export">Eksporter kontrollrapport</button></div></div>\n  <p id="supportShareStatus" class="sub">ChatGPT-supportsnapshotet inneholder bare status, prosjekt/mission-kontekst og neste anbefalte steg. Ingen bilder, prompts eller analysesvar inkluderes, og ingenting sendes automatisk.</p>'
          replacement='''<section class="panel gold" id="chatgptHandoffCenter">\n  <div class="row" style="justify-content:space-between"><div><h2 style="margin:0">ChatGPT Handoff</h2><p class="sub">Ett manuelt sted for å dele Raven-status og, når du trenger det, et bilde.</p></div><span class="badge">MANUELL · INGEN AUTO-SENDING</span></div>\n  <div class="handoff-grid">\n    <article class="handoff-card"><strong><span class="handoff-step">1</span>Del Raven-status</strong><p>Kopierer bare service- og Context Snapshot-status. Bilder, prompts og analysesvar følger ikke med.</p><div class="row"><button class="btn primary" id="copyCoreStatus">KOPIER STATUS</button><button class="btn" id="downloadCoreStatus">STATUS TXT</button></div></article>\n    <article class="handoff-card"><strong><span class="handoff-step">2</span>Del bilde ved behov</strong><p>Åpner Raven Vision i ChatGPT-handoff-modus. Du velger eller fanger bildet selv og kopierer/laster ned først når du trykker.</p><div class="row"><a class="btn primary" id="chatgptHandoffVision" href="RAH-RAVEN-VISION-CORE.html?mode=chatgpt">ÅPNE VISION FOR BILDE →</a></div></article>\n  </div>\n  <div id="supportShareStatus" class="handoff-note">Start med status. Hvis ChatGPT også trenger å se skjermen, åpner du Vision og deler bildet manuelt. Ingenting sendes automatisk.</div>\n</section>\n\n<section class="panel">\n  <div class="row" style="justify-content:space-between"><h2 style="margin:0">Hva kjernen har lagret</h2><button class="btn" id="export">Eksporter kontrollrapport</button></div>'''
          if stored not in text: raise SystemExit('Core status share block not found')
          text=text.replace(stored,replacement,1)
          core.write_text(text,encoding='utf-8')

          demo=Path('tests/raven-core-demo.test.mjs')
          t=demo.read_text(encoding='utf-8')
          t=t.replace('Raven Core Workflow v1\\.6','Raven Core Workflow v1\\.7')
          t=t.replace("assert.match(html, /LAST NED STATUS TXT/);","assert.match(html, /STATUS TXT/);\nassert.match(html, /id=\"chatgptHandoffCenter\"/);\nassert.match(html, /id=\"chatgptHandoffVision\"/);\nassert.match(html, /ChatGPT Handoff/);\nassert.match(html, /ÅPNE VISION FOR BILDE/);")
          t=t.replace("console.log('Raven Core workflow v1.6 status handoff validation passed.');","console.log('Raven Core workflow v1.7 unified ChatGPT handoff center validation passed.');")
          demo.write_text(t,encoding='utf-8')

          context=Path('tests/raven-core-context.test.mjs')
          t=context.read_text(encoding='utf-8')
          t=t.replace('RAH Raven Core Workflow v1\\.6','RAH Raven Core Workflow v1\\.7')
          t=t.replace('Core v1\\.6 · STATUS HANDOFF','Core v1\\.7 · CHATGPT HANDOFF')
          t=t.replace('console.log("Raven Core v1.6 keeps Context Snapshot FORTSETT authority while adding explicit status handoff controls.");','console.log("Raven Core v1.7 keeps Context Snapshot FORTSETT authority while unifying manual ChatGPT handoff controls.");')
          context.write_text(t,encoding='utf-8')

          status=Path('tests/raven-core-chatgpt-status.test.mjs')
          t=status.read_text(encoding='utf-8')
          t=t.replace('RAH Raven Core Workflow v1\\.6','RAH Raven Core Workflow v1\\.7')
          t=t.replace('Core v1\\.6 · STATUS HANDOFF','Core v1\\.7 · CHATGPT HANDOFF')
          t=t.replace('/KOPIER RAVEN STATUS TIL CHATGPT/','/KOPIER STATUS/')
          t=t.replace('/LAST NED STATUS TXT/','/STATUS TXT/')
          t=t.replace('console.log("Raven Core v1.6 explicit ChatGPT status handoff is minimal, read-only and manual.");','console.log("Raven Core v1.7 ChatGPT status handoff remains minimal, read-only and manual inside the unified handoff center.");')
          status.write_text(t,encoding='utf-8')

          center=Path('tests/raven-core-chatgpt-handoff-center.test.mjs')
          center.write_text('''import assert from "node:assert/strict";\nimport fs from "node:fs";\nconst html=fs.readFileSync("RAH-RAVEN-CORE-DEMO.html","utf8");\nassert.match(html,/RAH Raven Core Workflow v1\\.7/);\nassert.match(html,/Core v1\\.7 · CHATGPT HANDOFF/);\nfor(const id of ["chatgptHandoffCenter","copyCoreStatus","downloadCoreStatus","chatgptHandoffVision","supportShareStatus"])assert.match(html,new RegExp(`id="${id}"`));\nassert.match(html,/ChatGPT Handoff/);\nassert.match(html,/MANUELL · INGEN AUTO-SENDING/);\nassert.match(html,/KOPIER STATUS/);\nassert.match(html,/STATUS TXT/);\nassert.match(html,/RAH-RAVEN-VISION-CORE\\.html\\?mode=chatgpt/);\nassert.match(html,/ÅPNE VISION FOR BILDE/);\nassert.match(html,/Start med status/);\nassert.match(html,/Ingenting sendes automatisk/);\nassert.match(html,/\\$\\("copyCoreStatus"\\)\\.onclick=copySupportSnapshot/);\nassert.match(html,/\\$\\("downloadCoreStatus"\\)\\.onclick=downloadSupportSnapshot/);\nassert.doesNotMatch(html,/chatgptHandoffVision[^>]*onclick=/);\nassert.equal((html.match(/id="copyCoreStatus"/g)||[]).length,1);\nassert.equal((html.match(/id="downloadCoreStatus"/g)||[]).length,1);\nassert.equal((html.match(/id="chatgptHandoffVision"/g)||[]).length,1);\nassert.doesNotMatch(html,/api\\.openai\\.com/i);\nassert.doesNotMatch(html,/chatgpt\\.com\\/backend/i);\nconsole.log("Raven Core v1.7 unifies status and image handoff without automatic sending.");\n''',encoding='utf-8')

          manifest_path=Path('RAH-RAVEN-VERSION.json')
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['version']='2.0.21'
          manifest['released_at']='2026-08-13'
          manifest['summary']='RAH Raven 2.0.21 adds a unified manual ChatGPT Handoff center to Raven Core v1.7. Status sharing and the existing Vision image handoff are now presented side by side as a clear two-step workflow. Status remains minimal and excludes images, prompts and analysis answers; Vision still requires explicit image selection/capture and explicit copy or PNG download; nothing is sent automatically.'
          p=manifest.setdefault('privacy',{})
          p['raven_core_chatgpt_handoff_center_visible']=True
          p['raven_core_chatgpt_handoff_center_manual_only']=True
          p['raven_core_chatgpt_handoff_center_no_auto_send']=True
          p['raven_core_chatgpt_handoff_status_first']=True
          p['raven_core_chatgpt_handoff_vision_navigation_only']=True
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

      - name: Test Raven 2.0.21 runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('RAH-RAVEN-CORE-DEMO.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:[^>]*)>([\\s\\S]*?)</script>',html)
          Path('/tmp/core.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/core.js
          node tests/raven-core-demo.test.mjs
          node tests/raven-core-context.test.mjs
          node tests/raven-core-chatgpt-status.test.mjs
          node tests/raven-core-chatgpt-handoff-center.test.mjs
          node tests/raven-checkpoint-policy.test.mjs
          node tests/raven-now-v2.test.mjs
          node tests/raven-mission-control.test.mjs
          node tests/raven-project-focus.test.mjs
          node tests/raven-vision-core.test.mjs
      - name: Commit tested runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'RAH Raven Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add RAH-RAVEN-CORE-DEMO.html RAH-RAVEN-VERSION.json tests/raven-core-demo.test.mjs tests/raven-core-context.test.mjs tests/raven-core-chatgpt-status.test.mjs tests/raven-core-chatgpt-handoff-center.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Add unified ChatGPT handoff center for 2.0.21'
          git push origin HEAD:raven-2.0.21-chatgpt-handoff-center
