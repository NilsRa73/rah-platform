name: Validate Raven Core Workflow

on:
  push:
    branches: [main]
    paths:
      - RAH-RAVEN-CORE-DEMO.html
      - RAH-RAVEN-VISION-CORE.html
      - RAH-RAVEN-NOW-V2.html
      - RAH-RAVEN-START.html
      - RAH-RAVEN-AGENT-RUNNER.html
      - RAH-RAVEN-MEMORY-SYNC.html
      - raven-handoff-receipt.js
      - raven-handoff-history-lite.js
      - raven-checkpoint-policy.js
      - raven-vision-core.js
      - raven-council.js
      - raven-chronicle-sync.js
      - desktop-bridge/agent_runner.py
      - desktop-bridge/raven_bridge.py
      - tests/raven-core-demo.test.mjs
      - tests/raven-core-context.test.mjs
      - tests/raven-core-chatgpt-status.test.mjs
      - tests/raven-core-chatgpt-handoff-center.test.mjs
      - tests/raven-chatgpt-handoff-session.test.mjs
      - tests/raven-chatgpt-handoff-source-return.test.mjs
      - tests/raven-chatgpt-handoff-resume.test.mjs
      - tests/raven-chatgpt-handoff-receipt.test.mjs
      - tests/raven-chatgpt-handoff-history-lite.test.mjs
      - tests/raven-chatgpt-handoff-recall.test.mjs
      - tests/raven-handoff-receipt-policy.test.mjs
      - tests/raven-handoff-history-lite-policy.test.mjs
      - tests/raven-vision-core.test.mjs
      - tests/raven-checkpoint-policy.test.mjs
      - .github/workflows/validate-raven-core-demo.yml
  pull_request:
    paths:
      - RAH-RAVEN-CORE-DEMO.html
      - RAH-RAVEN-VISION-CORE.html
      - RAH-RAVEN-NOW-V2.html
      - RAH-RAVEN-START.html
      - RAH-RAVEN-AGENT-RUNNER.html
      - RAH-RAVEN-MEMORY-SYNC.html
      - raven-handoff-receipt.js
      - raven-handoff-history-lite.js
      - raven-checkpoint-policy.js
      - raven-vision-core.js
      - raven-council.js
      - raven-chronicle-sync.js
      - desktop-bridge/agent_runner.py
      - desktop-bridge/raven_bridge.py
      - tests/raven-core-demo.test.mjs
      - tests/raven-core-context.test.mjs
      - tests/raven-core-chatgpt-status.test.mjs
      - tests/raven-core-chatgpt-handoff-center.test.mjs
      - tests/raven-chatgpt-handoff-session.test.mjs
      - tests/raven-chatgpt-handoff-source-return.test.mjs
      - tests/raven-chatgpt-handoff-resume.test.mjs
      - tests/raven-chatgpt-handoff-receipt.test.mjs
      - tests/raven-chatgpt-handoff-history-lite.test.mjs
      - tests/raven-chatgpt-handoff-recall.test.mjs
      - tests/raven-handoff-receipt-policy.test.mjs
      - tests/raven-handoff-history-lite-policy.test.mjs
      - tests/raven-vision-core.test.mjs
      - tests/raven-checkpoint-policy.test.mjs
      - .github/workflows/validate-raven-core-demo.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript syntax
        run: |
          node --check raven-handoff-receipt.js
          node --check raven-handoff-history-lite.js
          node --check raven-checkpoint-policy.js
          node --check raven-vision-core.js
          node --check raven-council.js
          node --check raven-chronicle-sync.js
      - name: Check inline Core, Vision, Agent Runner and Memory Sync JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for name in ('RAH-RAVEN-CORE-DEMO.html', 'RAH-RAVEN-VISION-CORE.html', 'RAH-RAVEN-AGENT-RUNNER.html', 'RAH-RAVEN-MEMORY-SYNC.html'):
              html = Path(name).read_text(encoding='utf-8')
              scripts = re.findall(r'<script(?:[^>]*)>([\s\S]*?)</script>', html)
              Path(f'/tmp/{name}.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/RAH-RAVEN-CORE-DEMO.html.js
          node --check /tmp/RAH-RAVEN-VISION-CORE.html.js
          node --check /tmp/RAH-RAVEN-AGENT-RUNNER.html.js
          node --check /tmp/RAH-RAVEN-MEMORY-SYNC.html.js
      - name: Check Bridge and Agent Runner Python syntax
        run: python -m py_compile desktop-bridge/agent_runner.py desktop-bridge/raven_bridge.py
      - name: Validate shared Context Snapshot policy
        run: node tests/raven-checkpoint-policy.test.mjs
      - name: Validate shared Handoff Receipt policy
        run: node tests/raven-handoff-receipt-policy.test.mjs
      - name: Validate shared Handoff History Lite policy
        run: node tests/raven-handoff-history-lite-policy.test.mjs
      - name: Run Raven Core v1.12 validation
        run: node tests/raven-core-demo.test.mjs
      - name: Run Raven Core context validation
        run: node tests/raven-core-context.test.mjs
      - name: Run Raven Core ChatGPT status handoff validation
        run: node tests/raven-core-chatgpt-status.test.mjs
      - name: Run Raven Core ChatGPT handoff center validation
        run: node tests/raven-core-chatgpt-handoff-center.test.mjs
      - name: Run Raven ChatGPT handoff session validation
        run: node tests/raven-chatgpt-handoff-session.test.mjs
      - name: Run source-aware handoff return validation
        run: node tests/raven-chatgpt-handoff-source-return.test.mjs
      - name: Run Handoff Resume validation
        run: node tests/raven-chatgpt-handoff-resume.test.mjs
      - name: Run shared Handoff Receipt validation
        run: node tests/raven-chatgpt-handoff-receipt.test.mjs
      - name: Run Handoff History Lite validation
        run: node tests/raven-chatgpt-handoff-history-lite.test.mjs
      - name: Run shared Handoff Recall validation
        run: node tests/raven-chatgpt-handoff-recall.test.mjs
      - name: Run Raven Vision v0.5 handoff validation
        run: node tests/raven-vision-core.test.mjs
