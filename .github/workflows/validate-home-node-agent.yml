name: Validate RAH Home Node Agent
on:
  push:
    branches: [main]
    paths:
      - 'RAH-HOME-NODE-AGENT.ps1'
      - 'RAH-HOME-NODE-CLIENT.ps1'
      - 'RAH-HOME-INSTALL.ps1'
      - 'tests/test_home_node_agent_contract.py'
      - '.github/workflows/validate-home-node-agent.yml'
  pull_request:
    paths:
      - 'RAH-HOME-NODE-AGENT.ps1'
      - 'RAH-HOME-NODE-CLIENT.ps1'
      - 'RAH-HOME-INSTALL.ps1'
      - 'tests/test_home_node_agent_contract.py'
      - '.github/workflows/validate-home-node-agent.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/test_home_node_agent_contract.py
  windows-parse:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell files without execution
        shell: powershell
        run: |
          $files=@('RAH-HOME-NODE-AGENT.ps1','RAH-HOME-NODE-CLIENT.ps1','RAH-HOME-INSTALL.ps1')
          foreach($file in $files){
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)
            if($errors.Count){$errors|Format-List|Out-String|Write-Host;throw "PowerShell parse failed: $file"}
            Write-Host "PARSE PASS: $file"
          }
