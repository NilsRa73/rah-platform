name: Validate Raven Daily Brief v0.1

on:
  push:
    branches:
      - main
      - 'daily-brief/**'
    paths:
      - 'RAH-RAVEN-DAILY-BRIEF.html'
      - 'RAH-RAVEN-DAILY-BRIEF-VERSION.json'
      - 'RAH-RAVEN-CHRONICLE-VERSION.json'
      - 'RAH-RAVEN-INSIGHTS-VERSION.json'
      - 'RAH-RAVEN-VERSION.json'
      - 'desktop-bridge/chronicle_ai.py'
      - 'desktop-bridge/server_v17.py'
      - 'desktop-bridge/test_chronicle_ai.py'
      - 'desktop-bridge/test_raven_bridge_security.py'
      - 'tests/raven-daily-brief-v0.1.test.mjs'
      - 'tests/raven-chronicle-v17.test.mjs'
      - 'tests/raven-insights-v0.1.test.mjs'
      - 'tests/raven-release-gate.test.mjs'
      - '.github/workflows/validate-raven-daily-brief-v0.1.yml'
  pull_request:
    paths:
      - 'RAH-RAVEN-DAILY-BRIEF.html'
      - 'RAH-RAVEN-DAILY-BRIEF-VERSION.json'
      - 'RAH-RAVEN-CHRONICLE-VERSION.json'
      - 'RAH-RAVEN-INSIGHTS-VERSION.json'
      - 'RAH-RAVEN-VERSION.json'
      - 'desktop-bridge/chronicle_ai.py'
      - 'desktop-bridge/server_v17.py'
      - 'desktop-bridge/test_chronicle_ai.py'
      - 'desktop-bridge/test_raven_bridge_security.py'
      - 'tests/raven-daily-brief-v0.1.test.mjs'
      - 'tests/raven-chronicle-v17.test.mjs'
      - 'tests/raven-insights-v0.1.test.mjs'
      - 'tests/raven-release-gate.test.mjs'
      - '.github/workflows/validate-raven-daily-brief-v0.1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bridge dependencies
        run: python -m pip install -r desktop-bridge/requirements.txt
      - name: Validate Daily Brief explicit-local boundary
        run: node tests/raven-daily-brief-v0.1.test.mjs
      - name: Preserve Daily Brief backend contract
        working-directory: desktop-bridge
        run: python test_chronicle_ai.py
      - name: Preserve local-origin security
        working-directory: desktop-bridge
        run: python test_raven_bridge_security.py
      - name: Preserve Chronicle v1.7.1 Stable contract
        run: node tests/raven-chronicle-v17.test.mjs
      - name: Preserve Insights v0.1 Stable contract
        run: node tests/raven-insights-v0.1.test.mjs
      - name: Preserve Raven 2.0.32 nine-core gate
        run: node tests/raven-release-gate.test.mjs
      - name: Parse Daily Brief browser runtime
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('RAH-RAVEN-DAILY-BRIEF.html','utf8');
          const scripts=[...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];
          if(scripts.length!==1) throw new Error('Expected one inline Daily Brief script');
          new Function(scripts[0][1]);
          console.log('Daily Brief inline runtime parses');
          NODE
