name: Build Isolated Daily Driver CC2.3 Reference Sync

on:
  pull_request:
    branches:
      - release/daily-driver-cc23-sync-base

permissions:
  contents: write

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/daily-driver-cc23-stable-reference-sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact current-Stable reference sync
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root=Path('.')

          def exact_replace(path, old, new, count=1):
              p=root/path
              text=p.read_text(encoding='utf-8')
              actual=text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s) of {old!r}, found {actual}')
              p.write_text(text.replace(old,new),encoding='utf-8')

          exact_replace('apps/rah-raven-daily-driver/command_center.py','"Stable CC 2.0"','"Stable CC 2.3"')
          exact_replace('apps/rah-raven-daily-driver/command_center.py','"RAH-COMMAND-CENTER-V2.0.html"','"RAH-COMMAND-CENTER-V2.3.html"')

          mp=root/'RAH-RAVEN-DAILY-DRIVER-VERSION.json'
          m=json.loads(mp.read_text(encoding='utf-8'))
          assert m['version']=='1.0.0' and m['stage']=='candidate'
          assert m['stable_command_center_reference']=='2.1.0'
          assert m['stable_node_agent_reference']=='1.3.0'
          assert m['stable_chronicle_reference']=='1.7.1'
          assert m['authority_delta']=='none'
          assert m['stable_gate']['status']=='not_passed'
          m['stable_command_center_reference']='2.3.0'
          m['stable_command_center_package_generation_reference']=8
          mp.write_text(json.dumps(m,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          pp=root/'RAH-RAVEN-DAILY-DRIVER-PACKAGE.json'
          pkg=json.loads(pp.read_text(encoding='utf-8'))
          assert pkg['stage']=='candidate-package' and pkg['packageFileCount']==37
          assert len(pkg['packageFiles'])==37 and len(set(pkg['packageFiles']))==37
          old=['RAH-COMMAND-CENTER-V2.1.html','rah-command-center-core-v2.1.js']
          new=['RAH-COMMAND-CENTER-V2.3.html','rah-command-center-core-v2.3.js']
          forbidden=list(pkg['forbiddenPackagePaths'])
          for a,b in zip(old,new):
              assert forbidden.count(a)==1 and b not in forbidden
              forbidden[forbidden.index(a)]=b
          pkg['forbiddenPackagePaths']=forbidden
          assert len(pkg['packageFiles'])==37 and len(set(pkg['packageFiles']))==37
          for p in new:
              assert p not in pkg['packageFiles']
          pp.write_text(json.dumps(pkg,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          exact_replace('RAH-RAVEN-DAILY-DRIVER.md','canonical Command Center 2.1 Stable','canonical Command Center 2.3 Stable')

          tp=root/'apps/rah-raven-daily-driver/tests/test_smoke.py'
          t=tp.read_text(encoding='utf-8')
          anchor='    def test_chronicle_recovery_and_questions(self):\n'
          assert t.count(anchor)==1
          block='''    def test_current_stable_command_center_reference(self):\n        source = (APP / "command_center.py").read_text(encoding="utf-8")\n        self.assertIn('"Stable CC 2.3"', source)\n        self.assertIn('"RAH-COMMAND-CENTER-V2.3.html"', source)\n        self.assertNotIn('"Stable CC 2.0"', source)\n        self.assertNotIn('"RAH-COMMAND-CENTER-V2.0.html"', source)\n        repo = APP.parents[1]\n        daily = json.loads((repo / "RAH-RAVEN-DAILY-DRIVER-VERSION.json").read_text(encoding="utf-8"))\n        cc = json.loads((repo / "RAH-COMMAND-CENTER-VERSION.json").read_text(encoding="utf-8"))\n        package = json.loads((repo / "RAH-RAVEN-DAILY-DRIVER-PACKAGE.json").read_text(encoding="utf-8"))\n        self.assertEqual(daily["stable_command_center_reference"], cc["version"])\n        self.assertEqual(daily["stable_command_center_package_generation_reference"], cc["canonical_package_generation"])\n        self.assertEqual(package["packageFileCount"], 37)\n        self.assertNotIn("RAH-COMMAND-CENTER-V2.3.html", package["packageFiles"])\n        self.assertNotIn("rah-command-center-core-v2.3.js", package["packageFiles"])\n        self.assertIn("RAH-COMMAND-CENTER-V2.3.html", package["forbiddenPackagePaths"])\n        self.assertIn("rah-command-center-core-v2.3.js", package["forbiddenPackagePaths"])\n\n'''
          tp.write_text(t.replace(anchor,block+anchor),encoding='utf-8')

          checks={
              'apps/rah-raven-daily-driver/command_center.py':['RAH-COMMAND-CENTER-V2.0.html','Stable CC 2.0'],
              'RAH-RAVEN-DAILY-DRIVER-VERSION.json':['"stable_command_center_reference": "2.1.0"'],
              'RAH-RAVEN-DAILY-DRIVER-PACKAGE.json':['RAH-COMMAND-CENTER-V2.1.html','rah-command-center-core-v2.1.js'],
              'RAH-RAVEN-DAILY-DRIVER.md':['canonical Command Center 2.1 Stable'],
          }
          for path, forbidden_strings in checks.items():
              text=(root/path).read_text(encoding='utf-8')
              for s in forbidden_strings:
                  assert s not in text,(path,s)

          print('Daily Driver current Stable CC2.3 reference sync PASS')
          PY
      - name: Run focused regression before publishing output
        run: python3 -m unittest apps/rah-raven-daily-driver/tests/test_smoke.py -v
      - name: Remove builder request, generated caches and commit generated sync
        run: |
          rm -f .github/workflows/build-daily-driver-cc23-reference-sync.yml DAILY-DRIVER-CC23-SYNC-REQUEST.txt
          find apps/rah-raven-daily-driver -type d -name '__pycache__' -prune -exec rm -rf {} +
          find apps/rah-raven-daily-driver -type f -name '*.pyc' -delete
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Sync Daily Driver Candidate to canonical Command Center 2.3'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
