name: Validate RAH Home Pair Wizard

on:
  push:
    branches: [main]
    paths:
      - 'RAH-HOME-PAIR-WIZARD.ps1'
      - 'RAH-HOME-NODE-CLIENT.ps1'
      - 'RAH-HOME-NODE-AGENT.ps1'
      - 'tests/test_home_pair_wizard_contract.py'
      - 'tests/RAH-HOME-PAIR-WIZARD-RUNTIME-TEST.ps1'
      - '.github/workflows/validate-home-pair-wizard.yml'
  pull_request:
    paths:
      - 'RAH-HOME-PAIR-WIZARD.ps1'
      - 'RAH-HOME-NODE-CLIENT.ps1'
      - 'RAH-HOME-NODE-AGENT.ps1'
      - 'tests/test_home_pair_wizard_contract.py'
      - 'tests/RAH-HOME-PAIR-WIZARD-RUNTIME-TEST.ps1'
      - '.github/workflows/validate-home-pair-wizard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/test_home_pair_wizard_contract.py

  windows-runtime:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse Pair Wizard PowerShell
        shell: powershell
        run: |
          $files=@('RAH-HOME-PAIR-WIZARD.ps1','tests/RAH-HOME-PAIR-WIZARD-RUNTIME-TEST.ps1')
          foreach($file in $files){
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)
            if($errors.Count){$errors|Format-List|Out-String|Write-Host;throw "PowerShell parse failed: $file"}
          }
      - name: Pair Wizard built-in self test
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File RAH-HOME-PAIR-WIZARD.ps1 -SelfTest
      - name: Run real Pair Wizard LAN integration
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/RAH-HOME-PAIR-WIZARD-RUNTIME-TEST.ps1
