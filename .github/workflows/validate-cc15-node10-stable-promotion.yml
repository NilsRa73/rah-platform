name: Validate CC 1.5 Node 1.0 Stable Historical Reference

on:
  push:
    paths:
      - 'RAH-CC15-NODE10-STABLE-RELEASE.json'
      - 'rah-node-agent-v1.0.py'
      - 'tests/test_rah_node_agent_stable_v10.py'
      - '.github/workflows/validate-cc15-node10-stable-promotion.yml'
  pull_request:
    paths:
      - 'RAH-CC15-NODE10-STABLE-RELEASE.json'
      - 'rah-node-agent-v1.0.py'
      - 'tests/test_rah_node_agent_stable_v10.py'
      - '.github/workflows/validate-cc15-node10-stable-promotion.yml'

permissions:
  contents: read

jobs:
  historical-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify frozen CC 1.5 Node 1.0 release blobs
        shell: bash
        run: |
          test "$(git hash-object rah-command-center-core-v1.5.js)" = "ddec9e8dd694497a2a4d64159778023224951a23"
          test "$(git hash-object RAH-COMMAND-CENTER-V1.5.html)" = "c7433c698f848139ac5cb4fb8781de3d9e5aab99"
          test "$(git hash-object rah-node-agent-v1.0.py)" = "b823283507be71e37357511e3957552f73618878"
          test "$(git hash-object RAH-CC15-NODE10-STABLE-RELEASE.json)" = "b5e44c2ecee6ad8827fd8ec9de85a33010295267"
      - name: Re-run frozen Node Agent 1.0 live reference
        run: python3 -m unittest tests/test_rah_node_agent_stable_v10.py
      - name: Verify historical release identity and authority metadata
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('RAH-CC15-NODE10-STABLE-RELEASE.json','utf8'));
          const eq=(a,b,m)=>{if(JSON.stringify(a)!==JSON.stringify(b))throw new Error(m)};
          if(r.commandCenterVersion!=='1.5.0'||r.nodeAgentVersion!=='1.0.0'||r.nodeActionsProtocol!=='rah-node-actions-v5'||r.policyId!=='rah-capability-allowlist-v1')throw new Error('historical release identity drifted');
          eq(r.authoritySurface.capabilities,['compute','storage','display','remote-desktop'],'capability drift');
          eq(r.authoritySurface.actions,['storage-summary.read','rustdesk.launch','rustdesk.connect'],'action drift');
          eq(r.authoritySurface.routes,['/health','/actions','/storage','/launch/rustdesk','/handoff/rustdesk'],'route drift');
          NODE
