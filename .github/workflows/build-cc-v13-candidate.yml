name: Build CC v1.3 candidate manifest
on:
  push:
    branches: ['agent/rah-cc-v1.3-token-proof-auth']
    paths: ['tools/build-command-center-v13-candidate.mjs','.github/workflows/build-cc-v13-candidate.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Generate candidate manifest only
        run: node tools/build-command-center-v13-candidate.mjs
      - name: Verify generated diff scope
        run: |
          changed="$(git diff --name-only)"
          test "$changed" = "RAH-COMMAND-CENTER-VERSION.json"
      - name: Run token-proof core gate
        run: node --test tests/rah-command-center-core.test.mjs
      - name: Run token-proof Node Agent gate
        run: python -m unittest tests/test_rah_node_agent.py -v
      - name: Commit generated candidate manifest
        run: |
          git config user.name "RAH Raven Builder"
          git config user.email "actions@users.noreply.github.com"
          git add RAH-COMMAND-CENTER-VERSION.json
          git commit -m "RAH Command Center v1.3 — candidate manifest"
          git push
