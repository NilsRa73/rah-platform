name: Build Raven 2.0.22 Handoff Session

on:
  push:
    branches:
      - raven-2.0.22-handoff-session

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: raven-2.0.22-handoff-session
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fix temporary builder marker
        run: python .github/scripts/fix_raven_2_0_22_builder.py
      - name: Build URL-only ChatGPT handoff session
        run: python .github/scripts/build_raven_2_0_22.py
      - name: Check Core inline JavaScript
        run: python -c "from pathlib import Path; import re; h=Path('RAH-RAVEN-CORE-DEMO.html').read_text(encoding='utf-8'); Path('/tmp/core.js').write_text(chr(10).join(re.findall(r'<script(?:[^>]*)>([\\s\\S]*?)</script>',h)),encoding='utf-8')"
      - run: node --check /tmp/core.js
      - name: Check Vision inline JavaScript
        run: python -c "from pathlib import Path; import re; h=Path('RAH-RAVEN-VISION-CORE.html').read_text(encoding='utf-8'); Path('/tmp/vision.js').write_text(chr(10).join(re.findall(r'<script(?:[^>]*)>([\\s\\S]*?)</script>',h)),encoding='utf-8')"
      - run: node --check /tmp/vision.js
      - name: Test Raven 2.0.22 runtime
        run: node tests/raven-core-demo.test.mjs && node tests/raven-core-context.test.mjs && node tests/raven-core-chatgpt-status.test.mjs && node tests/raven-core-chatgpt-handoff-center.test.mjs && node tests/raven-chatgpt-handoff-session.test.mjs && node tests/raven-checkpoint-policy.test.mjs && node tests/raven-now-v2.test.mjs && node tests/raven-mission-control.test.mjs && node tests/raven-project-focus.test.mjs && node tests/raven-vision-core.test.mjs
      - name: Commit tested runtime
        run: git config user.name 'RAH Raven Builder' && git config user.email 'actions@users.noreply.github.com' && git add RAH-RAVEN-CORE-DEMO.html RAH-RAVEN-VISION-CORE.html RAH-RAVEN-VERSION.json tests/raven-core-demo.test.mjs tests/raven-core-context.test.mjs tests/raven-core-chatgpt-status.test.mjs tests/raven-core-chatgpt-handoff-center.test.mjs tests/raven-chatgpt-handoff-session.test.mjs tests/raven-vision-core.test.mjs && (git diff --cached --quiet || (git commit -m 'Add URL-only ChatGPT handoff session for 2.0.22' && git push origin HEAD:raven-2.0.22-handoff-session))
