name: Build Raven 2.0.22 Handoff Session

on:
  push:
    branches:
      - raven-2.0.22-handoff-session

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: raven-2.0.22-handoff-session
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build URL-only ChatGPT handoff session
        run: python .github/scripts/build_raven_2_0_22.py
      - name: Check inline JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          for name in ('RAH-RAVEN-CORE-DEMO.html','RAH-RAVEN-VISION-CORE.html'):
              html=Path(name).read_text(encoding='utf-8')
              Path('/tmp/'+name+'.js').write_text('\n'.join(re.findall(r'<script(?:[^>]*)>([\s\S]*?)</script>',html)),encoding='utf-8')
          PY
          node --check /tmp/RAH-RAVEN-CORE-DEMO.html.js
          node --check /tmp/RAH-RAVEN-VISION-CORE.html.js
      - name: Test Raven 2.0.22 runtime
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/raven-core-demo.test.mjs tests/raven-core-context.test.mjs tests/raven-core-chatgpt-status.test.mjs tests/raven-core-chatgpt-handoff-center.test.mjs tests/raven-chatgpt-handoff-session.test.mjs tests/raven-checkpoint-policy.test.mjs tests/raven-now-v2.test.mjs tests/raven-mission-control.test.mjs tests/raven-project-focus.test.mjs tests/raven-vision-core.test.mjs; do
            node "$test"
          done
      - name: Commit tested runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'RAH Raven Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add RAH-RAVEN-CORE-DEMO.html RAH-RAVEN-VISION-CORE.html RAH-RAVEN-VERSION.json tests/raven-core-demo.test.mjs tests/raven-core-context.test.mjs tests/raven-core-chatgpt-status.test.mjs tests/raven-core-chatgpt-handoff-center.test.mjs tests/raven-chatgpt-handoff-session.test.mjs tests/raven-vision-core.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Add URL-only ChatGPT handoff session for 2.0.22'
          git push origin HEAD:raven-2.0.22-handoff-session
