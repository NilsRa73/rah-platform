name: Validate Raven Daily Driver Stable Windows Runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'INSTALL-RAH-RAVEN.bat'
      - 'RAH-RAVEN-DAILY-DRIVER-PACKAGE.json'
      - 'RAH-RAVEN-DAILY-DRIVER-VERSION.json'
      - 'RAH-RAVEN-DAILY-DRIVER-FINAL.ps1'
      - 'START-HER-RAH-RAVEN-DAILY-DRIVER.cmd'
      - 'apps/rah-raven-daily-driver/**'
      - '.github/workflows/validate-raven-daily-driver-prestable-machine-v2.yml'
  pull_request:
    paths:
      - 'INSTALL-RAH-RAVEN.bat'
      - 'RAH-RAVEN-DAILY-DRIVER-PACKAGE.json'
      - 'RAH-RAVEN-DAILY-DRIVER-VERSION.json'
      - 'RAH-RAVEN-DAILY-DRIVER-FINAL.ps1'
      - 'START-HER-RAH-RAVEN-DAILY-DRIVER.cmd'
      - 'apps/rah-raven-daily-driver/**'
      - '.github/workflows/validate-raven-daily-driver-prestable-machine-v2.yml'

permissions:
  contents: read

jobs:
  windows-stable-runtime:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stage exact Stable package in path with spaces
        shell: pwsh
        run: |
          $m=Get-Content RAH-RAVEN-DAILY-DRIVER-PACKAGE.json -Raw|ConvertFrom-Json
          if($m.stage -ne 'stable-package' -or $m.packageFileCount -ne 39){throw 'Stable package contract drift'}
          $stage=Join-Path $env:RUNNER_TEMP 'RAH Daily Driver Stable Test'
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage|Out-Null
          foreach($rel in $m.packageFiles){
            $dest=Join-Path $stage ($rel -replace '/','\')
            New-Item -ItemType Directory -Path (Split-Path -Parent $dest) -Force|Out-Null
            Copy-Item -LiteralPath $rel -Destination $dest
          }
          if((Get-ChildItem $stage -Recurse -File).Count -ne 39){throw 'Staged Stable package count mismatch'}
          "RAH_STAGE=$stage"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run real installer headless
        shell: pwsh
        run: |
          $env:RAH_RAVEN_INSTALL_NO_START='1'
          Push-Location $env:RAH_STAGE
          try{
            & cmd.exe /d /c 'INSTALL-RAH-RAVEN.bat'
            if($LASTEXITCODE -ne 0){throw "Installer exit $LASTEXITCODE"}
          }finally{Pop-Location}
      - name: Verify venv runtime root and desktop shortcut
        shell: pwsh
        run: |
          $app=Join-Path $env:RAH_STAGE 'apps\rah-raven-daily-driver'
          $py=Join-Path $app '.venv\Scripts\python.exe'
          if(-not(Test-Path $py -PathType Leaf)){throw 'Installed venv missing'}
          & $py -c "import requests; print(requests.__version__)"
          if($LASTEXITCODE -ne 0){throw 'requests unavailable'}
          foreach($n in @('data','logs','reports','devices','imports','exports','state')){
            $p=Join-Path 'C:\RAH\DailyDriver\runtime' $n
            New-Item -ItemType Directory -Force -Path $p|Out-Null
            if(-not(Test-Path $p -PathType Container)){throw "Missing runtime $p"}
          }
          $link=Join-Path ([Environment]::GetFolderPath('Desktop')) 'RAH Raven Daily Driver.lnk'
          if(-not(Test-Path $link -PathType Leaf)){throw 'Desktop shortcut missing'}
          $sc=(New-Object -ComObject WScript.Shell).CreateShortcut($link)
          if(-not $sc.TargetPath.EndsWith('START-RAH-RAVEN.bat')){throw 'Shortcut target mismatch'}
      - name: Run full Stable unit suite
        shell: pwsh
        run: |
          $app=Join-Path $env:RAH_STAGE 'apps\rah-raven-daily-driver'
          $py=Join-Path $app '.venv\Scripts\python.exe'
          & $py -m unittest discover -s (Join-Path $app 'tests') -p 'test_*.py' -v
          if($LASTEXITCODE -ne 0){throw 'Stable unit suite failed'}
      - name: Run deterministic Stable runtime gate
        shell: pwsh
        run: |
          $app=Join-Path $env:RAH_STAGE 'apps\rah-raven-daily-driver'
          $py=Join-Path $app '.venv\Scripts\python.exe'
          $out=Join-Path $env:RUNNER_TEMP 'stable-runtime-gate.json'
          $env:RAH_DAILY_DRIVER_RUNTIME='C:\RAH\DailyDriver\runtime'
          & $py (Join-Path $app 'runtime_check.py') --output $out
          if($LASTEXITCODE -ne 0){throw 'Stable Runtime Gate returned FAIL'}
          $r=Get-Content $out -Raw|ConvertFrom-Json
          if($r.overall -ne 'PASS' -or $r.recommended_stage -ne 'Stable'){throw "Unexpected Stable gate result: $($r.overall) / $($r.recommended_stage)"}
          $live=@($r.checks|Where-Object {$_.name -in @('LM Studio','Real Facebook/archive import')})
          if(@($live|Where-Object {$_.required}).Count){throw 'Live/private integration checks must be optional for Stable release'}
      - name: Probe real read-only loopback bridge
        shell: pwsh
        run: |
          $app=Join-Path $env:RAH_STAGE 'apps\rah-raven-daily-driver'
          $py=Join-Path $app '.venv\Scripts\python.exe'
          $probe=Join-Path $env:RUNNER_TEMP 'bridge_probe.py'
          @'
          import json,sys,urllib.error,urllib.request
          from pathlib import Path
          app=Path(sys.argv[1]);sys.path.insert(0,str(app));from bridge import LocalBridge
          b=LocalBridge(lambda:{'stage':'Stable'},host='127.0.0.1',port=18767);b.start()
          try:
              with urllib.request.urlopen('http://127.0.0.1:18767/health',timeout=3) as r:
                  assert r.status==200 and json.load(r)=={'ok':True,'service':'rah-raven-daily-driver'}
              q=urllib.request.Request('http://127.0.0.1:18767/status',data=b'{}',method='POST',headers={'Content-Type':'application/json'})
              try: urllib.request.urlopen(q,timeout=3);raise AssertionError('POST accepted')
              except urllib.error.HTTPError as e: assert e.code==405 and json.loads(e.read())=={'error':'read_only_bridge'}
          finally:b.stop()
          print('read_only_loopback_bridge=PASS')
          '@|Set-Content $probe -Encoding UTF8
          & $py $probe $app
          if($LASTEXITCODE -ne 0){throw 'Bridge probe failed'}
      - name: Prove cloud remains disabled by default
        shell: pwsh
        run: |
          $app=Join-Path $env:RAH_STAGE 'apps\rah-raven-daily-driver'
          $config=Get-Content (Join-Path $app 'config.json') -Raw|ConvertFrom-Json
          if($config.agents.openai_cloud.enabled){throw 'Cloud agent enabled by default'}
          if($config.stage -ne 'Stable'){throw 'Installed config is not Stable'}
