name: Validate Raven Care Hub v0.6 Historical Readiness
on:
  push:
    paths: ['RAH-RAVEN-CARE-HUB-V0.5-STABLE.html','RAH-RAVEN-CARE-HUB-V0.5-STABLE.json','RAH-RAVEN-CARE-HUB-V0.6-CANDIDATE.html','RAH-RAVEN-CARE-HUB-V0.6-CANDIDATE.json','RAH-RAVEN-CARE-HUB-V0.6-STABLE-READINESS.json','tests/raven-care-hub-v0.6-stable-readiness.test.mjs','.github/workflows/validate-raven-care-hub-v0.6-stable-readiness.yml']
  pull_request:
    paths: ['RAH-RAVEN-CARE-HUB-V0.5-STABLE.html','RAH-RAVEN-CARE-HUB-V0.5-STABLE.json','RAH-RAVEN-CARE-HUB-V0.6-CANDIDATE.html','RAH-RAVEN-CARE-HUB-V0.6-CANDIDATE.json','RAH-RAVEN-CARE-HUB-V0.6-STABLE-READINESS.json','tests/raven-care-hub-v0.6-stable-readiness.test.mjs','.github/workflows/validate-raven-care-hub-v0.6-stable-readiness.yml']
permissions: {contents: read}
jobs:
  historical-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node tests/raven-care-hub-v0.6-stable-readiness.test.mjs
      - run: node tests/raven-care-hub-v0.6-candidate.test.mjs
      - run: node tests/raven-care-hub-v0.5-stable.test.mjs
