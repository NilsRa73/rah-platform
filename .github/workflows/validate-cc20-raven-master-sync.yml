name: Validate CC 2.0 Raven Master Sync
on:
  pull_request:
    paths:
      - 'RAH-RAVEN-VERSION.json'
      - 'RAH-COMMAND-CENTER-VERSION.json'
      - 'RAH-CC20-NODE13-STABLE-RELEASE.json'
      - 'tests/rah-cc20-raven-master-sync.test.mjs'
      - '.github/workflows/validate-cc20-raven-master-sync.yml'
  push:
    branches: [main]
    paths:
      - 'RAH-RAVEN-VERSION.json'
      - 'RAH-COMMAND-CENTER-VERSION.json'
      - 'RAH-CC20-NODE13-STABLE-RELEASE.json'
      - 'tests/rah-cc20-raven-master-sync.test.mjs'
      - '.github/workflows/validate-cc20-raven-master-sync.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate canonical v2.0 package
        run: node --test tests/rah-command-center-packaging.test.mjs
      - name: Re-run v2.0 requester-context Candidate
        run: node --test tests/rah-cc20-precommitted-requester-context.test.mjs
      - name: Re-run v2.0 Stable release pins
        run: node --test tests/rah-cc20-stable-release.test.mjs
      - name: Preserve Node Agent 1.3 live token-proof boundary
        run: python3 -m unittest tests/test_rah_node_agent_stable_v13.py -v
      - name: Preserve Raven 2.0.32 release gate
        run: node --test tests/raven-release-gate.test.mjs
      - name: Validate v2.0 Raven master contract
        run: node --test tests/rah-cc20-raven-master-sync.test.mjs
