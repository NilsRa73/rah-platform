# Historical CC v2.0 / Raven 2.0.32 evidence. Current canonical CC is validated by its own versioned workflow.
name: Validate CC 2.0 Historical Raven Master Evidence
on:
  pull_request:
    paths:
      - 'RAH-CC20-NODE13-STABLE-RELEASE.json'
      - 'RAH-CC20-PRECOMMITTED-REQUESTER-CONTEXT-CANDIDATE.json'
      - 'tests/rah-cc20-raven-master-sync.test.mjs'
      - 'tests/rah-cc20-precommitted-requester-context.test.mjs'
      - 'tests/rah-cc20-stable-release.test.mjs'
      - 'rah-node-agent-v1.3.py'
      - '.github/workflows/validate-cc20-raven-master-sync.yml'
  push:
    branches: [main]
    paths:
      - 'RAH-CC20-NODE13-STABLE-RELEASE.json'
      - 'RAH-CC20-PRECOMMITTED-REQUESTER-CONTEXT-CANDIDATE.json'
      - 'tests/rah-cc20-raven-master-sync.test.mjs'
      - 'tests/rah-cc20-precommitted-requester-context.test.mjs'
      - 'tests/rah-cc20-stable-release.test.mjs'
      - 'rah-node-agent-v1.3.py'
      - '.github/workflows/validate-cc20-raven-master-sync.yml'
permissions:
  contents: read
jobs:
  historical-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Re-run frozen v2.0 requester-context Candidate
        run: node --test tests/rah-cc20-precommitted-requester-context.test.mjs
      - name: Re-run frozen CC 2.0 Stable release pins
        run: node --test tests/rah-cc20-stable-release.test.mjs
      - name: Preserve unchanged Node Agent 1.3 token-proof boundary
        run: python3 -m unittest tests/test_rah_node_agent_stable_v13.py -v
      - name: Validate lifecycle-neutral v2.0 historical evidence
        run: node --test tests/rah-cc20-raven-master-sync.test.mjs
