name: Harden RAH Case Center v1.6 Origin Boundary

on:
  workflow_dispatch:
  push:
    branches:
      - case-center/v1.6-local-boundary
    paths:
      - '.github/scripts/harden_case_center_origin_boundary.py'
      - '.github/workflows/harden-case-center-origin-boundary.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: case-center/v1.6-local-boundary
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install bridge dependencies
        run: python -m pip install -r desktop-bridge/requirements.txt

      - name: Apply origin hardening
        run: python .github/scripts/harden_case_center_origin_boundary.py

      - name: Validate final candidate
        run: |
          python -m py_compile desktop-bridge/server_v16.py desktop-bridge/raven_bridge.py
          cd desktop-bridge
          python -m unittest -v test_case_v16.py
          python test_raven_bridge_security.py
          python test_chronicle_v17.py
          cd ..
          node tests/raven-case-center-v16.test.mjs
          node tests/raven-release-gate.test.mjs

      - name: Assert incremental product scope
        shell: python
        run: |
          import shutil
          import subprocess
          shutil.rmtree('.github/scripts/__pycache__', ignore_errors=True)
          shutil.rmtree('desktop-bridge/__pycache__', ignore_errors=True)
          expected={
            'RAH-RAVEN-CASE-CENTER-VERSION.json',
            'RAH-RAVEN-VERSION.json',
            'desktop-bridge/server_v16.py',
            'desktop-bridge/test_case_v16.py',
            'tests/raven-case-center-v16.test.mjs',
          }
          changed=set(subprocess.check_output(['git','status','--short'],text=True).splitlines())
          paths={line[3:] for line in changed if len(line)>=4}
          assert paths==expected,(paths,expected)
          print('Case Center origin hardening scope: OK')

      - name: Commit final Case Center hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RAH-RAVEN-CASE-CENTER-VERSION.json \
                  RAH-RAVEN-VERSION.json \
                  desktop-bridge/server_v16.py \
                  desktop-bridge/test_case_v16.py \
                  tests/raven-case-center-v16.test.mjs
          git commit -m 'Harden Case Center browser origin boundary'
          git push origin HEAD:case-center/v1.6-local-boundary
