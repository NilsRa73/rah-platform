name: Build Raven Chronicle v1.7.1 Stable Gate
on:
  push:
    branches: ['chronicle/v1.7.1-stable-gate']
    paths:
      - '.github/scripts/build_chronicle_v1_7_1_stable.py'
      - '.github/workflows/build-chronicle-v1.7.1-stable-gate.yml'
permissions:
  contents: write
jobs:
  stable-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: desktop-bridge/requirements.txt
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python -m pip install -r desktop-bridge/requirements.txt
      - name: Build and validate runtime-frozen Stable Gate
        run: python .github/scripts/build_chronicle_v1_7_1_stable.py
      - name: Commit Stable Gate metadata and semantic contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RAH-RAVEN-CHRONICLE-VERSION.json RAH-RAVEN-VERSION.json tests/raven-chronicle-v17.test.mjs
          git diff --cached --exit-code --quiet && { echo "No Stable Gate changes"; exit 1; } || true
          git commit -m "RAH Raven Chronicle v1.7.1 — stable gate"
          git push
