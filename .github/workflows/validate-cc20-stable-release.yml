name: Validate CC 2.0 Stable Release
on:
  pull_request:
    paths:
      - 'rah-command-center-core-v2.0.js'
      - 'RAH-COMMAND-CENTER-V2.0.html'
      - 'RAH-CC20-NODE13-STABLE-RELEASE.json'
      - 'tests/rah-cc20-stable-release.test.mjs'
      - '.github/workflows/validate-cc20-stable-release.yml'
  push:
    branches: [main]
    paths:
      - 'rah-command-center-core-v2.0.js'
      - 'RAH-COMMAND-CENTER-V2.0.html'
      - 'RAH-CC20-NODE13-STABLE-RELEASE.json'
      - 'tests/rah-cc20-stable-release.test.mjs'
      - '.github/workflows/validate-cc20-stable-release.yml'
permissions:
  contents: read
jobs:
  stable:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Stable lifecycle scope guard
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch origin main --quiet
          allowed='^(rah-command-center-core-v2\.0\.js|RAH-COMMAND-CENTER-V2\.0\.html|RAH-CC20-NODE13-STABLE-RELEASE\.json|tests/rah-cc20-stable-release\.test\.mjs|\.github/workflows/validate-cc20-stable-release\.yml)$'
          changed="$(git diff --name-only origin/main...HEAD)"
          test -n "$changed" || { echo 'No CC 2.0 Stable lifecycle files changed'; exit 1; }
          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          test -z "$bad" || { echo "$bad"; exit 1; }
      - name: Re-run v2.0 Candidate precommit matrix
        run: node --test tests/rah-cc20-precommitted-requester-context.test.mjs
      - name: Validate v2.0 Stable release pins and wrapper contract
        run: node --test tests/rah-cc20-stable-release.test.mjs
      - name: Preserve canonical v1.9 and rollback release
        run: |
          node --test tests/rah-command-center-packaging.test.mjs
          node --test tests/rah-cc19-stable-release.test.mjs
      - name: Preserve unchanged Node 1.3 live security boundary
        run: python3 -m unittest tests/test_rah_node_agent_stable_v13.py -v
      - name: Preserve current Raven master and release gates
        run: |
          node --test tests/rah-cc19-raven-master-sync.test.mjs
          node --test tests/raven-release-gate.test.mjs
          node --test tests/raven-project-registry-v0.1.test.mjs
