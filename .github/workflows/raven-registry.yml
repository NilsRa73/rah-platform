name: Raven Registry

on:
  pull_request:
    paths:
      - "raven/**"
      - "START-RAVEN.cmd"
      - "project-registry.js"
      - "index.html"
      - ".github/workflows/raven-registry.yml"
  push:
    branches:
      - main
    paths:
      - "raven/**"
      - "START-RAVEN.cmd"
      - "project-registry.js"
      - "index.html"
      - ".github/workflows/raven-registry.yml"

permissions:
  contents: read

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate project registry
        run: python raven/raven_registry.py --json

      - name: Check registry browser bridge syntax
        run: node --check project-registry.js

      - name: Run registry tests
        run: python -m unittest discover -s raven/tests -v


  windows-precheck:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Raven Windows candidate precheck
        shell: cmd
        run: START-RAVEN.cmd --check
