name: Raven Registry

on:
  pull_request:
    paths:
      - "raven/**"
      - "START-RAVEN.cmd"
      - "project-registry.js"
      - "index.html"
      - ".github/workflows/raven-registry.yml"
  push:
    branches:
      - main
    paths:
      - "raven/**"
      - "START-RAVEN.cmd"
      - "project-registry.js"
      - "index.html"
      - ".github/workflows/raven-registry.yml"

permissions:
  contents: read

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate project registry
        run: python raven/raven_registry.py --json

      - name: Check registry browser bridge syntax
        run: node --check project-registry.js

      - name: Run registry tests
        run: python -m unittest discover -s raven/tests -v


  windows-precheck:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Raven Windows candidate precheck
        shell: cmd
        run: START-RAVEN.cmd --check


  integrated-agent-stack:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Agent Team LIVE static contract
        shell: cmd
        run: python tests\test_agent_team_live_v1_contract.py

      - name: Self-test Agent Team LIVE bootstrap
        shell: cmd
        run: START-HER-RAH-AGENT-LIVE.cmd --self-test

      - name: Self-test LM Studio Recovery bootstrap
        shell: cmd
        run: RAH-LM-STUDIO-RECOVERY.cmd --self-test

      - name: Self-test Raven v1 final acceptance
        shell: cmd
        run: START-RAVEN-V1-ACCEPTANCE.cmd --self-test

      - name: Self-test Raven v1 Candidate freeze
        shell: cmd
        run: FREEZE-RAVEN-V1-CANDIDATE.cmd --self-test

      - name: Self-test Raven v1 safe rollback
        shell: cmd
        run: ROLLBACK-RAVEN-V1.cmd --self-test
