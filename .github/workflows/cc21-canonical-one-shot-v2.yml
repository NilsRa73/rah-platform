name: CC 2.1 Canonical One-Shot Migration v2
on:
  push:
    branches: ['agent/cc21-canonical-package']
    paths:
      - 'tools/cc21-canonical-lifecycle-patch.mjs'
      - '.github/workflows/cc21-canonical-one-shot-v2.yml'
permissions:
  contents: write
jobs:
  migrate:
    if: github.ref_name == 'agent/cc21-canonical-package'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cc21-canonical-package
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Require exact versioned CC 2.1 Stable source
        run: |
          test "$(git rev-parse HEAD:RAH-CC21-NODE13-STABLE-RELEASE.json)" = "$(git rev-parse origin/main:RAH-CC21-NODE13-STABLE-RELEASE.json)"
          node --test tests/rah-cc21-stable-release.test.mjs
      - name: Apply deterministic canonical migration
        run: |
          node tools/cc21-canonical-migrate.mjs
          node tools/cc21-canonical-lifecycle-patch.mjs
      - name: Validate generated canonical package before commit
        run: |
          node --test tests/rah-command-center-packaging.test.mjs
          node --test tests/rah-cc21-fleet-snapshot.test.mjs
          node --test tests/rah-cc21-stable-release.test.mjs
          python3 -m unittest tests/test_rah_node_agent_stable_v13.py -v
      - name: Commit generated canonical files to migration branch only
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = 'agent/cc21-canonical-package'
          git config user.name 'RAH Raven Canonical Gate'
          git config user.email 'actions@users.noreply.github.com'
          git add RAH-COMMAND-CENTER-VERSION.json DOBBELTKLIKK-HER-START-RAH-COMMAND-CENTER.bat START-RAH-NODE-AGENT.bat UPDATE-RAH-COMMAND-CENTER.ps1 tests/rah-command-center-packaging.test.mjs tests/rah-cc21-stable-release.test.mjs .github/workflows/validate-rah-command-center.yml
          test -n "$(git status --porcelain)"
          git commit -m 'RAH CC 2.1 — generate canonical package migration'
          git push origin HEAD:agent/cc21-canonical-package
