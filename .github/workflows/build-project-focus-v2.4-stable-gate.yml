name: Build Project Focus v2.4 Stable Gate

on:
  push:
    branches:
      - project/project-focus-v2.4-stable-gate
    paths:
      - '.github/scripts/build_project_focus_v2_4_stable_gate.py'
      - '.github/workflows/build-project-focus-v2.4-stable-gate.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project/project-focus-v2.4-stable-gate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Project Focus v2.4 stable gate
        run: python .github/scripts/build_project_focus_v2_4_stable_gate.py
      - name: Validate stable metadata and Raven contract
        run: |
          node tests/raven-project-focus.test.mjs
          node tests/raven-release-gate.test.mjs
          node --check raven-checkpoint-policy.js
      - name: Assert Project Focus runtime remains untouched
        run: git diff --exit-code -- RAH-RAVEN-PROJECT.html raven-checkpoint-policy.js
      - name: Commit stable gate metadata/tests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RAH-RAVEN-PROJECT-FOCUS-VERSION.json RAH-RAVEN-VERSION.json tests/raven-project-focus.test.mjs tests/raven-release-gate.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Freeze Project Focus v2.4 stable contract'
          git push origin HEAD:project/project-focus-v2.4-stable-gate
