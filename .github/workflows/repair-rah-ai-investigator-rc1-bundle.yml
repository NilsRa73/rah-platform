name: Diagnose RAH AI Investigator RC1 bundle

on:
  push:
    branches: [agent/rah-ai-investigator-v1-rc1]
    paths:
      - '.github/workflows/repair-rah-ai-investigator-rc1-bundle.yml'
      - 'apps/rah-ai-investigator/RAH-AI-Investigator-v1.0-RC1-Full-Bundle.zip'

permissions:
  contents: read

jobs:
  diagnose-zip-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rah-ai-investigator-v1-rc1

      - name: Inspect ZIP signatures and directory metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import io, struct, zipfile

          p=Path('apps/rah-ai-investigator/RAH-AI-Investigator-v1.0-RC1-Full-Bundle.zip')
          data=p.read_bytes()
          print(f'file_size={len(data)}')
          for label,sig in [
              ('local',b'PK\x03\x04'),
              ('central',b'PK\x01\x02'),
              ('eocd',b'PK\x05\x06'),
              ('zip64_eocd',b'PK\x06\x06'),
              ('zip64_locator',b'PK\x06\x07'),
              ('descriptor',b'PK\x07\x08'),
          ]:
              positions=[]; start=0
              while True:
                  i=data.find(sig,start)
                  if i<0: break
                  positions.append(i); start=i+1
              print(f'{label}_count={len(positions)}')
              print(f'{label}_positions={positions[:80]}')

          print(f'python_is_zipfile={zipfile.is_zipfile(io.BytesIO(data))}')
          try:
              with zipfile.ZipFile(io.BytesIO(data),'r') as z:
                  print(f'python_full_open=true entries={len(z.infolist())} bad={z.testzip()}')
                  for info in z.infolist()[:80]:
                      print(f'entry={info.filename!r} size={info.file_size} compressed={info.compress_size} crc={info.CRC:08x} offset={info.header_offset}')
          except Exception as e:
              print(f'python_full_open=false error={type(e).__name__}:{e}')

          eocd=data.rfind(b'PK\x05\x06')
          if eocd>=0 and eocd+22<=len(data):
              sig,disk,cd_disk,n_disk,n_total,cd_size,cd_offset,comment_len=struct.unpack_from('<4s4H2LH',data,eocd)
              print(f'eocd_pos={eocd}')
              print(f'eocd_disk={disk} cd_disk={cd_disk} entries_disk={n_disk} entries_total={n_total}')
              print(f'eocd_cd_size={cd_size} eocd_cd_offset={cd_offset} comment_len={comment_len}')
              print(f'eocd_expected_cd_absolute={eocd-cd_size}')
              print(f'eocd_offset_delta={(eocd-cd_size)-cd_offset}')
          else:
              print('eocd_parse=missing_or_truncated')

          # Decode only local headers, never payloads, to see whether the archive can be rebuilt safely.
          positions=[]; start=0
          while True:
              i=data.find(b'PK\x03\x04',start)
              if i<0: break
              positions.append(i); start=i+1
          for idx,i in enumerate(positions[:80]):
              try:
                  sig,ver,flags,method,mtime,mdate,crc,csize,usize,nlen,xlen=struct.unpack_from('<4s5H3L2H',data,i)
                  name=data[i+30:i+30+nlen].decode('utf-8','replace')
                  print(f'local[{idx}] pos={i} flags=0x{flags:04x} method={method} crc={crc:08x} csize={csize} usize={usize} name={name!r}')
              except Exception as e:
                  print(f'local[{idx}] pos={i} parse_error={e}')
          PY

      - name: Ask Info-ZIP for non-mutating diagnostics
        shell: bash
        run: |
          set +e
          zipinfo -v apps/rah-ai-investigator/RAH-AI-Investigator-v1.0-RC1-Full-Bundle.zip
          echo "zipinfo_exit=$?"
          unzip -t apps/rah-ai-investigator/RAH-AI-Investigator-v1.0-RC1-Full-Bundle.zip
          echo "unzip_test_exit=$?"
          exit 0
