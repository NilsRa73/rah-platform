name: Audit RAH AI Investigator RC1 binary format

on:
  push:
    branches: [agent/rah-ai-investigator-v1-rc1]
    paths:
      - '.github/workflows/repair-rah-ai-investigator-rc1-bundle.yml'

permissions:
  contents: read

jobs:
  binary-format-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rah-ai-investigator-v1-rc1

      - name: Identify committed bundle bytes
        shell: bash
        run: |
          set -euo pipefail
          p='apps/rah-ai-investigator/RAH-AI-Investigator-v1.0-RC1-Full-Bundle.zip'
          file "$p" || true
          wc -c "$p"
          xxd -l 128 "$p"
          echo '--- printable strings ---'
          strings -n 8 "$p" | head -n 80 || true
          echo '--- 7z probe ---'
          7z l "$p" || true

      - name: Probe common compression wrappers without mutation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import bz2, collections, lzma, math, zlib
          p=Path('apps/rah-ai-investigator/RAH-AI-Investigator-v1.0-RC1-Full-Bundle.zip')
          data=p.read_bytes()
          counts=collections.Counter(data)
          entropy=-sum((n/len(data))*math.log2(n/len(data)) for n in counts.values())
          printable=sum(1 for b in data if b in (9,10,13) or 32<=b<127)/len(data)
          print(f'bytes={len(data)} entropy_bits_per_byte={entropy:.4f} printable_ratio={printable:.4f}')
          print(f'first64={data[:64].hex()}')
          print(f'last64={data[-64:].hex()}')
          magics={
            'zip':b'PK\x03\x04','gzip':b'\x1f\x8b','bz2':b'BZh','xz':b'\xfd7zXZ\x00',
            '7z':b"7z\xbc\xaf'\x1c",'rar4':b'Rar!\x1a\x07\x00','rar5':b'Rar!\x1a\x07\x01\x00',
            'pdf':b'%PDF','pe':b'MZ','elf':b'\x7fELF'
          }
          for name,sig in magics.items():
            pos=data.find(sig)
            print(f'magic_{name}_offset={pos}')
          for label,fn in [
            ('zlib',lambda: zlib.decompress(data)),
            ('raw_deflate',lambda: zlib.decompress(data,-15)),
            ('gzip',lambda: zlib.decompress(data,31)),
            ('bz2',lambda: bz2.decompress(data)),
            ('lzma_auto',lambda: lzma.decompress(data)),
          ]:
            try:
              out=fn()
              print(f'{label}=success output_bytes={len(out)} first32={out[:32].hex()}')
            except Exception as e:
              print(f'{label}=fail {type(e).__name__}:{e}')
          PY
