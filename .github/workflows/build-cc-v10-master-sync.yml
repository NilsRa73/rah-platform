name: Build CC v1.0 Raven master sync
on:
  push:
    branches: ['agent/rah-cc-v1.0-master-sync']
    paths:
      - 'tools/sync-command-center-v10-master.mjs'
      - '.github/workflows/build-cc-v10-master-sync.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Patch Raven master metadata only
        run: node tools/sync-command-center-v10-master.mjs
      - name: Preserve Raven release gate
        run: node --test tests/raven-release-gate.test.mjs
      - name: Verify generated diff scope
        run: |
          changed="$(git diff --name-only)"
          test "$changed" = "RAH-RAVEN-VERSION.json"
      - name: Commit generated metadata
        run: |
          git config user.name "RAH Raven Builder"
          git config user.email "actions@users.noreply.github.com"
          git add RAH-RAVEN-VERSION.json
          git commit -m "Sync Raven master metadata to Command Center v1.0"
          git push
