name: Generate Raven Now v2.17 Stable CI

on:
  push:
    branches:
      - now/raven-now-v2.17-stable-gate
    paths:
      - '.github/scripts/generate_raven_now_v2_17_stable_ci.py'
      - '.github/workflows/generate-raven-now-v2.17-stable-ci.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: now/raven-now-v2.17-stable-gate
      - name: Generate stable CI copies
        run: python .github/scripts/generate_raven_now_v2_17_stable_ci.py
      - name: Sanity-check generated contracts
        run: |
          grep -F "raven_now" .ci-generated/validate-raven-package.yml
          grep -F "2.17" .ci-generated/validate-raven-package.yml
          grep -F "raven_now" .ci-generated/validate-raven-one-click.yml
          grep -F "2.17" .ci-generated/validate-raven-one-click.yml
          grep -F "eight stable core components including Raven Now v2.17" .ci-generated/validate-raven-release-gate.yml
          grep -F "tests/raven-now-local-boundary.test.mjs" .ci-generated/validate-raven-release-gate.yml
      - name: Commit generated copies only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ci-generated/validate-raven-package.yml .ci-generated/validate-raven-one-click.yml .ci-generated/validate-raven-release-gate.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Generate Raven Now v2.17 stable CI contracts'
          git push origin HEAD:now/raven-now-v2.17-stable-gate
