name: Build Raven 2.0.32 Temporary Stable Freeze

on:
  push:
    branches:
      - raven-2.0.32-temporary-stable
    paths:
      - '.github/workflows/build-raven-2.0.32-freeze.yml'

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: raven-2.0.32-temporary-stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Freeze release manifest and gate test
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest_path=Path('RAH-RAVEN-VERSION.json')
          m=json.loads(manifest_path.read_text(encoding='utf-8'))
          assert m['version']=='2.0.31'
          assert m['release_gate']['stage']=='release-candidate'
          assert m['release_gate']['runtime_feature_change'] is False
          pinned=dict(m['release_gate']['component_versions'])

          m['version']='2.0.32'
          m['released_at']='2026-08-13'
          m['summary']='RAH Raven 2.0.32 is the temporary stable freeze. It adds no runtime features and preserves the component versions validated by the 2.0.31 aggregate Release Gate. The project is intentionally paused at this checkpoint; future changes should be bug fixes or an explicitly reopened development cycle.'
          m['release_gate']['stage']='temporary-stable'
          m['release_gate']['temporary_stable_target']='2.0.32'
          m['release_gate']['runtime_feature_change']=False
          m['release_gate']['frozen_from']='2.0.31'
          m['release_gate']['development_paused']=True
          m['release_gate']['change_policy']='bugfix-only-until-explicit-reopen'
          assert m['release_gate']['component_versions']==pinned
          manifest_path.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          test_path=Path('tests/raven-release-gate.test.mjs')
          s=test_path.read_text(encoding='utf-8')
          s=s.replace('manifest.version,"2.0.31"','manifest.version,"2.0.32"')
          s=s.replace('manifest.release_gate?.stage,"release-candidate"','manifest.release_gate?.stage,"temporary-stable"')
          s=s.replace('assert.equal(manifest.release_gate?.runtime_feature_change,false);','assert.equal(manifest.release_gate?.runtime_feature_change,false);\nassert.equal(manifest.release_gate?.frozen_from,"2.0.31");\nassert.equal(manifest.release_gate?.development_paused,true);\nassert.equal(manifest.release_gate?.change_policy,"bugfix-only-until-explicit-reopen");')
          s=s.replace('RAH Raven 2.0.31 Release Gate: component identity, package and safety boundaries OK.','RAH Raven 2.0.32 Temporary Stable Gate: component identity, package and safety boundaries OK.')
          test_path.write_text(s,encoding='utf-8')
          PY

      - name: Validate frozen identity
        run: |
          node tests/raven-release-gate.test.mjs
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('RAH-RAVEN-VERSION.json').read_text(encoding='utf-8'))
          assert m['version']=='2.0.32'
          assert m['release_gate']['stage']=='temporary-stable'
          assert m['release_gate']['development_paused'] is True
          assert m['release_gate']['runtime_feature_change'] is False
          print('Raven 2.0.32 temporary stable freeze identity: OK')
          PY

      - name: Commit frozen runtime metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RAH-RAVEN-VERSION.json tests/raven-release-gate.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Freeze Raven 2.0.32 temporary stable metadata'
          git push origin HEAD:raven-2.0.32-temporary-stable
