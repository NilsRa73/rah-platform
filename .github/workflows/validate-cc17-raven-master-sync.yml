name: Validate CC 1.7 Raven Master Sync

on:
  pull_request:
    paths:
      - 'RAH-RAVEN-VERSION.json'
      - 'RAH-COMMAND-CENTER-VERSION.json'
      - 'RAH-CC17-NODE13-STABLE-RELEASE.json'
      - 'tests/rah-cc17-raven-master-sync.test.mjs'
      - '.github/workflows/validate-cc17-raven-master-sync.yml'
  push:
    branches: [main]
    paths:
      - 'RAH-RAVEN-VERSION.json'
      - 'RAH-COMMAND-CENTER-VERSION.json'
      - 'RAH-CC17-NODE13-STABLE-RELEASE.json'
      - 'tests/rah-cc17-raven-master-sync.test.mjs'
      - '.github/workflows/validate-cc17-raven-master-sync.yml'

permissions:
  contents: read

jobs:
  master-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Metadata-sync scope guard
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch origin main --quiet
          allowed='^(RAH-RAVEN-VERSION\.json|tests/rah-cc17-raven-master-sync\.test\.mjs|\.github/workflows/validate-cc17-raven-master-sync\.yml)$'
          bad="$(git diff --name-only origin/main...HEAD | grep -Ev "$allowed" || true)"
          if [ -n "$bad" ]; then
            echo 'Raven master sync modified files outside metadata/test/workflow scope:'
            echo "$bad"
            exit 1
          fi
      - name: Validate canonical CC package
        run: node --test tests/rah-command-center-packaging.test.mjs
      - name: Preserve Stable CC 1.7 release pins
        run: node --test tests/rah-cc17-stable-release.test.mjs
      - name: Preserve Stable Node 1.3 live token-proof gate
        run: python3 -m unittest tests/test_rah_node_agent_stable_v13.py -v
      - name: Preserve frozen Raven release gate
        run: node --test tests/raven-release-gate.test.mjs
      - name: Validate Raven master CC 1.7 sync
        run: node --test tests/rah-cc17-raven-master-sync.test.mjs
