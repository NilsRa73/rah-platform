name: Validate RAH OS v0.8 candidate
on:
  pull_request:
    paths:
      - 'RAH-OS-v0.8-HOVED-PC-ONE-CLICK.cmd'
      - 'START-HER-RAH-OS-v0.8.cmd'
      - 'INSTALL-RAH-OS-v0.8.cmd'
      - 'REPAIR-RAH-OS-v0.8.cmd'
      - 'RAH-OS-v0.8-CONTROL.ps1'
      - 'RAH-OS-v0.8-SELFTEST.ps1'
      - 'RUN-RAH-OS-v0.8-HOVED-PC-ACCEPTANCE.cmd'
      - 'RUN-RAH-OS-v0.8-HOVED-PC-ACCEPTANCE.ps1'
      - 'RAH-OS-v0.8-PLAN.md'
      - '.github/workflows/validate-rah-os-v08.yml'
  workflow_dispatch:
jobs:
  contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell parse
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($f in @('RAH-OS-v0.8-CONTROL.ps1','RAH-OS-v0.8-SELFTEST.ps1','RUN-RAH-OS-v0.8-HOVED-PC-ACCEPTANCE.ps1')){
            $null=[scriptblock]::Create((Get-Content $f -Raw))
            Write-Host "PARSE PASS $f"
          }
      - name: Self-test contract
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\RAH-OS-v0.8-SELFTEST.ps1 -ContractOnly
      - name: Acceptance contract
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\RUN-RAH-OS-v0.8-HOVED-PC-ACCEPTANCE.ps1 -SelfTest
      - name: Windows PowerShell 5.1 Generic.List regression
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $selfText=Get-Content .\RAH-OS-v0.8-SELFTEST.ps1 -Raw
          $accText=Get-Content .\RUN-RAH-OS-v0.8-HOVED-PC-ACCEPTANCE.ps1 -Raw
          if($selfText -match 'checks\s*=\s*@\(\$results\)'){throw 'Self-test Generic.List binder regression detected.'}
          if($accText -match 'areas\s*=\s*@\(\$stages\)'){throw 'Acceptance Generic.List binder regression detected.'}
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\RAH-OS-v0.8-SELFTEST.ps1 -ContractOnly
          if($LASTEXITCODE -ne 0){throw 'v0.8 self-test contract failed under Windows PowerShell 5.1'}
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\RUN-RAH-OS-v0.8-HOVED-PC-ACCEPTANCE.ps1 -SelfTest
          if($LASTEXITCODE -ne 0){throw 'v0.8 acceptance contract failed under Windows PowerShell 5.1'}

      - name: Immutable fixed-source pin
        shell: powershell
        run: |
          $pin='52377464195ac9a56bb7853cacd26a3faaaf22bd'
          $one=Get-Content .\RAH-OS-v0.8-HOVED-PC-ONE-CLICK.cmd -Raw
          $installer=Get-Content .\INSTALL-RAH-OS-v0.8.cmd -Raw
          if($one -notmatch [regex]::Escape($pin)){throw 'One-click is not pinned to the fixed v0.8 snapshot.'}
          if($installer -notmatch [regex]::Escape($pin)){throw 'Installer default is not pinned to the fixed v0.8 snapshot.'}
          if($one -match 'rah-os-v0\.8-consolidation' -or $installer -match 'rah-os-v0\.8-consolidation'){throw 'Old pre-fix v0.8 source branch is still referenced.'}
          Write-Host 'SOURCE PIN PASS'

      - name: CMD contract
        shell: powershell
        run: |
          foreach($f in @('RAH-OS-v0.8-HOVED-PC-ONE-CLICK.cmd','START-HER-RAH-OS-v0.8.cmd','INSTALL-RAH-OS-v0.8.cmd','REPAIR-RAH-OS-v0.8.cmd','RUN-RAH-OS-v0.8-HOVED-PC-ACCEPTANCE.cmd')){
            $t=Get-Content $f -Raw
            if($t -notmatch '@echo off'){throw "$f is not a CMD entry point"}
            if($t -match '(?i)\bdiskpart\b|\bformat\s+[A-Z]:'){throw "$f contains a forbidden disk-write command"}
            Write-Host "CMD PASS $f"
          }
