name: Build Raven 2.0.28 Handoff Recall

on:
  push:
    branches: [raven-2.0.28-handoff-recall]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: raven-2.0.28-handoff-recall
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Raven 2.0.28
        run: python .github/scripts/build_raven_2_0_28.py
      - name: Check inline Core JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('RAH-RAVEN-CORE-DEMO.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:[^>]*)>([\s\S]*?)</script>',html)
          Path('/tmp/raven-core-2-0-28.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/raven-core-2-0-28.js
      - name: Test Handoff Recall and Raven semantics
        run: |
          node tests/raven-chatgpt-handoff-recall.test.mjs
          node tests/raven-chatgpt-handoff-history-lite.test.mjs
          node tests/raven-chatgpt-handoff-receipt.test.mjs
          node tests/raven-chatgpt-handoff-resume.test.mjs
          node tests/raven-chatgpt-handoff-session.test.mjs
          node tests/raven-chatgpt-handoff-source-return.test.mjs
          node tests/raven-core-demo.test.mjs
          node tests/raven-core-context.test.mjs
          node tests/raven-core-chatgpt-status.test.mjs
          node tests/raven-core-chatgpt-handoff-center.test.mjs
          node tests/raven-checkpoint-policy.test.mjs
          node tests/raven-now-v2.test.mjs
          node tests/raven-mission-control.test.mjs
          node tests/raven-project-focus.test.mjs
          node tests/raven-vision-core.test.mjs
      - name: Commit tested runtime
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add RAH-RAVEN-CORE-DEMO.html RAH-RAVEN-VERSION.json tests/*.mjs
          git commit -m "Add Handoff Recall for Raven 2.0.28"
          git push origin HEAD:raven-2.0.28-handoff-recall
