name: Build RAH AI Photos v0.2 Local AI Metadata

on:
  push:
    branches:
      - rah-ai-photos-v0.2-local-ai
    paths:
      - '.github/workflows/build-rah-ai-photos-v0.2.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rah-ai-photos-v0.2-local-ai
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build v0.2
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          html_path=Path('RAH-AI-PHOTOS.html')
          html=html_path.read_text(encoding='utf-8')
          assert 'Golden Gallery v0.1' in html
          html=html.replace('RAH AI Photos · Golden Gallery v0.1','RAH AI Photos · Golden Gallery v0.2')
          html=html.replace('GOLDEN GALLERY · v0.1','GOLDEN GALLERY · v0.2')
          html=html.replace('Golden Gallery bruker ingen ekstern server i denne versjonen. Ingen bilder sendes automatisk noe sted. Senere AI-analyse skal kobles til eksplisitt og lokalt.','Golden Gallery sender ingenting automatisk. Lokal AI kan bare kontaktes på denne maskinen og bare etter et eksplisitt klikk. Forslag blir ikke lagret på bildet før du velger BRUK FORSLAG.')
          html=html.replace('<div><div class="label">TAGS · KOMMASEPARERT</div><input class="field" id="editorTags" placeholder="natur, tromsø, raven" /></div>','<div><div class="label">BESKRIVELSE</div><textarea class="field" id="editorDescription" rows="3" placeholder="Kort beskrivelse av bildet"></textarea></div>\n    <div><div class="label">TAGS · KOMMASEPARERT</div><input class="field" id="editorTags" placeholder="natur, tromsø, raven" /></div>\n    <section class="ai-panel" id="aiPanel"><div class="label">LOKAL AI · MANUELL</div><div class="ai-grid"><input class="field" id="aiEndpoint" value="http://127.0.0.1:1234/v1" spellcheck="false" aria-label="Lokal AI-adresse" /><select class="field" id="aiModel" aria-label="Lokal AI-modell"><option value="">Ingen modell valgt</option></select></div><div class="ai-actions"><button class="btn" id="aiTest">TEST LOKAL AI</button><button class="btn primary" id="aiAnalyze">ANALYSER LOKALT</button></div><div class="small" id="aiStatus">Ingen AI-kall er gjort.</div><div class="ai-suggestion hidden" id="aiSuggestion"><div class="label">FORSLAG · IKKE LAGRET</div><p id="aiDescription"></p><div class="tags" id="aiTags"></div><button class="btn" id="aiApply">BRUK FORSLAG</button></div></section>')
          html=html.replace('.dialog-foot{display:flex;justify-content:space-between;gap:10px;padding:16px 20px;border-top:1px solid #302819}.right{display:flex;gap:8px}.hidden{display:none!important}', '.dialog-foot{display:flex;justify-content:space-between;gap:10px;padding:16px 20px;border-top:1px solid #302819}.right{display:flex;gap:8px}.hidden{display:none!important}.ai-panel{border:1px solid #4a3a1c;background:#0a0907;border-radius:13px;padding:12px}.ai-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:8px;margin-top:7px}.ai-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.ai-suggestion{margin-top:10px;border-top:1px solid #33291a;padding-top:10px}.ai-suggestion p{margin:6px 0 8px;line-height:1.45;color:#d8cfbb}textarea.field{resize:vertical;min-height:72px}')
          html=html.replace('<script src="rah-ai-photos.js"></script>','<script src="rah-ai-photos-local-ai.js"></script>\n<script src="rah-ai-photos.js"></script>')
          html_path.write_text(html,encoding='utf-8')

          module=Path('rah-ai-photos-local-ai.js')
          module.write_text(r'''(()=>{
  'use strict';
  const DEFAULT_ENDPOINT='http://127.0.0.1:1234/v1';
  const SETTINGS_KEY='rah-ai-photos-local-ai-v1';
  const ALLOWED_HOSTS=new Set(['127.0.0.1','localhost','[::1]','::1']);
  function normalizeEndpoint(value){
    const raw=String(value||DEFAULT_ENDPOINT).trim()||DEFAULT_ENDPOINT;
    let url;try{url=new URL(raw);}catch{throw new Error('Ugyldig lokal AI-adresse.');}
    if(url.protocol!=='http:'&&url.protocol!=='https:')throw new Error('Lokal AI må bruke http eller https.');
    if(!ALLOWED_HOSTS.has(url.hostname))throw new Error('Bare lokal AI på denne maskinen er tillatt.');
    url.search='';url.hash='';let path=url.pathname.replace(/\/+$/,'');if(!/\/v1$/i.test(path))path=`${path}/v1`.replace(/\/+/g,'/');url.pathname=path;return url.toString().replace(/\/$/,'');
  }
  function loadSettings(){try{const saved=JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}');return {endpoint:normalizeEndpoint(saved.endpoint||DEFAULT_ENDPOINT),model:String(saved.model||'')};}catch{return {endpoint:DEFAULT_ENDPOINT,model:''};}}
  function saveSettings(endpoint,model){const settings={endpoint:normalizeEndpoint(endpoint),model:String(model||'')};localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));return Object.freeze({...settings});}
  function friendlyError(error){const text=String(error?.message||error||'ukjent feil');if(/failed to fetch|networkerror|load failed|fetch/i.test(text))return 'Lokal AI svarer ikke. Start LM Studio Local Server og kontroller at CORS er aktivert.';return text;}
  async function fetchJson(url,options={}){const target=new URL(url);if(!ALLOWED_HOSTS.has(target.hostname))throw new Error('Eksterne AI-adresser er blokkert.');let response;try{response=await fetch(target.toString(),{cache:'no-store',...options});}catch(error){throw new Error(friendlyError(error));}if(!response.ok){const body=await response.text().catch(()=> '');throw new Error(`${response.status} ${response.statusText}${body?`: ${body.slice(0,240)}`:''}`);}try{return await response.json();}catch{throw new Error('Lokal AI returnerte ugyldig JSON.');}}
  async function discoverModels(endpoint){const base=normalizeEndpoint(endpoint);const payload=await fetchJson(`${base}/models`);const models=Array.isArray(payload.data)?payload.data.filter(x=>x?.id).map(x=>String(x.id)):[];if(!models.length)throw new Error('Lokal AI svarer, men ingen modell er lastet inn.');return Object.freeze(models);}
  function parseSuggestion(text){const raw=String(text||'').trim();const cleaned=raw.replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'');const first=cleaned.indexOf('{'),last=cleaned.lastIndexOf('}');if(first<0||last<first)throw new Error('Modellen returnerte ikke et JSON-forslag.');let data;try{data=JSON.parse(cleaned.slice(first,last+1));}catch{throw new Error('Kunne ikke lese AI-forslaget som JSON.');}const description=String(data.description||'').trim().slice(0,1200);const tags=[...new Set((Array.isArray(data.tags)?data.tags:[]).map(x=>String(x).trim()).filter(Boolean))].slice(0,20);if(!description&&!tags.length)throw new Error('AI-forslaget var tomt.');return Object.freeze({description,tags:Object.freeze(tags)});}
  async function analyzeImage({endpoint,model,imageData,signal}){const base=normalizeEndpoint(endpoint);const selected=String(model||'').trim();if(!selected)throw new Error('Velg en lokal AI-modell først.');if(!String(imageData||'').startsWith('data:image/'))throw new Error('Valgt bilde kunne ikke klargjøres for lokal analyse.');const payload=await fetchJson(`${base}/chat/completions`,{method:'POST',signal,headers:{'Content-Type':'application/json'},body:JSON.stringify({model:selected,temperature:0.1,max_tokens:700,messages:[{role:'system',content:'Du lager metadata for et privat lokalt fotobibliotek. Svar KUN som JSON med feltene description og tags. description skal være en kort nøktern beskrivelse på norsk. tags skal være en JSON-liste med korte søkeord. Ikke identifiser personer ved navn og ikke gjett sensitiv informasjon.'},{role:'user',content:[{type:'text',text:'Beskriv dette bildet for et lokalt bildebibliotek og foreslå 3–10 nyttige tags. Returner kun JSON.'},{type:'image_url',image_url:{url:imageData}}]}]})});const answer=payload?.choices?.[0]?.message?.content;if(!answer)throw new Error('Modellen returnerte ikke et lesbart svar. Kontroller at modellen støtter bilder.');return parseSuggestion(answer);}
  function blobToDataUrl(blob,maxBytes=15*1024*1024){if(!blob||!String(blob.type||'').startsWith('image/'))return Promise.reject(new Error('Ingen gyldig bildefil valgt.'));if(Number(blob.size||0)>maxBytes)return Promise.reject(new Error('Bildet er for stort for lokal AI-analyse. Maks 15 MB.'));return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result||''));reader.onerror=()=>reject(new Error('Kunne ikke lese bildet for lokal AI-analyse.'));reader.readAsDataURL(blob);});}
  window.RAHPhotosLocalAI=Object.freeze({DEFAULT_ENDPOINT,normalizeEndpoint,loadSettings,saveSettings,discoverModels,analyzeImage,blobToDataUrl,parseSuggestion,friendlyError});
})();
''',encoding='utf-8')

          js_path=Path('rah-ai-photos.js');js=js_path.read_text(encoding='utf-8')
          js=js.replace("  let activeId=null;\n  const state={photos:[],query:'',album:'all',favoritesOnly:false};", "  let activeId=null;\n  let aiSuggestion=null;\n  let aiAbort=null;\n  const state={photos:[],query:'',album:'all',favoritesOnly:false};")
          js=js.replace("    editorPreview:$('editorPreview'),editorTitle:$('editorTitle'),editorAlbum:$('editorAlbum'),editorTags:$('editorTags'),\n    editorFavorite:$('editorFavorite'),editorInfo:$('editorInfo'),deletePhoto:$('deletePhoto'),downloadPhoto:$('downloadPhoto'),savePhoto:$('savePhoto')", "    editorPreview:$('editorPreview'),editorTitle:$('editorTitle'),editorAlbum:$('editorAlbum'),editorDescription:$('editorDescription'),editorTags:$('editorTags'),\n    editorFavorite:$('editorFavorite'),editorInfo:$('editorInfo'),deletePhoto:$('deletePhoto'),downloadPhoto:$('downloadPhoto'),savePhoto:$('savePhoto'),\n    aiEndpoint:$('aiEndpoint'),aiModel:$('aiModel'),aiTest:$('aiTest'),aiAnalyze:$('aiAnalyze'),aiStatus:$('aiStatus'),aiSuggestion:$('aiSuggestion'),aiDescription:$('aiDescription'),aiTags:$('aiTags'),aiApply:$('aiApply')")
          js=js.replace("        return [p.name,p.title,p.album,...(p.tags||[])].join(' ').toLocaleLowerCase('no').includes(q);", "        return [p.name,p.title,p.album,p.description||'',...(p.tags||[])].join(' ').toLocaleLowerCase('no').includes(q);")
          js=js.replace("        importedAt:new Date().toISOString(),album:'Inbox',tags:[],favorite:false,blob:file", "        importedAt:new Date().toISOString(),album:'Inbox',description:'',tags:[],favorite:false,blob:file")
          js=js.replace("    ui.editorAlbum.value=photo.album||'Inbox';\n    ui.editorTags.value=(photo.tags||[]).join(', ');", "    ui.editorAlbum.value=photo.album||'Inbox';\n    ui.editorDescription.value=photo.description||'';\n    ui.editorTags.value=(photo.tags||[]).join(', ');\n    resetAiSuggestion();")
          js=js.replace("    photo.album=ui.editorAlbum.value.trim()||'Inbox';\n    photo.tags=cleanTags(ui.editorTags.value);", "    photo.album=ui.editorAlbum.value.trim()||'Inbox';\n    photo.description=ui.editorDescription.value.trim().slice(0,1200);\n    photo.tags=cleanTags(ui.editorTags.value);")
          anchor="\n  async function saveActive(){";assert anchor in js
          ai_code=r'''

  function resetAiSuggestion(){aiSuggestion=null;ui.aiSuggestion.classList.add('hidden');ui.aiDescription.textContent='';ui.aiTags.innerHTML='';ui.aiStatus.textContent='Ingen AI-kall er gjort for dette bildet.';}
  function renderAiSuggestion(value){aiSuggestion=value;ui.aiDescription.textContent=value.description||'Ingen beskrivelse foreslått.';ui.aiTags.innerHTML=(value.tags||[]).map(tag=>`<span class="tag">${escapeHtml(tag)}</span>`).join('');ui.aiSuggestion.classList.remove('hidden');}
  async function testLocalAi(){const ai=window.RAHPhotosLocalAI;if(!ai){ui.aiStatus.textContent='Lokal AI-modul mangler.';return;}ui.aiTest.disabled=true;ui.aiStatus.textContent='Tester lokal AI…';try{const models=await ai.discoverModels(ui.aiEndpoint.value);const saved=ai.loadSettings();ui.aiModel.innerHTML=models.map(model=>`<option value="${escapeHtml(model)}">${escapeHtml(model)}</option>`).join('');ui.aiModel.value=models.includes(saved.model)?saved.model:models[0];const settings=ai.saveSettings(ui.aiEndpoint.value,ui.aiModel.value);ui.aiEndpoint.value=settings.endpoint;ui.aiStatus.textContent=`Lokal AI klar · ${models.length} modell${models.length===1?'':'er'} funnet.`;}catch(error){ui.aiModel.innerHTML='<option value="">Ingen modell tilgjengelig</option>';ui.aiStatus.textContent=ai.friendlyError(error);}finally{ui.aiTest.disabled=false;}}
  async function analyzeActive(){const ai=window.RAHPhotosLocalAI;const photo=state.photos.find(p=>p.id===activeId);if(!ai||!photo)return;if(aiAbort){aiAbort.abort();aiAbort=null;}ui.aiAnalyze.disabled=true;ui.aiStatus.textContent='Klargjør valgt bilde for lokal analyse…';try{let model=ui.aiModel.value;if(!model){const models=await ai.discoverModels(ui.aiEndpoint.value);ui.aiModel.innerHTML=models.map(item=>`<option value="${escapeHtml(item)}">${escapeHtml(item)}</option>`).join('');model=models[0];ui.aiModel.value=model;}const settings=ai.saveSettings(ui.aiEndpoint.value,model);ui.aiEndpoint.value=settings.endpoint;const imageData=await ai.blobToDataUrl(photo.blob);aiAbort=new AbortController();ui.aiStatus.textContent=`Analyserer lokalt med ${model}…`;const suggestion=await ai.analyzeImage({endpoint:settings.endpoint,model,imageData,signal:aiAbort.signal});renderAiSuggestion(suggestion);ui.aiStatus.textContent='Forslag klart. Ingenting er lagret på bildet ennå.';}catch(error){if(error?.name==='AbortError')ui.aiStatus.textContent='Lokal analyse stoppet.';else ui.aiStatus.textContent=ai.friendlyError(error);}finally{aiAbort=null;ui.aiAnalyze.disabled=false;}}
  function applyAiSuggestion(){if(!aiSuggestion)return;if(aiSuggestion.description)ui.editorDescription.value=aiSuggestion.description;if(aiSuggestion.tags?.length){const merged=cleanTags([ui.editorTags.value,...aiSuggestion.tags].filter(Boolean).join(','));ui.editorTags.value=merged.join(', ');}ui.aiStatus.textContent='Forslaget er lagt inn i feltene. Trykk LAGRE DETALJER for å lagre det på bildet.';}
'''
          js=js.replace(anchor,ai_code+anchor)
          js=js.replace("    ui.downloadPhoto.addEventListener('click',downloadActive);\n    ui.dialog.addEventListener('close',()=>{activeId=null;});", "    ui.downloadPhoto.addEventListener('click',downloadActive);\n    ui.aiTest.addEventListener('click',testLocalAi);\n    ui.aiAnalyze.addEventListener('click',analyzeActive);\n    ui.aiApply.addEventListener('click',applyAiSuggestion);\n    ui.dialog.addEventListener('close',()=>{if(aiAbort){aiAbort.abort();aiAbort=null;}activeId=null;aiSuggestion=null;});")
          js=js.replace("  async function start(){\n    bind();", "  async function start(){\n    bind();\n    const ai=window.RAHPhotosLocalAI;\n    if(ai){const saved=ai.loadSettings();ui.aiEndpoint.value=saved.endpoint;if(saved.model){ui.aiModel.innerHTML=`<option value=\"${escapeHtml(saved.model)}\">${escapeHtml(saved.model)}</option>`;ui.aiModel.value=saved.model;}}")
          js_path.write_text(js,encoding='utf-8')

          manifest_path=Path('RAH-AI-PHOTOS-VERSION.json');m=json.loads(manifest_path.read_text(encoding='utf-8'));assert m['version']=='0.1.0';m['version']='0.2.0';m['stage']='working-local-ai-prototype';m['features'].update({'description_metadata':True,'local_ai_metadata_suggestions':True,'local_ai_explicit_click_only':True,'local_ai_loopback_only':True,'local_ai_model_discovery':True,'local_ai_suggestion_requires_explicit_apply':True,'local_ai_settings_local_only':True,'network_calls':True,'network_scope':'loopback-only','automatic_ai_analysis':False,'external_upload':False});m['next_milestone']='1.0-stable-local-photo-library';manifest_path.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          Path('tests/rah-ai-photos.test.mjs').write_text(r'''import assert from 'node:assert/strict';import fs from 'node:fs';
const html=fs.readFileSync('RAH-AI-PHOTOS.html','utf8'),js=fs.readFileSync('rah-ai-photos.js','utf8'),ai=fs.readFileSync('rah-ai-photos-local-ai.js','utf8'),manifest=JSON.parse(fs.readFileSync('RAH-AI-PHOTOS-VERSION.json','utf8'));
assert.equal(manifest.product,'RAH AI Photos');assert.equal(manifest.edition,'Golden Gallery');assert.equal(manifest.version,'0.2.0');assert.equal(manifest.local_only,true);assert.equal(manifest.features.indexeddb_persistence,true);assert.equal(manifest.features.description_metadata,true);assert.equal(manifest.features.local_ai_metadata_suggestions,true);assert.equal(manifest.features.local_ai_explicit_click_only,true);assert.equal(manifest.features.local_ai_loopback_only,true);assert.equal(manifest.features.local_ai_suggestion_requires_explicit_apply,true);assert.equal(manifest.features.external_upload,false);assert.equal(manifest.features.network_calls,true);assert.equal(manifest.features.network_scope,'loopback-only');assert.equal(manifest.features.automatic_ai_analysis,false);
for(const marker of [/Golden Gallery v0\.2/,/id="editorDescription"/,/id="aiEndpoint"/,/id="aiModel"/,/id="aiTest"/,/id="aiAnalyze"/,/id="aiApply"/,/rah-ai-photos-local-ai\.js/,/rah-ai-photos\.js/])assert.match(html,marker);
assert.match(js,/indexedDB\.open\(DB_NAME,DB_VERSION\)/);assert.match(js,/description:''/);assert.match(js,/p\.description\|\|''/);assert.match(js,/async function analyzeActive\(\)/);assert.match(js,/function applyAiSuggestion\(\)/);assert.match(js,/ai\.blobToDataUrl\(photo\.blob\)/);assert.match(js,/ai\.analyzeImage\(/);assert.match(js,/ui\.aiApply\.addEventListener\('click',applyAiSuggestion\)/);assert.doesNotMatch(js,/fetch\s*\(/,'Main gallery runtime must not perform network calls directly.');
assert.match(ai,/DEFAULT_ENDPOINT='http:\/\/127\.0\.0\.1:1234\/v1'/);assert.match(ai,/ALLOWED_HOSTS=new Set/);assert.match(ai,/Bare lokal AI på denne maskinen er tillatt/);assert.match(ai,/Eksterne AI-adresser er blokkert/);assert.match(ai,/async function discoverModels\(endpoint\)/);assert.match(ai,/async function analyzeImage\(/);assert.match(ai,/function parseSuggestion\(text\)/);assert.match(ai,/fetch\(target\.toString\(\)/);assert.doesNotMatch(ai,/setInterval/);
const importBody=js.slice(js.indexOf('async function importFiles'),js.indexOf('async function toggleFavorite'));assert.doesNotMatch(importBody,/analyzeImage|discoverModels|fetch\s*\(/,'Import must never trigger AI.');const openBody=js.slice(js.indexOf('function openEditor'),js.indexOf('function resetAiSuggestion'));assert.doesNotMatch(openBody,/analyzeImage|discoverModels|fetch\s*\(/,'Opening editor must never trigger AI.');
console.log('RAH AI Photos Golden Gallery v0.2: explicit loopback-only AI metadata suggestions with explicit apply OK.');
''',encoding='utf-8')
          PY
      - name: Validate v0.2
        run: |
          node --check rah-ai-photos.js
          node --check rah-ai-photos-local-ai.js
          node tests/rah-ai-photos.test.mjs
      - name: Commit v0.2 runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RAH-AI-PHOTOS.html rah-ai-photos.js rah-ai-photos-local-ai.js RAH-AI-PHOTOS-VERSION.json tests/rah-ai-photos.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Add RAH AI Photos v0.2 local AI metadata'
          git push origin HEAD:rah-ai-photos-v0.2-local-ai
