name: Build RAH AI Photos v0.2 Local AI Metadata

on:
  push:
    branches:
      - rah-ai-photos-v0.2-local-ai
    paths:
      - '.github/workflows/build-rah-ai-photos-v0.2.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rah-ai-photos-v0.2-local-ai
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build v0.2 runtime
        run: python .github/scripts/build_rah_ai_photos_v0_2.py
      - name: Validate v0.2 runtime
        run: |
          node --check rah-ai-photos.js
          node --check rah-ai-photos-local-ai.js
          node tests/rah-ai-photos.test.mjs
      - name: Commit v0.2 runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RAH-AI-PHOTOS.html rah-ai-photos.js rah-ai-photos-local-ai.js RAH-AI-PHOTOS-VERSION.json tests/rah-ai-photos.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Add RAH AI Photos v0.2 local AI metadata'
          git push origin HEAD:rah-ai-photos-v0.2-local-ai
