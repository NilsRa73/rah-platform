name: Validate RAH Case Center v1.6

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop-bridge/server_v16.py"
      - "desktop-bridge/test_case_v16.py"
      - "desktop-bridge/requirements.txt"
      - ".github/workflows/validate-case-center-v16.yml"
  pull_request:
    paths:
      - "desktop-bridge/server_v16.py"
      - "desktop-bridge/test_case_v16.py"
      - "desktop-bridge/requirements.txt"
      - ".github/workflows/validate-case-center-v16.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: desktop-bridge/requirements.txt

      - name: Install bridge dependencies
        run: python -m pip install -r desktop-bridge/requirements.txt

      - name: Compile bridge
        run: python -m py_compile desktop-bridge/server_v16.py

      - name: Run Case Center tests
        working-directory: desktop-bridge
        run: python -m unittest -v test_case_v16.py
