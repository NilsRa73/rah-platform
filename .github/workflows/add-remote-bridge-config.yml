name: Validate RAH Vision v1.4 Legacy Local Boundary

on:
  workflow_dispatch:
  push:
    paths:
      - 'vision-module.js'
      - 'vision.html'
      - 'tests/vision-module-local-boundary.test.mjs'
      - '.github/workflows/add-remote-bridge-config.yml'
  pull_request:
    paths:
      - 'vision-module.js'
      - 'vision.html'
      - 'tests/vision-module-local-boundary.test.mjs'
      - '.github/workflows/add-remote-bridge-config.yml'

permissions:
  contents: read

jobs:
  validate-vision:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check vision-module.js
      - name: Check active legacy full-page Vision JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('vision.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:[^>]*)>([\s\S]*?)</script>',html)
          assert scripts, 'vision.html contains no inline JavaScript'
          Path('/tmp/vision-html.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/vision-html.js
      - name: Validate Vision v1.4 compatibility controls
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'const DEFAULT_ENDPOINT = "http://127.0.0.1:1234/v1";' vision-module.js
          grep -Fq 'const LOOPBACK_HOSTS = new Set(["127.0.0.1", "localhost", "[::1]", "::1"]);' vision-module.js
          grep -Fq 'const SETTINGS_KEY = "rah-raven-vision-settings-v1";' vision-module.js
          grep -Fq 'id="rahVisionEndpoint"' vision-module.js
          grep -Fq 'id="rahTestVision"' vision-module.js
          grep -Fq 'id="rahSaveVisionSettings"' vision-module.js
          grep -Fq '`${base}/models`' vision-module.js
          grep -Fq '`${base}/chat/completions`' vision-module.js
          grep -Fq 'Ingen skjult skjermopptak eller bakgrunnsfangst.' vision-module.js
      - name: Validate legacy Vision loopback-only network boundary
        run: node tests/vision-module-local-boundary.test.mjs
