name: Validate RAH Raven 2-PC Grid

on:
  pull_request:
    paths:
      - 'RAH-2PC-CLIENT.ps1'
      - 'RAH-2PC-ACCEPTANCE.ps1'
      - 'RAH-HARDWARE-INVENTORY.ps1'
      - 'RAH-HARDWARE-REGISTRY.ps1'
      - 'RAH-RAVEN-2PC-GUI.ps1'
      - 'START-HER-RAH-2PC-GRID.cmd'
      - 'INSTALL-RAH-2PC-GRID.cmd'
      - 'VERIFY-RAH-2PC-GRID.cmd'
      - 'COMPLETE-RAH-2PC-GRID.cmd'
      - 'RAH-2PC-GRID.md'
      - 'INSTALL-RAH-AI-FABRIC.ps1'
      - 'desktop-bridge/agent_runner.py'
      - 'desktop-bridge/raven_jobs.py'
      - 'desktop-bridge/anythingllm_approval.py'
      - 'desktop-bridge/test_agent_runner.py'
      - 'apps/rah-raven-daily-driver/devices.py'
      - 'tests/test_rah_2pc_grid_contract.py'
      - '.github/workflows/validate-rah-2pc-grid.yml'
  push:
    branches: [ main ]
    paths:
      - 'RAH-2PC-CLIENT.ps1'
      - 'RAH-2PC-ACCEPTANCE.ps1'
      - 'RAH-HARDWARE-INVENTORY.ps1'
      - 'RAH-HARDWARE-REGISTRY.ps1'
      - 'RAH-RAVEN-2PC-GUI.ps1'
      - 'START-HER-RAH-2PC-GRID.cmd'
      - 'INSTALL-RAH-2PC-GRID.cmd'
      - 'VERIFY-RAH-2PC-GRID.cmd'
      - 'COMPLETE-RAH-2PC-GRID.cmd'
      - 'RAH-2PC-GRID.md'
      - 'INSTALL-RAH-AI-FABRIC.ps1'
      - 'desktop-bridge/agent_runner.py'
      - 'desktop-bridge/raven_jobs.py'
      - 'desktop-bridge/anythingllm_approval.py'
      - 'desktop-bridge/test_agent_runner.py'
      - 'apps/rah-raven-daily-driver/devices.py'
      - 'tests/test_rah_2pc_grid_contract.py'
      - '.github/workflows/validate-rah-2pc-grid.yml'

permissions:
  contents: read

jobs:
  windows-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Python source syntax
        shell: pwsh
        run: python -m py_compile desktop-bridge/agent_runner.py desktop-bridge/raven_jobs.py desktop-bridge/anythingllm_approval.py desktop-bridge/test_agent_runner.py apps/rah-raven-daily-driver/devices.py tests/test_rah_2pc_grid_contract.py

      - name: Static authority and package contract
        shell: pwsh
        run: python tests/test_rah_2pc_grid_contract.py

      - name: PowerShell source parse
        shell: powershell
        run: |
          $files=@(
            'RAH-2PC-CLIENT.ps1',
            'RAH-2PC-ACCEPTANCE.ps1',
            'RAH-HARDWARE-INVENTORY.ps1',
            'RAH-HARDWARE-REGISTRY.ps1',
            'RAH-RAVEN-2PC-GUI.ps1'
          )
          foreach($file in $files){
            $errors=$null
            $tokens=$null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if($errors.Count){
              $errors | ForEach-Object { Write-Error ($file + ': ' + $_.Message) }
              exit 1
            }
          }
          Write-Host 'PASS: all PowerShell sources parse'

      - name: PowerShell HMAC client self-test
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\RAH-2PC-CLIENT.ps1 -SelfTest

      - name: PowerShell final acceptance self-test
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\RAH-2PC-ACCEPTANCE.ps1 -SelfTest

      - name: Detailed hardware inventory self-test
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\RAH-HARDWARE-INVENTORY.ps1 -SelfTest

      - name: Persistent hardware registry self-test
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\RAH-HARDWARE-REGISTRY.ps1 -SelfTest

      - name: GUI self-test entry
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\RAH-RAVEN-2PC-GUI.ps1 -SelfTest
