name: Validate Raven Care Hub v0.6 Stable

on:
  push:
    branches: [agent/raven-care-hub-v06-stable-promotion, main]
    paths:
      - 'RAH-RAVEN-CARE-HUB.html'
      - 'RAH-RAVEN-CARE-HUB-VERSION.json'
      - 'RAH-RAVEN-CARE-HUB-V0.6-STABLE-RELEASE.json'
      - 'tests/raven-care-hub-v0.6-stable.test.mjs'
      - 'tests/raven-care-hub-v0.6-stable-readiness.test.mjs'
      - 'tests/raven-care-hub-v0.5-stable.test.mjs'
      - 'tests/raven-project-registry-v0.1.test.mjs'
      - '.github/workflows/validate-raven-care-hub-v0.5-stable.yml'
      - '.github/workflows/validate-raven-care-hub-v0.6-stable-readiness.yml'
      - '.github/workflows/validate-raven-care-hub-v0.6-stable.yml'
  pull_request:
    paths:
      - 'RAH-RAVEN-CARE-HUB.html'
      - 'RAH-RAVEN-CARE-HUB-VERSION.json'
      - 'RAH-RAVEN-CARE-HUB-V0.6-STABLE-RELEASE.json'
      - 'tests/raven-care-hub-v0.6-stable.test.mjs'
      - 'tests/raven-care-hub-v0.6-stable-readiness.test.mjs'
      - 'tests/raven-care-hub-v0.5-stable.test.mjs'
      - 'tests/raven-project-registry-v0.1.test.mjs'
      - '.github/workflows/validate-raven-care-hub-v0.5-stable.yml'
      - '.github/workflows/validate-raven-care-hub-v0.6-stable-readiness.yml'
      - '.github/workflows/validate-raven-care-hub-v0.6-stable.yml'

permissions:
  contents: read

jobs:
  stable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate canonical Care Hub v0.6 Stable release
        run: node tests/raven-care-hub-v0.6-stable.test.mjs
      - name: Preserve v0.6 functional Candidate boundary
        run: node tests/raven-care-hub-v0.6-candidate.test.mjs
      - name: Preserve historical v0.6 readiness
        run: node tests/raven-care-hub-v0.6-stable-readiness.test.mjs
      - name: Preserve historical v0.5 Stable rollback
        run: node tests/raven-care-hub-v0.5-stable.test.mjs
      - name: Preserve v0.5 readiness and v0.4 rollback history
        run: |
          node tests/raven-care-hub-v0.5-stable-readiness.test.mjs
          node tests/raven-care-hub-v0.4.test.mjs
      - name: Preserve Health & Fatigue v0.2 Stable
        run: node tests/raven-health-fatigue-v0.2.test.mjs
      - name: Preserve Case Center v1.6 Stable
        run: node tests/raven-case-center-v16.test.mjs
      - name: Preserve Fristvakt v0.2 Stable
        run: node tests/raven-fristvakt-v0.2.test.mjs
      - name: Preserve Fastlegevisning v0.3 Stable
        run: node tests/raven-fastlege-v0.3.test.mjs
      - name: Preserve Raven Care v0.1 Stable
        run: node tests/raven-care-v0.1.test.mjs
      - name: Sync Project Registry Care Hub dependency pin only
        run: node tests/raven-project-registry-v0.1.test.mjs
      - name: Preserve Raven 2.0.32 Stable release gate
        run: node tests/raven-release-gate.test.mjs
      - name: Require exact Stable promotion PR scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          printf '%s\n' "$changed"
          allowed='^(RAH-RAVEN-CARE-HUB\.html|RAH-RAVEN-CARE-HUB-VERSION\.json|RAH-RAVEN-CARE-HUB-V0\.6-STABLE-RELEASE\.json|tests/raven-care-hub-v0\.6-stable\.test\.mjs|tests/raven-care-hub-v0\.6-stable-readiness\.test\.mjs|tests/raven-care-hub-v0\.5-stable\.test\.mjs|tests/raven-project-registry-v0\.1\.test\.mjs|\.github/workflows/validate-raven-care-hub-v0\.5-stable\.yml|\.github/workflows/validate-raven-care-hub-v0\.6-stable-readiness\.yml|\.github/workflows/validate-raven-care-hub-v0\.6-stable\.yml)$'
          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          if [ -n "$bad" ]; then
            echo 'Unexpected file outside exact Care Hub v0.6 Stable promotion scope:'
            printf '%s\n' "$bad"
            exit 1
          fi
          runtime_changed="$(printf '%s\n' "$changed" | grep -E '^RAH-RAVEN-CARE-HUB(\.html|-VERSION\.json)$' | wc -l)"
          test "$runtime_changed" -eq 2 || { echo "Expected exactly two canonical runtime files changed, got $runtime_changed"; exit 1; }
          for f in RAH-RAVEN-CARE-HUB-V0.6-CANDIDATE.html RAH-RAVEN-CARE-HUB-V0.6-CANDIDATE.json RAH-RAVEN-CARE-HUB-V0.6-STABLE-READINESS.json RAH-RAVEN-CARE-HUB-V0.5-STABLE.html RAH-RAVEN-CARE-HUB-V0.5-STABLE.json RAH-RAVEN-CARE-HUB-V0.5-STABLE-RELEASE.json RAH-RAVEN-CARE-HUB-V0.5-CANDIDATE.html RAH-RAVEN-CARE-HUB-V0.5-CANDIDATE.json RAH-RAVEN-HEALTH-FATIGUE.html RAH-RAVEN-HEALTH-FATIGUE-VERSION.json RAH-RAVEN-CASE-CENTER.html RAH-RAVEN-CASE-CENTER-VERSION.json RAH-RAVEN-FRISTVAKT.html RAH-RAVEN-FRISTVAKT-VERSION.json RAH-RAVEN-FASTLEGE.html RAH-RAVEN-FASTLEGE-VERSION.json RAH-RAVEN-CARE.html RAH-RAVEN-CARE-VERSION.json RAH-RAVEN-PROJECT-REGISTRY.html RAH-RAVEN-PROJECT-REGISTRY-VERSION.json RAH-RAVEN-VERSION.json RAH-COMMAND-CENTER-V2.1.html rah-command-center-core-v2.1.js rah-node-agent-v1.3.py; do
            if printf '%s\n' "$changed" | grep -Fxq "$f"; then
              echo "Forbidden runtime/evidence changed during v0.6 Stable promotion: $f"
              exit 1
            fi
          done
