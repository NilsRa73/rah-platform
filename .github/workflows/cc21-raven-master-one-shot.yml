name: CC 2.1 Raven Master One-Shot
on:
  push:
    branches: ['agent/cc21-raven-master-sync']
    paths:
      - 'tools/cc21-raven-master-migrate.mjs'
      - '.github/workflows/cc21-raven-master-one-shot.yml'
permissions:
  contents: write
jobs:
  migrate:
    if: github.ref_name == 'agent/cc21-raven-master-sync'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cc21-raven-master-sync
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Require fully gated canonical CC 2.1 source
        run: |
          test "$(git rev-parse HEAD:RAH-COMMAND-CENTER-VERSION.json)" = "$(git rev-parse origin/main:RAH-COMMAND-CENTER-VERSION.json)"
          test "$(git rev-parse HEAD:RAH-CC21-NODE13-STABLE-RELEASE.json)" = "$(git rev-parse origin/main:RAH-CC21-NODE13-STABLE-RELEASE.json)"
          node --test tests/rah-command-center-packaging.test.mjs
          node --test tests/rah-cc21-fleet-snapshot.test.mjs
          node --test tests/rah-cc21-stable-release.test.mjs
          python3 -m unittest tests/test_rah_node_agent_stable_v13.py -v
          node --test tests/raven-release-gate.test.mjs
      - name: Apply deterministic Raven master metadata migration
        run: node tools/cc21-raven-master-migrate.mjs
      - name: Validate Raven freeze remains unchanged before commit
        run: |
          node -e "const r=require('./RAH-RAVEN-VERSION.json');if(r.version!=='2.0.32'||r.release_gate.stage!=='temporary-stable'||r.release_gate.development_paused!==true||r.privacy.command_center_canonical_version!=='2.1.0'||r.privacy.command_center_canonical_package_generation!==6||r.privacy.command_center_canonical_package_dependency_count!==49)process.exit(1)"
          node --test tests/raven-release-gate.test.mjs
      - name: Commit only Raven master metadata to migration branch
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = 'agent/cc21-raven-master-sync'
          git config user.name 'RAH Raven Master Gate'
          git config user.email 'actions@users.noreply.github.com'
          git add RAH-RAVEN-VERSION.json
          test "$(git diff --name-only --cached)" = 'RAH-RAVEN-VERSION.json'
          git commit -m 'RAH Raven master — sync canonical Command Center v2.1 metadata'
          git push origin HEAD:agent/cc21-raven-master-sync
