name: Validate Raven Studio v2.9 Legacy Acceptance Compatibility

on:
  pull_request:
    paths:
      - 'ACCEPT-RAH-RAVEN-STUDIO-2.9-CANDIDATE.bat'
      - 'ACCEPT-RAH-RAVEN-STUDIO-2.9-CANDIDATE.ps1'
      - 'RAH-RAVEN-STUDIO-V2.9-CANDIDATE.json'
      - 'RAH-RAVEN-STUDIO-V3.0.json'
      - 'RAH-RAVEN-STUDIO-FINAL.ps1'
      - 'START-HER-RAH-RAVEN-STUDIO.cmd'
      - 'tests/raven-studio-v2.9-owned-machine-acceptance.test.mjs'
      - '.github/workflows/validate-raven-studio-v2.9-owned-machine-acceptance.yml'
  push:
    branches: [main]
    paths:
      - 'ACCEPT-RAH-RAVEN-STUDIO-2.9-CANDIDATE.bat'
      - 'ACCEPT-RAH-RAVEN-STUDIO-2.9-CANDIDATE.ps1'
      - 'RAH-RAVEN-STUDIO-V2.9-CANDIDATE.json'
      - 'RAH-RAVEN-STUDIO-V3.0.json'
      - 'RAH-RAVEN-STUDIO-FINAL.ps1'
      - 'START-HER-RAH-RAVEN-STUDIO.cmd'
      - 'tests/raven-studio-v2.9-owned-machine-acceptance.test.mjs'
      - '.github/workflows/validate-raven-studio-v2.9-owned-machine-acceptance.yml'

permissions:
  contents: read

jobs:
  static-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate fixed legacy-to-Stable handoff
        run: node --test tests/raven-studio-v2.9-owned-machine-acceptance.test.mjs

  windows-compatibility:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Parse compatibility PowerShell
        shell: pwsh
        run: |
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile(
            'ACCEPT-RAH-RAVEN-STUDIO-2.9-CANDIDATE.ps1',
            [ref]$null,[ref]$errors
          )|Out-Null
          if($errors.Count){$errors|Format-List;exit 1}
      - name: Run old Studio 2.9 launcher through Studio 3.0 finalizer self-test
        shell: cmd
        run: call ACCEPT-RAH-RAVEN-STUDIO-2.9-CANDIDATE.bat --self-test
