name: Validate Raven Now v2

on:
  push:
    branches: [main]
    paths:
      - RAH-RAVEN-NOW-V2.html
      - RAH-RAVEN-START.html
      - RAH-RAVEN-CORE-DEMO.html
      - RAH-RAVEN-VISION-CORE.html
      - raven-checkpoint-policy.js
      - RAH-RAVEN-PROJECT.html
      - tests/raven-checkpoint-policy.test.mjs
      - tests/raven-now-v2.test.mjs
      - tests/raven-chatgpt-handoff-entry.test.mjs
      - tests/raven-chatgpt-handoff-source-return.test.mjs
      - tests/raven-chatgpt-handoff-resume.test.mjs
      - tests/raven-chatgpt-handoff-receipt.test.mjs
      - tests/raven-chatgpt-handoff-history-lite.test.mjs
      - tests/raven-project-focus.test.mjs
      - .github/workflows/validate-raven-now-v2.yml
  pull_request:
    paths:
      - RAH-RAVEN-NOW-V2.html
      - RAH-RAVEN-START.html
      - RAH-RAVEN-CORE-DEMO.html
      - RAH-RAVEN-VISION-CORE.html
      - raven-checkpoint-policy.js
      - RAH-RAVEN-PROJECT.html
      - tests/raven-checkpoint-policy.test.mjs
      - tests/raven-now-v2.test.mjs
      - tests/raven-chatgpt-handoff-entry.test.mjs
      - tests/raven-chatgpt-handoff-source-return.test.mjs
      - tests/raven-chatgpt-handoff-resume.test.mjs
      - tests/raven-chatgpt-handoff-receipt.test.mjs
      - tests/raven-chatgpt-handoff-history-lite.test.mjs
      - tests/raven-project-focus.test.mjs
      - .github/workflows/validate-raven-now-v2.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for file in ('RAH-RAVEN-NOW-V2.html','RAH-RAVEN-START.html','RAH-RAVEN-PROJECT.html','RAH-RAVEN-CORE-DEMO.html','RAH-RAVEN-VISION-CORE.html'):
              html = Path(file).read_text(encoding='utf-8')
              scripts = re.findall(r'<script(?:[^>]*)>([\s\S]*?)</script>', html)
              out = '/tmp/' + file.replace('.html','.js').lower()
              Path(out).write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/rah-raven-now-v2.js
          node --check /tmp/rah-raven-start.js
          node --check /tmp/rah-raven-project.js
          node --check /tmp/rah-raven-core-demo.js
          node --check /tmp/rah-raven-vision-core.js
          node --check raven-checkpoint-policy.js
      - name: Validate shared checkpoint policy
        run: node tests/raven-checkpoint-policy.test.mjs
      - name: Validate Raven Now v2 semantics
        run: node tests/raven-now-v2.test.mjs
      - name: Validate ChatGPT Handoff entries
        run: node tests/raven-chatgpt-handoff-entry.test.mjs
      - name: Validate source-aware Handoff return
        run: node tests/raven-chatgpt-handoff-source-return.test.mjs
      - name: Validate Handoff Resume
        run: node tests/raven-chatgpt-handoff-resume.test.mjs
      - name: Validate Handoff Receipt
        run: node tests/raven-chatgpt-handoff-receipt.test.mjs
      - name: Validate Handoff History Lite
        run: node tests/raven-chatgpt-handoff-history-lite.test.mjs
      - name: Validate Project Focus semantics
        run: node tests/raven-project-focus.test.mjs
