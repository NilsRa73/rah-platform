name: Validate Raven Daily Driver Stable

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/rah-raven-daily-driver/**"
      - "RAH-RAVEN-DAILY-DRIVER-VERSION.json"
      - "RAH-RAVEN-DAILY-DRIVER-PACKAGE.json"
      - "RAH-RAVEN-DAILY-DRIVER-FINAL.ps1"
      - "START-HER-RAH-RAVEN-DAILY-DRIVER.cmd"
      - "INSTALL-RAH-RAVEN.bat"
      - ".github/workflows/validate-raven-daily-driver.yml"
  pull_request:
    paths:
      - "apps/rah-raven-daily-driver/**"
      - "RAH-RAVEN-DAILY-DRIVER-VERSION.json"
      - "RAH-RAVEN-DAILY-DRIVER-PACKAGE.json"
      - "RAH-RAVEN-DAILY-DRIVER-FINAL.ps1"
      - "START-HER-RAH-RAVEN-DAILY-DRIVER.cmd"
      - ".github/workflows/validate-raven-daily-driver.yml"

permissions:
  contents: read

jobs:
  stable-contract:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        shell: pwsh
        run: python -m pip install -r apps/rah-raven-daily-driver/requirements.txt
      - name: Compile Python
        shell: pwsh
        run: |
          Get-ChildItem apps/rah-raven-daily-driver -Recurse -Filter *.py |
            Where-Object { $_.FullName -notmatch '\\.venv\\' } |
            ForEach-Object { python -m py_compile $_.FullName }
      - name: Stable manifest and authority contract
        shell: pwsh
        run: |
          $d=Get-Content RAH-RAVEN-DAILY-DRIVER-VERSION.json -Raw|ConvertFrom-Json
          $cc=Get-Content RAH-COMMAND-CENTER-VERSION.json -Raw|ConvertFrom-Json
          $pkg=Get-Content RAH-RAVEN-DAILY-DRIVER-PACKAGE.json -Raw|ConvertFrom-Json
          if($d.stage -ne 'stable' -or $d.version -ne '1.0.0'){throw 'Daily Driver is not Stable 1.0.0'}
          if($d.stable_gate.status -ne 'passed'){throw 'Stable gate not passed'}
          if($d.stable_command_center_reference -ne '2.4.0' -or $cc.version -ne '2.4.0' -or [int]$cc.canonical_package_generation -ne 9){throw 'CC2.4 generation 9 dependency drift'}
          if($d.stable_node_agent_reference -ne '1.4.0'){throw 'Node Agent 1.4 reference drift'}
          if($d.authority_delta -ne 'none'){throw 'Authority delta must remain none'}
          $b=$d.security_boundary
          if($b.shell -or $b.generic_process_execution -or $b.generic_file_api -or $b.native_remote_control -or $b.credential_attack_features){throw 'Forbidden Daily Driver authority enabled'}
          if($b.cloud_agent_enabled_by_default -or $b.cloud_response_storage){throw 'Cloud default/privacy boundary drift'}
          if($pkg.stage -ne 'stable-package' -or $pkg.packageFileCount -ne 39 -or @($pkg.packageFiles).Count -ne 39){throw 'Stable package closure drift'}
          if($pkg.runtimePolicy.candidateOnly -or -not $pkg.runtimePolicy.stablePromotionIncluded){throw 'Stable package lifecycle drift'}
      - name: Unit and smoke suite
        shell: pwsh
        run: python -m unittest discover -s apps/rah-raven-daily-driver/tests -p "test_*.py" -v
      - name: Deterministic runtime gate
        shell: pwsh
        run: |
          $env:RAH_DAILY_DRIVER_RUNTIME=Join-Path $env:RUNNER_TEMP 'rah-dd-runtime'
          python apps/rah-raven-daily-driver/runtime_check.py --output (Join-Path $env:RUNNER_TEMP 'runtime-gate.json')
          if($LASTEXITCODE -ne 0){throw 'Runtime gate failed'}
          $r=Get-Content (Join-Path $env:RUNNER_TEMP 'runtime-gate.json') -Raw|ConvertFrom-Json
          if($r.overall -ne 'PASS' -or $r.recommended_stage -ne 'Stable'){throw "Unexpected runtime result: $($r.overall) / $($r.recommended_stage)"}
      - name: Parse and self-test Stable finalizer
        shell: pwsh
        run: |
          $tokens=$null;$errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'RAH-RAVEN-DAILY-DRIVER-FINAL.ps1'),[ref]$tokens,[ref]$errors)
          if($errors.Count){$errors|Format-List|Out-String|Write-Host;throw 'Daily Driver finalizer parse failed'}
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File RAH-RAVEN-DAILY-DRIVER-FINAL.ps1 -SelfTest
          if($LASTEXITCODE -ne 0){throw 'Daily Driver finalizer self-test failed'}
      - name: One-click launcher markers
        shell: pwsh
        run: |
          $c=Get-Content START-HER-RAH-RAVEN-DAILY-DRIVER.cmd -Raw
          foreach($m in @('RAH-RAVEN-DAILY-DRIVER-FINAL.ps1','RAVEN-DAILY-DRIVER-FINAL-LATEST.json')){
            if(-not $c.Contains($m)){throw "START-HER missing $m"}
          }
