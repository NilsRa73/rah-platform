name: Validate Raven Download Manager

on:
  push:
    paths:
      - 'RAH-RAVEN-WHEEL.user.js'
      - 'RAH-RAVEN-DOWNLOADS.html'
      - 'desktop-bridge/download_manager.py'
      - 'desktop-bridge/raven_bridge.py'
      - 'desktop-bridge/test_raven_bridge_security.py'
      - 'tests/raven-download-manager.test.mjs'
      - '.github/workflows/validate-raven-download-manager.yml'
  pull_request:
    paths:
      - 'RAH-RAVEN-WHEEL.user.js'
      - 'RAH-RAVEN-DOWNLOADS.html'
      - 'desktop-bridge/download_manager.py'
      - 'desktop-bridge/raven_bridge.py'
      - 'desktop-bridge/test_raven_bridge_security.py'
      - 'tests/raven-download-manager.test.mjs'
      - '.github/workflows/validate-raven-download-manager.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Bridge dependencies
        run: python -m pip install --disable-pip-version-check -r desktop-bridge/requirements.txt
      - name: Validate Python syntax
        run: python -m py_compile desktop-bridge/download_manager.py desktop-bridge/raven_bridge.py desktop-bridge/test_raven_bridge_security.py
      - name: Validate userscript syntax
        run: node --check RAH-RAVEN-WHEEL.user.js
      - name: Validate Raven Download Manager contract
        run: node tests/raven-download-manager.test.mjs
      - name: Validate local-origin Vault security
        working-directory: desktop-bridge
        run: python test_raven_bridge_security.py
