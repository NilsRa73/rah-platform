name: Build Raven Daily Driver Candidate Artifact

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'RAH-RAVEN-DAILY-DRIVER-PACKAGE.json'
      - 'RAH-RAVEN-DAILY-DRIVER-VERSION.json'
      - 'BUILD-VALIDATION.json'
      - 'EXPORT-RAH-RAVEN-RUNTIME-EVIDENCE.bat'
      - 'INSTALL-RAH-RAVEN.bat'
      - 'START-RAH-RAVEN-DAILY-DRIVER.bat'
      - 'TEST-RAH-RAVEN-RUNTIME.bat'
      - 'PROMOTE-RAH-RAVEN-TO-RUNTIME-TEST.bat'
      - 'RAH-RAVEN-DAILY-DRIVER.md'
      - 'STABLE-GATE.md'
      - 'apps/rah-raven-daily-driver/**'
      - '.github/workflows/build-raven-daily-driver-candidate.yml'
  push:
    branches: [main]
    paths:
      - 'RAH-RAVEN-DAILY-DRIVER-PACKAGE.json'
      - 'RAH-RAVEN-DAILY-DRIVER-VERSION.json'
      - 'BUILD-VALIDATION.json'
      - 'EXPORT-RAH-RAVEN-RUNTIME-EVIDENCE.bat'
      - 'INSTALL-RAH-RAVEN.bat'
      - 'START-RAH-RAVEN-DAILY-DRIVER.bat'
      - 'TEST-RAH-RAVEN-RUNTIME.bat'
      - 'PROMOTE-RAH-RAVEN-TO-RUNTIME-TEST.bat'
      - 'RAH-RAVEN-DAILY-DRIVER.md'
      - 'STABLE-GATE.md'
      - 'apps/rah-raven-daily-driver/**'
      - '.github/workflows/build-raven-daily-driver-candidate.yml'

permissions:
  contents: read

jobs:
  build-candidate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Candidate before packaging
        shell: pwsh
        run: |
          python -m pip install -r apps/rah-raven-daily-driver/requirements.txt
          python -m unittest discover -s apps/rah-raven-daily-driver/tests -p 'test_*.py' -v
      - name: Validate immutable package closure
        shell: pwsh
        run: |
          $m = Get-Content RAH-RAVEN-DAILY-DRIVER-PACKAGE.json -Raw | ConvertFrom-Json
          if ($m.stage -ne 'candidate-package') { throw 'Package stage drift.' }
          if ($m.packageFileCount -ne 34) { throw 'Unexpected package file count.' }
          if (@($m.packageFiles).Count -ne $m.packageFileCount) { throw 'Package list/count mismatch.' }
          $duplicates = @($m.packageFiles | Group-Object | Where-Object Count -gt 1)
          if ($duplicates.Count -gt 0) { throw 'Duplicate package paths are forbidden.' }
          foreach ($p in $m.packageFiles) {
            if (-not (Test-Path -LiteralPath $p -PathType Leaf)) { throw "Missing package file: $p" }
            if ($p -match '(^|/)\.venv(/|$)|(^|/)runtime(/|$)|__pycache__|\.pyc$') { throw "Generated/runtime path forbidden in package: $p" }
          }
          foreach ($p in $m.forbiddenPackagePaths) {
            if ($m.packageFiles -contains $p) { throw "Stable/runtime file forbidden in Candidate package: $p" }
          }
          foreach ($required in @('EXPORT-RAH-RAVEN-RUNTIME-EVIDENCE.bat','apps/rah-raven-daily-driver/evidence_bundle.py','apps/rah-raven-daily-driver/tests/test_evidence_bundle.py')) {
            if ($m.packageFiles -notcontains $required) { throw "Runtime Evidence package file missing: $required" }
          }
          if ($m.runtimePolicy.runtimeEvidence -ne 'privacy-safe-sanitized-v1') { throw 'Runtime Evidence policy drift.' }
          $v = Get-Content RAH-RAVEN-DAILY-DRIVER-VERSION.json -Raw | ConvertFrom-Json
          if ($v.stage -ne 'candidate' -or $v.stable_gate.status -ne 'not_passed') { throw 'Candidate package cannot claim Stable.' }
          if ($v.authority_delta -ne 'none') { throw 'Candidate package authority delta must remain none.' }
          if (-not $m.runtimePolicy.candidateOnly -or $m.runtimePolicy.stablePromotionIncluded) { throw 'Candidate package lifecycle boundary drift.' }
      - name: Build deterministic package directory and ZIP
        shell: pwsh
        run: |
          $m = Get-Content RAH-RAVEN-DAILY-DRIVER-PACKAGE.json -Raw | ConvertFrom-Json
          $dist = Join-Path $PWD 'dist'
          $stage = Join-Path $dist $m.packageRoot
          Remove-Item $dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          foreach ($rel in $m.packageFiles) {
            $dest = Join-Path $stage ($rel -replace '/', '\')
            $parent = Split-Path -Parent $dest
            New-Item -ItemType Directory -Force -Path $parent | Out-Null
            Copy-Item -LiteralPath $rel -Destination $dest
          }
          $source = [ordered]@{
            product = 'RAH Raven Daily Driver'
            version = '1.0.0'
            stage = 'candidate'
            repository = '${{ github.repository }}'
            commit = '${{ github.sha }}'
            ref = '${{ github.ref }}'
            built_utc = (Get-Date).ToUniversalTime().ToString('o')
          }
          $source | ConvertTo-Json | Set-Content -Encoding UTF8 (Join-Path $stage 'BUILD-SOURCE.json')
          $zip = Join-Path $dist ($m.packageRoot + '-Windows.zip')
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($zip))" | Set-Content -Encoding ASCII ($zip + '.sha256.txt')
          Write-Host "ZIP: $zip"
          Write-Host "SHA256: $hash"
      - name: Upload Candidate Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: RAH-Raven-Daily-Driver-v1.0-Candidate-Windows
          path: |
            dist/RAH-Raven-Daily-Driver-v1.0-Candidate-Windows.zip
            dist/RAH-Raven-Daily-Driver-v1.0-Candidate-Windows.zip.sha256.txt
          if-no-files-found: error
          retention-days: 30
