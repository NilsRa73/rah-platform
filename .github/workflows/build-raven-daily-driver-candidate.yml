name: Build Raven Daily Driver Stable Artifact

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'RAH-RAVEN-DAILY-DRIVER-PACKAGE.json'
      - 'RAH-RAVEN-DAILY-DRIVER-VERSION.json'
      - 'RAH-RAVEN-DAILY-DRIVER-FINAL.ps1'
      - 'START-HER-RAH-RAVEN-DAILY-DRIVER.cmd'
      - 'INSTALL-RAH-RAVEN.bat'
      - 'apps/rah-raven-daily-driver/**'
      - '.github/workflows/build-raven-daily-driver-candidate.yml'
  pull_request:
    paths:
      - 'RAH-RAVEN-DAILY-DRIVER-PACKAGE.json'
      - 'RAH-RAVEN-DAILY-DRIVER-VERSION.json'
      - 'RAH-RAVEN-DAILY-DRIVER-FINAL.ps1'
      - 'START-HER-RAH-RAVEN-DAILY-DRIVER.cmd'
      - 'apps/rah-raven-daily-driver/**'
      - '.github/workflows/build-raven-daily-driver-candidate.yml'

permissions:
  contents: read

jobs:
  build-stable:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source before packaging
        shell: pwsh
        run: |
          python -m pip install -r apps/rah-raven-daily-driver/requirements.txt
          python -m unittest discover -s apps/rah-raven-daily-driver/tests -p 'test_*.py' -v
      - name: Validate Stable package closure
        shell: pwsh
        run: |
          $m=Get-Content RAH-RAVEN-DAILY-DRIVER-PACKAGE.json -Raw|ConvertFrom-Json
          $v=Get-Content RAH-RAVEN-DAILY-DRIVER-VERSION.json -Raw|ConvertFrom-Json
          if($m.stage -ne 'stable-package' -or $v.stage -ne 'stable'){throw 'Stable lifecycle mismatch'}
          if($m.packageFileCount -ne 39 -or @($m.packageFiles).Count -ne 39){throw 'Stable package must contain exactly 39 files'}
          if(@($m.packageFiles|Group-Object|Where-Object Count -gt 1).Count){throw 'Duplicate package paths'}
          foreach($p in $m.packageFiles){
            if(-not(Test-Path -LiteralPath $p -PathType Leaf)){throw "Missing package file: $p"}
            if($p -match '(^|/)\.venv(/|$)|(^|/)runtime(/|$)|__pycache__|\.pyc$'){throw "Generated/runtime path forbidden: $p"}
          }
          foreach($p in $m.forbiddenPackagePaths){if($m.packageFiles -contains $p){throw "Canonical Stable dependency embedded in sidecar: $p"}}
          foreach($required in @('START-HER-RAH-RAVEN-DAILY-DRIVER.cmd','RAH-RAVEN-DAILY-DRIVER-FINAL.ps1')){
            if($m.packageFiles -notcontains $required){throw "Stable entry missing from package: $required"}
          }
      - name: Build deterministic Stable ZIP
        shell: pwsh
        run: |
          $m=Get-Content RAH-RAVEN-DAILY-DRIVER-PACKAGE.json -Raw|ConvertFrom-Json
          $dist=Join-Path $PWD 'dist';$stage=Join-Path $dist $m.packageRoot
          Remove-Item $dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stage|Out-Null
          foreach($rel in $m.packageFiles){
            $dest=Join-Path $stage ($rel -replace '/','\')
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $dest)|Out-Null
            Copy-Item -LiteralPath $rel -Destination $dest
          }
          [ordered]@{product='RAH Raven Daily Driver';version='1.0.0';stage='stable';repository='${{ github.repository }}';commit='${{ github.sha }}';ref='${{ github.ref }}';built_utc=(Get-Date).ToUniversalTime().ToString('o')}|ConvertTo-Json|Set-Content -Encoding UTF8 (Join-Path $stage 'BUILD-SOURCE.json')
          $zip=Join-Path $dist ($m.packageRoot+'-Windows.zip')
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal
          $hash=(Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($zip))"|Set-Content -Encoding ASCII ($zip+'.sha256.txt')
      - uses: actions/upload-artifact@v7
        with:
          name: RAH-Raven-Daily-Driver-v1.0-Stable-Windows
          path: |
            dist/RAH-Raven-Daily-Driver-v1.0-Stable-Windows.zip
            dist/RAH-Raven-Daily-Driver-v1.0-Stable-Windows.zip.sha256.txt
          if-no-files-found: error
          retention-days: 30
