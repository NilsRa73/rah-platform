name: Build CC 1.8 Raven Master Sync
on:
  push:
    branches: ['agent/rah-cc-v1.8-raven-master-sync-real']
    paths:
      - 'tools/build-cc18-raven-master-sync.mjs'
      - '.github/workflows/build-cc18-raven-master-sync.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rah-cc-v1.8-raven-master-sync-real
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Patch Raven master metadata only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/build-cc18-raven-master-sync.mjs')
          s=p.read_text()
          lines=s.splitlines()
          summary="raven.summary='RAH Raven 2.0.32 remains the temporary stable freeze with nine Stable core components unchanged. Project Brain Cloud Sync v1.1, Voice Control v1.7, Mission Engine v1.6, Raven Care v0.1 and Raven Fristvakt v0.2 remain stable supporting modules. Raven Chronicle v1.7.1 is stable. Raven Insights v0.1 is stable. Raven Daily Brief v0.1 is stable. RAH Raven Command Center v1.8.0 is Stable. Command Center v1.8 keeps the exact four capabilities compute, storage, display and remote-desktop; the exact three fixed actions storage-summary.read, rustdesk.launch and rustdesk.connect; and the exact five business routes /health, /actions, /storage, /launch/rustdesk and /handoff/rustdesk. Node Agent v1.3.0 uses rah-node-actions-v7 and rah-node-auth-v2 token-proof authentication: the fresh Node token stays local and is not transported as Bearer over LAN. Mutating RustDesk actions additionally require a fresh 90-second memory-only single-use Command Center one-shot approval bound to device, Node session, action and SHA-256 target digest; it is consumed before Node-local confirmation, and raw RustDesk target is not stored in the ticket. Existing advertised-action, capability, ephemeral Command Center approval, requester-source/context, Node-local human confirmation, fresh action challenge and Node-local approval proof remain independent gates. storage-summary.read remains read-only and does not require the one-shot ticket. Password persistence, RustDesk peer-ID persistence, caller-controlled executable paths or generic arguments, installation, shell/file/generic process or action endpoints, device commands, discovery, background polling and native Raven remote-control authority remain disabled.';"
          hits=[i for i,x in enumerate(lines) if x.startswith("raven.summary='")]
          assert len(hits)==1, hits
          lines[hits[0]]=summary
          p.write_text('\n'.join(lines)+'\n')
          PY
          node tools/build-cc18-raven-master-sync.mjs
          git checkout -- tools/build-cc18-raven-master-sync.mjs
      - name: Require Raven metadata-only worktree diff
        shell: bash
        run: |
          test "$(git diff --name-only)" = 'RAH-RAVEN-VERSION.json'
      - name: Validate canonical and Stable CC
        run: |
          node --test tests/rah-command-center-packaging.test.mjs
          node --test tests/rah-cc18-one-shot-mutating-approval.test.mjs
          node --test tests/rah-cc18-stable-release.test.mjs
      - name: Validate unchanged Stable Node 1.3
        run: python3 -m unittest tests/test_rah_node_agent_stable_v13.py -v
      - name: Validate Raven release and master consumers
        run: |
          node --test tests/raven-release-gate.test.mjs
          node --test tests/raven-project-registry-v0.1.test.mjs
          node --test tests/raven-daily-brief-v0.1.test.mjs
          node --test tests/raven-health-fatigue-v0.2.test.mjs
          node --test tests/raven-care-v0.1.test.mjs
          node --test tests/raven-fristvakt-v0.2.test.mjs
          node --test tests/raven-fastlege-v0.3.test.mjs
      - name: Push tested Raven master metadata
        shell: bash
        run: |
          git config user.name 'RAH Raven Master Sync'
          git config user.email 'actions@users.noreply.github.com'
          git add RAH-RAVEN-VERSION.json
          git commit -m 'RAH Raven master — sync Command Center v1.8 canonical metadata'
          git push origin HEAD:agent/rah-cc-v1.8-raven-master-sync-real
