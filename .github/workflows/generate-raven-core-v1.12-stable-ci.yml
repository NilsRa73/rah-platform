name: Generate Raven Core v1.12 Stable CI

on:
  push:
    branches:
      - core/raven-core-v1.12-stable-gate
    paths:
      - '.github/scripts/generate_raven_core_v1_12_stable_ci.py'
      - '.github/workflows/generate-raven-core-v1.12-stable-ci.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: core/raven-core-v1.12-stable-gate
      - name: Generate stable CI copies
        run: python .github/scripts/generate_raven_core_v1_12_stable_ci.py
      - name: Sanity-check generated contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          checks={
            'validate-raven-package.yml':['RAH-RAVEN-CORE-VERSION.json',"raven_core':'1.12",'raven_core_stable','Run Raven Core v1.12 stable boundary test'],
            'validate-raven-one-click.yml':['RAH-RAVEN-CORE-VERSION.json',"raven_core':'1.12",'raven_core_stable','tests/raven-core-local-boundary.test.mjs'],
            'validate-raven-release-gate.yml':['RAH-RAVEN-CORE-VERSION.json','seven stable core components including Raven Core v1.12','tests/raven-core-local-boundary.test.mjs'],
          }
          for name,needles in checks.items():
              text=(Path('.ci-generated')/name).read_text(encoding='utf-8')
              for needle in needles:
                  assert needle in text,(name,needle)
          PY
      - name: Commit generated copies only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ci-generated/
          git diff --cached --quiet && exit 0
          git commit -m 'Generate Raven Core v1.12 stable CI contracts'
          git push origin HEAD:core/raven-core-v1.12-stable-gate
