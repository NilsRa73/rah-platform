name: Validate Requester Context Candidate Readiness

on:
  push:
    paths:
      - 'RAH-REQUESTER-CONTEXT-CANDIDATE-GATE.json'
      - 'tests/rah-requester-context-candidate-readiness.test.mjs'
      - '.github/workflows/validate-requester-context-readiness.yml'
  pull_request:
    paths:
      - 'RAH-REQUESTER-CONTEXT-CANDIDATE-GATE.json'
      - 'tests/rah-requester-context-candidate-readiness.test.mjs'
      - '.github/workflows/validate-requester-context-readiness.yml'

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Readiness-only scope guard
        shell: bash
        run: |
          git fetch origin main --quiet
          allowed='^(RAH-REQUESTER-CONTEXT-CANDIDATE-GATE\.json|tests/rah-requester-context-candidate-readiness\.test\.mjs|\.github/workflows/validate-requester-context-readiness\.yml)$'
          bad="$(git diff --name-only origin/main...HEAD | grep -Ev "$allowed" || true)"
          if [ -n "$bad" ]; then
            echo 'Requester-context readiness branch modified files outside readiness-only scope:'
            echo "$bad"
            exit 1
          fi
      - name: Re-run current Stable CC 1.5 Node 1.1 contract
        run: node --test tests/rah-capability-allowlist-contract.test.mjs
      - name: Re-run current Stable Node Agent 1.1 live gate
        run: python3 -m unittest tests/test_rah_node_agent_stable_v11.py
      - name: Re-run current Stable Node 1.1 release gate
        run: node --test tests/rah-node11-stable-release.test.mjs
      - name: Re-run requester-context research gate
        run: node --test tests/rah-requester-context-binding-research.test.mjs
      - name: Validate requester-context Candidate implementation readiness
        run: node --test tests/rah-requester-context-candidate-readiness.test.mjs
