name: Build RAH OS ISO

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'rah-os/**'
      - '.github/workflows/build-rah-os.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'rah-os/**'
      - '.github/workflows/build-rah-os.yml'

permissions:
  contents: read

concurrency:
  group: rah-os-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  raven-runtime-tests:
    name: Raven + Recovery runtime self-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Python and shell sources
        run: |
          set -euo pipefail
          python3 -m py_compile rah-os/config/includes.chroot/usr/local/lib/rah/raven-agent.py
          python3 -m py_compile rah-os/config/includes.chroot/usr/local/lib/rah/recovery-center.py
          python3 -m py_compile rah-os/tests/test_raven_agent.py
          python3 -m py_compile rah-os/tests/test_recovery_center.py
          bash -n rah-os/build.sh
          bash -n rah-os/config/hooks/live/010-rah-core.hook.chroot
          bash -n rah-os/config/includes.chroot/usr/local/bin/rah-command-center-start
          bash -n rah-os/config/includes.chroot/usr/local/bin/rah-hardware-check-start
          bash -n rah-os/config/includes.chroot/usr/local/bin/rah-recovery-center-start

      - name: Run Raven and Recovery Center tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s rah-os/tests -p 'test_*.py' -v
          python3 rah-os/config/includes.chroot/usr/local/lib/rah/recovery-center.py --self-test

  windows-usb-prep-test:
    name: Windows USB prep self-test
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run read-only USB prep self-test
        shell: powershell
        run: |
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File ".\rah-os\RAH-OS-USB-PREP.ps1" -SelfTest
          if ($LASTEXITCODE -ne 0) { throw "RAH OS USB prep self-test failed with exit code $LASTEXITCODE" }

  build-iso:
    name: RAH OS Raven amd64
    needs: [raven-runtime-tests, windows-usb-prep-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate RAH build sources
        run: |
          set -euo pipefail
          bash -n rah-os/build.sh
          bash -n rah-os/config/hooks/live/010-rah-core.hook.chroot
          bash -n rah-os/config/includes.chroot/usr/local/bin/rah-command-center-start
          bash -n rah-os/config/includes.chroot/usr/local/bin/rah-hardware-check-start
          bash -n rah-os/config/includes.chroot/usr/local/bin/rah-recovery-center-start
          python3 -m py_compile rah-os/config/includes.chroot/usr/local/lib/rah/raven-agent.py
          python3 -m py_compile rah-os/config/includes.chroot/usr/local/lib/rah/recovery-center.py
          test -x rah-os/config/includes.chroot/usr/local/bin/rah-command-center-start
          test -x rah-os/config/includes.chroot/usr/local/bin/rah-hardware-check-start
          grep -Fqx 'VERSION="0.2"' rah-os/config/includes.chroot/etc/rah-os-release
          grep -Fqx 'EDITION="Raven v0.2 Desktop Candidate"' rah-os/config/includes.chroot/etc/rah-os-release
          grep -Fq 'VERSION = "0.2"' rah-os/config/includes.chroot/usr/local/lib/rah/raven-agent.py
          grep -Fq 'VERSION = "1.0"' rah-os/config/includes.chroot/usr/local/lib/rah/recovery-center.py
          grep -Fq 'RAH_VERSION="0.2"' rah-os/build.sh
          grep -Fqx 'Exec=/usr/local/bin/rah-command-center-start' rah-os/config/includes.chroot/etc/skel/.config/autostart/RAH-Command-Center.desktop
          grep -Fqx 'Exec=/usr/local/bin/rah-hardware-check-start' rah-os/config/includes.chroot/etc/skel/Desktop/RAH-Hardware-Check.desktop
          grep -Fqx 'Exec=/usr/local/bin/rah-recovery-center-start' rah-os/config/includes.chroot/etc/skel/Desktop/RAH-Recovery-Center.desktop
          grep -Fq '"/api/diagnostics"' rah-os/config/includes.chroot/usr/local/lib/rah/raven-agent.py
          grep -Fq '"/report"' rah-os/config/includes.chroot/usr/local/lib/rah/raven-agent.py

      - name: Build ISO in Debian 13 toolchain
        run: |
          docker run --rm --privileged \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            debian:13 \
            bash -lc 'set -e; apt-get update; DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends live-build debootstrap squashfs-tools xorriso isolinux syslinux-common grub-pc-bin grub-efi-amd64-bin mtools dosfstools ca-certificates; bash rah-os/build.sh'

      - name: Show output
        run: |
          ls -lh rah-os/output
          cat rah-os/output/*.sha256

      - name: Upload RAH OS ISO
        uses: actions/upload-artifact@v4
        with:
          name: RAH-OS-Raven-v0.2-amd64
          path: |
            rah-os/output/RAH-OS-Raven-v0.2-amd64.iso
            rah-os/output/RAH-OS-Raven-v0.2-amd64.iso.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload RAH OS checksum
        uses: actions/upload-artifact@v4
        with:
          name: RAH-OS-Raven-v0.2-checksum
          path: rah-os/output/RAH-OS-Raven-v0.2-amd64.iso.sha256
          if-no-files-found: error
          retention-days: 14
