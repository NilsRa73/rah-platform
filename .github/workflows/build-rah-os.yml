name: Build RAH OS ISO

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'rah-os/**'
      - '.github/workflows/build-rah-os.yml'

permissions:
  contents: read

concurrency:
  group: rah-os-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-iso:
    name: RAH OS Raven amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate RAH build sources
        run: |
          set -euo pipefail
          bash -n rah-os/build.sh
          bash -n rah-os/config/hooks/live/010-rah-core.hook.chroot
          bash -n rah-os/config/includes.chroot/usr/local/bin/rah-command-center-start
          python3 -m py_compile rah-os/config/includes.chroot/usr/local/lib/rah/raven-agent.py
          test -x rah-os/config/includes.chroot/usr/local/bin/rah-command-center-start
          grep -Fqx 'VERSION="0.1"' rah-os/config/includes.chroot/etc/rah-os-release
          grep -Fqx 'EDITION="Raven v0.1"' rah-os/config/includes.chroot/etc/rah-os-release
          grep -Fq 'VERSION = "0.1"' rah-os/config/includes.chroot/usr/local/lib/rah/raven-agent.py
          grep -Fq 'RAH_VERSION="0.1"' rah-os/build.sh
          grep -Fqx 'Exec=/usr/local/bin/rah-command-center-start' rah-os/config/includes.chroot/etc/skel/.config/autostart/RAH-Command-Center.desktop

      - name: Build ISO in Debian 13 toolchain
        run: |
          docker run --rm --privileged \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            debian:13 \
            bash -lc 'set -e; apt-get update; DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends live-build debootstrap squashfs-tools xorriso isolinux syslinux-common grub-pc-bin grub-efi-amd64-bin mtools dosfstools ca-certificates; bash rah-os/build.sh'

      - name: Show output
        run: |
          ls -lh rah-os/output
          cat rah-os/output/*.sha256

      - name: Upload RAH OS ISO
        uses: actions/upload-artifact@v4
        with:
          name: RAH-OS-Raven-v0.1-amd64
          path: |
            rah-os/output/RAH-OS-Raven-v0.1-amd64.iso
            rah-os/output/RAH-OS-Raven-v0.1-amd64.iso.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload RAH OS checksum
        uses: actions/upload-artifact@v4
        with:
          name: RAH-OS-Raven-v0.1-checksum
          path: rah-os/output/RAH-OS-Raven-v0.1-amd64.iso.sha256
          if-no-files-found: error
          retention-days: 14
