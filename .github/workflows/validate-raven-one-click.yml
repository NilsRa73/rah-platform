name: Validate RAH Raven one-click package

on:
  workflow_dispatch:
  push:
    paths:
      - 'INSTALL-RAH-AI-STUDIOS.bat'
      - 'INSTALL-RAH-AI-STUDIOS.ps1'
      - 'UPDATE-RAH-RAVEN.ps1'
      - 'DOBBELTKLIKK-HER-START-RAH-RAVEN.bat'
      - 'START-RAH-RAVEN-V2.bat'
      - 'RAH-RAVEN-*.html'
      - 'RAH-HOME-CONTROL.html'
      - 'RAH-RAVEN-VERSION.json'
      - 'raven-checkpoint-policy.js'
      - 'desktop-bridge/**'
      - 'tests/raven-checkpoint-policy.test.mjs'
      - 'tests/raven-now-v2.test.mjs'
      - 'tests/raven-mission-control.test.mjs'
      - 'tests/raven-project-focus.test.mjs'
      - '.github/workflows/validate-raven-one-click.yml'
  pull_request:
    paths:
      - 'INSTALL-RAH-AI-STUDIOS.bat'
      - 'INSTALL-RAH-AI-STUDIOS.ps1'
      - 'UPDATE-RAH-RAVEN.ps1'
      - 'DOBBELTKLIKK-HER-START-RAH-RAVEN.bat'
      - 'START-RAH-RAVEN-V2.bat'
      - 'RAH-RAVEN-*.html'
      - 'RAH-HOME-CONTROL.html'
      - 'RAH-RAVEN-VERSION.json'
      - 'raven-checkpoint-policy.js'
      - 'desktop-bridge/**'
      - 'tests/raven-checkpoint-policy.test.mjs'
      - 'tests/raven-now-v2.test.mjs'
      - 'tests/raven-mission-control.test.mjs'
      - 'tests/raven-project-focus.test.mjs'
      - '.github/workflows/validate-raven-one-click.yml'

permissions:
  contents: read

jobs:
  validate-one-click:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell scripts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @('INSTALL-RAH-AI-STUDIOS.ps1', 'UPDATE-RAH-RAVEN.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              exit 1
            }
            Write-Host "$file syntax: OK"
          }

      - name: Validate manifest and Raven 2.0.11 safety contract
        shell: python
        run: |
          import json
          from pathlib import Path

          manifest = json.loads(Path('RAH-RAVEN-VERSION.json').read_text(encoding='utf-8'))
          assert manifest['product'] == 'RAH Raven'
          assert manifest['version'] == '2.0.11'
          assert manifest['launcher'] == '3.0'

          missing = [p for p in manifest['files'] if not Path(p).is_file()]
          if missing:
              raise SystemExit('Manifest references missing files: ' + ', '.join(missing))

          required = {
              'RAH-RAVEN-START.html','RAH-RAVEN-CORE-DEMO.html','RAH-RAVEN-VISION-CORE.html',
              'RAH-RAVEN-COUNCIL.html','RAH-RAVEN-AGENT-RUNNER.html','RAH-RAVEN-MEMORY-SYNC.html',
              'RAH-RAVEN-MISSION-CONTROL.html','RAH-RAVEN-NOW.html','RAH-RAVEN-NOW-V2.html',
              'RAH-RAVEN-PROJECT.html','index.html','raven-checkpoint-policy.js',
              'desktop-bridge/agent_runner.py','desktop-bridge/raven_bridge.py'
          }
          omitted = sorted(required - set(manifest['files']))
          if omitted:
              raise SystemExit('Updater manifest omits runtime files: ' + ', '.join(omitted))

          p = manifest['privacy']
          assert p['hidden_screen_capture'] is False
          assert p['automatic_sending'] is False
          assert p['memory_sync_requires_explicit_confirmation'] is True
          assert p['mission_completion_requires_explicit_confirmation'] is True
          assert p['raven_now_read_only'] is True
          assert p['raven_now_default_start_page'] is True
          assert p['project_activation_requires_explicit_confirmation'] is True
          assert p['project_activation_does_not_replace_active_mission'] is True
          assert p['continue_navigation_read_only'] is True
          assert p['mission_project_mismatch_warning'] is True
          assert p['raven_now_recommended_checkpoint_navigation_read_only'] is True
          assert p['mission_control_recommended_checkpoint_navigation_read_only'] is True
          assert p['recommended_checkpoint_policy_shared_between_now_and_mission_control'] is True
          assert p['recommended_checkpoint_policy_shared_module'] is True
          assert p['recommended_checkpoint_module_read_only'] is True
          assert p['recommended_checkpoint_module_no_storage_writes'] is True
          print('Manifest 2.0.11 / launcher 3.0 / shared checkpoint safety: OK')

      - name: Validate shared checkpoint integration
        shell: python
        run: |
          from pathlib import Path
          import re

          now = Path('RAH-RAVEN-NOW-V2.html').read_text(encoding='utf-8')
          mission = Path('RAH-RAVEN-MISSION-CONTROL.html').read_text(encoding='utf-8')
          policy = Path('raven-checkpoint-policy.js').read_text(encoding='utf-8')
          project = Path('RAH-RAVEN-PROJECT.html').read_text(encoding='utf-8')

          assert 'v2.8 · READ ONLY' in now
          assert 'v2.6 · LOCAL FIRST' in mission
          assert '<script src="raven-checkpoint-policy.js"></script>' in now
          assert '<script src="raven-checkpoint-policy.js"></script>' in mission
          assert "Checkpoint.recommend(s,m,block,'now')" in now
          assert 'Checkpoint.recommend(state,m,blocker,"mission-control")' in mission
          assert 'function recommendedCheckpoint(' not in now
          assert 'function recommendedCheckpoint(' not in mission
          assert 'function missionOpen(m)' not in now
          assert 'function missionOpen(m)' not in mission

          for marker in ('BLOCKER','MISSION MISMATCH','MISSION PROJECT UNKNOWN','MISSION','PROJECT','MISSION CONTROL'):
              assert marker in policy
          assert 'LØS BLOKKERING I MISSION CONTROL' in policy
          assert 'LØS BLOKKERING HER' in policy
          assert 'FORTSETT AKTIV MISSION' in policy
          assert 'AVKLAR AKTIV MISSION' in policy
          assert 'FORTSETT AKTIVT PROSJEKT' in policy
          assert 'Ingen prosjektbytte skjer automatisk' in policy
          assert 'localStorage' not in policy
          assert 'document.' not in policy
          assert re.search(r'\bactiveMission\s*=(?!=)', policy) is None
          assert re.search(r'\bactiveProject\s*=(?!=)', policy) is None
          assert re.search(r'\.done\s*=\s*true', policy) is None
          assert '/agent/run' not in policy

          assert 'localStorage.setItem(STATE_KEY' not in now
          assert re.search(r'\bs\.activeProject\s*=(?!=)', now) is None
          assert re.search(r'\bstate\.activeProject\s*=(?!=)', now) is None
          assert re.search(r'\bactiveMission\s*=(?!=)', now) is None
          assert 'step.done=true' not in now
          assert '/agent/run' not in now

          assert 'id="activateProject"' in project
          assert 'confirm(' in project
          assert 's.activeProject=index' in project
          assert re.search(r'\bs\.activeMission\s*=(?!=)', project) is None
          assert 'step.done=true' not in project
          assert '/agent/run' not in project
          print('Shared checkpoint module + read-only navigation boundaries: OK')

      - name: Validate JavaScript and semantic tests
        shell: powershell
        run: |
          node --check raven-checkpoint-policy.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/raven-checkpoint-policy.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/raven-now-v2.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/raven-mission-control.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/raven-project-focus.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate one-click chain
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-Content 'INSTALL-RAH-AI-STUDIOS.ps1' -Raw
          $updater = Get-Content 'UPDATE-RAH-RAVEN.ps1' -Raw
          $bootstrap = Get-Content 'INSTALL-RAH-AI-STUDIOS.bat' -Raw
          $starter = Get-Content 'DOBBELTKLIKK-HER-START-RAH-RAVEN.bat' -Raw
          $launcher = Get-Content 'START-RAH-RAVEN-V2.bat' -Raw

          if ($installer -notmatch 'UPDATE-RAH-RAVEN\.ps1') { throw 'Installer does not call updater.' }
          if ($installer -match '\-NoStart') { throw 'Installer suppresses first automatic Raven start.' }
          if ($updater -notmatch 'START-RAH-RAVEN-V2\.bat') { throw 'Updater does not launch Raven.' }
          if ($bootstrap -notmatch 'INSTALL-RAH-AI-STUDIOS\.ps1') { throw 'Bootstrap does not download installer.' }
          if ($starter -notmatch 'UPDATE-RAH-RAVEN\.ps1') { throw 'Desktop starter does not refresh updater.' }
          if ($launcher -notmatch 'set "RAVEN_URL=%~dp0RAH-RAVEN-NOW-V2\.html"') { throw 'Launcher does not open Raven Now v2.' }
          if ($launcher -notmatch 'set "STUDIO_URL=%~dp0RAH-RAVEN-START\.html"') { throw 'Launcher lost Studio navigation target.' }
          if ($launcher -match 'set "RAVEN_URL=%~dp0RAH-RAVEN-NOW\.html"') { throw 'Launcher reverted to Raven Now v1.' }
          Write-Host 'RAH Raven one-click -> shared-module Raven 2.0.11: OK'
