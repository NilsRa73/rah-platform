name: Validate RAH Raven one-click package

on:
  workflow_dispatch:
  push:
    paths:
      - 'INSTALL-RAH-AI-STUDIOS.bat'
      - 'INSTALL-RAH-AI-STUDIOS.ps1'
      - 'UPDATE-RAH-RAVEN.ps1'
      - 'DOBBELTKLIKK-HER-START-RAH-RAVEN.bat'
      - 'START-RAH-RAVEN-V2.bat'
      - 'RAH-RAVEN-*.html'
      - 'RAH-HOME-CONTROL.html'
      - 'RAH-RAVEN-VERSION.json'
      - 'raven-checkpoint-policy.js'
      - 'raven-vision-core.js'
      - 'desktop-bridge/**'
      - 'tests/raven-checkpoint-policy.test.mjs'
      - 'tests/raven-now-v2.test.mjs'
      - 'tests/raven-mission-control.test.mjs'
      - 'tests/raven-project-focus.test.mjs'
      - 'tests/raven-core-demo.test.mjs'
      - 'tests/raven-core-context.test.mjs'
      - 'tests/raven-vision-core.test.mjs'
      - '.github/workflows/validate-raven-one-click.yml'
  pull_request:
    paths:
      - 'INSTALL-RAH-AI-STUDIOS.bat'
      - 'INSTALL-RAH-AI-STUDIOS.ps1'
      - 'UPDATE-RAH-RAVEN.ps1'
      - 'DOBBELTKLIKK-HER-START-RAH-RAVEN.bat'
      - 'START-RAH-RAVEN-V2.bat'
      - 'RAH-RAVEN-*.html'
      - 'RAH-HOME-CONTROL.html'
      - 'RAH-RAVEN-VERSION.json'
      - 'raven-checkpoint-policy.js'
      - 'raven-vision-core.js'
      - 'desktop-bridge/**'
      - 'tests/raven-checkpoint-policy.test.mjs'
      - 'tests/raven-now-v2.test.mjs'
      - 'tests/raven-mission-control.test.mjs'
      - 'tests/raven-project-focus.test.mjs'
      - 'tests/raven-core-demo.test.mjs'
      - 'tests/raven-core-context.test.mjs'
      - 'tests/raven-vision-core.test.mjs'
      - '.github/workflows/validate-raven-one-click.yml'

permissions:
  contents: read

jobs:
  validate-one-click:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Parse PowerShell scripts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @('INSTALL-RAH-AI-STUDIOS.ps1', 'UPDATE-RAH-RAVEN.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              exit 1
            }
            Write-Host "$file syntax: OK"
          }

      - name: Validate manifest and Raven 2.0.19 safety contract
        shell: python
        run: |
          import json
          from pathlib import Path

          manifest = json.loads(Path('RAH-RAVEN-VERSION.json').read_text(encoding='utf-8'))
          assert manifest['product'] == 'RAH Raven'
          assert manifest['version'] == '2.0.19'
          assert manifest['launcher'] == '3.0'

          missing = [p for p in manifest['files'] if not Path(p).is_file()]
          if missing:
              raise SystemExit('Manifest references missing files: ' + ', '.join(missing))

          required = {
              'RAH-RAVEN-START.html','RAH-RAVEN-CORE-DEMO.html','RAH-RAVEN-VISION-CORE.html',
              'RAH-RAVEN-COUNCIL.html','RAH-RAVEN-AGENT-RUNNER.html','RAH-RAVEN-MEMORY-SYNC.html',
              'RAH-RAVEN-MISSION-CONTROL.html','RAH-RAVEN-NOW.html','RAH-RAVEN-NOW-V2.html',
              'RAH-RAVEN-PROJECT.html','index.html','raven-checkpoint-policy.js','raven-vision-core.js',
              'desktop-bridge/agent_runner.py','desktop-bridge/raven_bridge.py'
          }
          omitted = sorted(required - set(manifest['files']))
          if omitted:
              raise SystemExit('Updater manifest omits runtime files: ' + ', '.join(omitted))

          p = manifest['privacy']
          expected_true = [
              'memory_sync_requires_explicit_confirmation','mission_completion_requires_explicit_confirmation',
              'raven_now_read_only','project_activation_requires_explicit_confirmation',
              'project_activation_does_not_replace_active_mission','recommended_checkpoint_policy_shared_module',
              'project_mission_relation_shared_policy','raven_context_snapshot_shared',
              'raven_context_snapshot_shared_between_now_and_mission_control','raven_context_snapshot_read_only',
              'raven_context_snapshot_no_storage_writes','raven_context_snapshot_value_based',
              'recommended_checkpoint_uses_context_snapshot','raven_core_context_snapshot_visible',
              'raven_core_uses_shared_context_snapshot','raven_core_context_snapshot_read_only',
              'raven_core_context_snapshot_navigation_only','raven_core_context_snapshot_no_storage_writes',
              'raven_core_central_continue_visible','raven_core_continue_uses_context_snapshot',
              'raven_core_continue_navigation_only','raven_core_continue_no_storage_writes',
              'raven_core_continue_no_project_switch','raven_core_continue_no_mission_mutation',
              'raven_core_continue_no_step_completion','raven_core_continue_no_agent_run',
              'raven_core_pipeline_separate_from_operational_direction','raven_core_continue_context_snapshot_authoritative',
              'raven_core_pipeline_cannot_control_continue_route','raven_core_next_action_visible',
              'raven_core_next_action_derived_from_context_snapshot','raven_core_next_action_explainer_only',
              'raven_core_next_action_read_only','raven_core_next_action_no_storage_writes',
              'raven_core_next_action_cannot_control_continue_route','vision_chatgpt_share_visible',
              'vision_chatgpt_share_requires_explicit_action','vision_share_clipboard_requires_explicit_click',
              'vision_share_png_download_fallback','vision_share_image_memory_only_until_explicit_download',
              'vision_chatgpt_core_entry_visible','vision_chatgpt_mode_navigation_only',
              'vision_chatgpt_mode_no_auto_copy','vision_chatgpt_mode_no_auto_download',
              'vision_chatgpt_mode_no_auto_send','vision_chatgpt_mode_no_auto_capture'
          ]
          expected_false = [
              'hidden_screen_capture','automatic_sending','vision_chatgpt_share_automatic_sending','vision_share_uses_external_api'
          ]
          for key in expected_true:
              assert p.get(key) is True, key
          for key in expected_false:
              assert p.get(key) is False, key
          print('Manifest 2.0.19 / launcher 3.0 / Core-Vision handoff safety: OK')

      - name: Validate Core and Vision handoff boundaries
        shell: python
        run: |
          from pathlib import Path
          import re
          core = Path('RAH-RAVEN-CORE-DEMO.html').read_text(encoding='utf-8')
          vision = Path('RAH-RAVEN-VISION-CORE.html').read_text(encoding='utf-8')
          assert 'Raven Core Workflow v1.5' in core
          assert 'Core v1.5 · VISION HANDOFF' in core
          assert 'id="visionChatGPTHandoff"' in core
          assert 'RAH-RAVEN-VISION-CORE.html?mode=chatgpt' in core
          assert 'RAH Raven Vision Core v0.3' in vision
          assert 'new URLSearchParams(location.search).get("mode") === "chatgpt"' in vision
          assert 'ChatGPT-handoff-modus' in vision
          assert 'RAH-RAVEN-CORE-DEMO.html' in vision
          assert 'navigator.clipboard.write' in vision
          assert 'Raven-Vision-Latest.png' in vision
          assert 'api.openai.com' not in vision.lower()
          assert 'chatgpt.com/backend' not in vision.lower()
          assert re.search(r'copyImageToClipboard\(\)', vision)
          assert re.search(r'downloadLatestPng\(\)', vision)
          assert vision.count('copyImageToClipboard()') == 1
          assert vision.count('downloadLatestPng()') == 1
          print('Core -> Vision ChatGPT handoff is navigation-only; copy/download remain explicit: OK')

      - name: Validate JavaScript and semantic tests
        shell: powershell
        run: |
          node --check raven-checkpoint-policy.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check raven-vision-core.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/raven-checkpoint-policy.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/raven-now-v2.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/raven-mission-control.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/raven-project-focus.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/raven-core-demo.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/raven-core-context.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/raven-vision-core.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate one-click chain
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-Content 'INSTALL-RAH-AI-STUDIOS.ps1' -Raw
          $updater = Get-Content 'UPDATE-RAH-RAVEN.ps1' -Raw
          $bootstrap = Get-Content 'INSTALL-RAH-AI-STUDIOS.bat' -Raw
          $starter = Get-Content 'DOBBELTKLIKK-HER-START-RAH-RAVEN.bat' -Raw
          $launcher = Get-Content 'START-RAH-RAVEN-V2.bat' -Raw
          if ($installer -notmatch 'UPDATE-RAH-RAVEN\.ps1') { throw 'Installer does not call updater.' }
          if ($installer -match '\-NoStart') { throw 'Installer suppresses first automatic Raven start.' }
          if ($updater -notmatch 'START-RAH-RAVEN-V2\.bat') { throw 'Updater does not launch Raven.' }
          if ($bootstrap -notmatch 'INSTALL-RAH-AI-STUDIOS\.ps1') { throw 'Bootstrap does not download installer.' }
          if ($starter -notmatch 'UPDATE-RAH-RAVEN\.ps1') { throw 'Desktop starter does not refresh updater.' }
          if ($launcher -notmatch 'set "RAVEN_URL=%~dp0RAH-RAVEN-NOW-V2\.html"') { throw 'Launcher does not open Raven Now v2.' }
          if ($launcher -notmatch 'set "STUDIO_URL=%~dp0RAH-RAVEN-START\.html"') { throw 'Launcher lost Studio navigation target.' }
          if ($launcher -match 'set "RAVEN_URL=%~dp0RAH-RAVEN-NOW\.html"') { throw 'Launcher reverted to Raven Now v1.' }
          Write-Host 'RAH Raven one-click -> Core/Vision ChatGPT handoff Raven 2.0.19: OK'
