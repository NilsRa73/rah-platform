name: Validate RAH Raven one-click package

on:
  workflow_dispatch:
  push:
    paths:
      - 'INSTALL-RAH-AI-STUDIOS.bat'
      - 'INSTALL-RAH-AI-STUDIOS.ps1'
      - 'UPDATE-RAH-RAVEN.ps1'
      - 'DOBBELTKLIKK-HER-START-RAH-RAVEN.bat'
      - 'START-RAH-RAVEN-V2.bat'
      - 'RAH-RAVEN-START.html'
      - 'RAH-RAVEN-CORE-DEMO.html'
      - 'RAH-RAVEN-VISION-CORE.html'
      - 'RAH-RAVEN-COUNCIL.html'
      - 'RAH-RAVEN-AGENT-RUNNER.html'
      - 'RAH-RAVEN-MEMORY-SYNC.html'
      - 'raven-vision-core.js'
      - 'raven-council.js'
      - 'raven-chronicle-sync.js'
      - 'index.html'
      - 'RAH-RAVEN-VERSION.json'
      - '.github/workflows/validate-raven-one-click.yml'
  pull_request:
    paths:
      - 'INSTALL-RAH-AI-STUDIOS.bat'
      - 'INSTALL-RAH-AI-STUDIOS.ps1'
      - 'UPDATE-RAH-RAVEN.ps1'
      - 'DOBBELTKLIKK-HER-START-RAH-RAVEN.bat'
      - 'START-RAH-RAVEN-V2.bat'
      - 'RAH-RAVEN-START.html'
      - 'RAH-RAVEN-CORE-DEMO.html'
      - 'RAH-RAVEN-VISION-CORE.html'
      - 'RAH-RAVEN-COUNCIL.html'
      - 'RAH-RAVEN-AGENT-RUNNER.html'
      - 'RAH-RAVEN-MEMORY-SYNC.html'
      - 'raven-vision-core.js'
      - 'raven-council.js'
      - 'raven-chronicle-sync.js'
      - 'index.html'
      - 'RAH-RAVEN-VERSION.json'
      - '.github/workflows/validate-raven-one-click.yml'

permissions:
  contents: read

jobs:
  validate-one-click:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Parse PowerShell scripts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @('INSTALL-RAH-AI-STUDIOS.ps1', 'UPDATE-RAH-RAVEN.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              exit 1
            }
            Write-Host "$file syntax: OK"
          }

      - name: Validate manifest and complete Core runtime
        shell: python
        run: |
          import json
          from pathlib import Path

          manifest = json.loads(Path('RAH-RAVEN-VERSION.json').read_text(encoding='utf-8'))
          assert manifest['product'] == 'RAH Raven'
          assert manifest['version']
          assert manifest['launcher']

          missing = [path for path in manifest['files'] if not Path(path).is_file()]
          if missing:
              raise SystemExit('Manifest references missing files: ' + ', '.join(missing))

          required_runtime = {
              'RAH-RAVEN-START.html',
              'RAH-RAVEN-CORE-DEMO.html',
              'RAH-RAVEN-VISION-CORE.html',
              'RAH-RAVEN-COUNCIL.html',
              'RAH-RAVEN-AGENT-RUNNER.html',
              'RAH-RAVEN-MEMORY-SYNC.html',
              'index.html',
              'raven-vision-core.js',
              'raven-council.js',
              'raven-chronicle-sync.js',
              'desktop-bridge/agent_runner.py',
              'desktop-bridge/raven_bridge.py'
          }
          packaged = set(manifest['files'])
          omitted = sorted(required_runtime - packaged)
          if omitted:
              raise SystemExit('Updater manifest omits Core runtime files: ' + ', '.join(omitted))

          assert manifest['privacy']['hidden_screen_capture'] is False
          assert manifest['privacy']['automatic_sending'] is False
          assert manifest['privacy']['memory_sync_requires_explicit_confirmation'] is True
          print(f"Manifest {manifest['version']} / launcher {manifest['launcher']} / Core runtime: OK")

      - name: Validate Studio v2.1 start page
        shell: python
        run: |
          from pathlib import Path

          html = Path('RAH-RAVEN-START.html').read_text(encoding='utf-8')
          required = [
              'RAH RAVEN STUDIO',
              'Raven Studio v2.1',
              'Raven AI / Core',
              'Raven Vision',
              'Home Control',
              'Chronicle',
              'Mission Control',
              'Care / Case Center',
              'id="favoriteBar"',
              'id="recentOpen"',
              'FAVORITES_KEY',
              'RECENT_KEY',
              'data-launch="core"',
              'id="appStatus-core"',
              'id="bridge"',
              'id="lm"',
              'id="vision"',
              'id="agent"',
              'id="test"',
              'Manuelt valgt skjermbilde kan analyseres lokalt.',
              'Ingen skjult skjermfangst, mikrofon eller kamera.'
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit('Studio v2.1 start page is missing: ' + ', '.join(missing))
          forbidden = [
              'Aktivt vindu, skjermdeling, opplasting og lokal analyse er klare.',
              'Eksplisitt fangst via Bridge 18765'
          ]
          stale = [item for item in forbidden if item in html]
          if stale:
              raise SystemExit('Studio v2.1 contains stale Vision capture text: ' + ', '.join(stale))
          print('RAH Raven Studio v2.1 start page: OK')

      - name: Validate Raven Core v1 user flow
        shell: python
        run: |
          from pathlib import Path
          html = Path('RAH-RAVEN-CORE-DEMO.html').read_text(encoding='utf-8')
          required = [
              'Raven Core Workflow v1',
              'Én kontrollert arbeidsflyt i syv steg',
              'Analyser et bilde du velger selv',
              'RAH-RAVEN-VISION-CORE.html',
              'RAH-RAVEN-COUNCIL.html',
              'index.html#missions',
              'RAH-RAVEN-AGENT-RUNNER.html',
              'RAH-RAVEN-MEMORY-SYNC.html',
              'raven-chronicle-sync.js?v=0.1',
              'Automatisk Memory Sync: NEI'
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit('Core v1 flow is missing: ' + ', '.join(missing))
          forbidden = ['Analyser ett valgt vindu', 'Vision fanger bare']
          stale = [item for item in forbidden if item in html]
          if stale:
              raise SystemExit('Core v1 contains stale screen-capture wording: ' + ', '.join(stale))
          print('Raven Core v1 user flow: OK')

      - name: Validate one-click chain
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-Content 'INSTALL-RAH-AI-STUDIOS.ps1' -Raw
          $updater = Get-Content 'UPDATE-RAH-RAVEN.ps1' -Raw
          $bootstrap = Get-Content 'INSTALL-RAH-AI-STUDIOS.bat' -Raw
          $starter = Get-Content 'DOBBELTKLIKK-HER-START-RAH-RAVEN.bat' -Raw

          if ($installer -notmatch 'UPDATE-RAH-RAVEN\.ps1') { throw 'Installer does not call updater.' }
          if ($installer -match '\-NoStart') { throw 'Installer still suppresses first automatic Raven start.' }
          if ($updater -notmatch 'START-RAH-RAVEN-V2\.bat') { throw 'Updater does not launch Raven v2.' }
          if ($bootstrap -notmatch 'INSTALL-RAH-AI-STUDIOS\.ps1') { throw 'BAT bootstrap does not download PowerShell installer.' }
          if ($starter -notmatch 'UPDATE-RAH-RAVEN\.ps1') { throw 'Desktop starter does not refresh updater.' }

          Write-Host 'RAH Raven one-click install/update/start chain: OK'
