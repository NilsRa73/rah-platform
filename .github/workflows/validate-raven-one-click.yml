name: Validate RAH Raven one-click package

on:
  workflow_dispatch:
  push:
    paths:
      - 'INSTALL-RAH-AI-STUDIOS.bat'
      - 'INSTALL-RAH-AI-STUDIOS.ps1'
      - 'UPDATE-RAH-RAVEN.ps1'
      - 'DOBBELTKLIKK-HER-START-RAH-RAVEN.bat'
      - 'START-RAH-RAVEN-V2.bat'
      - 'RAH-RAVEN-*.html'
      - 'RAH-HOME-CONTROL.html'
      - 'RAH-RAVEN-VERSION.json'
      - 'RAH-RAVEN-VISION-VERSION.json'
      - 'RAH-RAVEN-COUNCIL-VERSION.json'
      - 'RAH-RAVEN-AGENT-RUNNER-VERSION.json'
      - 'RAH-RAVEN-MEMORY-SYNC-VERSION.json'
      - 'RAH-RAVEN-MISSION-CONTROL-VERSION.json'
      - 'RAH-RAVEN-PROJECT-FOCUS-VERSION.json'
      - 'RAH-RAVEN-CORE-VERSION.json'
      - 'raven-*.js'
      - 'desktop-bridge/**'
      - 'tests/raven-*.test.mjs'
      - '.github/workflows/validate-raven-one-click.yml'
  pull_request:
    paths:
      - 'INSTALL-RAH-AI-STUDIOS.bat'
      - 'INSTALL-RAH-AI-STUDIOS.ps1'
      - 'UPDATE-RAH-RAVEN.ps1'
      - 'DOBBELTKLIKK-HER-START-RAH-RAVEN.bat'
      - 'START-RAH-RAVEN-V2.bat'
      - 'RAH-RAVEN-*.html'
      - 'RAH-HOME-CONTROL.html'
      - 'RAH-RAVEN-VERSION.json'
      - 'RAH-RAVEN-VISION-VERSION.json'
      - 'RAH-RAVEN-COUNCIL-VERSION.json'
      - 'RAH-RAVEN-AGENT-RUNNER-VERSION.json'
      - 'RAH-RAVEN-MEMORY-SYNC-VERSION.json'
      - 'RAH-RAVEN-MISSION-CONTROL-VERSION.json'
      - 'RAH-RAVEN-PROJECT-FOCUS-VERSION.json'
      - 'RAH-RAVEN-CORE-VERSION.json'
      - 'raven-*.js'
      - 'desktop-bridge/**'
      - 'tests/raven-*.test.mjs'
      - '.github/workflows/validate-raven-one-click.yml'

permissions:
  contents: read

jobs:
  validate-one-click:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Parse PowerShell scripts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @('INSTALL-RAH-AI-STUDIOS.ps1', 'UPDATE-RAH-RAVEN.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              exit 1
            }
          }

      - name: Validate manifest and Raven 2.0.32 temporary-stable contract
        shell: python
        run: |
          import json
          from pathlib import Path
          m=json.loads(Path('RAH-RAVEN-VERSION.json').read_text(encoding='utf-8'))
          assert m['product']=='RAH Raven'
          assert m['version']=='2.0.32'
          assert m['launcher']=='3.0'
          assert m['release_gate']['stage']=='temporary-stable'
          assert m['release_gate']['temporary_stable_target']=='2.0.32'
          assert m['release_gate']['runtime_feature_change'] is False
          assert m['release_gate']['frozen_from']=='2.0.31'
          assert m['release_gate']['development_paused'] is True
          assert m['release_gate']['change_policy']=='bugfix-only-until-explicit-reopen'
          assert m['release_gate']['component_versions']=={
            'raven_now':'2.17','raven_studio':'2.8','raven_core':'1.12','raven_vision':'0.6',
            'mission_control':'2.9','project_focus':'2.4','raven_council':'0.3','agent_runner':'0.3','memory_sync':'0.2'
          }
          assert m['release_gate']['bugfix_component_updates']=={'raven_vision':'0.6','raven_council':'0.3','agent_runner':'0.3','memory_sync':'0.2','mission_control':'2.9','project_focus':'2.4','raven_core':'1.12'}
          assert m['release_gate']['stable_components']=={'raven_vision':'0.6','raven_council':'0.3','agent_runner':'0.3','memory_sync':'0.2','mission_control':'2.9','project_focus':'2.4','raven_core':'1.12'}
          for required in ['RAH-RAVEN-VISION-VERSION.json','RAH-RAVEN-COUNCIL-VERSION.json','RAH-RAVEN-AGENT-RUNNER-VERSION.json','RAH-RAVEN-MEMORY-SYNC-VERSION.json','RAH-RAVEN-MISSION-CONTROL-VERSION.json','RAH-RAVEN-PROJECT-FOCUS-VERSION.json','RAH-RAVEN-CORE-VERSION.json']:
            assert required in m['files']
          missing=[p for p in m['files'] if not Path(p).is_file()]
          assert not missing, missing
          vision=json.loads(Path('RAH-RAVEN-VISION-VERSION.json').read_text(encoding='utf-8'))
          assert vision['version']=='0.6.0'
          assert vision['stage']=='stable'
          council=json.loads(Path('RAH-RAVEN-COUNCIL-VERSION.json').read_text(encoding='utf-8'))
          assert council['version']=='0.3.0'
          assert council['stage']=='stable'
          assert council['development_paused'] is True
          assert council['features']['local_bridge_only'] is True
          assert council['features']['external_bridge_addresses_allowed'] is False
          assert council['features']['bridge_tools_executed'] is False
          assert council['features']['bridge_automatic_actions'] is False
          agent=json.loads(Path('RAH-RAVEN-AGENT-RUNNER-VERSION.json').read_text(encoding='utf-8'))
          assert agent['version']=='0.3.0'
          assert agent['stage']=='stable'
          assert agent['runtime_feature_change'] is False
          assert agent['development_paused'] is True
          assert agent['change_policy']=='bugfix-only-until-explicit-reopen'
          assert agent['features']['local_bridge_only'] is True
          assert agent['features']['external_bridge_addresses_allowed'] is False
          assert agent['features']['backend_version_synced'] is True
          assert agent['features']['mode']=='read-only-allowlist'
          assert agent['features']['arbitrary_commands'] is False
          assert agent['features']['file_writes'] is False
          assert agent['features']['automatic_execution'] is False
          assert agent['features']['capability_set_changed'] is False
          assert agent['stable_release_gate']['status']=='passed'
          assert agent['stable_release_gate']['runtime_files_frozen'] is True
          assert agent['next_milestone'] is None
          memory=json.loads(Path('RAH-RAVEN-MEMORY-SYNC-VERSION.json').read_text(encoding='utf-8'))
          assert memory['version']=='0.2.0'
          assert memory['stage']=='stable'
          assert memory['runtime_feature_change'] is False
          assert memory['development_paused'] is True
          assert memory['change_policy']=='bugfix-only-until-explicit-reopen'
          assert memory['features']['local_bridge_only'] is True
          assert memory['features']['external_bridge_addresses_allowed'] is False
          assert memory['features']['chronicle_write_requires_explicit_confirmation'] is True
          assert memory['features']['general_background_permission'] is False
          assert memory['features']['automatic_sync'] is False
          assert memory['features']['metadata_only'] is True
          assert memory['features']['images_included'] is False
          assert memory['features']['prompts_included'] is False
          assert memory['features']['model_answers_included'] is False
          assert memory['features']['document_text_included'] is False
          assert memory['features']['command_output_included'] is False
          assert memory['features']['error_logs_included'] is False
          assert memory['features']['sync_core_runtime_changed'] is False
          assert memory['stable_release_gate']['status']=='passed'
          assert memory['stable_release_gate']['runtime_files_frozen'] is True
          assert memory['next_milestone'] is None
          mission=json.loads(Path('RAH-RAVEN-MISSION-CONTROL-VERSION.json').read_text(encoding='utf-8'))
          assert mission['version']=='2.9.0'
          assert mission['stage']=='stable'
          assert mission['runtime_feature_change'] is False
          assert mission['development_paused'] is True
          assert mission['change_policy']=='bugfix-only-until-explicit-reopen'
          assert mission['features']['local_bridge_only'] is True
          assert mission['features']['external_bridge_addresses_allowed'] is False
          assert mission['features']['chronicle_context_read_only'] is True
          assert mission['features']['mission_completion_requires_explicit_confirmation'] is True
          assert mission['features']['automatic_step_completion'] is False
          assert mission['features']['capability_set_changed'] is False
          assert mission['stable_release_gate']['status']=='passed'
          assert mission['stable_release_gate']['runtime_files_frozen'] is True
          assert mission['next_milestone'] is None
          project_focus=json.loads(Path('RAH-RAVEN-PROJECT-FOCUS-VERSION.json').read_text(encoding='utf-8'))
          assert project_focus['version']=='2.4.0'
          assert project_focus['stage']=='stable'
          assert project_focus['runtime_feature_change'] is False
          assert project_focus['development_paused'] is True
          assert project_focus['change_policy']=='bugfix-only-until-explicit-reopen'
          assert project_focus['features']['explicit_project_activation'] is True
          assert project_focus['features']['active_project_write_requires_explicit_confirmation'] is True
          assert project_focus['features']['stale_selection_guard'] is True
          assert project_focus['features']['project_identity_revalidated_before_write'] is True
          assert project_focus['features']['active_mission_write'] is False
          assert project_focus['features']['mission_step_completion'] is False
          assert project_focus['features']['agent_execution'] is False
          assert project_focus['features']['network_requests'] is False
          assert project_focus['features']['capability_set_changed'] is False
          assert project_focus['stable_release_gate']['status']=='passed'
          assert project_focus['stable_release_gate']['runtime_files_frozen'] is True
          assert project_focus['next_milestone'] is None
          core=json.loads(Path('RAH-RAVEN-CORE-VERSION.json').read_text(encoding='utf-8'))
          assert core['version']=='1.12.0'
          assert core['stage']=='stable'
          assert core['runtime_feature_change'] is False
          assert core['development_paused'] is True
          assert core['change_policy']=='bugfix-only-until-explicit-reopen'
          assert core['features']['local_bridge_only'] is True
          assert core['features']['external_bridge_addresses_allowed'] is False
          assert core['features']['dependency_cache_keys_synced'] is True
          assert core['features']['agent_execution'] is False
          assert core['features']['automatic_memory_sync'] is False
          assert core['stable_release_gate']['status']=='passed'
          assert core['stable_release_gate']['runtime_files_frozen'] is True
          assert core['next_milestone'] is None
          p=m['privacy']
          for key in ['keylogging','clipboard_capture','hidden_microphone','hidden_camera','automatic_sending','hidden_screen_capture','vision_external_bridge_addresses_allowed','council_external_bridge_addresses_allowed','agent_runner_external_bridge_addresses_allowed','memory_sync_external_bridge_addresses_allowed','memory_sync_automatic_sync','mission_control_external_bridge_addresses_allowed','mission_control_automatic_step_completion','project_focus_active_mission_write','project_focus_mission_step_completion','project_focus_agent_execution','project_focus_network_requests','raven_core_external_bridge_addresses_allowed']:
            assert p.get(key) is False, key
          required_true=[
            'memory_sync_requires_explicit_confirmation','memory_sync_local_bridge_only','memory_sync_explicit_write_only','memory_sync_metadata_only','memory_sync_stable',
            'mission_control_local_bridge_only','mission_control_chronicle_context_read_only','mission_control_stable',
            'project_focus_explicit_activation_only','project_focus_stale_selection_guard','project_focus_stable',
            'raven_core_local_bridge_only','raven_core_dependency_versions_synced','raven_core_support_snapshot_version_synced','raven_core_report_version_synced','raven_core_stable',
            'mission_completion_requires_explicit_confirmation','raven_now_read_only','project_activation_requires_explicit_confirmation',
            'recommended_checkpoint_policy_shared_module','recommended_checkpoint_module_read_only',
            'raven_context_snapshot_shared','raven_context_snapshot_read_only',
            'raven_core_continue_navigation_only','raven_core_continue_no_storage_writes',
            'raven_core_continue_no_project_switch','raven_core_continue_no_mission_mutation',
            'raven_core_continue_no_step_completion','raven_core_continue_no_agent_run',
            'vision_chatgpt_share_requires_explicit_action','vision_chatgpt_mode_no_auto_send',
            'vision_local_bridge_only','vision_helper_version_synced',
            'council_local_bridge_only','council_helper_version_synced','council_stable',
            'agent_runner_local_bridge_only','agent_runner_version_synced','agent_runner_stable',
            'raven_core_chatgpt_status_share_requires_explicit_click','raven_core_chatgpt_status_share_read_only',
            'chatgpt_handoff_history_lite_explicit_save_only','chatgpt_handoff_recall_read_only',
            'chatgpt_handoff_history_shared_policy_read_only','chatgpt_handoff_history_shared_policy_no_network',
            'chatgpt_handoff_receipt_shared_policy_read_only','chatgpt_handoff_receipt_shared_policy_no_network'
          ]
          for key in required_true: assert p.get(key) is True, key
          print('Manifest 2.0.32 / seven stable core components including Raven Core v1.12 / launcher 3.0: OK')

      - name: Validate aggregate Raven release gate and semantics
        shell: powershell
        run: |
          foreach ($module in @('raven-handoff-receipt.js','raven-handoff-history-lite.js','raven-checkpoint-policy.js','raven-vision-core.js','raven-council.js','raven-chronicle-sync.js')) {
            node --check $module
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          foreach ($test in @(
            'tests/raven-release-gate.test.mjs',
            'tests/raven-handoff-receipt-policy.test.mjs',
            'tests/raven-handoff-history-lite-policy.test.mjs',
            'tests/raven-checkpoint-policy.test.mjs',
            'tests/raven-now-v2.test.mjs',
            'tests/raven-mission-control.test.mjs',
            'tests/raven-project-focus.test.mjs',
            'tests/raven-core-demo.test.mjs',
            'tests/raven-core-local-boundary.test.mjs',
            'tests/raven-core-context.test.mjs',
            'tests/raven-core-chatgpt-status.test.mjs',
            'tests/raven-core-chatgpt-handoff-center.test.mjs',
            'tests/raven-chatgpt-handoff-session.test.mjs',
            'tests/raven-chatgpt-handoff-entry.test.mjs',
            'tests/raven-chatgpt-handoff-source-return.test.mjs',
            'tests/raven-chatgpt-handoff-resume.test.mjs',
            'tests/raven-chatgpt-handoff-receipt.test.mjs',
            'tests/raven-chatgpt-handoff-history-lite.test.mjs',
            'tests/raven-chatgpt-handoff-recall.test.mjs',
            'tests/raven-vision-core.test.mjs',
            'tests/raven-vision-local-boundary.test.mjs',
            'tests/raven-council.test.mjs',
            'tests/raven-agent-runner.test.mjs',
            'tests/raven-memory-sync.test.mjs'
          )) {
            node $test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Validate one-click chain
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-Content 'INSTALL-RAH-AI-STUDIOS.ps1' -Raw
          $updater = Get-Content 'UPDATE-RAH-RAVEN.ps1' -Raw
          $bootstrap = Get-Content 'INSTALL-RAH-AI-STUDIOS.bat' -Raw
          $starter = Get-Content 'DOBBELTKLIKK-HER-START-RAH-RAVEN.bat' -Raw
          $launcher = Get-Content 'START-RAH-RAVEN-V2.bat' -Raw
          if ($installer -notmatch 'UPDATE-RAH-RAVEN\.ps1') { throw 'Installer does not call updater.' }
          if ($installer -match '\-NoStart') { throw 'Installer suppresses first automatic Raven start.' }
          if ($updater -notmatch 'START-RAH-RAVEN-V2\.bat') { throw 'Updater does not launch Raven.' }
          if ($bootstrap -notmatch 'INSTALL-RAH-AI-STUDIOS\.ps1') { throw 'Bootstrap does not download installer.' }
          if ($starter -notmatch 'UPDATE-RAH-RAVEN\.ps1') { throw 'Desktop starter does not refresh updater.' }
          if ($launcher -notmatch 'set "RAVEN_URL=%~dp0RAH-RAVEN-NOW-V2\.html"') { throw 'Launcher does not open Raven Now v2.' }
          if ($launcher -notmatch 'set "STUDIO_URL=%~dp0RAH-RAVEN-START\.html"') { throw 'Launcher lost Studio navigation target.' }
          if ($launcher -match 'set "RAVEN_URL=%~dp0RAH-RAVEN-NOW\.html"') { throw 'Launcher reverted to Raven Now v1.' }
          Write-Host 'RAH Raven one-click -> Temporary Stable 2.0.32 + seven stable core components including Raven Core v1.12: OK'