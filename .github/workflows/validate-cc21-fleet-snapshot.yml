name: Validate CC 2.1 Fleet Snapshot Candidate
on:
  pull_request:
    paths:
      - 'RAH-COMMAND-CENTER-V2.1-CANDIDATE.html'
      - 'rah-command-center-core-v2.1-candidate.js'
      - 'RAH-CC21-FLEET-SNAPSHOT-CANDIDATE.json'
      - 'tests/rah-cc21-fleet-snapshot.test.mjs'
      - '.github/workflows/validate-cc21-fleet-snapshot.yml'
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'RAH-COMMAND-CENTER-V2.1-CANDIDATE.html'
      - 'rah-command-center-core-v2.1-candidate.js'
      - 'RAH-CC21-FLEET-SNAPSHOT-CANDIDATE.json'
      - 'tests/rah-cc21-fleet-snapshot.test.mjs'
      - '.github/workflows/validate-cc21-fleet-snapshot.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Preserve canonical CC 2.0 Stable package
        run: node --test tests/rah-command-center-packaging.test.mjs tests/rah-cc20-stable-release.test.mjs
      - name: Validate manual Fleet Snapshot Candidate
        run: node --test tests/rah-cc21-fleet-snapshot.test.mjs
      - name: Preserve Node Agent 1.3 token-proof boundary
        run: python3 -m unittest tests/test_rah_node_agent_stable_v13.py -v
