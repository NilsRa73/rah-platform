name: Validate RAH Agent Team Live v1

on:
  push:
    branches: [main]
    paths:
      - 'RAH-AGENT-TEAM-LIVE-TEST.ps1'
      - 'START-HER-RAH-AGENT-LIVE.cmd'
      - 'tests/test_agent_team_live_v1_contract.py'
      - 'tests/RAH-AGENT-TEAM-LIVE-RUNTIME-TEST.ps1'
      - 'tests/rah_agent_team_live_mock_fabric.py'
      - '.github/workflows/validate-rah-agent-team-live-v1.yml'
  pull_request:
    paths:
      - 'RAH-AGENT-TEAM-LIVE-TEST.ps1'
      - 'START-HER-RAH-AGENT-LIVE.cmd'
      - 'tests/test_agent_team_live_v1_contract.py'
      - 'tests/RAH-AGENT-TEAM-LIVE-RUNTIME-TEST.ps1'
      - 'tests/rah_agent_team_live_mock_fabric.py'
      - '.github/workflows/validate-rah-agent-team-live-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Live test static safety contract
        run: python tests/test_agent_team_live_v1_contract.py

  windows-runtime:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Parse PowerShell
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($p in @('RAH-AGENT-TEAM-LIVE-TEST.ps1','tests/RAH-AGENT-TEAM-LIVE-RUNTIME-TEST.ps1')){
            $t=$null;$e=$null
            [Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $p),[ref]$t,[ref]$e)|Out-Null
            if(@($e).Count){throw ('Parse failed: '+$p+' : '+$e[0].Message)}
          }

      - name: Live test built-in self-test
        shell: powershell
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\RAH-AGENT-TEAM-LIVE-TEST.ps1 -SelfTest
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: Full AgentBus to Raven and AI live runtime
        shell: powershell
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\tests\RAH-AGENT-TEAM-LIVE-RUNTIME-TEST.ps1
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: One-click LIVE bootstrap against PR content
        if: github.event_name == 'pull_request'
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $server=Start-Process python -ArgumentList '-m','http.server','8770','--bind','127.0.0.1' -WorkingDirectory $PWD -PassThru -WindowStyle Hidden
          try{
            Start-Sleep -Seconds 1
            $env:RAH_LIVE_TEST_URL='http://127.0.0.1:8770/RAH-AGENT-TEAM-LIVE-TEST.ps1'
            & cmd.exe /d /c 'START-HER-RAH-AGENT-LIVE.cmd --self-test'
            if($LASTEXITCODE -ne 0){throw ('LIVE CMD bootstrap failed: '+$LASTEXITCODE)}
          } finally {
            Remove-Item Env:RAH_LIVE_TEST_URL -ErrorAction SilentlyContinue
            if($server -and -not $server.HasExited){Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue}
          }

      - name: One-click LIVE bootstrap against main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: cmd
        run: START-HER-RAH-AGENT-LIVE.cmd --self-test
