name: Validate CC 1.9 Stable Release
on:
  pull_request:
    paths:
      - 'rah-command-center-core-v1.9.js'
      - 'RAH-COMMAND-CENTER-V1.9.html'
      - 'RAH-CC19-NODE13-STABLE-RELEASE.json'
      - 'tests/rah-cc19-stable-release.test.mjs'
      - '.github/workflows/validate-cc19-stable-release.yml'
  push:
    branches: [main]
    paths:
      - 'rah-command-center-core-v1.9.js'
      - 'RAH-COMMAND-CENTER-V1.9.html'
      - 'RAH-CC19-NODE13-STABLE-RELEASE.json'
      - 'tests/rah-cc19-stable-release.test.mjs'
      - '.github/workflows/validate-cc19-stable-release.yml'
permissions:
  contents: read
jobs:
  stable:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Stable-only scope guard
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch origin main --quiet
          allowed='^(rah-command-center-core-v1\.9\.js|RAH-COMMAND-CENTER-V1\.9\.html|RAH-CC19-NODE13-STABLE-RELEASE\.json|tests/rah-cc19-stable-release\.test\.mjs|\.github/workflows/validate-cc19-stable-release\.yml)$'
          bad="$(git diff --name-only origin/main...HEAD | grep -Ev "$allowed" || true)"
          test -z "$bad" || { echo "$bad"; exit 1; }
          test "$(git diff --name-only origin/main...HEAD | wc -l)" -eq 5
      - name: Re-run v1.9 Candidate immutable-intent matrix
        run: node --test tests/rah-cc19-immutable-mutating-intent.test.mjs
      - name: Validate v1.9 Stable release pins and wrapper contract
        run: node --test tests/rah-cc19-stable-release.test.mjs
      - name: Preserve canonical v1.8 and rollback release
        run: |
          node --test tests/rah-command-center-packaging.test.mjs
          node --test tests/rah-cc18-stable-release.test.mjs
      - name: Preserve unchanged Node 1.3 live security boundary
        run: python3 -m unittest tests/test_rah_node_agent_stable_v13.py -v
      - name: Preserve Raven 2.0.32 master and release gates
        run: |
          node --test tests/rah-cc18-raven-master-sync.test.mjs
          node --test tests/raven-release-gate.test.mjs
          node --test tests/raven-project-registry-v0.1.test.mjs
