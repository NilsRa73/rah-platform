name: Validate Capability Allowlist Contract

on:
  push:
    paths:
      - 'RAH-CAPABILITY-ALLOWLIST-CONTRACT.json'
      - 'RAH-CAPABILITY-ALLOWLIST-SECURITY.md'
      - 'RAH-COMMAND-CENTER-V1.4.html'
      - 'rah-command-center-core-v1.4.js'
      - 'RAH-COMMAND-CENTER-V1.3.html'
      - 'rah-command-center-core-v1.3.js'
      - 'rah-node-agent-v0.9.py'
      - 'RAH-COMMAND-CENTER-V1.2.html'
      - 'rah-command-center-core.js'
      - 'rah-node-agent.py'
      - 'tests/rah-capability-allowlist-contract.test.mjs'
      - 'tests/test_rah_node_agent_stable_v09.py'
      - '.github/workflows/validate-capability-allowlist-contract.yml'
  pull_request:
    paths:
      - 'RAH-CAPABILITY-ALLOWLIST-CONTRACT.json'
      - 'RAH-CAPABILITY-ALLOWLIST-SECURITY.md'
      - 'RAH-COMMAND-CENTER-V1.4.html'
      - 'rah-command-center-core-v1.4.js'
      - 'RAH-COMMAND-CENTER-V1.3.html'
      - 'rah-command-center-core-v1.3.js'
      - 'rah-node-agent-v0.9.py'
      - 'RAH-COMMAND-CENTER-V1.2.html'
      - 'rah-command-center-core.js'
      - 'rah-node-agent.py'
      - 'tests/rah-capability-allowlist-contract.test.mjs'
      - 'tests/test_rah_node_agent_stable_v09.py'
      - '.github/workflows/validate-capability-allowlist-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate CC 1.4 Stable ephemeral-approval boundary
        run: node --test tests/rah-capability-allowlist-contract.test.mjs
      - name: Validate unchanged Stable Node Agent 0.9 live policy endpoint
        run: python3 -m unittest tests/test_rah_node_agent_stable_v09.py
