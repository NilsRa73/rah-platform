name: Historical Policy Reference - Capability Allowlist CC1.5 / Node1.1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate historical CC1.5 / Node1.1 capability-policy contract
        run: node --test tests/rah-capability-allowlist-contract.test.mjs
      - name: Validate historical Node Agent 0.9 live policy reference
        run: python3 -m unittest tests/test_rah_node_agent_stable_v09.py
