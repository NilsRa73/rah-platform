name: Build RAH Command Center v0.3.2 Explicit Launch

on:
  push:
    branches:
      - 'agent/rah-cc-v0.3.2-explicit-launch-boundary'
    paths:
      - '.github/scripts/build_rah_cc_v0_3_2_explicit_launch.py'
      - '.github/workflows/build-rah-cc-v0.3.2-explicit-launch.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and validate v0.3.2 explicit-launch bugfix
        run: python .github/scripts/build_rah_cc_v0_3_2_explicit_launch.py
      - name: Commit Command Center bugfix candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RAH-COMMAND-CENTER-V0.3.html RAH-COMMAND-CENTER-VERSION.json rah-command-center-core.js DOBBELTKLIKK-HER-START-RAH-COMMAND-CENTER.bat tests/rah-command-center-core.test.mjs tests/rah-command-center-v03.test.mjs tests/rah-command-center-packaging.test.mjs
          if git diff --cached --quiet; then
            echo "No bugfix changes to commit"
          else
            git commit -m "RAH Command Center v0.3.2 — explicit launch boundary"
            git push
          fi
