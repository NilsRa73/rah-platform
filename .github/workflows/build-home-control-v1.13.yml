name: Build RAH Home Control v1.13

on:
  push:
    branches:
      - rah-home-control-v1.13-transaction-safe-room-screen-node
    paths:
      - '.github/workflows/build-home-control-v1.13.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rah-home-control-v1.13-transaction-safe-room-screen-node
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Home Control v1.13
        run: python .github/scripts/build_home_control_v1_13.py
      - name: Validate Home Control v1.13
        run: node tests/rah-home-control.test.mjs
      - name: Commit Home Control v1.13 runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RAH-HOME-CONTROL.html RAH-HOME-CONTROL-VERSION.json tests/rah-home-control.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Build RAH Home Control v1.13 transaction-safe room screen node mutations'
          git push origin HEAD:rah-home-control-v1.13-transaction-safe-room-screen-node
