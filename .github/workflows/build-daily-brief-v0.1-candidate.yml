name: Build Raven Daily Brief v0.1 Candidate

on:
  push:
    branches:
      - 'daily-brief/v0.1-explicit-local-boundary'
    paths:
      - '.github/scripts/build_daily_brief_v0_1_candidate.py'
      - '.github/workflows/build-daily-brief-v0.1-candidate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: daily-brief/v0.1-explicit-local-boundary
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bridge dependencies
        run: python -m pip install -r desktop-bridge/requirements.txt
      - name: Configure commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Build and validate candidate metadata
        run: python .github/scripts/build_daily_brief_v0_1_candidate.py
