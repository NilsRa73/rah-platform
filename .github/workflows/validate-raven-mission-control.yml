name: Validate Raven Mission Control v2

on:
  push:
    branches: [main]
    paths:
      - RAH-RAVEN-MISSION-CONTROL.html
      - RAH-RAVEN-START.html
      - RAH-RAVEN-CORE-DEMO.html
      - tests/raven-mission-control.test.mjs
      - .github/workflows/validate-raven-mission-control.yml
  pull_request:
    paths:
      - RAH-RAVEN-MISSION-CONTROL.html
      - RAH-RAVEN-START.html
      - RAH-RAVEN-CORE-DEMO.html
      - tests/raven-mission-control.test.mjs
      - .github/workflows/validate-raven-mission-control.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check inline JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for name in ('RAH-RAVEN-MISSION-CONTROL.html', 'RAH-RAVEN-START.html', 'RAH-RAVEN-CORE-DEMO.html'):
              html = Path(name).read_text(encoding='utf-8')
              scripts = re.findall(r'<script(?:[^>]*)>([\s\S]*?)</script>', html)
              inline = '\n'.join(scripts)
              Path(f'/tmp/{name}.js').write_text(inline, encoding='utf-8')
          PY
          node --check /tmp/RAH-RAVEN-MISSION-CONTROL.html.js
          node --check /tmp/RAH-RAVEN-START.html.js
          node --check /tmp/RAH-RAVEN-CORE-DEMO.html.js
      - name: Validate Mission Control semantics and navigation
        run: node tests/raven-mission-control.test.mjs
