name: Build Raven 2.0.23 Handoff Entries

on:
  push:
    branches: [raven-2.0.23-handoff-entry]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: raven-2.0.23-handoff-entry
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Raven 2.0.23 entries
        run: python .github/scripts/build_raven_2_0_23.py
      - name: Check inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for name in ('RAH-RAVEN-NOW-V2.html','RAH-RAVEN-START.html'):
              html=Path(name).read_text(encoding='utf-8')
              scripts=re.findall(r'<script(?:[^>]*)>([\s\S]*?)</script>',html)
              Path('/tmp/'+name+'.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/RAH-RAVEN-NOW-V2.html.js
          node --check /tmp/RAH-RAVEN-START.html.js
      - name: Test Raven 2.0.23 navigation boundaries
        run: |
          node tests/raven-checkpoint-policy.test.mjs
          node tests/raven-now-v2.test.mjs
          node tests/raven-chatgpt-handoff-session.test.mjs
          node tests/raven-chatgpt-handoff-entry.test.mjs
          node tests/raven-mission-control.test.mjs
          node tests/raven-project-focus.test.mjs
      - name: Commit tested runtime
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add RAH-RAVEN-NOW-V2.html RAH-RAVEN-START.html RAH-RAVEN-VERSION.json tests/raven-now-v2.test.mjs tests/raven-chatgpt-handoff-entry.test.mjs
          git commit -m "Expose ChatGPT Handoff from Raven Now and Studio for 2.0.23"
          git push origin HEAD:raven-2.0.23-handoff-entry
