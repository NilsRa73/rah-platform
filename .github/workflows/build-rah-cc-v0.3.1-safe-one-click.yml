name: Build RAH Command Center v0.3.1 Safe One-Click

on:
  push:
    branches:
      - 'agent/rah-cc-v0.3.1-safe-one-click'
    paths:
      - '.github/scripts/build_rah_cc_v0_3_1_safe_one_click.py'
      - '.github/workflows/build-rah-cc-v0.3.1-safe-one-click.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Correct release-neutral footer anchor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/build_rah_cc_v0_3_1_safe_one_click.py')
          text = p.read_text(encoding='utf-8')
          old = 'html = html.replace("RAH Raven Command Center v0.3 candidate · no mission mutation · no project activation · no agent execution · no automatic sending.", "RAH Raven Command Center v0.3.1 · read-only package integration · no mission mutation · no project activation · no agent execution · no automatic sending.")'
          new = 'html = html.replace("RAH Raven Command Center v0.3.1 candidate · no mission mutation · no project activation · no agent execution · no automatic sending.", "RAH Raven Command Center v0.3.1 · read-only package integration · no mission mutation · no project activation · no agent execution · no automatic sending.")'
          assert old in text
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Build and validate safe one-click candidate
        run: python .github/scripts/build_rah_cc_v0_3_1_safe_one_click.py
      - name: Commit Command Center candidate files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RAH-COMMAND-CENTER-V0.3.html RAH-COMMAND-CENTER-VERSION.json rah-command-center-core.js DOBBELTKLIKK-HER-START-RAH-COMMAND-CENTER.bat tests/rah-command-center-core.test.mjs tests/rah-command-center-v03.test.mjs tests/rah-command-center-packaging.test.mjs
          if git diff --cached --quiet; then
            echo "No candidate changes to commit"
          else
            git commit -m "RAH Command Center v0.3.1 — safe one-click boundary"
            git push
          fi
