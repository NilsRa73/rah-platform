name: Build Isolated CC23 Generation 8 Release

on:
  pull_request:
    branches:
      - release/cc23-generation8-base

permissions:
  contents: write

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/cc23-generation8-package'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build or validate canonical generation 8 package files
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('.')
          p=root/'RAH-COMMAND-CENTER-VERSION.json'
          m=json.loads(p.read_text(encoding='utf-8'))
          caps=['compute','storage','display','remote-desktop']
          actions=['storage-summary.read','rustdesk.launch','rustdesk.connect']
          routes=['/health','/actions','/storage','/launch/rustdesk','/handoff/rustdesk']
          def security(m):
              assert m['product']=='RAH Raven Command Center' and m['raven_contract']=='2.0.32'
              assert m['node_agent']['agent_version']=='1.3.0'
              assert m['node_agent']['actions_protocol']=='rah-node-actions-v7'
              assert m['node_agent']['auth_protocol']=='rah-node-auth-v2'
              assert m['node_agent']['capability_allowlist']==caps
              assert m['node_agent']['action_allowlist']==actions
              assert [m['node_agent']['health_path'],m['node_agent']['actions_path'],m['node_agent']['storage_path'],m['node_agent']['rustdesk_launch_path'],m['node_agent']['rustdesk_handoff_path']]==routes
              for k in ['approved_action_requires_advertised_action','approved_action_requires_capability','action_execution_requires_local_approval','fresh_node_agent_token_required','action_execution_requires_token_proof','token_proof_authentication','node_local_human_confirmation']:
                  assert m['features'][k] is True,k
              for k in ['token_network_transport','bearer_authorization_transport','generic_process_launch','generic_action_endpoint','shell_access','file_access','device_commands','remote_control','network_discovery','device_background_polling','rustdesk_handoff_peer_id_persistence','rustdesk_handoff_password_persistence','rustdesk_launch_user_supplied_path','rustdesk_launch_user_supplied_arguments','rustdesk_handoff_user_supplied_path','rustdesk_handoff_user_supplied_arguments']:
                  assert m['features'][k] is False,k
              for k in ['commands','files','shell','remoteControl']: assert m['node_agent']['permissions'][k] is False,k
          security(m)
          prepend=['RAH-COMMAND-CENTER-V2.3.html','RAH-COMMAND-CENTER-V2.3-CANDIDATE.html','rah-command-center-core-v2.3-candidate.js','rah-command-center-core-v2.3.js','RAH-CC23-FLEET-SNAPSHOT-REGISTRY-BINDING-CANDIDATE.json','RAH-CC23-NODE13-STABLE-RELEASE.json']
          if m['version']=='2.2.0':
              assert m['canonical_package_generation']==7 and m['features']['canonical_package_dependency_count']==55
              old=list(m['package_files']);assert len(old)==55==len(set(old))
              for x in prepend: assert x not in old and (root/x).is_file(),x
              m['version']='2.3.0';m['released_at']='2026-08-18';m['entry']='RAH-COMMAND-CENTER-V2.3.html';m['runtime']='rah-command-center-core-v2.3.js';m['previous_stable_version']='2.2.0';m['package_files']=prepend+old
              f=m['features'];f['canonical_package_dependency_count']=61;f['canonical_v23_package']=True;f['fleet_snapshot_registry_binding']=True;f['fleet_snapshot_registry_binding_version']='rah-cc-fleet-snapshot-registry-binding-v1';f['fleet_snapshot_registry_policy']='prune-row-on-registry-identity-drift';f['fleet_snapshot_registry_identity_fields']=['deviceId','endpointIp','sessionId'];f['fleet_snapshot_registry_prune_removed_device']=True;f['fleet_snapshot_registry_prune_endpoint_change']=True;f['fleet_snapshot_registry_prune_node_session_change']=True;f['fleet_snapshot_registry_same_page_signal']='device-grid-mutation-observer';f['fleet_snapshot_registry_cross_tab_signal']='storage-event-exact-device-registry-key';f['fleet_snapshot_registry_timers']=False
              rg=m['release_gate'];rg['status']='passed';rg['gate_version']='2.6.0';rg['requires_tests']=['tests/rah-command-center-packaging.test.mjs','tests/rah-cc23-fleet-snapshot-registry-binding.test.mjs','tests/rah-cc23-stable-readiness.test.mjs','tests/rah-cc23-stable-release.test.mjs','tests/test_rah_node_agent_stable_v13.py'];rg['stable_raven_runtime_frozen']=True;rg['runtime_files_frozen']=True;rg['change_policy']='bugfix-only-until-explicit-reopen'
              m['runtime_feature_change']=False;m['development_reopened']=True;m['development_paused']=True;m['change_policy']='bugfix-only-until-explicit-reopen';m['stable_since']='2026-08-18';m['stable_release_manifest']='RAH-CC23-NODE13-STABLE-RELEASE.json';m['canonical_package_generation']=8
              p.write_text(json.dumps(m,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          else: assert m['version']=='2.3.0'
          security(m)
          assert m['entry']=='RAH-COMMAND-CENTER-V2.3.html' and m['runtime']=='rah-command-center-core-v2.3.js'
          assert m['previous_stable_version']=='2.2.0' and m['stable_release_manifest']=='RAH-CC23-NODE13-STABLE-RELEASE.json'
          assert m['canonical_package_generation']==8 and m['features']['canonical_package_dependency_count']==61
          assert len(m['package_files'])==61==len(set(m['package_files'])) and m['package_files'][:6]==prepend
          for x in m['package_files']: assert (root/x).is_file(),x
          assert m['features']['fleet_snapshot_failure_policy']=='invalidate-selected-row-on-refresh-failure'
          assert m['features']['fleet_snapshot_registry_policy']=='prune-row-on-registry-identity-drift'
          launcher='''@echo off\nsetlocal EnableExtensions\ncd /d "%~dp0"\ntitle RAH Raven Command Center\nset "CC_PAGE=%~dp0RAH-COMMAND-CENTER-V2.3.html"\nif not exist "%CC_PAGE%" goto :missing\necho.\necho  RAH RAVEN COMMAND CENTER v2.3.0 STABLE\necho  =======================================\necho  Lokal start. Ingen nedlasting eller automatisk oppdatering ved oppstart.\necho  Node-token sendes ikke over LAN; token-proof HMAC brukes per request.\necho  Fleet Snapshot er memory-only og registry-bound; fjernet eller endret Node-identitet pruner gammel rad.\necho  For manuell oppdatering: start UPDATE-RAH-COMMAND-CENTER.ps1 selv.\necho.\nstart "" "%CC_PAGE%"\nexit /b 0\n:missing\necho.\necho FEIL: RAH-COMMAND-CENTER-V2.3.html ble ikke funnet i denne mappen.\necho Kjoer UPDATE-RAH-RAVEN.ps1 en gang dersom denne installasjonen kommer fra en eldre pakke.\necho Ingen filer er endret eller lastet ned av launcheren.\necho.\npause\nexit /b 1\n'''
          Path('DOBBELTKLIKK-HER-START-RAH-COMMAND-CENTER.bat').write_text(launcher,encoding='utf-8')
          print('CC23 generation8 package PASS')
          PY
      - name: Remove builder/request and commit generated inputs
        run: |
          rm -f .github/workflows/build-cc23-generation8-release.yml RAH-CC23-GENERATION8-BUILD-REQUEST.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A && git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build CC 2.3 canonical generation 8 package inputs'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
