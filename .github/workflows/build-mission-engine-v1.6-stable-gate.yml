name: Build Mission Engine v1.6 Stable Gate

on:
  push:
    branches:
      - mission-engine/v1.6-stable-gate
    paths:
      - .github/scripts/build_mission_engine_v1_6_stable.py
      - .github/workflows/build-mission-engine-v1.6-stable-gate.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mission-engine/v1.6-stable-gate
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and validate Stable Gate
        run: python .github/scripts/build_mission_engine_v1_6_stable.py
      - name: Commit Stable Gate metadata
        run: |
          git config user.name "RAH Raven Builder"
          git config user.email "actions@users.noreply.github.com"
          git add RAH-RAVEN-MISSION-ENGINE-VERSION.json RAH-RAVEN-VERSION.json tests/mission-engine.test.mjs
          git diff --cached --quiet || git commit -m "chore: promote Mission Engine v1.6 to stable"
          git push origin HEAD:mission-engine/v1.6-stable-gate
