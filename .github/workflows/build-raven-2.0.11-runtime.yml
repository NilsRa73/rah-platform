name: Persist tested Raven 2.0.11 runtime

on:
  push:
    branches: [raven-2.0.11-shared-checkpoint-policy]
    paths:
      - .github/workflows/build-raven-2.0.11-runtime.yml

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: raven-2.0.11-shared-checkpoint-policy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reuse the already-tested 2.0.11 transformation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/build-raven-2.0.11.yml').read_text(encoding='utf-8')
          start=src.index('      - name: Extract checkpoint policy and update Raven surfaces')
          run_start=src.index('        run: |\n', start)+len('        run: |\n')
          end=src.index('      - name: Commit generated 2.0.11 changes', run_start)
          lines=src[run_start:end].splitlines()
          script='\n'.join(line[10:] if line.startswith('          ') else line for line in lines)+'\n'
          Path('/tmp/rah-build-2.0.11.sh').write_text(script,encoding='utf-8')
          PY
          bash /tmp/rah-build-2.0.11.sh
      - name: Commit only runtime, manifest and tests
        shell: bash
        run: |
          git config user.name "RAH Raven Builder"
          git config user.email "actions@users.noreply.github.com"
          git add raven-checkpoint-policy.js RAH-RAVEN-NOW-V2.html RAH-RAVEN-MISSION-CONTROL.html RAH-RAVEN-VERSION.json tests/raven-checkpoint-policy.test.mjs tests/raven-now-v2.test.mjs tests/raven-mission-control.test.mjs
          git diff --cached --check
          git commit -m "Extract shared Raven checkpoint policy for 2.0.11"
          git push origin HEAD:raven-2.0.11-shared-checkpoint-policy
