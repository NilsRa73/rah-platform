name: Validate Raven Care Hub v0.5 Historical Stable

on:
  push:
    paths:
      - 'RAH-RAVEN-CARE-HUB-V0.5-STABLE.html'
      - 'RAH-RAVEN-CARE-HUB-V0.5-STABLE.json'
      - 'RAH-RAVEN-CARE-HUB-V0.5-CANDIDATE.html'
      - 'RAH-RAVEN-CARE-HUB-V0.5-CANDIDATE.json'
      - 'RAH-RAVEN-CARE-HUB-V0.5-STABLE-RELEASE.json'
      - 'tests/raven-care-hub-v0.5-stable.test.mjs'
      - '.github/workflows/validate-raven-care-hub-v0.5-stable.yml'
  pull_request:
    paths:
      - 'RAH-RAVEN-CARE-HUB-V0.5-STABLE.html'
      - 'RAH-RAVEN-CARE-HUB-V0.5-STABLE.json'
      - 'RAH-RAVEN-CARE-HUB-V0.5-CANDIDATE.html'
      - 'RAH-RAVEN-CARE-HUB-V0.5-CANDIDATE.json'
      - 'RAH-RAVEN-CARE-HUB-V0.5-STABLE-RELEASE.json'
      - 'tests/raven-care-hub-v0.5-stable.test.mjs'
      - '.github/workflows/validate-raven-care-hub-v0.5-stable.yml'
permissions: {contents: read}
jobs:
  historical-stable:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node tests/raven-care-hub-v0.5-stable.test.mjs
      - run: node tests/raven-care-hub-v0.5-candidate.test.mjs
      - run: node tests/raven-care-hub-v0.5-stable-readiness.test.mjs
      - run: node tests/raven-care-hub-v0.4.test.mjs
