name: Build Raven System Health v1.7 Candidate

on:
  workflow_dispatch:
  push:
    branches:
      - system-health/v1.7-explicit-check-boundary
    paths:
      - '.github/scripts/build_system_health_v1_7_candidate.py'
      - '.github/workflows/build-system-health-v1.7-candidate.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: system-health/v1.7-explicit-check-boundary
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check candidate builder syntax
        run: python -m py_compile .github/scripts/build_system_health_v1_7_candidate.py

      - name: Build System Health explicit-check candidate
        run: python .github/scripts/build_system_health_v1_7_candidate.py

      - name: Validate System Health candidate
        run: |
          node --check system-health-v1.7.js
          node tests/system-health.test.mjs
          node tests/raven-release-gate.test.mjs

      - name: Assert candidate diff scope
        shell: python
        run: |
          import shutil
          import subprocess
          shutil.rmtree('.github/scripts/__pycache__', ignore_errors=True)
          expected={
            'SYSTEM_HEALTH_V1_7.md',
            'RAH-RAVEN-SYSTEM-HEALTH-VERSION.json',
            'RAH-RAVEN-VERSION.json',
            'index.html',
            'system-health-v1.7.js',
            'tests/system-health.test.mjs',
          }
          changed=set(subprocess.check_output(['git','status','--short'],text=True).splitlines())
          paths={line[3:] for line in changed if len(line)>=4}
          assert paths==expected,(paths,expected)
          print('System Health candidate diff scope: OK')

      - name: Commit System Health candidate product files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SYSTEM_HEALTH_V1_7.md \
                  RAH-RAVEN-SYSTEM-HEALTH-VERSION.json \
                  RAH-RAVEN-VERSION.json \
                  index.html \
                  system-health-v1.7.js \
                  tests/system-health.test.mjs
          git commit -m 'Raven System Health v1.7 explicit check boundary'
          git push origin HEAD:system-health/v1.7-explicit-check-boundary
