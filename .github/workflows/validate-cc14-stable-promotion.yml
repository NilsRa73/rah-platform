name: Validate CC 1.4 Stable Historical Reference

on:
  push:
    paths:
      - 'RAH-CC14-STABLE-RELEASE.json'
      - 'RAH-COMMAND-CENTER-V1.4.html'
      - 'rah-command-center-core-v1.4.js'
      - 'rah-node-agent-v0.9.py'
      - '.github/workflows/validate-cc14-stable-promotion.yml'
  pull_request:
    paths:
      - 'RAH-CC14-STABLE-RELEASE.json'
      - 'RAH-COMMAND-CENTER-V1.4.html'
      - 'rah-command-center-core-v1.4.js'
      - 'rah-node-agent-v0.9.py'
      - '.github/workflows/validate-cc14-stable-promotion.yml'

permissions:
  contents: read

jobs:
  historical-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify frozen CC 1.4 and Node 0.9 runtime blobs
        shell: bash
        run: |
          test "$(git hash-object rah-command-center-core-v1.4.js)" = "0e376b28b420760365321a31e963aef8b17d7a87"
          test "$(git hash-object RAH-COMMAND-CENTER-V1.4.html)" = "4645dec79201cc630b6f9d39ad6138cc7c1f2183"
          test "$(git hash-object rah-node-agent-v0.9.py)" = "e8774e3dc93e1a4bb431994b5020be0e6354023a"
      - name: Verify frozen CC 1.4 authority identity
        run: node -e "const c=require('./rah-command-center-core-v1.4.js');if(c.CC_VERSION!=='1.4.0'||c.NODE_ACTIONS_PROTOCOL!=='rah-node-actions-v4'||c.CAPABILITY_IDS.length!==4||c.ACTION_IDS.length!==3)process.exit(1)"
      - name: Verify frozen Node 0.9 identity
        run: python3 -c "import importlib.util; s=importlib.util.spec_from_file_location('n','rah-node-agent-v0.9.py');m=importlib.util.module_from_spec(s);s.loader.exec_module(m); assert m.AGENT_VERSION=='0.9.0'; assert m.ACTIONS_PROTOCOL=='rah-node-actions-v4'"
