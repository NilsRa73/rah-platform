name: Validate Raven Daily Driver Legacy Acceptance Compatibility

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ACCEPT-RAH-RAVEN-OWNED-MACHINE.bat'
      - 'OWNED-MACHINE-ACCEPT-RAH-RAVEN.ps1'
      - 'OWNED-MACHINE-ACCEPTANCE.md'
      - 'REVIEW-RAH-RAVEN-DAILY-DRIVER-STABLE.py'
      - 'RAH-RAVEN-DAILY-DRIVER-VERSION.json'
      - 'RAH-RAVEN-DAILY-DRIVER-PACKAGE.json'
      - 'RAH-RAVEN-DAILY-DRIVER-FINAL.ps1'
      - 'START-HER-RAH-RAVEN-DAILY-DRIVER.cmd'
      - '.github/workflows/build-raven-daily-driver-owned-machine-acceptance.yml'
  pull_request:
    paths:
      - 'ACCEPT-RAH-RAVEN-OWNED-MACHINE.bat'
      - 'OWNED-MACHINE-ACCEPT-RAH-RAVEN.ps1'
      - 'OWNED-MACHINE-ACCEPTANCE.md'
      - 'REVIEW-RAH-RAVEN-DAILY-DRIVER-STABLE.py'
      - 'RAH-RAVEN-DAILY-DRIVER-VERSION.json'
      - 'RAH-RAVEN-DAILY-DRIVER-PACKAGE.json'
      - 'RAH-RAVEN-DAILY-DRIVER-FINAL.ps1'
      - 'START-HER-RAH-RAVEN-DAILY-DRIVER.cmd'
      - '.github/workflows/build-raven-daily-driver-owned-machine-acceptance.yml'

permissions:
  contents: read

jobs:
  windows-compatibility:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse legacy compatibility PowerShell
        shell: pwsh
        run: |
          $tokens=$null;$errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'OWNED-MACHINE-ACCEPT-RAH-RAVEN.ps1'),
            [ref]$tokens,[ref]$errors
          )
          if($errors.Count){$errors|Format-List|Out-String|Write-Host;throw 'Compatibility PowerShell parse failed'}
      - name: Run old BAT through Stable finalizer self-test
        shell: cmd
        run: ACCEPT-RAH-RAVEN-OWNED-MACHINE.bat --self-test
      - name: Run legacy review compatibility self-test
        shell: pwsh
        run: |
          python REVIEW-RAH-RAVEN-DAILY-DRIVER-STABLE.py --self-test
          if($LASTEXITCODE -ne 0){throw 'Legacy Stable-review compatibility self-test failed'}
      - name: Prove Stable lifecycle and 39-file package
        shell: pwsh
        run: |
          $v=Get-Content RAH-RAVEN-DAILY-DRIVER-VERSION.json -Raw|ConvertFrom-Json
          $p=Get-Content RAH-RAVEN-DAILY-DRIVER-PACKAGE.json -Raw|ConvertFrom-Json
          if($v.stage -ne 'stable' -or $v.stable_gate.status -ne 'passed'){throw 'Daily Driver Stable lifecycle drift'}
          if($v.authority_delta -ne 'none'){throw 'Daily Driver authority drift'}
          if($p.stage -ne 'stable-package' -or $p.packageFileCount -ne 39 -or @($p.packageFiles).Count -ne 39){throw 'Stable 39-file package drift'}
          if($p.runtimePolicy.candidateOnly -or -not $p.runtimePolicy.stablePromotionIncluded){throw 'Stable package policy drift'}
          foreach($legacy in @(
            'ACCEPT-RAH-RAVEN-OWNED-MACHINE.bat',
            'OWNED-MACHINE-ACCEPT-RAH-RAVEN.ps1',
            'OWNED-MACHINE-ACCEPTANCE.md',
            'REVIEW-RAH-RAVEN-DAILY-DRIVER-STABLE.py'
          )){
            if($p.packageFiles -contains $legacy){throw "Legacy compatibility entered Stable runtime package: $legacy"}
          }
      - name: Prove fixed compatibility handoff
        shell: pwsh
        run: |
          $bat=Get-Content ACCEPT-RAH-RAVEN-OWNED-MACHINE.bat -Raw
          $ps=Get-Content OWNED-MACHINE-ACCEPT-RAH-RAVEN.ps1 -Raw
          $review=Get-Content REVIEW-RAH-RAVEN-DAILY-DRIVER-STABLE.py -Raw
          if(-not $bat.Contains('OWNED-MACHINE-ACCEPT-RAH-RAVEN.ps1')){throw 'Legacy BAT fixed wrapper missing'}
          if(-not $ps.Contains('RAH-RAVEN-DAILY-DRIVER-FINAL.ps1')){throw 'Stable finalizer handoff missing'}
          if(-not $ps.Contains('already Stable')){throw 'Stable lifecycle notice missing'}
          if(-not $review.Contains('ALREADY_STABLE')){throw 'Legacy verifier Stable status missing'}
          if($ps -match 'Invoke-Expression|\biex\b'){throw 'Dynamic PowerShell execution forbidden'}
          if($review -match 'subprocess|os\.system|Popen|requests|urllib|socket|git push|git commit|git merge'){throw 'Legacy verifier must remain read-only/offline'}

  linux-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run lifecycle compatibility verifier
        run: python REVIEW-RAH-RAVEN-DAILY-DRIVER-STABLE.py --self-test
      - name: Require compatibility-only PR scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          printf '%s\n' "$changed"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^(ACCEPT-RAH-RAVEN-OWNED-MACHINE\.bat|OWNED-MACHINE-ACCEPT-RAH-RAVEN\.ps1|OWNED-MACHINE-ACCEPTANCE\.md|REVIEW-RAH-RAVEN-DAILY-DRIVER-STABLE\.py|\.github/workflows/build-raven-daily-driver-owned-machine-acceptance\.yml)$' || true)"
          if [ -n "$bad" ]; then
            echo 'Unexpected legacy-compatibility scope:'
            printf '%s\n' "$bad"
            exit 1
          fi
