name: Validate Raven Vision Core

on:
  push:
    paths:
      - raven-vision-core.js
      - RAH-RAVEN-VISION-CORE.html
      - RAH-RAVEN-VISION-VERSION.json
      - RAH-RAVEN-CORE-DEMO.html
      - RAH-RAVEN-NOW-V2.html
      - RAH-RAVEN-START.html
      - tests/raven-vision-core.test.mjs
      - tests/raven-vision-local-boundary.test.mjs
      - tests/raven-chatgpt-handoff-source-return.test.mjs
      - .github/workflows/integrate-vision.yml
      - .github/workflows/validate-raven-vision-core.yml
  pull_request:
    paths:
      - raven-vision-core.js
      - RAH-RAVEN-VISION-CORE.html
      - RAH-RAVEN-VISION-VERSION.json
      - RAH-RAVEN-CORE-DEMO.html
      - RAH-RAVEN-NOW-V2.html
      - RAH-RAVEN-START.html
      - tests/raven-vision-core.test.mjs
      - tests/raven-vision-local-boundary.test.mjs
      - tests/raven-chatgpt-handoff-source-return.test.mjs
      - .github/workflows/integrate-vision.yml
      - .github/workflows/validate-raven-vision-core.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify legacy write-enabled Vision integrator stays retired
        run: test ! -e .github/workflows/integrate-vision.yml
      - name: Check Vision Core syntax
        run: node --check raven-vision-core.js
      - name: Check inline Vision and Core JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for name in ('RAH-RAVEN-VISION-CORE.html','RAH-RAVEN-CORE-DEMO.html'):
              html = Path(name).read_text(encoding='utf-8')
              scripts = re.findall(r'<script(?:[^>]*)>([\s\S]*?)</script>', html)
              Path('/tmp/' + name + '.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/RAH-RAVEN-VISION-CORE.html.js
          node --check /tmp/RAH-RAVEN-CORE-DEMO.html.js
      - name: Run Raven Vision v0.6 validation
        run: node tests/raven-vision-core.test.mjs
      - name: Validate Vision v0.6 local bridge boundary
        run: node tests/raven-vision-local-boundary.test.mjs
      - name: Validate source-aware Handoff return
        run: node tests/raven-chatgpt-handoff-source-return.test.mjs
