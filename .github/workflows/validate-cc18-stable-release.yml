name: Validate CC 1.8 Stable Release
on:
  pull_request:
    paths:
      - 'rah-command-center-core-v1.8.js'
      - 'RAH-COMMAND-CENTER-V1.8.html'
      - 'RAH-CC18-NODE13-STABLE-RELEASE.json'
      - 'tests/rah-cc18-stable-release.test.mjs'
      - '.github/workflows/validate-cc18-stable-release.yml'
  push:
    branches: [main]
    paths:
      - 'rah-command-center-core-v1.8.js'
      - 'RAH-COMMAND-CENTER-V1.8.html'
      - 'RAH-CC18-NODE13-STABLE-RELEASE.json'
      - 'tests/rah-cc18-stable-release.test.mjs'
      - '.github/workflows/validate-cc18-stable-release.yml'
permissions: {contents: read}
jobs:
  stable:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Stable-only scope guard
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch origin main --quiet
          allowed='^(rah-command-center-core-v1\.8\.js|RAH-COMMAND-CENTER-V1\.8\.html|RAH-CC18-NODE13-STABLE-RELEASE\.json|tests/rah-cc18-stable-release\.test\.mjs|\.github/workflows/validate-cc18-stable-release\.yml)$'
          bad="$(git diff --name-only origin/main...HEAD|grep -Ev "$allowed"||true)"
          test -z "$bad" || { echo "$bad"; exit 1; }
      - name: Re-run v1.8 Candidate one-shot matrix
        run: node --test tests/rah-cc18-one-shot-mutating-approval.test.mjs
      - name: Validate v1.8 Stable release pins and wrapper contract
        run: node --test tests/rah-cc18-stable-release.test.mjs
      - name: Preserve v1.7 direct rollback release
        run: node --test tests/rah-cc17-stable-release.test.mjs
      - name: Preserve unchanged Node 1.3 live security boundary
        run: python3 -m unittest tests/test_rah_node_agent_stable_v13.py -v
      - name: Preserve current canonical package baseline
        run: node --test tests/rah-command-center-packaging.test.mjs
      - name: Preserve Raven 2.0.32 release gate
        run: node --test tests/raven-release-gate.test.mjs
