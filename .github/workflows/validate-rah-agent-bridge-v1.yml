name: Validate RAH Agent Bridge v1

on:
  push:
    branches: [main]
    paths:
      - 'rah_agent_bridge.py'
      - 'rah_agent_worker.py'
      - 'RAH-AGENT-BUS.ps1'
      - 'INSTALL-RAH-AGENT-BRIDGE.ps1'
      - 'START-HER-RAH-AGENT-BRIDGE.cmd'
      - 'tests/test_agent_bridge_v1_contract.py'
      - 'tests/RAH-AGENT-BRIDGE-RUNTIME-TEST.ps1'
      - 'tests/RAH-AGENT-WORKER-RUNTIME-TEST.ps1'
      - 'tests/rah_agent_worker_mock_fabric.py'
      - '.github/workflows/validate-rah-agent-bridge-v1.yml'
  pull_request:
    paths:
      - 'rah_agent_bridge.py'
      - 'RAH-AGENT-BUS.ps1'
      - 'INSTALL-RAH-AGENT-BRIDGE.ps1'
      - 'START-HER-RAH-AGENT-BRIDGE.cmd'
      - 'tests/test_agent_bridge_v1_contract.py'
      - 'tests/RAH-AGENT-BRIDGE-RUNTIME-TEST.ps1'
      - '.github/workflows/validate-rah-agent-bridge-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Agent Bridge static contract
        run: python tests/test_agent_bridge_v1_contract.py

  windows-runtime:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Parse Agent Bridge PowerShell
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($p in @('RAH-AGENT-BUS.ps1','INSTALL-RAH-AGENT-BRIDGE.ps1','tests/RAH-AGENT-BRIDGE-RUNTIME-TEST.ps1','tests/RAH-AGENT-WORKER-RUNTIME-TEST.ps1')){
            $t=$null;$e=$null
            [Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $p),[ref]$t,[ref]$e)|Out-Null
            if(@($e).Count){throw ('Parse failed: ' + $p + ' : ' + $e[0].Message)}
          }
      - name: Full localhost queue runtime
        shell: powershell
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\tests\RAH-AGENT-BRIDGE-RUNTIME-TEST.ps1
      - name: Agent Worker queue-to-AI-Fabric runtime
        shell: powershell
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\tests\RAH-AGENT-WORKER-RUNTIME-TEST.ps1
      - name: One-click CMD bootstrap against PR content
        if: github.event_name == 'pull_request'
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $server=Start-Process python -ArgumentList '-m','http.server','8767','--bind','127.0.0.1' -WorkingDirectory $PWD -PassThru -WindowStyle Hidden
          try{
            Start-Sleep -Seconds 1
            $env:RAH_AGENT_INSTALL_URL='http://127.0.0.1:8767/INSTALL-RAH-AGENT-BRIDGE.ps1'
            $env:RAH_AGENT_SOURCE_DIR=$PWD
            & cmd.exe /d /c 'START-HER-RAH-AGENT-BRIDGE.cmd --self-test'
            if($LASTEXITCODE -ne 0){throw ('CMD bootstrap failed: ' + $LASTEXITCODE)}
          } finally {
            Remove-Item Env:RAH_AGENT_INSTALL_URL -ErrorAction SilentlyContinue
            Remove-Item Env:RAH_AGENT_SOURCE_DIR -ErrorAction SilentlyContinue
            if($server -and -not $server.HasExited){Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue}
          }
      - name: One-click CMD bootstrap against main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: cmd
        run: START-HER-RAH-AGENT-BRIDGE.cmd --self-test
