name: Validate Raven Studio v2.9 Retirement Compatibility

on:
  pull_request:
    paths:
      - 'RAH-RAVEN-START-V2.9-CANDIDATE.html'
      - 'RAH-RAVEN-STUDIO-V2.9-CANDIDATE.json'
      - 'RAH-RAVEN-STUDIO-V3.0.json'
      - 'tests/raven-studio-v2.9-candidate.test.mjs'
      - 'tests/test_raven_studio_v30.py'
      - '.github/workflows/validate-raven-studio-v2.9-candidate.yml'
  push:
    branches: [main]
    paths:
      - 'RAH-RAVEN-START-V2.9-CANDIDATE.html'
      - 'RAH-RAVEN-STUDIO-V2.9-CANDIDATE.json'
      - 'RAH-RAVEN-STUDIO-V3.0.json'
      - 'tests/raven-studio-v2.9-candidate.test.mjs'
      - 'tests/test_raven_studio_v30.py'
      - '.github/workflows/validate-raven-studio-v2.9-candidate.yml'

permissions:
  contents: read

jobs:
  retirement-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate retired Studio 2.9 contract
        run: node --test tests/raven-studio-v2.9-candidate.test.mjs
      - name: Re-prove current Studio 3.0 Stable contract
        run: python tests/test_raven_studio_v30.py
