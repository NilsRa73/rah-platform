name: Historical Policy Reference - Policy ID Candidate / CC1.3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-policy-id:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate historical Stable allowlist guard
        run: node --test tests/rah-capability-allowlist-contract.test.mjs
      - name: Validate historical Command Center 1.3 policy binding and browser loader
        run: node --test tests/rah-policy-id-candidate.test.mjs
      - name: Validate historical Node Agent policy binding
        run: python3 -m unittest tests/test_rah_node_agent_policy_candidate.py
