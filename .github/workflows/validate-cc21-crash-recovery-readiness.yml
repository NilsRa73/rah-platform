name: Validate CC 2.1 Crash Recovery Readiness

on:
  pull_request:
    paths:
      - 'RAH-CC21-CRASH-RECOVERY-READINESS.json'
      - 'RAH-CC21-CRASH-RECOVERY-THREAT-MODEL.md'
      - 'tests/rah-cc21-crash-recovery-readiness.test.mjs'
      - '.github/workflows/validate-cc21-crash-recovery-readiness.yml'
  push:
    branches: [main]
    paths:
      - 'RAH-CC21-CRASH-RECOVERY-READINESS.json'
      - 'RAH-CC21-CRASH-RECOVERY-THREAT-MODEL.md'
      - 'tests/rah-cc21-crash-recovery-readiness.test.mjs'
      - '.github/workflows/validate-cc21-crash-recovery-readiness.yml'

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Readiness-only scope guard
        shell: bash
        run: |
          git fetch origin main --quiet
          allowed='^(RAH-CC21-CRASH-RECOVERY-READINESS\.json|RAH-CC21-CRASH-RECOVERY-THREAT-MODEL\.md|tests/rah-cc21-crash-recovery-readiness\.test\.mjs|\.github/workflows/validate-cc21-crash-recovery-readiness\.yml)$'
          bad="$(git diff --name-only origin/main...HEAD | grep -Ev "$allowed" || true)"
          if [ -n "$bad" ]; then
            echo 'Crash recovery readiness changed files outside the evidence-only allowlist:'
            echo "$bad"
            exit 1
          fi
      - name: Re-run canonical package and updater contract
        run: node --test tests/rah-command-center-packaging.test.mjs
      - name: Re-run recursive dependency integrity
        run: node --test tests/rah-cc21-canonical-dependency-integrity.test.mjs
      - name: Re-run immutable release trust anchor
        run: node --test tests/rah-cc21-updater-trust-anchor.test.mjs
      - name: Re-run downloaded Git blob verification
        run: node --test tests/rah-cc21-downloaded-blob-verification.test.mjs
      - name: Re-run transactional staging and rollback-safe activation contract
        run: node --test tests/rah-cc21-transactional-package-staging.test.mjs
      - name: Re-run Stable Node Agent 1.3 token-proof gate
        run: python3 -m unittest tests/test_rah_node_agent_stable_v13.py -v
      - name: Validate crash-recovery implementation readiness
        run: node --test tests/rah-cc21-crash-recovery-readiness.test.mjs
