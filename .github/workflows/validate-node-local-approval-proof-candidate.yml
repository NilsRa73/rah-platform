name: Validate Node-local Approval Proof Candidate Reference

on:
  push:
    paths:
      - 'rah-node-agent-v1.0-candidate.py'
      - 'RAH-NODE-LOCAL-APPROVAL-PROOF-CANDIDATE.json'
      - 'tests/test_rah_node_agent_local_approval_candidate.py'
      - 'RAH-NODE-LOCAL-APPROVAL-PROOF-CANDIDATE-GATE.json'
      - 'RAH-NODE-LOCAL-APPROVAL-PROOF-CANDIDATE-DESIGN.md'
      - 'RAH-NODE-LOCAL-APPROVAL-PROOF-RESEARCH.json'
      - 'RAH-NODE-LOCAL-APPROVAL-PROOF-THREAT-MODEL.md'
      - 'RAH-CC14-STABLE-RELEASE.json'
      - '.github/workflows/validate-node-local-approval-proof-candidate.yml'
  pull_request:
    paths:
      - 'rah-node-agent-v1.0-candidate.py'
      - 'RAH-NODE-LOCAL-APPROVAL-PROOF-CANDIDATE.json'
      - 'tests/test_rah_node_agent_local_approval_candidate.py'
      - 'RAH-NODE-LOCAL-APPROVAL-PROOF-CANDIDATE-GATE.json'
      - 'RAH-NODE-LOCAL-APPROVAL-PROOF-CANDIDATE-DESIGN.md'
      - 'RAH-NODE-LOCAL-APPROVAL-PROOF-RESEARCH.json'
      - 'RAH-NODE-LOCAL-APPROVAL-PROOF-THREAT-MODEL.md'
      - 'RAH-CC14-STABLE-RELEASE.json'
      - '.github/workflows/validate-node-local-approval-proof-candidate.yml'

permissions:
  contents: read

jobs:
  node-candidate-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify frozen source Stable 1.4 / Node 0.9 blobs
        shell: bash
        run: |
          test "$(git hash-object rah-command-center-core-v1.4.js)" = "0e376b28b420760365321a31e963aef8b17d7a87"
          test "$(git hash-object RAH-COMMAND-CENTER-V1.4.html)" = "4645dec79201cc630b6f9d39ad6138cc7c1f2183"
          test "$(git hash-object rah-node-agent-v0.9.py)" = "e8774e3dc93e1a4bb431994b5020be0e6354023a"
      - name: Re-run research threat model
        run: node --test tests/rah-node-local-approval-proof-research.test.mjs
      - name: Re-run implementation readiness contract
        run: node --test tests/rah-node-local-approval-proof-candidate-readiness.test.mjs
      - name: Validate frozen Node Agent 1.0 Candidate runtime
        run: python3 -m unittest tests/test_rah_node_agent_local_approval_candidate.py
