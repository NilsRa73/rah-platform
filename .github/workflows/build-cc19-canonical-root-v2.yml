name: Build CC 1.9 Canonical Root v2
on:
  push:
    branches: ['agent/rah-cc-v1.9-canonical-root-v2']
    paths:
      - 'tools/build-cc19-canonical-root.mjs'
      - '.github/workflows/build-cc19-canonical-root-v2.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rah-cc-v1.9-canonical-root-v2
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Generate bounded canonical root
        run: node tools/build-cc19-canonical-root.mjs
      - name: Require bounded build scope
        shell: bash
        run: |
          allowed='^(RAH-COMMAND-CENTER-VERSION\.json|DOBBELTKLIKK-HER-START-RAH-COMMAND-CENTER\.bat|START-RAH-NODE-AGENT\.bat|START-RAH-NODE-AGENT\.sh|UPDATE-RAH-COMMAND-CENTER\.ps1|tests/rah-command-center-packaging\.test\.mjs)$'
          bad="$(git diff --name-only | grep -Ev "$allowed" || true)"
          test -z "$bad" || { echo "$bad"; exit 1; }
      - name: Validate canonical v1.9 and Stable chain
        run: |
          node --test tests/rah-command-center-packaging.test.mjs
          node --test tests/rah-cc19-immutable-mutating-intent.test.mjs
          node --test tests/rah-cc19-stable-release.test.mjs
      - name: Preserve Node 1.3 and current Raven master
        run: |
          python3 -m unittest tests/test_rah_node_agent_stable_v13.py -v
          node --test tests/rah-cc18-raven-master-sync.test.mjs
          node --test tests/raven-release-gate.test.mjs
      - name: Parse updater scripts
        shell: pwsh
        run: |
          [void][scriptblock]::Create((Get-Content -LiteralPath ./UPDATE-RAH-COMMAND-CENTER.ps1 -Raw))
          [void][scriptblock]::Create((Get-Content -LiteralPath ./UPDATE-RAH-RAVEN.ps1 -Raw))
      - name: Push tested non-workflow canonical files
        shell: bash
        run: |
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          git config user.name 'RAH CC 1.9 Canonical Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add RAH-COMMAND-CENTER-VERSION.json DOBBELTKLIKK-HER-START-RAH-COMMAND-CENTER.bat START-RAH-NODE-AGENT.bat START-RAH-NODE-AGENT.sh UPDATE-RAH-COMMAND-CENTER.ps1 tests/rah-command-center-packaging.test.mjs
          git commit -m 'RAH Command Center v1.9 — canonical tested root files'
          git push origin HEAD:agent/rah-cc-v1.9-canonical-root-v2
