name: Raven AI Fabric

on:
  push:
    branches:
      - main
      - feature/raven-ai-fabric-v1
    paths:
      - "desktop-bridge/raven_ai_fabric.py"
      - "desktop-bridge/raven_project_memory.py"
      - "desktop-bridge/raven_council.py"
      - "desktop-bridge/raven_bridge_agent.py"
      - "desktop-bridge/raven_jobs.py"
      - "desktop-bridge/agent_runner.py"
      - "desktop-bridge/test_raven_ai_fabric.py"
      - "desktop-bridge/test_raven_project_memory.py"
      - "desktop-bridge/test_raven_council.py"
      - "desktop-bridge/test_raven_jobs.py"
      - "START-RAH-BRIDGE-AUTOSTART.bat"
      - "INSTALL-RAH-AUTOSTART.bat"
      - "INSTALL-RAH-AI-FABRIC.ps1"
      - "START-RAH-AI-FABRIC.cmd"
      - "CONFIGURE-RAH-PROJECT-MEMORY.ps1"
      - "CONFIGURE-RAH-PROJECT-MEMORY.cmd"
      - "SYNC-RAH-PROJECT-MEMORY.ps1"
      - "SYNC-RAH-PROJECT-MEMORY.cmd"
      - "RAH-PROJECT-MEMORY.md"
      - "RAVEN-AI-SELF-CHECK.ps1"
      - "RAVEN-AI-SELF-CHECK.cmd"
      - "RAVEN-AI-SELF-CHECK.md"
      - "RAH-AI-CHAT-RECOVERY.ps1"
      - "START-HER-RAH-AI-CHAT-RECOVERY.cmd"
      - "START-HER-RAH-RAVEN-FINAL.cmd"
      - "RAH-RAVEN-HOVED-PC-FINAL.ps1"
      - "UPDATE-RAH-LATEST.ps1"
      - "START-HER-RAH-LATEST.cmd"
      - "RAH-LATEST-SYNC.md"
      - ".github/workflows/raven-ai-fabric.yml"
  pull_request:
    paths:
      - "desktop-bridge/raven_ai_fabric.py"
      - "desktop-bridge/raven_project_memory.py"
      - "desktop-bridge/raven_council.py"
      - "desktop-bridge/raven_bridge_agent.py"
      - "desktop-bridge/raven_jobs.py"
      - "desktop-bridge/agent_runner.py"
      - "desktop-bridge/test_raven_ai_fabric.py"
      - "desktop-bridge/test_raven_project_memory.py"
      - "desktop-bridge/test_raven_council.py"
      - "desktop-bridge/test_raven_jobs.py"
      - "START-RAH-BRIDGE-AUTOSTART.bat"
      - "INSTALL-RAH-AUTOSTART.bat"
      - "INSTALL-RAH-AI-FABRIC.ps1"
      - "START-RAH-AI-FABRIC.cmd"
      - "CONFIGURE-RAH-PROJECT-MEMORY.ps1"
      - "CONFIGURE-RAH-PROJECT-MEMORY.cmd"
      - "SYNC-RAH-PROJECT-MEMORY.ps1"
      - "SYNC-RAH-PROJECT-MEMORY.cmd"
      - "RAH-PROJECT-MEMORY.md"
      - "RAVEN-AI-SELF-CHECK.ps1"
      - "RAVEN-AI-SELF-CHECK.cmd"
      - "RAVEN-AI-SELF-CHECK.md"
      - "RAH-AI-CHAT-RECOVERY.ps1"
      - "START-HER-RAH-AI-CHAT-RECOVERY.cmd"
      - "START-HER-RAH-RAVEN-FINAL.cmd"
      - "RAH-RAVEN-HOVED-PC-FINAL.ps1"
      - "UPDATE-RAH-LATEST.ps1"
      - "START-HER-RAH-LATEST.cmd"
      - "RAH-LATEST-SYNC.md"
      - ".github/workflows/raven-ai-fabric.yml"

permissions:
  contents: read

jobs:
  windows-validation:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: desktop-bridge/requirements.txt

      - name: Install Bridge dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop-bridge/requirements.txt

      - name: Compile AI Fabric, Council and Raven entrypoints
        working-directory: desktop-bridge
        run: >-
          python -m py_compile
          raven_ai_fabric.py
          raven_project_memory.py
          raven_council.py
          raven_bridge_agent.py
          raven_jobs.py
          agent_runner.py
          server_v17.py
          test_raven_ai_fabric.py
          test_raven_project_memory.py
          test_raven_council.py

      - name: AI Fabric tests
        working-directory: desktop-bridge
        run: python -m unittest -v test_raven_ai_fabric.py

      - name: Project Memory tests
        working-directory: desktop-bridge
        run: python -m unittest -v test_raven_project_memory.py

      - name: Raven Council tests
        working-directory: desktop-bridge
        run: python -m unittest -v test_raven_council.py

      - name: Raven Jobs regression tests
        working-directory: desktop-bridge
        run: python test_raven_jobs.py

      - name: Agent Runner regression tests
        working-directory: desktop-bridge
        run: python test_agent_runner.py

      - name: Parse Windows bootstrap
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'INSTALL-RAH-AI-FABRIC.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'INSTALL-RAH-AI-FABRIC.ps1 has PowerShell parse errors'
          }
          foreach ($path in @(
            'CONFIGURE-RAH-PROJECT-MEMORY.ps1',
            'SYNC-RAH-PROJECT-MEMORY.ps1',
            'RAVEN-AI-SELF-CHECK.ps1',
            'RAH-AI-CHAT-RECOVERY.ps1',
            'UPDATE-RAH-LATEST.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "$path has PowerShell parse errors"
            }
          }
          Write-Host 'PowerShell bootstrap + Project Memory parse: PASS'

      - name: AI Chat Recovery self-test
        shell: pwsh
        run: |
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\RAH-AI-CHAT-RECOVERY.ps1 -SelfTest -SourceDirectory $PWD
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: One-click AI Chat Recovery bootstrap against PR content
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $server=Start-Process python -ArgumentList '-m','http.server','8771','--bind','127.0.0.1' -WorkingDirectory $PWD -PassThru -WindowStyle Hidden
          try{
            Start-Sleep -Seconds 1
            $env:RAH_RECOVERY_URL='http://127.0.0.1:8771/RAH-AI-CHAT-RECOVERY.ps1'
            $env:RAH_RECOVERY_SOURCE_DIR=$PWD
            & cmd.exe /d /c 'START-HER-RAH-AI-CHAT-RECOVERY.cmd --self-test'
            if($LASTEXITCODE -ne 0){throw ('AI Chat Recovery CMD bootstrap failed: '+$LASTEXITCODE)}
          } finally {
            Remove-Item Env:RAH_RECOVERY_URL -ErrorAction SilentlyContinue
            Remove-Item Env:RAH_RECOVERY_SOURCE_DIR -ErrorAction SilentlyContinue
            if($server -and -not $server.HasExited){Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue}
          }

      - name: One-click AI Chat Recovery bootstrap against main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: cmd
        run: START-HER-RAH-AI-CHAT-RECOVERY.cmd --self-test

      - name: Static autostart and bootstrap safety checks
        shell: pwsh
        run: |
          $start = Get-Content -Raw START-RAH-BRIDGE-AUTOSTART.bat
          $install = Get-Content -Raw INSTALL-RAH-AUTOSTART.bat
          $bootstrap = Get-Content -Raw INSTALL-RAH-AI-FABRIC.ps1
          $launcher = Get-Content -Raw START-RAH-AI-FABRIC.cmd
          $finalCmd = Get-Content -Raw START-HER-RAH-RAVEN-FINAL.cmd
          $finalPs1 = Get-Content -Raw RAH-RAVEN-HOVED-PC-FINAL.ps1
          $agent = Get-Content -Raw desktop-bridge/raven_bridge_agent.py
          $council = Get-Content -Raw desktop-bridge/raven_council.py
          $memory = Get-Content -Raw desktop-bridge/raven_project_memory.py
          $memorySetup = Get-Content -Raw CONFIGURE-RAH-PROJECT-MEMORY.ps1
          $memorySync = Get-Content -Raw SYNC-RAH-PROJECT-MEMORY.ps1
          $selfCheck = Get-Content -Raw RAVEN-AI-SELF-CHECK.ps1
          $chatRecovery = Get-Content -Raw RAH-AI-CHAT-RECOVERY.ps1
          $chatRecoveryCmd = Get-Content -Raw START-HER-RAH-AI-CHAT-RECOVERY.cmd
          $latestSync = Get-Content -Raw UPDATE-RAH-LATEST.ps1
          $latestSyncCmd = Get-Content -Raw START-HER-RAH-LATEST.cmd
          if ($start -notmatch 'raven_bridge_agent\.py') { throw 'Autostart does not use raven_bridge_agent.py' }
          if ($start -notmatch '/agent/jobs/health') { throw 'Job health check missing' }
          if ($start -notmatch '/ai/providers') { throw 'AI Fabric provider probe missing' }
          if ($start -notmatch 'RAH_JOB_REQUIRE_ADMIN') { throw 'Elevated job contract missing' }
          if ($install -notmatch 'RunLevel Highest') { throw 'Highest scheduled-task contract missing' }
          if ($bootstrap -notmatch 'RAH Raven AI Fabric Watchdog') { throw 'Watchdog task missing' }
          if ($bootstrap -notmatch 'RAH Raven Node Agent 18766') { throw 'Node task missing' }
          if ($bootstrap -notmatch 'test_raven_ai_fabric\.py') { throw 'Local AI Fabric test gate missing' }
          if ($bootstrap -notmatch 'test_raven_jobs\.py') { throw 'Local Raven Jobs test gate missing' }
          if ($launcher -notmatch 'INSTALL-RAH-AI-FABRIC\.ps1') { throw 'One-click launcher target missing' }
          if ($bootstrap -notmatch '\[string\]\$Ref = "main"') { throw 'AI Fabric immutable source-ref parameter missing' }
          if ($bootstrap -notmatch 'SOURCE-REF\.txt') { throw 'AI Fabric installed source-ref evidence missing' }
          foreach ($required in @('Get-MainSha','Wait-GreenSha','head_sha=$Sha','-Mode Repair -Ref $sha','RAVEN-BASELINE-LATEST.json','-NoRepair')) {
            if ($latestSync -notmatch [regex]::Escape($required)) { throw "LATEST SYNC missing: $required" }
          }
          if ($latestSync -notmatch 'api\.github\.com/repos/\$Repo') { throw 'LATEST SYNC GitHub API boundary missing' }
          if ($latestSync -notmatch 'raw\.githubusercontent\.com/\$Repo') { throw 'LATEST SYNC immutable raw source boundary missing' }
          if ($latestSync -match 'New-NetFirewallRule') { throw 'LATEST SYNC must not create firewall rules' }
          if ($latestSync -match '/agent/approval/review') { throw 'LATEST SYNC must not request approvals' }
          if ($latestSync -match '/api/v1/models/download') { throw 'LATEST SYNC must not download models' }
          if ($latestSyncCmd -notmatch 'UPDATE-RAH-LATEST\.ps1') { throw 'LATEST SYNC CMD target missing' }
          foreach ($required in @('fltmc','RAH-RAVEN-HOVED-PC-FINAL.ps1','PRECHECK','SYSTEM-INVENTORY','RAVEN-HOVED-PC-FINAL-LATEST.json')) {
            if ($finalCmd -notmatch [regex]::Escape($required)) { throw "HOVED-PC final CMD missing: $required" }
          }
          foreach ($required in @('-Verb RunAs','-Wait','-PassThru','/agent/jobs/health','system-inventory','job_executor_elevated','Get-ScheduledTask','RunLevel','RAVEN-HOVED-PC-FINAL-LATEST.json')) {
            if ($finalPs1 -notmatch [regex]::Escape($required)) { throw "HOVED-PC final verifier missing: $required" }
          }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseInput($finalPs1,[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; throw 'RAH-RAVEN-HOVED-PC-FINAL.ps1 has parse errors' }
          if ($agent -notmatch 'import raven_council') { throw 'Council is not wired into agent entrypoint' }
          if ($agent -notmatch 'import raven_project_memory') { throw 'Project Memory is not wired into agent entrypoint' }
          if ($council -notmatch 'raven_project_memory\.retrieve_context') { throw 'Council does not retrieve project memory' }
          if ($memory -notmatch '/ai/memory/status') { throw 'Project Memory status endpoint missing' }
          if ($memory -notmatch 'REFERENCE ONLY') { throw 'Project Memory instruction-boundary guard missing' }
          if ($bootstrap -notmatch 'CONFIGURE-RAH-PROJECT-MEMORY\.cmd') { throw 'Installer does not deploy Project Memory setup' }
          if ($bootstrap -notmatch 'SYNC-RAH-PROJECT-MEMORY\.ps1') { throw 'Installer does not deploy Project Memory sync' }
          if ($memorySetup -notmatch 'Read-Host.*AsSecureString') { throw 'Project Memory token input is not hidden' }
          if ($memorySetup -notmatch 'Set-Acl') { throw 'Project Memory token file ACL protection missing' }
          if ($memorySync -notmatch '/api/v1/document/raw-text') { throw 'Project Memory raw-text sync missing' }
          if ($memorySync -notmatch 'snapshot_sha') { throw 'Project Memory dedupe hash missing' }
          if ($selfCheck -notmatch '/ai/council/run') { throw 'AI Self-Check Council probe missing' }
          if ($selfCheck -notmatch '/ai/memory/status') { throw 'AI Self-Check Project Memory probe missing' }
          if ($selfCheck -notmatch '/agent/approval/status') { throw 'AI Self-Check approval status probe missing' }
          if ($selfCheck -match '/agent/approval/review') { throw 'AI Self-Check must not request AnythingLLM approvals' }
          if ($selfCheck -notmatch 'v1/chat/completions') { throw 'AI Self-Check real LM inference probe missing' }
          if ($selfCheck -match 'New-NetFirewallRule') { throw 'AI Self-Check must not create firewall rules' }
          if ($selfCheck -match '/api/v1/models/download') { throw 'AI Self-Check must not download models' }
          foreach ($required in @('AI_FABRIC_VERSION = "1.3.1"','MODEL_HEALTH_FILE','traceVersion','/ai/self-test','HTTP 200 uten gyldig tekstsvar','AUTO SELFTEST','py_compile','Backup','INSTALL-RAH-AGENT-WORKER.ps1','RAH-AGENT-TEAM-LIVE-TEST.ps1')) {
            if ($chatRecovery -notmatch [regex]::Escape($required)) { throw "AI Chat Recovery missing: $required" }
          }
          if ($chatRecovery -match 'New-NetFirewallRule|Invoke-Expression') { throw 'AI Chat Recovery contains forbidden system/network behavior' }
          foreach ($required in @('fltmc','-Verb RunAs','RAH-AI-CHAT-RECOVERY.ps1','v1.3.1 runtime + Worker trace')) {
            if ($chatRecoveryCmd -notmatch [regex]::Escape($required)) { throw "AI Chat Recovery CMD missing: $required" }
          }
          if ($council -notmatch 'lms.*server.*start') { throw 'Council LM Studio server automation missing' }
          if ($council -match 'lms get') { throw 'Council must not auto-download large models' }
          if ($start -match '0\.0\.0\.0') { throw 'Wildcard network binding is not allowed' }
          if ($bootstrap -match 'New-NetFirewallRule') { throw 'Bootstrap must not create firewall rules' }
          if ($memorySetup -match '(?i)token\s*=\s*["''][A-Za-z0-9_-]{20,}') { throw 'Hard-coded token-like value detected' }
          if ($memory -match '(?i)token\s*=\s*["''][A-Za-z0-9_-]{20,}') { throw 'Hard-coded token-like value detected in memory module' }
          Write-Host 'Raven AI Fabric + Council safety checks: PASS'
