name: Validate CC 2.1 Crash Recovery Stable Gate

on:
  pull_request:
    paths:
      - 'RAH-CC21-CRASH-RECOVERY-STABLE-GATE.json'
      - 'tests/rah-cc21-crash-recovery-stable-gate.test.mjs'
      - '.github/workflows/validate-cc21-crash-recovery-stable-gate.yml'
      - 'UPDATE-RAH-COMMAND-CENTER.ps1'
      - 'RAH-CC21-CRASH-RECOVERY-CANDIDATE.json'
      - 'RAH-CC21-CRASH-RECOVERY-READINESS.json'
      - 'tests/rah-cc21-crash-recovery-candidate.test.mjs'
      - 'RAH-COMMAND-CENTER-VERSION.json'
      - 'rah-node-agent-v1.3.py'
  push:
    branches: [main]
    paths:
      - 'RAH-CC21-CRASH-RECOVERY-STABLE-GATE.json'
      - 'tests/rah-cc21-crash-recovery-stable-gate.test.mjs'
      - '.github/workflows/validate-cc21-crash-recovery-stable-gate.yml'
      - 'UPDATE-RAH-COMMAND-CENTER.ps1'
      - 'RAH-CC21-CRASH-RECOVERY-CANDIDATE.json'
      - 'RAH-CC21-CRASH-RECOVERY-READINESS.json'
      - 'tests/rah-cc21-crash-recovery-candidate.test.mjs'
      - 'RAH-COMMAND-CENTER-VERSION.json'
      - 'rah-node-agent-v1.3.py'

permissions:
  contents: read

jobs:
  stable-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Evidence-only scope guard
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch origin main --quiet
          allowed='^(RAH-CC21-CRASH-RECOVERY-STABLE-GATE\.json|tests/rah-cc21-crash-recovery-stable-gate\.test\.mjs|\.github/workflows/validate-cc21-crash-recovery-stable-gate\.yml)$'
          bad="$(git diff --name-only origin/main...HEAD | grep -Ev "$allowed" || true)"
          if [ -n "$bad" ]; then
            echo 'Stable gate PR changed files outside the evidence-only allowlist:'
            echo "$bad"
            exit 1
          fi
      - name: Validate exact Stable gate evidence pins
        run: node --test tests/rah-cc21-crash-recovery-stable-gate.test.mjs
      - name: Re-run canonical package and updater contract
        run: node --test tests/rah-command-center-packaging.test.mjs
      - name: Re-run recursive dependency integrity
        run: node --test tests/rah-cc21-canonical-dependency-integrity.test.mjs
      - name: Re-run immutable release trust anchor
        run: node --test tests/rah-cc21-updater-trust-anchor.test.mjs
      - name: Re-run downloaded Git blob verification
        run: node --test tests/rah-cc21-downloaded-blob-verification.test.mjs
      - name: Re-run transactional staging and rollback-safe activation
        run: node --test tests/rah-cc21-transactional-package-staging.test.mjs
      - name: Re-run crash-recovery Candidate regression
        run: node --test tests/rah-cc21-crash-recovery-candidate.test.mjs
      - name: Preserve Stable Node Agent 1.3 token-proof boundary
        run: python3 -m unittest tests/test_rah_node_agent_stable_v13.py -v
      - name: Parse updater with PowerShell parser
        shell: pwsh
        run: |
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'UPDATE-RAH-COMMAND-CENTER.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count -gt 0){$errors | ForEach-Object { Write-Error $_.Message }; exit 1}
      - name: Verify FileShare.None exclusive lock semantics
        shell: pwsh
        run: |
          $p=Join-Path $env:RUNNER_TEMP 'rah-cc21-stable-gate-lock-smoke'
          Remove-Item -LiteralPath $p -Force -ErrorAction SilentlyContinue
          $first=[IO.File]::Open($p,[IO.FileMode]::OpenOrCreate,[IO.FileAccess]::ReadWrite,[IO.FileShare]::None)
          try {
            $second=$null
            $denied=$false
            try {$second=[IO.File]::Open($p,[IO.FileMode]::OpenOrCreate,[IO.FileAccess]::ReadWrite,[IO.FileShare]::None)} catch [IO.IOException] {$denied=$true}
            finally {if($null-ne$second){$second.Dispose()}}
            if(-not$denied){throw 'Second FileShare.None open unexpectedly succeeded.'}
          } finally {$first.Dispose();Remove-Item -LiteralPath $p -Force -ErrorAction SilentlyContinue}
