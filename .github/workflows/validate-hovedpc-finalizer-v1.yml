name: Validate HOVED-PC Finalizer v1

on:
  workflow_dispatch:
  push:
    paths:
      - 'RAH-HOVED-PC-FINALIZER-v1-START-HER.cmd'
      - 'RAH-HOVED-PC-FINALIZER-v1.json'
      - 'RAVEN-JOB-EXECUTOR-PROOF.ps1'
      - 'RUN-RAH-OS-v0.8-HOVED-PC-ACCEPTANCE.ps1'
      - 'tests/test_hovedpc_finalizer_v1.py'
      - '.github/workflows/validate-hovedpc-finalizer-v1.yml'
  pull_request:
    paths:
      - 'RAH-HOVED-PC-FINALIZER-v1-START-HER.cmd'
      - 'RAH-HOVED-PC-FINALIZER-v1.json'
      - 'RAVEN-JOB-EXECUTOR-PROOF.ps1'
      - 'RUN-RAH-OS-v0.8-HOVED-PC-ACCEPTANCE.ps1'
      - 'tests/test_hovedpc_finalizer_v1.py'
      - '.github/workflows/validate-hovedpc-finalizer-v1.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: PowerShell parse
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $null=[scriptblock]::Create((Get-Content .\RAVEN-JOB-EXECUTOR-PROOF.ps1 -Raw))
          $null=[scriptblock]::Create((Get-Content .\RUN-RAH-OS-v0.8-HOVED-PC-ACCEPTANCE.ps1 -Raw))
          Write-Host 'PARSE PASS'
      - name: Job proof self-test
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\RAVEN-JOB-EXECUTOR-PROOF.ps1 -SelfTest
      - name: Acceptance self-test
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\RUN-RAH-OS-v0.8-HOVED-PC-ACCEPTANCE.ps1 -SelfTest
      - name: Static finalizer contract
        shell: powershell
        run: python .\tests\test_hovedpc_finalizer_v1.py
