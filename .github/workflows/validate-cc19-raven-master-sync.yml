name: Validate CC 1.9 Historical Raven Master Evidence
on:
  pull_request:
    paths:
      - 'RAH-RAVEN-VERSION.json'
      - 'RAH-COMMAND-CENTER-VERSION.json'
      - 'RAH-CC19-NODE13-STABLE-RELEASE.json'
      - 'tests/rah-cc19-raven-master-sync.test.mjs'
      - '.github/workflows/validate-cc19-raven-master-sync.yml'
  push:
    branches: [main]
    paths:
      - 'RAH-RAVEN-VERSION.json'
      - 'RAH-COMMAND-CENTER-VERSION.json'
      - 'RAH-CC19-NODE13-STABLE-RELEASE.json'
      - 'tests/rah-cc19-raven-master-sync.test.mjs'
      - '.github/workflows/validate-cc19-raven-master-sync.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate historical CC 1.9 Raven evidence contract
        run: node --test tests/rah-cc19-raven-master-sync.test.mjs
      - name: Re-run current canonical plus historical CC 1.9 gates
        run: |
          node --test tests/rah-command-center-packaging.test.mjs
          node --test tests/rah-cc19-immutable-mutating-intent.test.mjs
          node --test tests/rah-cc19-stable-release.test.mjs
      - name: Re-run unchanged Stable Node 1.3 live boundary
        run: python3 -m unittest tests/test_rah_node_agent_stable_v13.py -v
      - name: Preserve frozen Raven release and earlier historical CC evidence
        run: |
          node --test tests/raven-release-gate.test.mjs
          node --test tests/rah-cc18-raven-master-sync.test.mjs
