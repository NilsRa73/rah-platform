name: Build CC 1.7 Raven Master Sync
on:
  push:
    branches: ['agent/rah-cc-v1.7-raven-master-sync']
    paths: ['.github/workflows/build-cc17-raven-master-sync.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rah-cc-v1.7-raven-master-sync
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Generate Raven master metadata sync
        run: node tools/build-cc17-raven-master-sync.mjs
      - name: Verify builder changed Raven master only
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          test "$changed" = 'RAH-RAVEN-VERSION.json'
      - name: Validate canonical CC package
        run: node --test tests/rah-command-center-packaging.test.mjs
      - name: Preserve CC 1.7 Stable release pins
        run: node --test tests/rah-cc17-stable-release.test.mjs
      - name: Preserve Stable Node 1.3 live token-proof
        run: python3 -m unittest tests/test_rah_node_agent_stable_v13.py -v
      - name: Preserve frozen Raven release gate
        run: node --test tests/raven-release-gate.test.mjs
      - name: Validate generated Raven master sync
        run: node --test tests/rah-cc17-raven-master-sync.test.mjs
      - name: Commit generated Raven master only
        shell: bash
        run: |
          git config user.name 'RAH Raven Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add RAH-RAVEN-VERSION.json
          git commit -m 'RAH Raven master — sync canonical Command Center v1.7'
          git push origin HEAD:agent/rah-cc-v1.7-raven-master-sync
