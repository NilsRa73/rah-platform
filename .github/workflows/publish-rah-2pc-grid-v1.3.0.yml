name: Publish RAH Raven 2-PC Grid v1.3.0

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-rah-2pc-grid-v1.3.0.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and verify annotated release tag
        shell: bash
        run: |
          set -euo pipefail
          TARGET='cb9c37f5f775bc37e46a2c724f0f9ea126356387'
          TAG='rah-2pc-grid-v1.3.0'
          git cat-file -e "${TARGET}^{commit}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git fetch --force --tags origin "refs/tags/${TAG}:refs/tags/${TAG}"
            test "$(git cat-file -t "refs/tags/${TAG}")" = 'tag'
            test "$(git rev-parse "${TAG}^{commit}")" = "${TARGET}"
          else
            git config user.name 'RAH Release Bot'
            git config user.email 'actions@users.noreply.github.com'
            git tag -a "${TAG}" "${TARGET}" -m 'RAH Raven 2-PC Grid v1.3.0'
            test "$(git cat-file -t "refs/tags/${TAG}")" = 'tag'
            test "$(git rev-parse "${TAG}^{commit}")" = "${TARGET}"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Verify hardware knowledge source contract
        shell: bash
        run: |
          set -euo pipefail
          TARGET='cb9c37f5f775bc37e46a2c724f0f9ea126356387'
          git show "${TARGET}:SYNC-RAH-PROJECT-MEMORY.ps1" | grep -F '## RAH HARDWARE CONTEXT'
          git show "${TARGET}:SYNC-RAH-PROJECT-MEMORY.ps1" | grep -F 'hardware_registry_devices'
          git show "${TARGET}:desktop-bridge/raven_ai_fabric.py" | grep -F 'hardware_tokens'
          git show "${TARGET}:RAH-RAVEN-2PC-GUI.ps1" | grep -F 'Request-RahHardwareKnowledgeSync'
          git show "${TARGET}:RAH-RAVEN-2PC-GUI.ps1" | grep -F "LastKnowledgeSync = 'NOT_REQUESTED'"
          git show "${TARGET}:RAH-RAVEN-2PC-GUI.ps1" | grep -F 'Best-effort only'
          git show "${TARGET}:RAH-HARDWARE-INVENTORY.ps1" | grep -F 'Legacy BIOS slot without optional fields'
          ! git show "${TARGET}:RAH-HARDWARE-INVENTORY.ps1" | grep -F '$slot.Purpose'

      - name: Build pinned exact release package
        shell: bash
        run: |
          set -euo pipefail
          TARGET='cb9c37f5f775bc37e46a2c724f0f9ea126356387'
          TAG='rah-2pc-grid-v1.3.0'
          PKG='dist/package'
          mkdir -p "${PKG}"
          FILES=(
            INSTALL-RAH-2PC-GRID.cmd
            START-HER-RAH-2PC-GRID.cmd
            VERIFY-RAH-2PC-GRID.cmd
            COMPLETE-RAH-2PC-GRID.cmd
            RAH-RAVEN-2PC-GUI.ps1
            RAH-2PC-CLIENT.ps1
            RAH-2PC-ACCEPTANCE.ps1
            RAH-HARDWARE-INVENTORY.ps1
            RAH-HARDWARE-REGISTRY.ps1
            RAH-2PC-GRID.md
          )
          for file in "${FILES[@]}"; do
            git show "${TARGET}:${file}" > "${PKG}/${file}"
            test -s "${PKG}/${file}"
          done
          sed -i 's/set "REF=main"/set "REF=rah-2pc-grid-v1.3.0"/' "${PKG}/INSTALL-RAH-2PC-GRID.cmd"
          printf '%s' "${TAG}" > "${PKG}/RAH-2PC-SOURCE-REF.txt"

          grep -F 'set "REF=rah-2pc-grid-v1.3.0"' "${PKG}/INSTALL-RAH-2PC-GRID.cmd"
          grep -F 'v1.3.0: PASS' "${PKG}/VERIFY-RAH-2PC-GRID.cmd"
          grep -F "Rah2PcClientVersion = '1.3.0'" "${PKG}/RAH-2PC-CLIENT.ps1"
          grep -F 'Request-RahHardwareKnowledgeSync' "${PKG}/RAH-RAVEN-2PC-GUI.ps1"
          grep -F 'KNOWLEDGE : ' "${PKG}/RAH-RAVEN-2PC-GUI.ps1"
          grep -F 'RAH-HARDWARE-REGISTRY.ps1' "${PKG}/INSTALL-RAH-2PC-GRID.cmd"
          ! grep -R -F 'rah_2pc_inventory_client.py' "${PKG}"
          ! grep -R -F 'rah_2pc_acceptance.py' "${PKG}"

          (cd "${PKG}" && zip -q -r ../RAH-Raven-2PC-Grid-v1.3.0.zip .)
          cp "${PKG}/INSTALL-RAH-2PC-GRID.cmd" dist/INSTALL-RAH-2PC-GRID.cmd
          (cd dist && sha256sum RAH-Raven-2PC-Grid-v1.3.0.zip INSTALL-RAH-2PC-GRID.cmd > SHA256SUMS.txt)
          test -s dist/RAH-Raven-2PC-Grid-v1.3.0.zip
          test -s dist/INSTALL-RAH-2PC-GRID.cmd
          test -s dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='rah-2pc-grid-v1.3.0'
          if ! gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --verify-tag \
              --title 'RAH Raven 2-PC Grid v1.3.0' \
              --notes-file RAH-2PC-GRID-RELEASE-v1.3.0.md \
              dist/RAH-Raven-2PC-Grid-v1.3.0.zip \
              dist/INSTALL-RAH-2PC-GRID.cmd \
              dist/SHA256SUMS.txt
          fi
          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json tagName,name,isDraft,isPrerelease,url
