name: Build Raven Studio v2.8 Stable Gate

on:
  push:
    branches:
      - studio/raven-studio-v2.8-stable-gate
    paths:
      - '.github/scripts/build_raven_studio_v2_8_stable_gate.py'
      - '.github/workflows/build-raven-studio-v2.8-stable-gate.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/raven-studio-v2.8-stable-gate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Raven Studio v2.8 stable gate
        run: python .github/scripts/build_raven_studio_v2_8_stable_gate.py
      - name: Validate stable Studio metadata and Raven contract
        run: |
          node tests/raven-studio.test.mjs
          node tests/raven-chatgpt-handoff-entry.test.mjs
          node tests/raven-chatgpt-handoff-receipt.test.mjs
          node tests/raven-chatgpt-handoff-history-lite.test.mjs
          node tests/raven-chatgpt-handoff-recall.test.mjs
          node tests/raven-release-gate.test.mjs
      - name: Assert Studio and all frozen runtimes remain untouched
        run: |
          git diff --exit-code -- \
            RAH-RAVEN-START.html \
            RAH-RAVEN-VISION-CORE.html raven-vision-core.js \
            RAH-RAVEN-COUNCIL.html raven-council.js \
            RAH-RAVEN-AGENT-RUNNER.html desktop-bridge/agent_runner.py \
            RAH-RAVEN-MEMORY-SYNC.html raven-chronicle-sync.js \
            RAH-RAVEN-MISSION-CONTROL.html \
            RAH-RAVEN-PROJECT.html \
            RAH-RAVEN-CORE-DEMO.html \
            RAH-RAVEN-NOW-V2.html \
            RAH-HOME-CONTROL.html \
            raven-checkpoint-policy.js
      - name: Commit Studio stable metadata and tests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            RAH-RAVEN-STUDIO-VERSION.json \
            RAH-RAVEN-VERSION.json \
            tests/raven-studio.test.mjs \
            tests/raven-release-gate.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Freeze Raven Studio v2.8 stable contract'
          git push origin HEAD:studio/raven-studio-v2.8-stable-gate
