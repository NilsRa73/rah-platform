name: Validate Raven Care Hub v0.5 Candidate

on:
  push:
    branches: [agent/raven-care-hub-v05-candidate, main]
    paths:
      - 'RAH-RAVEN-CARE-HUB-V0.5-CANDIDATE.html'
      - 'RAH-RAVEN-CARE-HUB-V0.5-CANDIDATE.json'
      - 'tests/raven-care-hub-v0.5-candidate.test.mjs'
      - '.github/workflows/validate-raven-care-hub-v0.5-candidate.yml'
  pull_request:
    paths:
      - 'RAH-RAVEN-CARE-HUB-V0.5-CANDIDATE.html'
      - 'RAH-RAVEN-CARE-HUB-V0.5-CANDIDATE.json'
      - 'tests/raven-care-hub-v0.5-candidate.test.mjs'
      - '.github/workflows/validate-raven-care-hub-v0.5-candidate.yml'

permissions:
  contents: read

jobs:
  candidate-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Care Hub v0.5 Candidate boundary
        run: node tests/raven-care-hub-v0.5-candidate.test.mjs
      - name: Preserve Care Hub v0.4 Stable navigation boundary
        run: node tests/raven-care-hub-v0.4.test.mjs
      - name: Preserve Raven Care v0.1 Stable contract
        run: node tests/raven-care-v0.1.test.mjs
      - name: Preserve Case Center v1.6 Stable contract
        run: node tests/raven-case-center-v16.test.mjs
      - name: Preserve Fristvakt v0.2 Stable contract
        run: node tests/raven-fristvakt-v0.2.test.mjs
      - name: Preserve Health & Fatigue v0.2 Stable contract
        run: node tests/raven-health-fatigue-v0.2.test.mjs
      - name: Preserve Fastlegevisning v0.3 Stable contract
        run: node tests/raven-fastlege-v0.3.test.mjs
      - name: Preserve Raven 2.0.32 Stable release gate
        run: node tests/raven-release-gate.test.mjs

  isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require exact Candidate-only PR scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          printf '%s\n' "$changed"
          allowed='^(RAH-RAVEN-CARE-HUB-V0\.5-CANDIDATE\.html|RAH-RAVEN-CARE-HUB-V0\.5-CANDIDATE\.json|tests/raven-care-hub-v0\.5-candidate\.test\.mjs|\.github/workflows/validate-raven-care-hub-v0\.5-candidate\.yml)$'
          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          if [ -n "$bad" ]; then
            echo 'Unexpected file outside exact Care Hub v0.5 Candidate scope:'
            printf '%s\n' "$bad"
            exit 1
          fi
          for stable in \
            RAH-RAVEN-CARE.html \
            RAH-RAVEN-CARE-VERSION.json \
            RAH-RAVEN-CARE-HUB.html \
            RAH-RAVEN-CARE-HUB-VERSION.json \
            RAH-RAVEN-CASE-CENTER.html \
            RAH-RAVEN-CASE-CENTER-VERSION.json \
            RAH-RAVEN-FRISTVAKT.html \
            RAH-RAVEN-FRISTVAKT-VERSION.json \
            RAH-RAVEN-HEALTH-FATIGUE.html \
            RAH-RAVEN-HEALTH-FATIGUE-VERSION.json \
            RAH-RAVEN-FASTLEGE.html \
            RAH-RAVEN-FASTLEGE-VERSION.json \
            RAH-RAVEN-VERSION.json \
            RAH-COMMAND-CENTER-V2.1.html \
            rah-command-center-core-v2.1.js \
            rah-node-agent-v1.3.py; do
            if printf '%s\n' "$changed" | grep -Fxq "$stable"; then
              echo "Forbidden Stable runtime touched: $stable"
              exit 1
            fi
          done
