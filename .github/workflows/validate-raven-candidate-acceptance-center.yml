name: Validate Raven Candidate Acceptance Center

on:
  workflow_dispatch:
  push:
    paths:
      - 'START-RAH-CANDIDATE-SUITE.bat'
      - 'RAH-CANDIDATE-ACCEPTANCE-CENTER.ps1'
      - 'RAH-CANDIDATE-ACCEPTANCE-CENTER.bat'
      - 'RAH-CANDIDATE-ACCEPTANCE-CENTER.md'
      - 'tests/raven-candidate-acceptance-center.test.mjs'
      - 'RAH-RAVEN-STUDIO-V2.9-CANDIDATE.json'
      - 'RAH-RAVEN-STUDIO-V3.0.json'
      - 'RAH-RAVEN-DAILY-DRIVER-VERSION.json'
      - 'apps/rah-ai-investigator/RAH-INVESTIGATOR-VERSION.json'
      - '.github/workflows/build-raven-candidate-acceptance-suite.yml'
      - '.github/workflows/validate-raven-candidate-acceptance-center.yml'
  pull_request:
    paths:
      - 'START-RAH-CANDIDATE-SUITE.bat'
      - 'RAH-CANDIDATE-ACCEPTANCE-CENTER.ps1'
      - 'RAH-CANDIDATE-ACCEPTANCE-CENTER.bat'
      - 'RAH-CANDIDATE-ACCEPTANCE-CENTER.md'
      - 'tests/raven-candidate-acceptance-center.test.mjs'
      - 'RAH-RAVEN-STUDIO-V2.9-CANDIDATE.json'
      - 'RAH-RAVEN-STUDIO-V3.0.json'
      - 'RAH-RAVEN-DAILY-DRIVER-VERSION.json'
      - 'apps/rah-ai-investigator/RAH-INVESTIGATOR-VERSION.json'
      - '.github/workflows/build-raven-candidate-acceptance-suite.yml'
      - '.github/workflows/validate-raven-candidate-acceptance-center.yml'

permissions:
  contents: read

jobs:
  static-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate empty Candidate queue and current Stable lifecycle
        run: node tests/raven-candidate-acceptance-center.test.mjs

  windows-self-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Candidate Center empty-queue self-test
        shell: powershell
        run: .\RAH-CANDIDATE-ACCEPTANCE-CENTER.ps1 -SelfTest
      - name: Run suite starter self-test
        shell: cmd
        run: START-RAH-CANDIDATE-SUITE.bat --self-test
