name: Validate CC 2.3 Raven Master Sync

on:
  pull_request:
    paths:
      - 'RAH-RAVEN-VERSION.json'
      - 'RAH-COMMAND-CENTER-VERSION.json'
      - 'RAH-CC23-RAVEN-MASTER-SYNC.json'
      - 'RAH-CC23-CANONICAL-GENERATION8-STABLE-GATE.json'
      - 'RAH-CC23-NODE13-STABLE-RELEASE.json'
      - 'tests/rah-cc23-raven-master-sync.test.mjs'
      - 'tests/rah-cc23-canonical-generation8.test.mjs'
      - 'tests/raven-release-gate.test.mjs'
      - 'tests/test_rah_node_agent_stable_v13.py'
      - '.github/workflows/validate-cc23-raven-master-sync.yml'
  push:
    branches: [main]
    paths:
      - 'RAH-RAVEN-VERSION.json'
      - 'RAH-COMMAND-CENTER-VERSION.json'
      - 'RAH-CC23-RAVEN-MASTER-SYNC.json'
      - 'RAH-CC23-CANONICAL-GENERATION8-STABLE-GATE.json'
      - 'RAH-CC23-NODE13-STABLE-RELEASE.json'
      - 'tests/rah-cc23-raven-master-sync.test.mjs'
      - 'tests/rah-cc23-canonical-generation8.test.mjs'
      - 'tests/raven-release-gate.test.mjs'
      - 'tests/test_rah_node_agent_stable_v13.py'
      - '.github/workflows/validate-cc23-raven-master-sync.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate historical CC 2.3 Raven master sync boundary
        run: node --test tests/rah-cc23-raven-master-sync.test.mjs
      - name: Preserve Raven 2.0.32 frozen release gate
        run: node --test tests/raven-release-gate.test.mjs
      - name: Preserve immutable CC 2.3 generation 8 trust point
        shell: bash
        run: |
          git cat-file -e 1f5339841958bf0c2b4e737a5307f00029f8cf68^{commit}
          node - <<'NODE'
          const {execFileSync}=require('node:child_process');
          const c='1f5339841958bf0c2b4e737a5307f00029f8cf68';
          const m=JSON.parse(execFileSync('git',['show',`${c}:RAH-COMMAND-CENTER-VERSION.json`],{encoding:'utf8'}));
          const r=JSON.parse(execFileSync('git',['show',`${c}:RAH-CC23-NODE13-STABLE-RELEASE.json`],{encoding:'utf8'}));
          if(m.version!=='2.3.0'||m.canonical_package_generation!==8||m.package_files.length!==61) throw new Error('CC2.3 immutable manifest mismatch');
          if(r.commandCenterVersion!=='2.3.0'||r.nodeAgentVersion!=='1.3.0'||r.authProtocol!=='rah-node-auth-v2') throw new Error('CC2.3 immutable release mismatch');
          NODE
      - name: Preserve Stable Node Agent 1.3 live token-proof and negative boundaries
        run: python3 -m unittest tests/test_rah_node_agent_stable_v13.py -v
