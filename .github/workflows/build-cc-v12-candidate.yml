name: Verify CC v1.2 candidate branch
on:
  push:
    branches: ['agent/rah-cc-v1.2-session-bound-enrollment']
    paths:
      - '.github/workflows/build-cc-v12-candidate.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Current v1.2 core
        run: node --test tests/rah-command-center-core.test.mjs
      - name: Preserve historical v0.5-v1.1 artifacts
        run: |
          node --test tests/rah-command-center-v05.test.mjs
          node --test tests/rah-command-center-v06.test.mjs
          node --test tests/rah-command-center-v07.test.mjs
          node --test tests/rah-command-center-v08.test.mjs
          node --test tests/rah-command-center-v09.test.mjs
          node --test tests/rah-command-center-v10.test.mjs
          node --test tests/rah-command-center-v11.test.mjs
      - name: Current v1.2 integration sections
        run: |
          RAH_CC_V12_SECTION=manifest node --test tests/rah-command-center-v12.test.mjs
          RAH_CC_V12_SECTION=ui node --test tests/rah-command-center-v12.test.mjs
          RAH_CC_V12_SECTION=agent node --test tests/rah-command-center-v12.test.mjs
          RAH_CC_V12_SECTION=core node --test tests/rah-command-center-v12.test.mjs
      - name: Current v1.2 packaging
        run: node --test tests/rah-command-center-packaging.test.mjs
      - name: Full Node Agent v0.8 HTTP security regression
        run: python -m unittest tests/test_rah_node_agent.py -v
      - name: Parse manual updater scripts
        shell: pwsh
        run: |
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile('UPDATE-RAH-COMMAND-CENTER.ps1',[ref]$null,[ref]$errors)|Out-Null
          if($errors.Count -gt 0){$errors|Format-List;exit 1}
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile('UPDATE-RAH-RAVEN.ps1',[ref]$null,[ref]$errors)|Out-Null
          if($errors.Count -gt 0){$errors|Format-List;exit 1}
      - name: Preserve Raven and support gates
        run: |
          node --test tests/raven-release-gate.test.mjs
          node --test tests/raven-project-registry-v0.1.test.mjs
          node --test tests/raven-daily-brief-v0.1.test.mjs
          node --test tests/raven-health-fatigue-v0.2.test.mjs
          node --test tests/raven-care-v0.1.test.mjs
          node --test tests/raven-fristvakt-v0.2.test.mjs
