name: Build CC v1.2 candidate
on:
  push:
    branches: ['agent/rah-cc-v1.2-session-bound-enrollment']
    paths:
      - 'tools/build-command-center-v12.mjs'
      - '.github/workflows/build-cc-v12-candidate.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Generate v1.2 candidate
        run: node tools/build-command-center-v12.mjs
      - name: Core session-bound tests
        run: node --test tests/rah-command-center-core.test.mjs
      - name: v1.2 manifest section
        run: RAH_CC_V12_SECTION=manifest node --test tests/rah-command-center-v12.test.mjs
      - name: v1.2 UI enrollment section
        run: RAH_CC_V12_SECTION=ui node --test tests/rah-command-center-v12.test.mjs
      - name: v1.2 Node Agent session section
        run: RAH_CC_V12_SECTION=agent node --test tests/rah-command-center-v12.test.mjs
      - name: v1.2 typed core section
        run: RAH_CC_V12_SECTION=core node --test tests/rah-command-center-v12.test.mjs
      - name: Packaging tests
        run: node --test tests/rah-command-center-packaging.test.mjs
      - name: Node Agent v0.8 HTTP session gate
        run: python -m unittest tests/test_rah_node_agent.py -v
      - name: Preserve Raven release gate
        run: node --test tests/raven-release-gate.test.mjs
      - name: Preserve Project Registry stage-aware gate
        run: node --test tests/raven-project-registry-v0.1.test.mjs
      - name: Verify generated scope
        run: |
          git diff --name-only | sort > /tmp/changed.txt
          cat >/tmp/allowed.txt <<'EOF'
          .github/workflows/validate-rah-command-center.yml
          DOBBELTKLIKK-HER-START-RAH-COMMAND-CENTER.bat
          RAH-COMMAND-CENTER-V1.2.html
          RAH-COMMAND-CENTER-VERSION.json
          UPDATE-RAH-COMMAND-CENTER.ps1
          rah-command-center-core.js
          rah-node-agent.py
          tests/rah-command-center-core.test.mjs
          tests/rah-command-center-packaging.test.mjs
          tests/rah-command-center-v11.test.mjs
          tests/rah-command-center-v12.test.mjs
          tests/test_rah_node_agent.py
          EOF
          sort -o /tmp/allowed.txt /tmp/allowed.txt
          unexpected="$(comm -23 /tmp/changed.txt /tmp/allowed.txt)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected generated files:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          cat /tmp/changed.txt
      - name: Commit generated candidate runtime and tests
        run: |
          git config user.name "RAH Raven Builder"
          git config user.email "actions@users.noreply.github.com"
          git add DOBBELTKLIKK-HER-START-RAH-COMMAND-CENTER.bat RAH-COMMAND-CENTER-V1.2.html RAH-COMMAND-CENTER-VERSION.json UPDATE-RAH-COMMAND-CENTER.ps1 rah-command-center-core.js rah-node-agent.py tests/rah-command-center-core.test.mjs tests/rah-command-center-packaging.test.mjs tests/rah-command-center-v11.test.mjs tests/rah-command-center-v12.test.mjs tests/test_rah_node_agent.py
          git commit -m "RAH Command Center v1.2 — session-bound enrollment candidate"
          git push
