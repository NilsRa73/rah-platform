name: Build Raven Insights v0.1 Stable Final
on:
  push:
    branches: ['raven-insights/v0.1-stable-final']
    paths:
      - '.github/scripts/build_raven_insights_v0_1_stable_final.py'
      - '.github/workflows/build-raven-insights-v0.1-stable-final.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Promote Insights metadata only on v0.6 + Chronicle v1.7.1 Stable base
        run: python .github/scripts/build_raven_insights_v0_1_stable_final.py
