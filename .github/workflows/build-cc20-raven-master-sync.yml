name: Build CC 2.0 Raven Master Sync
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/build-cc20-raven-master-sync.yml']
permissions:
  contents: write
jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/rah-cc-v2.0-raven-master-sync'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rah-cc-v2.0-raven-master-sync
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Generate metadata-only v2.0 Raven master sync
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='RAH-RAVEN-VERSION.json';
          const r=JSON.parse(fs.readFileSync(path,'utf8'));
          const cc=JSON.parse(fs.readFileSync('RAH-COMMAND-CENTER-VERSION.json','utf8'));
          const rel=JSON.parse(fs.readFileSync('RAH-CC20-NODE13-STABLE-RELEASE.json','utf8'));
          if(r.product!=='RAH Raven'||r.version!=='2.0.32'||r.release_gate?.stage!=='temporary-stable')throw new Error('Unexpected Raven baseline');
          if(cc.version!=='2.0.0'||cc.stage!=='stable'||cc.canonical_package_generation!==5||cc.package_files.length!==43)throw new Error('Canonical CC v2.0 baseline missing');
          if(rel.commandCenterVersion!=='2.0.0'||rel.nodeAgentVersion!=='1.3.0'||rel.nodeRuntimeChange!==false)throw new Error('Unexpected CC20 release');
          if(r.privacy?.command_center_canonical_version!=='1.9.0'||r.privacy?.command_center_canonical_package_generation!==4||r.privacy?.command_center_canonical_package_dependency_count!==37)throw new Error('Unexpected Raven CC1.9 master baseline');
          const preserved=structuredClone(r); delete preserved.summary; delete preserved.files; delete preserved.privacy;
          r.summary='RAH Raven 2.0.32 remains the temporary stable freeze with nine Stable core components unchanged. Project Brain Cloud Sync v1.1, Voice Control v1.7, Mission Engine v1.6, Raven Care v0.1 and Raven Fristvakt v0.2 remain stable supporting modules. Raven Chronicle v1.7.1 is stable. Raven Insights v0.1 is stable. Raven Daily Brief v0.1 is stable. RAH Raven Command Center v2.0.0 is Stable and canonical. Command Center v2.0 keeps the exact four capabilities compute, storage, display and remote-desktop; the exact three fixed actions storage-summary.read, rustdesk.launch and rustdesk.connect; and the exact five business routes /health, /actions, /storage, /launch/rustdesk and /handoff/rustdesk. Node Agent v1.3.0 remains rah-node-health-v2, rah-node-actions-v7 and rah-node-auth-v2 token-proof: the fresh Node token stays local and is not transported as Bearer over LAN. Mutating RustDesk actions retain the 90-second memory-only single-use one-shot approval and v1.9 immutable execution-intent binding; v2.0 additionally precommits requester context at Arm using secure randomness, stores only its SHA-256 digest in the ticket, keeps the raw context transient in browser memory only, and requires that exact same context for Node-local confirmation and execution. Context or intent drift consumes and rejects the ticket before Node-local confirmation. Existing advertised-action, capability, ephemeral Command Center approval, requester-source validation, Node-local human confirmation, fresh action challenge and Node-local approval proof remain independent gates. storage-summary.read remains read-only and outside the mutating-intent/precommit ledger. Password persistence, RustDesk peer-ID persistence, caller-controlled executable paths or generic arguments, installation, shell/file/generic process or action endpoints, device commands, discovery, background polling and native Raven remote-control authority remain disabled.';
          const add=['RAH-COMMAND-CENTER-V2.0.html','RAH-COMMAND-CENTER-V2.0-CANDIDATE.html','rah-command-center-core-v2.0-candidate.js','rah-command-center-core-v2.0.js','RAH-CC20-PRECOMMITTED-REQUESTER-CONTEXT-CANDIDATE.json','RAH-CC20-NODE13-STABLE-RELEASE.json'];
          for(const f of add)if(!r.files.includes(f))r.files.push(f);
          Object.assign(r.privacy,{
            command_center_canonical_version:'2.0.0',
            command_center_canonical_package_generation:5,
            command_center_canonical_package_dependency_count:43,
            command_center_precommitted_requester_context:true,
            command_center_precommitted_requester_context_version:'rah-cc-precommitted-requester-context-v1',
            command_center_precommitted_requester_context_required_rustdesk_launch:true,
            command_center_precommitted_requester_context_required_rustdesk_connect:true,
            command_center_precommitted_requester_context_storage_read_required:false,
            command_center_precommitted_requester_context_ttl_ms:90000,
            command_center_precommitted_requester_context_max_outstanding:32,
            command_center_precommitted_requester_context_generated_at_arm:true,
            command_center_precommitted_requester_context_secure_random_required:true,
            command_center_precommitted_requester_context_math_random_fallback:false,
            command_center_precommitted_requester_context_raw_memory_only:true,
            command_center_precommitted_requester_context_raw_persistence:false,
            command_center_precommitted_requester_context_ticket_digest_only:true,
            command_center_precommitted_requester_context_binds_requester_context_digest:true,
            command_center_precommitted_requester_context_same_context_confirmation_execution:true,
            command_center_precommitted_requester_context_single_use:true,
            command_center_precommitted_requester_context_consume_before_node_local_confirmation:true,
            command_center_precommitted_requester_context_consume_on_context_mismatch:true,
            command_center_precommitted_requester_context_stores_raw_requester_context:false
          });
          const after=structuredClone(r); delete after.summary; delete after.files; delete after.privacy;
          if(JSON.stringify(after)!==JSON.stringify(preserved))throw new Error('Non-target Raven master metadata changed');
          fs.writeFileSync(path,JSON.stringify(r,null,2)+'\n');

          const test=`import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport fs from 'node:fs';\nconst raven=JSON.parse(fs.readFileSync('RAH-RAVEN-VERSION.json','utf8'));\nconst cc=JSON.parse(fs.readFileSync('RAH-COMMAND-CENTER-VERSION.json','utf8'));\nconst release=JSON.parse(fs.readFileSync('RAH-CC20-NODE13-STABLE-RELEASE.json','utf8'));\nconst stableCore={raven_vision:'0.6',raven_council:'0.3',agent_runner:'0.3',memory_sync:'0.2',mission_control:'2.9',project_focus:'2.4',raven_core:'1.12',raven_now:'2.17',raven_studio:'2.8'};\n\ntest('Raven 2.0.32 freeze and nine Stable core versions stay unchanged',()=>{assert.equal(raven.product,'RAH Raven');assert.equal(raven.version,'2.0.32');assert.equal(raven.release_gate.stage,'temporary-stable');assert.equal(raven.release_gate.temporary_stable_target,'2.0.32');assert.equal(raven.release_gate.development_paused,true);assert.deepEqual(raven.release_gate.stable_components,stableCore)});\ntest('Raven master names and packages canonical CC 2.0 Stable',()=>{assert.equal(cc.version,'2.0.0');assert.equal(cc.stage,'stable');assert.equal(cc.raven_contract,'2.0.32');assert.equal(cc.entry,'RAH-COMMAND-CENTER-V2.0.html');assert.equal(cc.runtime,'rah-command-center-core-v2.0.js');assert.equal(cc.canonical_package_generation,5);assert.equal(cc.package_files.length,43);assert.match(raven.summary,/RAH Raven Command Center v2\\.0\\.0 is Stable and canonical/);for(const f of cc.package_files)assert.equal(raven.files.includes(f),true,'Raven package missing '+f)});\ntest('authority and token-proof remain exact',()=>{assert.equal(release.nodeAgentVersion,'1.3.0');assert.equal(release.nodeRuntimeChange,false);assert.deepEqual(release.authoritySurface.capabilities,['compute','storage','display','remote-desktop']);assert.deepEqual(release.authoritySurface.actions,['storage-summary.read','rustdesk.launch','rustdesk.connect']);assert.deepEqual(release.authoritySurface.businessRoutes,['/health','/actions','/storage','/launch/rustdesk','/handoff/rustdesk']);const p=raven.privacy;assert.equal(p.command_center_capability_count,4);assert.equal(p.command_center_action_count,3);assert.equal(p.command_center_business_route_count,5);assert.equal(p.command_center_node_agent_version,'1.3.0');assert.equal(p.command_center_token_network_transport,false);assert.equal(p.command_center_bearer_authorization_transport,false);assert.equal(p.command_center_action_execution_requires_token_proof,true)});\ntest('one-shot and immutable intent remain retained',()=>{const p=raven.privacy;assert.equal(p.command_center_one_shot_mutating_approval,true);assert.equal(p.command_center_one_shot_single_use,true);assert.equal(p.command_center_one_shot_persistence,false);assert.equal(p.command_center_immutable_mutating_intent_binding,true);assert.equal(p.command_center_mutating_intent_binding_version,'rah-cc-mutating-intent-v1');assert.equal(p.command_center_mutating_intent_binds_endpoint_ipv4,true);assert.equal(p.command_center_mutating_intent_binds_capability_snapshot,true);assert.equal(p.command_center_mutating_intent_binds_advertised_action_snapshot,true);assert.equal(p.command_center_mutating_intent_binds_approved_action_snapshot,true)});\ntest('v2.0 requester context precommit is exact and persistence-free',()=>{const p=raven.privacy,b=release.precommittedRequesterContext;assert.equal(p.command_center_canonical_version,'2.0.0');assert.equal(p.command_center_canonical_package_generation,5);assert.equal(p.command_center_canonical_package_dependency_count,43);assert.equal(p.command_center_precommitted_requester_context,true);assert.equal(p.command_center_precommitted_requester_context_version,'rah-cc-precommitted-requester-context-v1');assert.equal(p.command_center_precommitted_requester_context_required_rustdesk_launch,true);assert.equal(p.command_center_precommitted_requester_context_required_rustdesk_connect,true);assert.equal(p.command_center_precommitted_requester_context_storage_read_required,false);assert.equal(p.command_center_precommitted_requester_context_ttl_ms,90000);assert.equal(p.command_center_precommitted_requester_context_max_outstanding,32);assert.equal(p.command_center_precommitted_requester_context_generated_at_arm,true);assert.equal(p.command_center_precommitted_requester_context_secure_random_required,true);assert.equal(p.command_center_precommitted_requester_context_math_random_fallback,false);assert.equal(p.command_center_precommitted_requester_context_raw_memory_only,true);assert.equal(p.command_center_precommitted_requester_context_raw_persistence,false);assert.equal(p.command_center_precommitted_requester_context_ticket_digest_only,true);assert.equal(p.command_center_precommitted_requester_context_binds_requester_context_digest,true);assert.equal(p.command_center_precommitted_requester_context_same_context_confirmation_execution,true);assert.equal(p.command_center_precommitted_requester_context_single_use,true);assert.equal(p.command_center_precommitted_requester_context_consume_before_node_local_confirmation,true);assert.equal(p.command_center_precommitted_requester_context_consume_on_context_mismatch,true);assert.equal(p.command_center_precommitted_requester_context_stores_raw_requester_context,false);assert.equal(b.generatedAtArm,true);assert.equal(b.rawRequesterContextMemoryOnly,true);assert.equal(b.rawRequesterContextPersistent,false);assert.equal(b.ticketStoresRequesterContextDigestOnly,true);assert.equal(b.bindsRequesterContextDigest,true);assert.equal(b.sameContextUsedForNodeLocalConfirmationAndExecution,true);assert.equal(b.consumeOnContextMismatch,true);assert.equal(b.mathRandomFallback,false)});\ntest('generic authority and credentials remain disabled',()=>{const p=raven.privacy;for(const k of ['command_center_rustdesk_handoff_peer_id_persistence','command_center_rustdesk_handoff_password_input','command_center_rustdesk_handoff_password_transport','command_center_rustdesk_handoff_password_persistence','command_center_rustdesk_installation','command_center_generic_process_launch','command_center_generic_action_endpoint','command_center_file_access','command_center_shell_access','command_center_remote_control','command_center_device_commands','command_center_network_discovery','command_center_device_background_polling','command_center_credential_collection'])assert.equal(p[k],false,k)});\nconsole.log('RAH CC v2.0 Raven master sync contract: PASS');\n`;
          fs.writeFileSync('tests/rah-cc20-raven-master-sync.test.mjs',test);
          NODE
      - name: Validate metadata sync and all active gates
        run: |
          node --test tests/rah-command-center-packaging.test.mjs
          node --test tests/rah-cc20-precommitted-requester-context.test.mjs
          node --test tests/rah-cc20-stable-release.test.mjs
          python3 -m unittest tests/test_rah_node_agent_stable_v13.py -v
          node --test tests/raven-release-gate.test.mjs
          node --test tests/rah-cc20-raven-master-sync.test.mjs
      - name: Commit only metadata and test
        shell: bash
        run: |
          rm -rf __pycache__ tests/__pycache__
          changed="$(git status --short | sed 's/^...//' | sort)"
          expected="$(printf '%s\n' 'RAH-RAVEN-VERSION.json' 'tests/rah-cc20-raven-master-sync.test.mjs' | sort)"
          test "$changed" = "$expected" || { echo "$changed"; exit 1; }
          git config user.name 'RAH CC Raven Master Sync'
          git config user.email 'actions@users.noreply.github.com'
          git add RAH-RAVEN-VERSION.json tests/rah-cc20-raven-master-sync.test.mjs
          git commit -m 'RAH Raven master — sync canonical Command Center v2.0'
          git push origin HEAD:agent/rah-cc-v2.0-raven-master-sync
