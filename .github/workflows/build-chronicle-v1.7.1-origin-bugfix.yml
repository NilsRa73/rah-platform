name: Build Raven Chronicle v1.7.1 Origin Bugfix

on:
  push:
    branches:
      - 'chronicle/v1.7.1-local-origin-bugfix'
    paths:
      - '.github/scripts/build_chronicle_v1_7_1_origin_bugfix.py'
      - '.github/workflows/build-chronicle-v1.7.1-origin-bugfix.yml'

permissions:
  contents: write

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: desktop-bridge/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install bridge requirements
        run: python -m pip install -r desktop-bridge/requirements.txt
      - name: Build and validate Chronicle origin-boundary bugfix
        run: python .github/scripts/build_chronicle_v1_7_1_origin_bugfix.py
      - name: Commit candidate product files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop-bridge/server_v17.py desktop-bridge/test_chronicle_v17.py RAH-RAVEN-CHRONICLE-VERSION.json RAH-RAVEN-VERSION.json tests/raven-chronicle-v17.test.mjs
          git diff --cached --exit-code --quiet && { echo "No candidate changes"; exit 1; } || true
          git commit -m "RAH Raven Chronicle v1.7.1 — local origin bugfix candidate"
          git push
