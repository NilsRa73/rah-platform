name: Validate Raven Chronicle v1.7

on:
  push:
    paths:
      - "RAH-RAVEN-CHRONICLE-LIVE.html"
      - "RAH-RAVEN-INSIGHTS.html"
      - "desktop-bridge/server_v17.py"
      - "desktop-bridge/chronicle_insights.py"
      - "desktop-bridge/raven_bridge.py"
      - "desktop-bridge/test_chronicle_v17.py"
      - "desktop-bridge/test_raven_bridge_security.py"
      - ".github/workflows/validate-chronicle-v17.yml"
  pull_request:
    paths:
      - "RAH-RAVEN-CHRONICLE-LIVE.html"
      - "RAH-RAVEN-INSIGHTS.html"
      - "desktop-bridge/server_v17.py"
      - "desktop-bridge/chronicle_insights.py"
      - "desktop-bridge/raven_bridge.py"
      - "desktop-bridge/test_chronicle_v17.py"
      - "desktop-bridge/test_raven_bridge_security.py"
      - ".github/workflows/validate-chronicle-v17.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: desktop-bridge/requirements.txt

      - name: Install bridge requirements
        run: python -m pip install -r desktop-bridge/requirements.txt

      - name: Compile Python
        working-directory: desktop-bridge
        run: python -m py_compile server_v16.py server_v17.py chronicle_insights.py raven_bridge.py test_chronicle_v17.py test_raven_bridge_security.py

      - name: Run Chronicle API tests
        working-directory: desktop-bridge
        run: python test_chronicle_v17.py

      - name: Run local-origin security tests
        working-directory: desktop-bridge
        run: python test_raven_bridge_security.py

      - name: Validate Chronicle browser scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          pages = [
              ("RAH-RAVEN-CHRONICLE-LIVE.html", ["/chronicle/session/start", "/chronicle/pause", "/chronicle/session/stop", "Tastetrykk"]),
              ("RAH-RAVEN-INSIGHTS.html", ["/chronicle/summary", "/chronicle/complete", "Åpne tråder"]),
          ]
          for index, (name, required) in enumerate(pages):
              page = Path(name).read_text(encoding="utf-8")
              for marker in required:
                  assert marker in page, f"{marker} mangler i {name}"
              start = page.rfind("<script>") + len("<script>")
              end = page.rfind("</script>")
              Path(f"/tmp/raven-page-{index}.js").write_text(page[start:end], encoding="utf-8")
          PY
          node --check /tmp/raven-page-0.js
          node --check /tmp/raven-page-1.js
