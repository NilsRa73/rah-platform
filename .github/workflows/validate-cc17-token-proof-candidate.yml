name: Validate CC 1.7 Token-Proof Candidate

on:
  pull_request:
    paths:
      - 'rah-command-center-core-v1.7-candidate.js'
      - 'RAH-COMMAND-CENTER-V1.7-CANDIDATE.html'
      - 'rah-node-agent-v1.3-candidate.py'
      - 'RAH-CC17-NODE13-TOKEN-PROOF-CANDIDATE.json'
      - 'tests/rah-cc17-token-proof-candidate.test.mjs'
      - 'tests/test_rah_node_agent_token_proof_candidate.py'
      - '.github/workflows/validate-cc17-token-proof-candidate.yml'
  push:
    branches: [main]
    paths:
      - 'rah-command-center-core-v1.7-candidate.js'
      - 'RAH-COMMAND-CENTER-V1.7-CANDIDATE.html'
      - 'rah-node-agent-v1.3-candidate.py'
      - 'RAH-CC17-NODE13-TOKEN-PROOF-CANDIDATE.json'
      - 'tests/rah-cc17-token-proof-candidate.test.mjs'
      - 'tests/test_rah_node_agent_token_proof_candidate.py'
      - '.github/workflows/validate-cc17-token-proof-candidate.yml'

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Candidate-only scope guard
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch origin main --quiet
          allowed='^(rah-command-center-core-v1\.7-candidate\.js|RAH-COMMAND-CENTER-V1\.7-CANDIDATE\.html|rah-node-agent-v1\.3-candidate\.py|RAH-CC17-NODE13-TOKEN-PROOF-CANDIDATE\.json|tests/rah-cc17-token-proof-candidate\.test\.mjs|tests/test_rah_node_agent_token_proof_candidate\.py|\.github/workflows/validate-cc17-token-proof-candidate\.yml)$'
          bad="$(git diff --name-only origin/main...HEAD | grep -Ev "$allowed" || true)"
          if [ -n "$bad" ]; then
            echo 'Token-proof Candidate modified files outside authorized scope:'
            echo "$bad"
            exit 1
          fi
      - name: Preserve current Stable CC 1.6 release
        run: node --test tests/rah-cc16-stable-release.test.mjs
      - name: Preserve current Stable Node 1.2 live gate
        run: python3 -m unittest tests/test_rah_node_agent_stable_v12.py -v
      - name: Preserve token-proof research and readiness
        run: |
          node --test tests/rah-token-proof-auth-research.test.mjs
          node --test tests/rah-token-proof-auth-candidate-readiness.test.mjs
      - name: Validate CC 1.7 core, browser and blob pins
        run: node --test tests/rah-cc17-token-proof-candidate.test.mjs
      - name: Compile Node Agent 1.3 Candidate
        run: python3 -m py_compile rah-node-agent-v1.3-candidate.py
      - name: Validate Node Agent 1.3 live token-proof matrix
        run: python3 -m unittest tests/test_rah_node_agent_token_proof_candidate.py -v
