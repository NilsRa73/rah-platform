name: Validate CC 2.1 Raven Master Sync (Historical)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-historical-cc21:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7c82213c5726b9be77ae47b849af511046b40086
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Re-run immutable CC 2.1 package evidence
        run: node --test tests/rah-command-center-packaging.test.mjs
      - name: Re-run immutable CC 2.1 Manual Fleet Snapshot evidence
        run: node --test tests/rah-cc21-fleet-snapshot.test.mjs
      - name: Re-run immutable CC 2.1 Stable release evidence
        run: node --test tests/rah-cc21-stable-release.test.mjs
      - name: Preserve historical Stable Node Agent 1.3 boundary
        run: python3 -m unittest tests/test_rah_node_agent_stable_v13.py -v
      - name: Preserve historical Raven 2.0.32 release gate
        run: node --test tests/raven-release-gate.test.mjs
      - name: Re-run immutable CC 2.1 Raven master sync evidence
        run: node --test tests/rah-cc21-raven-master-sync.test.mjs
