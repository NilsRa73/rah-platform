name: Build Mission Control v2.9 Candidate

on:
  push:
    branches:
      - mission/mission-control-v2.9-boundary
    paths:
      - '.github/scripts/build_mission_control_v2_9_candidate.py'
      - '.github/workflows/build-mission-control-v2.9-candidate.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mission/mission-control-v2.9-boundary
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Mission Control v2.9 candidate
        run: python .github/scripts/build_mission_control_v2_9_candidate.py
      - name: Fix generated boundary test wrapper
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/raven-mission-control.test.mjs')
          s=p.read_text(encoding='utf-8')
          old="const normalizeBridgeBase=new Function('raw',`function normalizeBridgeBase(raw){${normalizeBody}};return normalizeBridgeBase(raw);`);"
          new="const normalizeBridgeBase=new Function('raw',normalizeBody.replace(/\\n\\s*}\\s*$/,'') );"
          if old not in s: raise SystemExit('generated test wrapper anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Validate Mission Control and Raven contracts
        run: |
          node tests/raven-mission-control.test.mjs
          node tests/raven-release-gate.test.mjs
          node --check raven-checkpoint-policy.js
      - name: Commit candidate runtime and contracts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RAH-RAVEN-MISSION-CONTROL.html RAH-RAVEN-MISSION-CONTROL-VERSION.json RAH-RAVEN-VERSION.json tests/raven-mission-control.test.mjs tests/raven-release-gate.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Secure Mission Control v2.9 local Bridge boundary'
          git push origin HEAD:mission/mission-control-v2.9-boundary
