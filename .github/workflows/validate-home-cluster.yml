name: Validate RAH Home Cluster

on:
  push:
    branches: [main]
    paths:
      - 'RAH-HOME-CLUSTER.html'
      - 'tests/test_home_cluster_contract.py'
      - 'RAH-SOFTWARE-CATALOG.json'
      - '.github/workflows/validate-home-cluster.yml'
  pull_request:
    paths:
      - 'RAH-HOME-CLUSTER.html'
      - 'tests/test_home_cluster_contract.py'
      - 'RAH-SOFTWARE-CATALOG.json'
      - '.github/workflows/validate-home-cluster.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cluster-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/test_home_cluster_contract.py
