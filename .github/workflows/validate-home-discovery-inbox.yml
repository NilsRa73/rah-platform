name: Validate RAH Home Discovery Inbox

on:
  push:
    branches: [main]
    paths:
      - 'RAH-HOME-DISCOVERY-INBOX.html'
      - 'RAH-HOME-DISCOVERY-RUN.ps1'
      - 'tests/test_home_discovery_inbox_contract.py'
      - '.github/workflows/validate-home-discovery-inbox.yml'
  pull_request:
    paths:
      - 'RAH-HOME-DISCOVERY-INBOX.html'
      - 'RAH-HOME-DISCOVERY-RUN.ps1'
      - 'tests/test_home_discovery_inbox_contract.py'
      - '.github/workflows/validate-home-discovery-inbox.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inbox-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/test_home_discovery_inbox_contract.py
