name: Build Isolated CC22 Generation 7 Updater

on:
  pull_request:
    branches:
      - release/cc22-updater-generation7-base

permissions:
  contents: write

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/cc22-updater-generation7'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch updater to immutable CC22 generation 7 release
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('UPDATE-RAH-COMMAND-CENTER.ps1')
          s=p.read_text(encoding='utf-8')
          old_commit='a6b77f93dca5f774cdb76deb707edc71f86638a1'
          new_commit='9f2f69859d96155e7400924c5624f5ee734886bf'
          assert s.count(old_commit)==1
          assert new_commit not in s
          s=s.replace(old_commit,new_commit,1)

          old_start='$AllowedPackageFiles=@(\n  "RAH-COMMAND-CENTER-V2.1.html",'
          new_start='$AllowedPackageFiles=@(\n  "RAH-COMMAND-CENTER-V2.2.html",\n  "RAH-COMMAND-CENTER-V2.2-CANDIDATE.html",\n  "rah-command-center-core-v2.2-candidate.js",\n  "rah-command-center-core-v2.2.js",\n  "RAH-CC22-FLEET-SNAPSHOT-INVALIDATION-CANDIDATE.json",\n  "RAH-CC22-NODE13-STABLE-RELEASE.json",\n  "RAH-COMMAND-CENTER-V2.1.html",'
          assert s.count(old_start)==1
          s=s.replace(old_start,new_start,1)

          assert s.count('$JournalReadinessId="rah-cc21-crash-recovery-journal-readiness-v1"')==1
          s=s.replace('$JournalReadinessId="rah-cc21-crash-recovery-journal-readiness-v1"','$JournalReadinessId="rah-cc22-crash-recovery-journal-readiness-v1"',1)
          s=s.replace('den pinnede CC 2.1-releasen','den pinnede CC 2.2-releasen')

          a=s.index('function Assert-StableReleaseContract{')
          b=s.index('function Assert-ExactPropertySet{',a)
          stable='''function Assert-StableReleaseContract{param($Release)if($Release.stage-ne"stable-release"){throw "Stable release-manifest har feil stage."};if($Release.commandCenterVersion-ne"2.2.0"-or $Release.nodeAgentVersion-ne"1.3.0"){throw "Stable release-manifest har uventet CC/Node-versjon."};if($Release.nodeActionsProtocol-ne"rah-node-actions-v7"-or $Release.authProtocol-ne"rah-node-auth-v2"-or $Release.policyId-ne"rah-capability-allowlist-v1"){throw "Stable release-manifest har uventet protokoll/policy."};$caps=@($Release.authoritySurface.capabilities);$actions=@($Release.authoritySurface.actions);$routes=@($Release.authoritySurface.businessRoutes);if(($caps -join ",")-ne"compute,storage,display,remote-desktop"){throw "Stable release har uventet capability authority."};if(($actions -join ",")-ne"storage-summary.read,rustdesk.launch,rustdesk.connect"){throw "Stable release har uventet action authority."};if(($routes -join ",")-ne"/health,/actions,/storage,/launch/rustdesk,/handoff/rustdesk"){throw "Stable release har uventet route authority."};$f=$Release.fleetSnapshotInvalidation;if($f.version-ne"rah-cc-fleet-snapshot-invalidation-v1"-or $f.failurePolicy-ne"invalidate-selected-row-on-refresh-failure"-or -not $f.selectedRowRemovedBeforeFailureRender-or $f.successfulRefreshBehaviorChanged-or $f.refreshMode-ne"explicit-selected-device-click"-or -not $f.freshNodeTokenRequiredPerRefreshClick-or -not $f.tokenProofAuthenticationRequired-or $f.tokenPersistence-or -not $f.snapshotMemoryOnly-or $f.snapshotPersistence-or $f.backgroundPolling-or $f.networkDiscovery-or $f.automaticRemoteControl-or $f.nodeRuntimeChange){throw "Stable release har uventet fail-closed Fleet Snapshot boundary."}}\n'''
          s=s[:a]+stable+s[b:]

          replacements={
            '$files.Count-ne50':'$files.Count-ne56',
            'for($i=0;$i-lt50;$i++)':'for($i=0;$i-lt56;$i++)',
            'if($Files.Count-ne50)':'if($Files.Count-ne56)',
            'annet enn 50 filer':'annet enn 56 filer',
            '$TransactionFiles.Count-ne50-or@($TransactionFiles|Select-Object -Unique).Count-ne50':'$TransactionFiles.Count-ne56-or@($TransactionFiles|Select-Object -Unique).Count-ne56',
            'ikke eksakt 50 unike filer':'ikke eksakt 56 unike filer',
            '$manifest.version-ne"2.1.0"':'$manifest.version-ne"2.2.0"',
            'canonical v2.1 Stable':'canonical v2.2 Stable',
            '[string]$manifest.entry-ne"RAH-COMMAND-CENTER-V2.1.html"-or[string]$manifest.runtime-ne"rah-command-center-core-v2.1.js"':'[string]$manifest.entry-ne"RAH-COMMAND-CENTER-V2.2.html"-or[string]$manifest.runtime-ne"rah-command-center-core-v2.2.js"',
            '$releasePath-ne"RAH-CC21-NODE13-STABLE-RELEASE.json"':'$releasePath-ne"RAH-CC22-NODE13-STABLE-RELEASE.json"',
            'Start RAH Raven Command Center v2.1 Stable':'Start RAH Raven Command Center v2.2 Stable',
            'Starter RAH Command Center v2.1 crash-recoverable transactional update.':'Starter RAH Command Center v2.2 crash-recoverable transactional update.',
            'Command Center v2.1 crash-recoverable update committed':'Command Center v2.2 crash-recoverable update committed',
            'RAH Command Center v2.1 Stable er klar.':'RAH Command Center v2.2 Stable er klar.'
          }
          for old,new in replacements.items():
              if old in ('$files.Count-ne50','for($i=0;$i-lt50;$i++)'):
                  assert s.count(old)>=1,old
                  s=s.replace(old,new)
              else:
                  assert s.count(old)==1,(old,s.count(old))
                  s=s.replace(old,new,1)

          # Refuse stale generation-6 transaction constants or release targets.
          assert old_commit not in s
          assert '$JournalReadinessId="rah-cc21-crash-recovery-journal-readiness-v1"' not in s
          assert '$files.Count-ne50' not in s and 'for($i=0;$i-lt50;$i++)' not in s and '$Files.Count-ne50' not in s
          assert '$TransactionFiles.Count-ne50' not in s
          assert '$ReleaseCommit="'+new_commit+'"' in s
          assert '$JournalReadinessId="rah-cc22-crash-recovery-journal-readiness-v1"' in s
          assert '$manifest.version-ne"2.2.0"' in s
          assert 'RAH-COMMAND-CENTER-V2.2.html' in s and 'rah-command-center-core-v2.2.js' in s
          assert '$releasePath-ne"RAH-CC22-NODE13-STABLE-RELEASE.json"' in s
          for x in ['RAH-COMMAND-CENTER-V2.2.html','RAH-COMMAND-CENTER-V2.2-CANDIDATE.html','rah-command-center-core-v2.2-candidate.js','rah-command-center-core-v2.2.js','RAH-CC22-FLEET-SNAPSHOT-INVALIDATION-CANDIDATE.json','RAH-CC22-NODE13-STABLE-RELEASE.json']:
              assert s.count('"'+x+'"')>=1,x
          assert 'compute,storage,display,remote-desktop' in s
          assert 'storage-summary.read,rustdesk.launch,rustdesk.connect' in s
          assert '/health,/actions,/storage,/launch/rustdesk,/handoff/rustdesk' in s
          assert 'branch' not in s.lower() or 'branch-head' not in s.lower()
          p.write_text(s,encoding='utf-8')
          print('CC22 generation7 updater patch PASS')
          PY
      - name: Parse and validate updater contract
        shell: pwsh
        run: |
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile('UPDATE-RAH-COMMAND-CENTER.ps1',[ref]$null,[ref]$errors)|Out-Null
          if($errors.Count -gt 0){$errors|Format-List;exit 1}
          $raw=Get-Content -LiteralPath 'UPDATE-RAH-COMMAND-CENTER.ps1' -Raw
          if($raw -notmatch '9f2f69859d96155e7400924c5624f5ee734886bf'){throw 'new verified release commit missing'}
          if($raw -notmatch 'RAH-CC22-NODE13-STABLE-RELEASE.json'){throw 'CC22 Stable release missing'}
          if($raw -notmatch 'Count-ne56'){throw '56-file transaction contract missing'}
          if($raw -match 'Count-ne50|lt50'){throw 'stale 50-file transaction contract remains'}
          if($raw -match 'a6b77f93dca5f774cdb76deb707edc71f86638a1'){throw 'old release trust target remains'}
      - name: Remove builder/request artifacts and commit updater output
        run: |
          rm -f .github/workflows/build-cc22-generation7-updater.yml
          rm -f RAH-CC22-UPDATER-BUILD-REQUEST.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build CC 2.2 generation 7 immutable updater'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
