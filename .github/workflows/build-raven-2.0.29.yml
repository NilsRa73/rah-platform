name: Build Raven 2.0.29 Shared Handoff Recall

on:
  push:
    branches: [raven-2.0.29-shared-handoff-recall]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: raven-2.0.29-shared-handoff-recall
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Raven 2.0.29
        run: python .github/scripts/build_raven_2_0_29.py
      - name: Scope Recall assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/raven-chatgpt-handoff-recall.test.mjs')
          text=p.read_text(encoding='utf-8')
          old='assert.doesNotMatch(core,/JSON\\.parse\\(localStorage\\.getItem\\(/);'
          new='assert.doesNotMatch(read,/JSON\\.parse\\(localStorage\\.getItem\\(/);'
          if old not in text: raise SystemExit('Recall assertion marker missing')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
      - name: Check JavaScript syntax
        run: |
          node --check raven-handoff-history-lite.js
          node --check raven-checkpoint-policy.js
          python - <<'PY'
          from pathlib import Path
          import re
          for name in ('RAH-RAVEN-CORE-DEMO.html','RAH-RAVEN-NOW-V2.html','RAH-RAVEN-START.html'):
              html=Path(name).read_text(encoding='utf-8')
              scripts=re.findall(r'<script(?:[^>]*)>([\s\S]*?)</script>',html)
              Path('/tmp/'+name+'.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/RAH-RAVEN-CORE-DEMO.html.js
          node --check /tmp/RAH-RAVEN-NOW-V2.html.js
          node --check /tmp/RAH-RAVEN-START.html.js
      - name: Test shared Handoff policy and Raven semantics
        run: |
          node tests/raven-handoff-history-lite-policy.test.mjs
          node tests/raven-chatgpt-handoff-recall.test.mjs
          node tests/raven-chatgpt-handoff-history-lite.test.mjs
          node tests/raven-chatgpt-handoff-receipt.test.mjs
          node tests/raven-chatgpt-handoff-resume.test.mjs
          node tests/raven-chatgpt-handoff-session.test.mjs
          node tests/raven-chatgpt-handoff-source-return.test.mjs
          node tests/raven-chatgpt-handoff-entry.test.mjs
          node tests/raven-core-demo.test.mjs
          node tests/raven-core-context.test.mjs
          node tests/raven-core-chatgpt-status.test.mjs
          node tests/raven-core-chatgpt-handoff-center.test.mjs
          node tests/raven-checkpoint-policy.test.mjs
          node tests/raven-now-v2.test.mjs
          node tests/raven-mission-control.test.mjs
          node tests/raven-project-focus.test.mjs
          node tests/raven-vision-core.test.mjs
      - name: Commit tested runtime
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add RAH-RAVEN-CORE-DEMO.html RAH-RAVEN-NOW-V2.html RAH-RAVEN-START.html RAH-RAVEN-VERSION.json tests/*.mjs
          git commit -m "Share Handoff Recall policy in Raven 2.0.29"
          git push origin HEAD:raven-2.0.29-shared-handoff-recall
