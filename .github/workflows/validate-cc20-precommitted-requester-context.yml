name: Validate CC 2.0 Precommitted Requester Context Candidate
on:
  pull_request:
    paths:
      - 'rah-command-center-core-v2.0-candidate.js'
      - 'RAH-COMMAND-CENTER-V2.0-CANDIDATE.html'
      - 'RAH-CC20-PRECOMMITTED-REQUESTER-CONTEXT-CANDIDATE.json'
      - 'tests/rah-cc20-precommitted-requester-context.test.mjs'
      - '.github/workflows/validate-cc20-precommitted-requester-context.yml'
  push:
    branches: [main]
    paths:
      - 'rah-command-center-core-v2.0-candidate.js'
      - 'RAH-COMMAND-CENTER-V2.0-CANDIDATE.html'
      - 'RAH-CC20-PRECOMMITTED-REQUESTER-CONTEXT-CANDIDATE.json'
      - 'tests/rah-cc20-precommitted-requester-context.test.mjs'
      - '.github/workflows/validate-cc20-precommitted-requester-context.yml'
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Candidate lifecycle scope guard
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch origin main --quiet
          allowed='^(rah-command-center-core-v2\.0-candidate\.js|RAH-COMMAND-CENTER-V2\.0-CANDIDATE\.html|RAH-CC20-PRECOMMITTED-REQUESTER-CONTEXT-CANDIDATE\.json|tests/rah-cc20-precommitted-requester-context\.test\.mjs|\.github/workflows/validate-cc20-precommitted-requester-context\.yml)$'
          changed="$(git diff --name-only origin/main...HEAD)"
          test -n "$changed" || { echo 'No CC 2.0 Candidate lifecycle files changed'; exit 1; }
          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          test -z "$bad" || { echo "$bad"; exit 1; }
      - name: Validate v2.0 precommitted requester context
        run: node --test tests/rah-cc20-precommitted-requester-context.test.mjs
      - name: Preserve canonical v1.9 and Stable release
        run: |
          node --test tests/rah-command-center-packaging.test.mjs
          node --test tests/rah-cc19-immutable-mutating-intent.test.mjs
          node --test tests/rah-cc19-stable-release.test.mjs
      - name: Preserve Stable Node 1.3 live boundary
        run: python3 -m unittest tests/test_rah_node_agent_stable_v13.py -v
      - name: Preserve Raven master and release consumers
        run: |
          node --test tests/rah-cc19-raven-master-sync.test.mjs
          node --test tests/raven-release-gate.test.mjs
          node --test tests/raven-project-registry-v0.1.test.mjs
