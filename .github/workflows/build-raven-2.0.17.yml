name: Build Raven 2.0.17 Core Next Action

on:
  push:
    branches: [raven-2.0.17-core-next-action]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: raven-2.0.17-core-next-action
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Add read-only next action explainer to Raven Core
        shell: python
        run: |
          from pathlib import Path
          import json

          def replace(path, old, new):
              p=Path(path); text=p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{path}: expected text not found: {old[:180]}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          core='RAH-RAVEN-CORE-DEMO.html'
          replace(core,'RAH Raven Core Workflow v1.3','RAH Raven Core Workflow v1.4')
          replace(core,'Core v1.3 · DIRECTION','Core v1.4 · NEXT ACTION')
          replace(core,'.direction-card p{margin:5px 0 0;color:var(--muted);font-size:13px}', '.direction-card p{margin:5px 0 0;color:var(--muted);font-size:13px}.next-action-card{margin-top:12px;background:#0b1016;border:1px solid #8a6a24;border-left:4px solid var(--gold);border-radius:13px;padding:14px}.next-action-card small{display:block;color:var(--gold);font-size:11px;font-weight:900;letter-spacing:.7px}.next-action-card strong{display:block;margin-top:5px;color:var(--text);font-size:18px}.next-action-card p{margin:6px 0 0;color:var(--muted);font-size:13px}')

          marker='''  <a class="btn primary continue-btn" id="coreContinue" href="RAH-RAVEN-MISSION-CONTROL.html" aria-describedby="contextCheckpointReason">FORTSETT → MISSION CONTROL</a>'''
          addition='''  <div class="next-action-card" id="contextNextActionCard">\n    <small>NESTE HANDLING · INGEN AUTOMATIKK</small>\n    <strong id="contextNextAction">Raven forklarer neste manuelle handling…</strong>\n    <p id="contextNextActionDetail">Ingenting utføres før du selv velger hva som skal skje på neste skjerm.</p>\n  </div>\n  <a class="btn primary continue-btn" id="coreContinue" href="RAH-RAVEN-MISSION-CONTROL.html" aria-describedby="contextCheckpointReason contextNextActionDetail">FORTSETT → MISSION CONTROL</a>'''
          replace(core,marker,addition)
          replace(core,'FORTSETT styres av Raven Context Snapshot og navigerer bare. Pipeline-markeringen viser progresjon, men bestemmer aldri FORTSETT-ruten.', 'FORTSETT styres av Raven Context Snapshot og navigerer bare. «Neste handling» forklarer hva du kan gjøre der; den utfører ingenting og kan ikke endre FORTSETT-ruten.')

          helper='''\n  function nextActionHint(snapshot,checkpoint){\n    const mission=snapshot.mission?.title||"aktiv mission";\n    const project=snapshot.activeProject?.name||"aktivt prosjekt";\n    const nextTitle=String(snapshot.nextStep?.title||"").trim();\n    const nextDetail=String(snapshot.nextStep?.detail||snapshot.nextStep?.action||"").trim();\n    const blocker=String(snapshot.blocker?.text||"").trim();\n    if(checkpoint.kind==="BLOCKER")return Object.freeze({title:`Avklar blokkeringen i «${mission}»`,detail:blocker?`Blokkering: ${blocker}. Åpne Mission Control og avgjør selv hvordan den skal løses.`:"Åpne Mission Control og avklar blokkeringen før du fortsetter."});\n    if(checkpoint.kind==="MISSION MISMATCH")return Object.freeze({title:`Avklar mission «${mission}» før prosjektarbeidet fortsetter`,detail:nextTitle?`Neste mission-steg er «${nextTitle}». Åpne Mission Control og velg eksplisitt om missionen skal fortsette eller om prosjektfokus skal vurderes.`:"Åpne Mission Control og avklar hvilken prosjektkontekst missionen skal fortsette i. Ingen prosjektbytte skjer automatisk."});\n    if(checkpoint.kind==="MISSION PROJECT UNKNOWN")return Object.freeze({title:`Avklar prosjektkoblingen for «${mission}»`,detail:"Åpne Mission Control og kontroller missionens prosjektkobling før du endrer arbeidsfokus."});\n    if(checkpoint.kind==="MISSION")return Object.freeze({title:nextTitle?`Fortsett med: ${nextTitle}`:`Åpne aktiv mission «${mission}»`,detail:nextDetail||`Åpne Mission Control og velg neste mission-handling eksplisitt.`});\n    if(checkpoint.kind==="PROJECT")return Object.freeze({title:`Åpne prosjektet «${project}»`,detail:"Se statusen i Project Focus og velg neste konkrete oppgave. Aktivt prosjekt endres ikke av denne forklaringen."});\n    return Object.freeze({title:"Velg én konkret mission",detail:"Åpne Mission Control og velg eller opprett en konkret arbeidsretning eksplisitt."});\n  }\n'''
          replace(core,'  function renderContextSnapshot(snapshot,checkpoint){',helper+'\n  function renderContextSnapshot(snapshot,checkpoint){')
          replace(core,'  function renderContextSnapshot(snapshot,checkpoint){\n    const relation=snapshot.relation;', '  function renderContextSnapshot(snapshot,checkpoint){\n    const relation=snapshot.relation;\n    const nextAction=nextActionHint(snapshot,checkpoint);')
          replace(core,'    $("contextCheckpointReason").textContent=checkpoint.reason;\n    $("coreContinue").href=checkpoint.href;', '    $("contextCheckpointReason").textContent=checkpoint.reason;\n    $("contextNextAction").textContent=nextAction.title;\n    $("contextNextActionDetail").textContent=nextAction.detail;\n    $("coreContinue").href=checkpoint.href;')
          replace(core,'    const visionSaved=!!(vision&&state.visionHistory?.some(item=>item.id===vision.id)),missionReady=!!mission?.councilId,agentSaved=agentSavedInMission(agent,mission),coreReady=services.bridge&&services.model&&services.agent,pipeline=corePipelineState(coreReady,!!vision,visionSaved,!!council,missionReady,agentSaved,sync.complete);\n    return [', '    const visionSaved=!!(vision&&state.visionHistory?.some(item=>item.id===vision.id)),missionReady=!!mission?.councilId,agentSaved=agentSavedInMission(agent,mission),coreReady=services.bridge&&services.model&&services.agent,pipeline=corePipelineState(coreReady,!!vision,visionSaved,!!council,missionReady,agentSaved,sync.complete),nextAction=nextActionHint(snapshot,checkpoint);\n    return [')
          replace(core,'      `Core FORTSETT: ${checkpoint.href}`,\n      `Core pipeline:', '      `Core FORTSETT: ${checkpoint.href}`,\n      `Neste handling: ${nextAction.title} · ${nextAction.detail}`,\n      `Core pipeline:')
          replace(core,'Raven Core v1.3 skiller pipeline-status fra operativ Context Snapshot-retning; FORTSETT styres bare av den operative retningen', 'Raven Core v1.4 viser i tillegg én read-only neste-handling-forklaring; FORTSETT styres fortsatt bare av operativ Context Snapshot-retning')
          replace(core,'RAH-Raven-Core-v1.3-', 'RAH-Raven-Core-v1.4-')

          replace('tests/raven-core-demo.test.mjs','Raven Core Workflow v1\\.3','Raven Core Workflow v1\\.4')
          replace('tests/raven-core-demo.test.mjs','Raven Core workflow v1.3 validation passed.','Raven Core workflow v1.4 validation passed.')

          test=Path('tests/raven-core-context.test.mjs')
          test.write_text('''import assert from "node:assert/strict";\nimport fs from "node:fs";\nconst html=fs.readFileSync("RAH-RAVEN-CORE-DEMO.html","utf8");\nconst policy=fs.readFileSync("raven-checkpoint-policy.js","utf8");\nfunction between(text,start,end){const a=text.indexOf(start);assert.notEqual(a,-1);const b=text.indexOf(end,a+start.length);assert.notEqual(b,-1);return text.slice(a+start.length,b)}\nassert.match(html,/RAH Raven Core Workflow v1\\.4/);\nassert.match(html,/Core v1\\.4 · NEXT ACTION/);\nassert.match(html,/Raven Context Snapshot/);\nassert.match(html,/id="contextSnapshotPanel"/);\nassert.match(html,/id="coreDirectionStatus"/);\nfor(const id of ["pipelineDirection","pipelineDirectionMeta","operationalDirection","operationalDirectionMeta","contextNextActionCard","contextNextAction","contextNextActionDetail","coreContinue"]) assert.match(html,new RegExp(`id="${id}"`));\nassert.match(html,/PIPELINE-STATUS/);\nassert.match(html,/OPERATIV RETNING · STYRER FORTSETT/);\nassert.match(html,/NESTE HANDLING · INGEN AUTOMATIKK/);\nassert.match(html,/«Neste handling» forklarer hva du kan gjøre der/);\nassert.match(html,/<script src="raven-checkpoint-policy\\.js"><\\/script>/);\nassert.match(html,/CHECKPOINT\\.contextSnapshot\\(state,mission,missionBlocker\\(mission\\)\\)/);\nassert.match(html,/CHECKPOINT\\.recommendSnapshot\\(snapshot,"core"\\)/);\nassert.match(html,/function corePipelineState\\(/);\nassert.match(html,/function renderCoreDirection\\(/);\nassert.match(html,/function nextActionHint\\(/);\nconst pipeline=between(html,"function corePipelineState(","function renderCoreDirection(");\nassert.doesNotMatch(pipeline,/localStorage/);\nassert.doesNotMatch(pipeline,/activeProject\\s*=/);\nassert.doesNotMatch(pipeline,/activeMission\\s*=/);\nassert.doesNotMatch(pipeline,/\\.done\\s*=\\s*true/);\nassert.doesNotMatch(pipeline,/\\/agent\\/run/);\nconst direction=between(html,"function renderCoreDirection(pipeline,checkpoint){","function nextActionHint(snapshot,checkpoint){");\nassert.match(direction,/pipelineDirection/);\nassert.match(direction,/operationalDirection/);\nassert.doesNotMatch(direction,/coreContinue/);\nassert.doesNotMatch(direction,/localStorage/);\nconst nextAction=between(html,"function nextActionHint(snapshot,checkpoint){","function renderContextSnapshot(snapshot,checkpoint){");\nfor(const kind of ["BLOCKER","MISSION MISMATCH","MISSION PROJECT UNKNOWN","MISSION","PROJECT"]) assert.match(nextAction,new RegExp(`checkpoint\\.kind===\\"${kind}\\"`));\nassert.match(nextAction,/snapshot\\.nextStep/);\nassert.match(nextAction,/snapshot\\.blocker/);\nassert.doesNotMatch(nextAction,/localStorage/);\nassert.doesNotMatch(nextAction,/writeState\\(/);\nassert.doesNotMatch(nextAction,/activeProject\\s*=/);\nassert.doesNotMatch(nextAction,/activeMission\\s*=/);\nassert.doesNotMatch(nextAction,/\\.done\\s*=\\s*true/);\nassert.doesNotMatch(nextAction,/\\/agent\\/run/);\nassert.doesNotMatch(nextAction,/coreContinue/);\nassert.doesNotMatch(nextAction,/\\.href\\s*=/);\nconst context=between(html,"function renderContextSnapshot(snapshot,checkpoint){","function buildReport(){");\nassert.match(context,/const nextAction=nextActionHint\\(snapshot,checkpoint\\)/);\nassert.match(context,/contextNextAction/);\nassert.match(context,/contextNextActionDetail/);\nassert.match(context,/\\$\\("coreContinue"\\)\\.href=checkpoint\\.href/);\nassert.doesNotMatch(context,/nextAction\\.href/);\nassert.doesNotMatch(context,/pipeline\\.href/);\nassert.doesNotMatch(context,/localStorage\\.setItem/);\nassert.doesNotMatch(context,/writeState\\(/);\nassert.doesNotMatch(context,/activeProject\\s*=/);\nassert.doesNotMatch(context,/activeMission\\s*=/);\nassert.doesNotMatch(context,/\\.done\\s*=\\s*true/);\nassert.doesNotMatch(context,/\\/agent\\/run/);\nassert.equal((html.match(/id="coreContinue"/g)||[]).length,1);\nassert.doesNotMatch(html,/coreContinue[^\\n]*onclick=/);\nassert.match(policy,/function contextSnapshot\\(/);\nassert.match(policy,/function recommendSnapshot\\(/);\nconsole.log("Raven Core v1.4 adds a read-only next-action explainer without changing Context Snapshot FORTSETT authority.");\n''',encoding='utf-8')

          manifest_path=Path('RAH-RAVEN-VERSION.json')
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['version']='2.0.17'; manifest['released_at']='2026-08-13'
          manifest['summary']='RAH Raven 2.0.17 adds a read-only Next Action explainer to Raven Core v1.4. The explainer translates the existing canonical Context Snapshot recommendation into one concrete manual action, including blocker, mission mismatch, mission step, project, and no-context cases. It cannot navigate, write state, switch projects, mutate missions, complete steps, or run the Agent; the central FORTSETT route remains controlled only by the canonical checkpoint recommendation.'
          p=manifest.setdefault('privacy',{})
          p['raven_core_next_action_visible']=True
          p['raven_core_next_action_derived_from_context_snapshot']=True
          p['raven_core_next_action_explainer_only']=True
          p['raven_core_next_action_read_only']=True
          p['raven_core_next_action_no_storage_writes']=True
          p['raven_core_next_action_cannot_control_continue_route']=True
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          replace('.github/workflows/validate-raven-core-demo.yml','Run Raven Core v1.3 validation','Run Raven Core v1.4 validation')
          replace('.github/workflows/validate-raven-core-demo.yml','Run Raven Core pipeline + operational direction validation','Run Raven Core pipeline + next action validation')

          wf='.github/workflows/validate-raven-one-click.yml'
          replace(wf,'Validate manifest and Raven 2.0.16 safety contract','Validate manifest and Raven 2.0.17 safety contract')
          replace(wf,"assert manifest['version'] == '2.0.16'","assert manifest['version'] == '2.0.17'")
          replace(wf,"          assert p['raven_core_pipeline_cannot_control_continue_route'] is True\n          print('Manifest 2.0.16 / launcher 3.0 / Core direction separation: OK')", "          assert p['raven_core_pipeline_cannot_control_continue_route'] is True\n          assert p['raven_core_next_action_visible'] is True\n          assert p['raven_core_next_action_derived_from_context_snapshot'] is True\n          assert p['raven_core_next_action_explainer_only'] is True\n          assert p['raven_core_next_action_read_only'] is True\n          assert p['raven_core_next_action_no_storage_writes'] is True\n          assert p['raven_core_next_action_cannot_control_continue_route'] is True\n          print('Manifest 2.0.17 / launcher 3.0 / Core next action safety: OK')")
          replace(wf,'Validate shared Context Snapshot and Core direction boundaries','Validate shared Context Snapshot and Core next action boundaries')
          replace(wf,"          assert 'Raven Core Workflow v1.3' in core\n          assert 'Core v1.3 · DIRECTION' in core", "          assert 'Raven Core Workflow v1.4' in core\n          assert 'Core v1.4 · NEXT ACTION' in core")
          replace(wf,"          assert 'function renderCoreDirection(' in core\n", "          assert 'function renderCoreDirection(' in core\n          assert 'id=\"contextNextActionCard\"' in core\n          assert 'id=\"contextNextAction\"' in core\n          assert 'id=\"contextNextActionDetail\"' in core\n          assert 'NESTE HANDLING · INGEN AUTOMATIKK' in core\n          assert 'function nextActionHint(' in core\n")
          replace(wf,"          direction = core.split('function renderCoreDirection(pipeline,checkpoint){',1)[1].split('function renderContextSnapshot(snapshot,checkpoint){',1)[0]\n", "          direction = core.split('function renderCoreDirection(pipeline,checkpoint){',1)[1].split('function nextActionHint(snapshot,checkpoint){',1)[0]\n")
          next_action_checks="""          next_action = core.split('function nextActionHint(snapshot,checkpoint){',1)[1].split('function renderContextSnapshot(snapshot,checkpoint){',1)[0]\n          assert 'snapshot.nextStep' in next_action\n          assert 'snapshot.blocker' in next_action\n          assert 'coreContinue' not in next_action\n          assert 'localStorage' not in next_action\n          assert 'writeState(' not in next_action\n          assert re.search(r'\\bactiveMission\\s*=(?!=)', next_action) is None\n          assert re.search(r'\\bactiveProject\\s*=(?!=)', next_action) is None\n          assert re.search(r'\\.done\\s*=\\s*true', next_action) is None\n          assert '/agent/run' not in next_action\n          assert '.href=' not in next_action\n\n"""
          replace(wf,"          context = core.split('function renderContextSnapshot(snapshot,checkpoint){',1)[1].split('function buildReport(){',1)[0]\n", next_action_checks+"          context = core.split('function renderContextSnapshot(snapshot,checkpoint){',1)[1].split('function buildReport(){',1)[0]\n")
          replace(wf,"          assert 'pipeline.href' not in context", "          assert 'const nextAction=nextActionHint(snapshot,checkpoint)' in context\n          assert 'contextNextAction' in context\n          assert 'contextNextActionDetail' in context\n          assert 'nextAction.href' not in context\n          assert 'pipeline.href' not in context")
          replace(wf,"print('Shared Context Snapshot remains authoritative; Core pipeline is read-only and cannot control FORTSETT: OK')", "print('Shared Context Snapshot remains authoritative; Core next-action explainer is read-only and cannot control FORTSETT: OK')")
          replace(wf,"Write-Host 'RAH Raven one-click -> Core direction separation Raven 2.0.16: OK'", "Write-Host 'RAH Raven one-click -> Core next action Raven 2.0.17: OK'")

      - name: Test Raven Core next action explainer
        run: |
          node --check raven-checkpoint-policy.js
          node tests/raven-checkpoint-policy.test.mjs
          node tests/raven-core-demo.test.mjs
          node tests/raven-core-context.test.mjs
          node tests/raven-now-v2.test.mjs
          node tests/raven-mission-control.test.mjs
          node tests/raven-project-focus.test.mjs
      - name: Commit tested runtime
        shell: bash
        run: |
          git config user.name 'RAH Raven Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add RAH-RAVEN-CORE-DEMO.html RAH-RAVEN-VERSION.json tests/raven-core-demo.test.mjs tests/raven-core-context.test.mjs .github/workflows/validate-raven-core-demo.yml .github/workflows/validate-raven-one-click.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Add Core next action explainer for 2.0.17'
          git push origin HEAD:raven-2.0.17-core-next-action
