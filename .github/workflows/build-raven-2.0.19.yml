name: Build Raven 2.0.19 Vision Core Handoff

on:
  push:
    branches: [raven-2.0.19-vision-core-handoff]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: raven-2.0.19-vision-core-handoff
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Add Core to Vision ChatGPT handoff mode
        shell: python
        run: |
          from pathlib import Path
          import json

          def replace(path, old, new, count=1):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{path}: expected text not found: {old[:180]}')
              p.write_text(text.replace(old,new,count),encoding='utf-8')

          core=Path('RAH-RAVEN-CORE-DEMO.html')
          text=core.read_text(encoding='utf-8')
          text=text.replace('RAH Raven Core Workflow v1.4','RAH Raven Core Workflow v1.5')
          text=text.replace('Core v1.4 · NEXT ACTION','Core v1.5 · VISION HANDOFF')
          text=text.replace('Raven Core v1.4 viser i tillegg én read-only neste-handling-forklaring;','Raven Core v1.5 legger til direkte, eksplisitt Vision → ChatGPT-handoff fra Core;')
          text=text.replace('RAH-Raven-Core-v1.4-','RAH-Raven-Core-v1.5-')
          old='<div class="actions row"><a class="btn primary" href="RAH-RAVEN-VISION-CORE.html">Åpne Vision</a></div></article>'
          new='<div class="actions row"><a class="btn primary" href="RAH-RAVEN-VISION-CORE.html">Åpne Vision</a><a class="btn" id="visionChatGPTHandoff" href="RAH-RAVEN-VISION-CORE.html?mode=chatgpt">DEL BILDE MED CHATGPT</a></div></article>'
          if old not in text: raise SystemExit('Core Vision step action not found')
          text=text.replace(old,new,1)
          core.write_text(text,encoding='utf-8')

          vision=Path('RAH-RAVEN-VISION-CORE.html')
          text=vision.read_text(encoding='utf-8')
          text=text.replace('RAH Raven Vision Core v0.2','RAH Raven Vision Core v0.3')
          text=text.replace('<span class="badge">v0.2</span>','<span class="badge">v0.3</span>',1)
          text=text.replace('raven-vision-core.js?v=0.2','raven-vision-core.js?v=0.3')
          old='<div class="row"><span class="badge">v0.3</span><a class="btn" href="RAH-RAVEN-START.html">← Raven Start</a><a class="btn" href="RAH-RAVEN-COUNCIL.html">Raven Council</a></div>'
          new='<div class="row"><span class="badge">v0.3</span><a class="btn" href="RAH-RAVEN-CORE-DEMO.html">← Raven Core</a><a class="btn" href="RAH-RAVEN-START.html">Raven Start</a><a class="btn" href="RAH-RAVEN-COUNCIL.html">Raven Council</a></div>'
          if old not in text: raise SystemExit('Vision header row not found')
          text=text.replace(old,new,1)
          old='  const CORE = window.RavenVisionCore;\n  const HISTORY_KEY = "rah.raven.vision.core.history.v1";'
          new='  const CORE = window.RavenVisionCore;\n  const chatGPTMode = new URLSearchParams(location.search).get("mode") === "chatgpt";\n  const HISTORY_KEY = "rah.raven.vision.core.history.v1";'
          if old not in text: raise SystemExit('Vision CORE declaration not found')
          text=text.replace(old,new,1)
          old='    $("shareStatus").textContent = "Bildet er klart. Trykk DEL SISTE BILDE MED CHATGPT for å se eksplisitte delingsvalg.";'
          new='    $("shareStatus").textContent = chatGPTMode ? "Bildet er klart for eksplisitt ChatGPT-handoff. Velg KOPIER BILDE eller LAST NED PNG." : "Bildet er klart. Trykk DEL SISTE BILDE MED CHATGPT for å se eksplisitte delingsvalg.";'
          if old not in text: raise SystemExit('Vision setImage share status not found')
          text=text.replace(old,new,1)
          old='  $("bridgeBase").value = CORE.normalizeBase(localStorage.getItem("rah.bridge.base"));\n  renderHistory(); testAll();'
          new='  $("bridgeBase").value = CORE.normalizeBase(localStorage.getItem("rah.bridge.base"));\n  if (chatGPTMode) {\n    $("chatgptSharePanel").style.display = "block";\n    $("shareStatus").textContent = "ChatGPT-handoff-modus: velg eller fang et bilde. Deretter velger du selv KOPIER BILDE eller LAST NED PNG. Ingenting sendes automatisk.";\n  }\n  renderHistory(); testAll();'
          if old not in text: raise SystemExit('Vision startup block not found')
          text=text.replace(old,new,1)
          vision.write_text(text,encoding='utf-8')

          vt=Path('tests/raven-vision-core.test.mjs')
          text=vt.read_text(encoding='utf-8')
          text=text.replace('RAH Raven Vision Core v0\\.2','RAH Raven Vision Core v0\\.3')
          text=text.replace('<span class="badge">v0\\.2<\\/span>','<span class="badge">v0\\.3<\\/span>')
          text=text.replace("console.log('Raven Vision Core v0.2 explicit ChatGPT handoff validation passed.');",'''assert.match(html, /RAH-RAVEN-CORE-DEMO\\.html/);\nassert.match(html, /new URLSearchParams\\(location\\.search\\)\\.get\\(\"mode\"\\) === \"chatgpt\"/);\nassert.match(html, /ChatGPT-handoff-modus/);\nassert.match(html, /chatGPTMode \\? \"Bildet er klart for eksplisitt ChatGPT-handoff/);\nassert.equal((html.match(/copyImageToClipboard\\(\\)/g)||[]).length, 1);\nassert.equal((html.match(/downloadLatestPng\\(\\)/g)||[]).length, 1);\nconsole.log('Raven Vision Core v0.3 explicit Core handoff validation passed.');''')
          vt.write_text(text,encoding='utf-8')

          ct=Path('tests/raven-core-demo.test.mjs')
          text=ct.read_text(encoding='utf-8')
          text=text.replace('Raven Core Workflow v1\\.4','Raven Core Workflow v1\\.5')
          text=text.replace("assert.match(html, /RAH-RAVEN-MEMORY-SYNC\\.html/);",'''assert.match(html, /RAH-RAVEN-MEMORY-SYNC\\.html/);\nassert.match(html, /id=\"visionChatGPTHandoff\"/);\nassert.match(html, /RAH-RAVEN-VISION-CORE\\.html\\?mode=chatgpt/);\nassert.match(html, /DEL BILDE MED CHATGPT/);''')
          text=text.replace("console.log('Raven Core workflow v1.4 validation passed.');","console.log('Raven Core workflow v1.5 Vision handoff validation passed.');")
          ct.write_text(text,encoding='utf-8')

          cct=Path('tests/raven-core-context.test.mjs')
          text=cct.read_text(encoding='utf-8')
          text=text.replace('RAH Raven Core Workflow v1\\.4','RAH Raven Core Workflow v1\\.5')
          text=text.replace('Core v1\\.4 · NEXT ACTION','Core v1\\.5 · VISION HANDOFF')
          text=text.replace('console.log("Raven Core v1.4 adds a read-only next-action explainer without changing Context Snapshot FORTSETT authority.");','console.log("Raven Core v1.5 keeps Context Snapshot FORTSETT authority while adding explicit Vision handoff navigation.");')
          cct.write_text(text,encoding='utf-8')

          manifest_path=Path('RAH-RAVEN-VERSION.json')
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['version']='2.0.19'
          manifest['released_at']='2026-08-13'
          manifest['summary']='RAH Raven 2.0.19 connects Raven Core v1.5 directly to Raven Vision Core v0.3 ChatGPT handoff mode. Core now offers DEL BILDE MED CHATGPT, which opens Vision with the explicit share panel visible and a direct return path to Raven Core. The mode never copies, downloads, sends, captures, or changes state automatically; those actions still require explicit user clicks.'
          privacy=manifest.setdefault('privacy',{})
          privacy['vision_chatgpt_core_entry_visible']=True
          privacy['vision_chatgpt_mode_navigation_only']=True
          privacy['vision_chatgpt_mode_no_auto_copy']=True
          privacy['vision_chatgpt_mode_no_auto_download']=True
          privacy['vision_chatgpt_mode_no_auto_send']=True
          privacy['vision_chatgpt_mode_no_auto_capture']=True
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

      - name: Test Raven 2.0.19 runtime
        shell: bash
        run: |
          set -euo pipefail
          node --check raven-vision-core.js
          python - <<'PY'
          from pathlib import Path
          import re
          for name in ('RAH-RAVEN-VISION-CORE.html','RAH-RAVEN-CORE-DEMO.html'):
              html=Path(name).read_text(encoding='utf-8')
              scripts=re.findall(r'<script(?:[^>]*)>([\s\S]*?)</script>',html)
              Path('/tmp/'+name+'.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/RAH-RAVEN-VISION-CORE.html.js
          node --check /tmp/RAH-RAVEN-CORE-DEMO.html.js
          node tests/raven-vision-core.test.mjs
          node tests/raven-core-demo.test.mjs
          node tests/raven-core-context.test.mjs
          node tests/raven-checkpoint-policy.test.mjs
          node tests/raven-now-v2.test.mjs
          node tests/raven-mission-control.test.mjs
          node tests/raven-project-focus.test.mjs
      - name: Commit tested runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'RAH Raven Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add RAH-RAVEN-CORE-DEMO.html RAH-RAVEN-VISION-CORE.html RAH-RAVEN-VERSION.json tests/raven-vision-core.test.mjs tests/raven-core-demo.test.mjs tests/raven-core-context.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Add Core to Vision ChatGPT handoff for 2.0.19'
          git push origin HEAD:raven-2.0.19-vision-core-handoff
