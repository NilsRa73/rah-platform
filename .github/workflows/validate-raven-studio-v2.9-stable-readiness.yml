name: Validate Raven Studio v2.9 Retirement Readiness

on:
  pull_request:
    paths:
      - 'RAH-RAVEN-STUDIO-V2.9-STABLE-READINESS.json'
      - 'RAH-RAVEN-STUDIO-V2.9-CANDIDATE.json'
      - 'RAH-RAVEN-STUDIO-V3.0.json'
      - 'tests/raven-studio-v2.9-stable-readiness.test.mjs'
      - 'tests/test_raven_studio_v30.py'
      - '.github/workflows/validate-raven-studio-v2.9-stable-readiness.yml'
  push:
    branches: [main]
    paths:
      - 'RAH-RAVEN-STUDIO-V2.9-STABLE-READINESS.json'
      - 'RAH-RAVEN-STUDIO-V2.9-CANDIDATE.json'
      - 'RAH-RAVEN-STUDIO-V3.0.json'
      - 'tests/raven-studio-v2.9-stable-readiness.test.mjs'
      - 'tests/test_raven_studio_v30.py'
      - '.github/workflows/validate-raven-studio-v2.9-stable-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate 2.9 retirement readiness
        run: node --test tests/raven-studio-v2.9-stable-readiness.test.mjs
      - name: Re-prove Studio 3.0 Stable contract
        run: python tests/test_raven_studio_v30.py
