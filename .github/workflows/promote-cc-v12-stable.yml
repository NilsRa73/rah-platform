name: Promote CC v1.2 Stable atomically
on:
  push:
    branches: ['agent/rah-cc-v1.2-session-bound-enrollment']
    paths:
      - 'tools/promote-command-center-v12-stable.mjs'
      - '.github/workflows/promote-cc-v12-stable.yml'
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Generate atomic Stable metadata
        run: node tools/promote-command-center-v12-stable.mjs
      - name: Verify runtime untouched
        run: |
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' RAH-COMMAND-CENTER-VERSION.json RAH-RAVEN-VERSION.json tests/rah-command-center-packaging.test.mjs tests/rah-command-center-v12.test.mjs | sort)"
          test "$changed" = "$expected"
      - name: v1.2 Stable core
        run: node --test tests/rah-command-center-core.test.mjs
      - name: v1.2 Stable integration
        run: node --test tests/rah-command-center-v12.test.mjs
      - name: v1.2 Stable packaging
        run: node --test tests/rah-command-center-packaging.test.mjs
      - name: Node Agent v0.8 full HTTP regression
        run: python -m unittest tests/test_rah_node_agent.py -v
      - name: Parse manual updater scripts
        shell: pwsh
        run: |
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile('UPDATE-RAH-COMMAND-CENTER.ps1',[ref]$null,[ref]$errors)|Out-Null
          if($errors.Count -gt 0){$errors|Format-List;exit 1}
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile('UPDATE-RAH-RAVEN.ps1',[ref]$null,[ref]$errors)|Out-Null
          if($errors.Count -gt 0){$errors|Format-List;exit 1}
      - name: Raven and support gates
        run: |
          node --test tests/raven-release-gate.test.mjs
          node --test tests/raven-project-registry-v0.1.test.mjs
          node --test tests/raven-daily-brief-v0.1.test.mjs
          node --test tests/raven-health-fatigue-v0.2.test.mjs
          node --test tests/raven-care-v0.1.test.mjs
          node --test tests/raven-fristvakt-v0.2.test.mjs
      - name: Verify current Stable manifest chain
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const raven=JSON.parse(fs.readFileSync('RAH-RAVEN-VERSION.json','utf8'));
          const cc=JSON.parse(fs.readFileSync('RAH-COMMAND-CENTER-VERSION.json','utf8'));
          if(cc.version!=='1.2.0'||cc.stage!=='stable'||cc.release_gate?.status!=='passed')throw new Error('CC v1.2 Stable mismatch');
          if(!raven.files.includes(cc.entry))throw new Error('Raven master missing current CC entry');
          if(!raven.summary.includes(`RAH Raven Command Center v${cc.version}`))throw new Error('Raven master missing current CC version');
          if(!fs.existsSync(cc.entry))throw new Error('Current CC entry file missing');
          NODE
      - name: Commit Stable freeze and Raven sync
        run: |
          git config user.name "RAH Raven Builder"
          git config user.email "actions@users.noreply.github.com"
          git add RAH-COMMAND-CENTER-VERSION.json RAH-RAVEN-VERSION.json tests/rah-command-center-v12.test.mjs tests/rah-command-center-packaging.test.mjs
          git commit -m "RAH Command Center v1.2 — stable gate and Raven sync"
          git push
