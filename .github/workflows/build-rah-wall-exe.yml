name: Build Native RAH-WALL EXE

on:
  push:
    branches:
      - build/rah-wall-exe
    paths:
      - 'tools/rah-wall-exe/**'
      - '.github/workflows/build-rah-wall-exe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile native Windows EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $env:GITHUB_WORKSPACE 'tools\rah-wall-exe\Program.cs'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist\rah-wall'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path $csc)) { throw "C# compiler not found: $csc" }

          & $csc `
            /nologo `
            /target:winexe `
            /platform:x64 `
            /optimize+ `
            /debug- `
            /out:"$dist\RAH-WALL.exe" `
            /reference:System.dll `
            /reference:System.Core.dll `
            /reference:System.Drawing.dll `
            /reference:System.Windows.Forms.dll `
            "$src"

          if ($LASTEXITCODE -ne 0) { throw "csc failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "$dist\RAH-WALL.exe")) { throw 'RAH-WALL.exe was not produced' }

          Copy-Item 'tools\rah-wall-exe\README.md' "$dist\README.md"

      - name: Headless self-test
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'dist\rah-wall\RAH-WALL.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "RAH-WALL self-test failed: $($p.ExitCode)" }
          Write-Host 'RAH-WALL self-test: OK'

      - name: Generate checksum and build info
        shell: pwsh
        run: |
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist\rah-wall'
          $hash = (Get-FileHash "$dist\RAH-WALL.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  RAH-WALL.exe" | Set-Content "$dist\SHA256.txt" -Encoding ascii
          @(
            'RAH-WALL.exe - native Windows build',
            "Commit: $env:GITHUB_SHA",
            "Built: $(Get-Date -Format o)",
            'Target: Windows x64 / .NET Framework / WinForms + GDI+',
            'HTML: NO',
            'Edge/WebView: NO',
            'Self-test: PASS'
          ) | Set-Content "$dist\BUILD-INFO.txt" -Encoding utf8
          Get-ChildItem $dist | Format-Table Name,Length

      - name: Upload RAH-WALL artifact
        uses: actions/upload-artifact@v4
        with:
          name: RAH-WALL-native-x64
          path: dist/rah-wall/*
          if-no-files-found: error
          retention-days: 30
