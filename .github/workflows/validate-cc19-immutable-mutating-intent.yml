name: Validate CC 1.9 Immutable Mutating Intent Candidate
on:
  pull_request:
    paths:
      - 'rah-command-center-core-v1.9-candidate.js'
      - 'RAH-COMMAND-CENTER-V1.9-CANDIDATE.html'
      - 'RAH-CC19-IMMUTABLE-MUTATING-INTENT-CANDIDATE.json'
      - 'tests/rah-cc19-immutable-mutating-intent.test.mjs'
      - '.github/workflows/validate-cc19-immutable-mutating-intent.yml'
  push:
    branches: [main]
    paths:
      - 'rah-command-center-core-v1.9-candidate.js'
      - 'RAH-COMMAND-CENTER-V1.9-CANDIDATE.html'
      - 'RAH-CC19-IMMUTABLE-MUTATING-INTENT-CANDIDATE.json'
      - 'tests/rah-cc19-immutable-mutating-intent.test.mjs'
      - '.github/workflows/validate-cc19-immutable-mutating-intent.yml'
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Candidate lifecycle scope guard
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch origin main --quiet
          allowed='^(rah-command-center-core-v1\.9-candidate\.js|RAH-COMMAND-CENTER-V1\.9-CANDIDATE\.html|RAH-CC19-IMMUTABLE-MUTATING-INTENT-CANDIDATE\.json|tests/rah-cc19-immutable-mutating-intent\.test\.mjs|\.github/workflows/validate-cc19-immutable-mutating-intent\.yml)$'
          changed="$(git diff --name-only origin/main...HEAD)"
          test -n "$changed" || { echo 'No Candidate lifecycle files changed'; exit 1; }
          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          test -z "$bad" || { echo "$bad"; exit 1; }
      - name: Validate v1.9 immutable intent binding
        run: node --test tests/rah-cc19-immutable-mutating-intent.test.mjs
      - name: Preserve canonical Stable package and v1.8 rollback release
        run: |
          node --test tests/rah-command-center-packaging.test.mjs
          node --test tests/rah-cc18-one-shot-mutating-approval.test.mjs
          node --test tests/rah-cc18-stable-release.test.mjs
      - name: Preserve Stable Node 1.3 live boundary
        run: python3 -m unittest tests/test_rah_node_agent_stable_v13.py -v
      - name: Preserve Raven master and release consumers
        run: |
          node --test tests/rah-cc18-raven-master-sync.test.mjs
          node --test tests/raven-release-gate.test.mjs
          node --test tests/raven-project-registry-v0.1.test.mjs
