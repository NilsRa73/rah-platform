const V7_HELPERS=String.raw`
const rahV7Encoder=new TextEncoder();
function cryptoReadyV7(){return !!(globalThis.crypto&&crypto.subtle&&typeof crypto.getRandomValues==='function'&&globalThis.btoa&&globalThis.TextEncoder)}
function bytesB64UrlV7(buffer){let s='';for(const b of new Uint8Array(buffer))s+=String.fromCharCode(b);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}

async function fetchJsonV7(url,options,timeoutMs){const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),timeoutMs||5000);try{const r=await fetch(url,{...options,credentials:'omit',cache:'no-store',signal:ctl.signal});let payload=null;try{payload=await r.json()}catch(_){}return{ok:r.ok,status:r.status,payload}}finally{clearTimeout(timer)}}

async function checkNodeV7(){const id=document.getElementById('enrollDevice').value,ip=document.getElementById('nodeIp').value.trim(),token=document.getElementById('nodeToken').value.trim(),out=document.getElementById('nodeResult');pendingEnrollment=null;document.getElementById('enrollNodeBtn').disabled=true;if(!core.isAllowedNodeIpv4(ip)||!token){out.className='result bad';out.textContent='Enter a private IPv4 address and current Node Agent token.';return}out.className='result';out.textContent='Checking Node with token-proof authentication; token stays local…';try{const healthReq=core.nodeHealthRequest(ip),healthRes=await proofRequestV7(ip,token,healthReq,'',5000);if(!healthRes.ok)throw new Error('Health proof rejected ('+healthRes.status+').');const health=core.sanitizeNodeHealth(healthRes.payload);if(!health||health.sessionId!==healthRes.authSessionId)throw new Error('Invalid or cross-session Node health.');const actionsReq=core.nodeActionsRequest(ip),actionRes=await proofRequestV7(ip,token,actionsReq,health.sessionId,5000);if(!actionRes.ok)throw new Error('Action catalog proof rejected ('+actionRes.status+').');const catalog=core.sanitizeActionCatalog(actionRes.payload,health.capabilities,health.sessionId);if(!catalog||actionRes.authSessionId!==health.sessionId)throw new Error('Invalid or cross-session v7 action catalog.');pendingEnrollment={id,ip,health,catalog};checks.set(id,true);out.className='result ok';out.textContent='ONLINE NOW · token stayed local · '+health.hostname+' · session '+health.sessionId.slice(0,8)+'… · actions: '+(catalog.actions.join(', ')||'none');document.getElementById('enrollNodeBtn').disabled=false}catch(e){checks.set(id,false);out.className='result bad';out.textContent=e.name==='AbortError'?'Node check timed out.':e.message}finally{document.getElementById('nodeToken').value='';renderDevices()}}
async function freshStorageChallengeV7(d,token){const req=core.actionChallengeRequest(d,'storage-summary.read');if(!req)return'';const res=await proofRequestV7(d.endpointIp,token,req,d.agentSessionId,5000);if(!res.ok)throw new Error('Fresh storage catalog proof rejected ('+res.status+').');const catalog=core.sanitizeActionCatalog(res.payload,d.capabilities,d.agentSessionId),challenge=core.actionChallengeFromCatalog(res.payload,d.capabilities,'storage-summary.read',d.agentSessionId);if(!catalog||res.authSessionId!==d.agentSessionId)throw new Error('Node session/policy changed. Re-check and re-enroll.');if(!catalog.actions.includes('storage-summary.read')||!challenge)throw new Error('Valid storage challenge missing.');return challenge}

async function runApprovedActionV7(){const id=document.getElementById('actionDevice').value,action=document.getElementById('actionId').value,token=document.getElementById('actionToken').value.trim(),out=document.getElementById('actionResult'),d=devices.find(x=>x.id===id);let requesterContext='';if(!d||!core.canExecuteAction(d,action)||!token){out.className='result bad';out.textContent='Advertised + approved action and fresh token are required.';return}try{if(action==='storage-summary.read'){out.className='result';out.textContent='Refreshing v7 catalog and acquiring proof-bound storage challenge…';const challenge=await freshStorageChallengeV7(d,token),req=core.actionExecutionRequest(d,action,challenge),res=await proofRequestV7(d.endpointIp,token,req,d.agentSessionId,5000);if(!res.ok)throw new Error('Storage proof/action rejected ('+res.status+').');const p=core.sanitizeStorageSummary(res.payload);if(!p)throw new Error('Invalid storage response.');out.className='result ok';out.textContent=p.volume+' · '+fmtBytes(p.usedBytes)+' used of '+fmtBytes(p.totalBytes)+' · '+fmtBytes(p.freeBytes)+' free · token stayed local.';return}if(action==='rustdesk.launch'){requesterContext=newRequesterContextV7();out.className='result';out.textContent='Waiting for Node-local confirmation; auth token remains local…';const grant=await freshLocalGrantV7(d,action,token,undefined,requesterContext),req=core.actionExecutionRequest(d,action,grant,requesterContext),res=await proofRequestV7(d.endpointIp,token,req,d.agentSessionId,5000);if(!res.ok)throw new Error('Launch proof/action rejected ('+res.status+').');if(!core.sanitizeLaunchResult(res.payload))throw new Error('Invalid RustDesk launch response.');out.className='result ok';out.textContent='RustDesk launched · token stayed local · requester context + Node-local pair consumed once.';return}throw new Error('No fixed renderer for action.')}catch(e){out.className='result bad';out.textContent=e.name==='AbortError'?'Action or local confirmation timed out.':e.message}finally{requesterContext='';document.getElementById('actionToken').value=''}}

function replaceRange(text,startMarker,endMarker,replacement){const start=text.indexOf(startMarker),end=text.indexOf(endMarker,start+startMarker.length);if(start<0||end<0)throw new Error('Legacy auth range marker missing.');return text.slice(0,start)+replacement+text.slice(end)}
