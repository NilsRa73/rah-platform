<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08090c">
<title>RAH Raven Command Center v1.6 Candidate</title>
<style>
html,body{margin:0;min-height:100%;background:#08090c;color:#f1efe7;font-family:Inter,Segoe UI,system-ui,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;padding:24px}.card{max-width:780px;border:1px solid #303640;border-radius:16px;background:#11141a;padding:24px}.gold{color:#f2d47d}.muted{color:#9da3ae}.bad{color:#ffb4b4}
</style>
</head>
<body>
<div class="boot"><div class="card"><strong class="gold">RAH RAVEN · CC 1.6 CANDIDATE</strong><h1>Loading requester-context bound Command Center…</h1><p class="muted" id="status">Stable 1.5 ephemeral CC approval and Node-local confirmation remain required. Each mutating flow additionally gets one fresh, transient requester context.</p></div></div>
<script>
(async function(){
'use strict';
const SOURCE='RAH-COMMAND-CENTER-V1.2.html';
const CORE_MARKER='<script src="rah-command-center-core.js"><\/script><script>';
const CORE_INJECTION='<script src="rah-command-center-core.js"><\/script><script src="rah-command-center-core-v1.3.js"><\/script><script src="rah-command-center-core-v1.4.js"><\/script><script src="rah-command-center-core-v1.5-candidate.js"><\/script><script src="rah-command-center-core-v1.5.js"><\/script><script src="rah-command-center-core-v1.6-candidate.js"><\/script><script>window.RAHCommandCenterCore=window.RAHCommandCenterRequesterContextCandidate;<\/script><script>';
const LOAD_MARKER="function loadDevices(){try{const r=localStorage.getItem(core.DEVICE_STORAGE_KEY);return core.normalizeDeviceRegistry(r?JSON.parse(r):null)}catch(_){return core.normalizeDeviceRegistry(null)}}";
const LOAD_REPLACEMENT="function loadDevices(){try{const r=localStorage.getItem(core.DEVICE_STORAGE_KEY),loaded=core.normalizeDeviceRegistry(r?JSON.parse(r):null);if(r)localStorage.setItem(core.DEVICE_STORAGE_KEY,JSON.stringify(core.persistableDeviceRegistry(loaded)));return loaded}catch(_){return core.normalizeDeviceRegistry(null)}}";
const SAVE_MARKER="function saveDevices(){devices=core.normalizeDeviceRegistry(devices);localStorage.setItem(core.DEVICE_STORAGE_KEY,JSON.stringify(devices))}";
const SAVE_REPLACEMENT="function saveDevices(){localStorage.setItem(core.DEVICE_STORAGE_KEY,JSON.stringify(core.persistableDeviceRegistry(devices)))}";
const INSERT_MARKER="document.getElementById('continueBtn').onclick=()=>openRelative('RAH-RAVEN-NOW-V2.html')";
const RUN_BIND_MARKER="document.getElementById('runActionBtn').onclick=runApprovedAction";
const RUN_BIND_REPLACEMENT="document.getElementById('runActionBtn').onclick=runApprovedActionV6";
const HANDOFF_BIND_MARKER="document.getElementById('handoffBtn').onclick=runRustDeskHandoff";
const HANDOFF_BIND_REPLACEMENT="document.getElementById('handoffBtn').onclick=runRustDeskHandoffV6";
const V6_HELPERS=String.raw`
function newRequesterContextV6(){if(!(globalThis.crypto&&typeof crypto.getRandomValues==='function'&&globalThis.btoa))throw new Error('Secure random requester context is unavailable; mutating action fails closed.');const bytes=new Uint8Array(32);crypto.getRandomValues(bytes);let raw='';for(const b of bytes)raw+=String.fromCharCode(b);const value=btoa(raw).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');const clean=core.sanitizeRequesterContext(value);if(!clean)throw new Error('Generated requester context failed validation.');return clean}
async function authRequestV6(url,token,method,body,extraHeaders,timeoutMs){const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),timeoutMs||5000),headers={Authorization:'Bearer '+token},allowed=[core.ACTION_CHALLENGE_HEADER,core.LOCAL_APPROVAL_HEADER,core.APPROVAL_ACTION_HEADER,core.APPROVAL_TARGET_HEADER,core.REQUESTER_CONTEXT_HEADER],opts={method,headers,credentials:'omit',cache:'no-store',signal:ctl.signal};if(extraHeaders){for(const [k,v] of Object.entries(extraHeaders)){if(!allowed.includes(k)||typeof v!=='string'||!v)throw new Error('Invalid fixed v6 request header.');headers[k]=v}}if(body!==undefined){headers['Content-Type']='application/json';opts.body=JSON.stringify(body)}try{const r=await fetch(url,opts);let payload=null;try{payload=await r.json()}catch(_){}return{ok:r.ok,status:r.status,payload}}finally{clearTimeout(timer)}}
async function freshStorageChallengeV6(d,token){const pre=core.actionChallengeRequest(d,'storage-summary.read');if(!pre)return'';if(Object.hasOwn(pre.headers||{},core.REQUESTER_CONTEXT_HEADER))throw new Error('Requester context is forbidden on storage challenge flow.');const res=await authRequestV6(pre.url,token,pre.method,undefined,pre.headers);if(!res.ok)throw new Error('Fresh storage catalog rejected ('+res.status+').');const catalog=core.sanitizeActionCatalog(res.payload,d.capabilities,d.agentSessionId),challenge=core.actionChallengeFromCatalog(res.payload,d.capabilities,'storage-summary.read',d.agentSessionId);if(!catalog)throw new Error('Node Agent v6 session/policy/catalog mismatch. Re-check and re-enroll.');if(!catalog.actions.includes('storage-summary.read')||!challenge)throw new Error('Node did not return a valid fresh storage challenge.');return challenge}
async function freshLocalGrantV6(d,action,token,target,requesterContext){const context=core.sanitizeRequesterContext(requesterContext);if(!context)throw new Error('Fresh requester context is required.');const pre=core.localApprovalIntentRequest(d,action,target,context);if(!pre)throw new Error('Requester-context local approval intent could not be built.');const res=await authRequestV6(pre.url,token,pre.method,undefined,pre.headers,35000);if(!res.ok){const e=res.payload&&typeof res.payload.error==='string'?res.payload.error:'local_confirmation_failed';throw new Error('Node-local approval rejected ('+res.status+'): '+e+'.')}const catalog=core.sanitizeActionCatalog(res.payload,d.capabilities,d.agentSessionId),grant=core.localApprovalGrantFromCatalog(res.payload,d.capabilities,action,d.agentSessionId);if(!catalog)throw new Error('Node Agent v6 session/policy/catalog mismatch. Re-check and re-enroll.');if(!catalog.actions.includes(action)||!grant)throw new Error('Node did not return a valid requester-context-bound challenge/proof pair.');return grant}
async function runApprovedActionV6(){const id=document.getElementById('actionDevice').value,action=document.getElementById('actionId').value,token=document.getElementById('actionToken').value.trim(),out=document.getElementById('actionResult'),d=devices.find(x=>x.id===id);if(!d||!core.canExecuteAction(d,action)||!token){out.className='result bad';out.textContent='Action is not both advertised and approved in this CC browser session, or token is missing.';return}let requesterContext='';try{if(action==='storage-summary.read'){out.className='result';out.textContent='Refreshing v6 catalog and acquiring one-time storage challenge…';const challenge=await freshStorageChallengeV6(d,token),req=core.actionExecutionRequest(d,action,challenge);if(!req)throw new Error('Storage request could not be built.');const res=await authRequestV6(req.url,token,req.method,undefined,req.headers);if(!res.ok)throw new Error('Node rejected challenged storage read ('+res.status+').');const p=core.sanitizeStorageSummary(res.payload);if(!p)throw new Error('Invalid storage summary.');out.className='result ok';out.textContent=p.volume+' · '+fmtBytes(p.usedBytes)+' used of '+fmtBytes(p.totalBytes)+' · '+fmtBytes(p.freeBytes)+' free · '+p.usedPercent+'% used. No requester context was sent.';return}if(action==='rustdesk.launch'){requesterContext=newRequesterContextV6();out.className='result';out.textContent='Waiting for local confirmation on the Node Agent host for this fresh requester-context flow…';const grant=await freshLocalGrantV6(d,action,token,undefined,requesterContext),req=core.actionExecutionRequest(d,action,grant,requesterContext);if(!req)throw new Error('Context-bound RustDesk launch request could not be built.');const res=await authRequestV6(req.url,token,req.method,undefined,req.headers);if(!res.ok)throw new Error('Node rejected context-bound launch ('+res.status+').');const p=core.sanitizeLaunchResult(res.payload);if(!p)throw new Error('Invalid RustDesk launch response.');out.className='result ok';out.textContent='RustDesk launched on '+d.label+'. Ephemeral CC approval + Node-local confirmation + requester context + proof/challenge were consumed.';return}throw new Error('No Candidate renderer for action.')}catch(e){out.className='result bad';out.textContent=e.name==='AbortError'?'Action or local confirmation timed out.':e.message}finally{requesterContext='';document.getElementById('actionToken').value=''}}
async function runRustDeskHandoffV6(){const nodeId=document.getElementById('handoffDevice').value,peerId=document.getElementById('handoffPeerId').value.trim(),token=document.getElementById('handoffToken').value.trim(),out=document.getElementById('handoffResult'),d=devices.find(x=>x.id===nodeId);let requesterContext='';if(!d||!core.canHandoffRustDesk(d)||!core.sanitizePeerId(peerId)||!token){out.className='result bad';out.textContent='Select an approved controller node, enter a valid RustDesk ID and current Node Agent token.';document.getElementById('handoffPeerId').value='';document.getElementById('handoffToken').value='';return}out.className='result';out.textContent='Waiting for local Node confirmation of this exact target and fresh requester-context flow…';try{requesterContext=newRequesterContextV6();const grant=await freshLocalGrantV6(d,'rustdesk.connect',token,peerId,requesterContext),req=core.rustDeskHandoffRequest(d,peerId,grant,requesterContext);if(!req)throw new Error('Context-bound handoff request could not be built.');const res=await authRequestV6(req.url,token,req.method,req.body,req.headers);if(!res.ok)throw new Error('Node rejected context-bound handoff ('+res.status+').');const p=core.sanitizeHandoffResult(res.payload);if(!p)throw new Error('Invalid RustDesk handoff response.');out.className='result ok';out.textContent='RustDesk handoff started on '+d.label+'. The same transient requester context bound intent and execution; authentication remains inside RustDesk.'}catch(e){out.className='result bad';out.textContent=e.name==='AbortError'?'Handoff or local confirmation timed out.':e.message}finally{requesterContext='';document.getElementById('handoffPeerId').value='';document.getElementById('handoffToken').value=''}}
`;
const status=document.getElementById('status');
try{
  const sourceUrl=new URL(SOURCE,window.location.href);
  if(sourceUrl.origin!==window.location.origin)throw new Error('Candidate source must be same-origin.');
  const response=await fetch(sourceUrl.href,{cache:'no-store',credentials:'same-origin',redirect:'follow'});
  if(!response.ok)throw new Error('Rollback v1.2 UI surface unavailable ('+response.status+').');
  if(new URL(response.url).origin!==window.location.origin)throw new Error('Cross-origin redirect rejected.');
  const sourceHtml=await response.text();
  const unique=(marker,label)=>{const first=sourceHtml.indexOf(marker);if(first<0||sourceHtml.indexOf(marker,first+marker.length)>=0)throw new Error('Expected unique '+label+' marker not found.');};
  unique(CORE_MARKER,'core');unique(LOAD_MARKER,'load');unique(SAVE_MARKER,'persistence');unique(INSERT_MARKER,'handler insertion');unique(RUN_BIND_MARKER,'run binding');unique(HANDOFF_BIND_MARKER,'handoff binding');
  let candidateHtml=sourceHtml.replace(CORE_MARKER,CORE_INJECTION).replace(LOAD_MARKER,LOAD_REPLACEMENT).replace(SAVE_MARKER,SAVE_REPLACEMENT).replace(INSERT_MARKER,V6_HELPERS+INSERT_MARKER).replace(RUN_BIND_MARKER,RUN_BIND_REPLACEMENT).replace(HANDOFF_BIND_MARKER,HANDOFF_BIND_REPLACEMENT);
  candidateHtml=candidateHtml.replace('<title>RAH Raven Command Center v1.2.0</title>','<title>RAH Raven Command Center v1.6 Candidate</title>');
  candidateHtml=candidateHtml.replace('CC v1.2.0 · Raven 2.0.32','CC v1.6 Candidate · Raven 2.0.32');
  candidateHtml=candidateHtml.replace('RAH AI STUDIOS · SESSION-BOUND ENROLLMENT','RAH AI STUDIOS · REQUESTER-CONTEXT CANDIDATE');
  candidateHtml=candidateHtml.replace('Enrollment is now bound to one Node Agent process session. Agent restart forces explicit re-verification before actions can run; no new action power is added.','Stable session/policy binding, ephemeral CC approval and Node-local confirmation remain. Mutating flows additionally require one fresh requester context; no new action power is added.');
  candidateHtml=candidateHtml.replace('Each click first refreshes the authenticated action catalog, then consumes one action-bound 60-second challenge.','Storage uses no requester context. Each mutating flow creates one CSPRNG requester context and reuses it only for the matching local-approval intent and execution.');
  candidateHtml=candidateHtml.replace('Target ID, token and one-time challenge are transient; none are written to browser storage.','Target ID, token, requester context, challenge and Node-local proof are transient; none are written to browser storage.');
  candidateHtml=candidateHtml.replace('RAH Raven Command Center v1.2 · session-bound enrollment + one-time challenge · no challenge/token/peer-ID/password storage · no arbitrary process · no shell · no installer · no native remote-control endpoint.','RAH Raven Command Center v1.6 Candidate · ephemeral CC approval + Node-local proof + requester-context binding · no context/proof/challenge/token/peer-ID/password storage · no arbitrary process · no shell · no native remote-control endpoint.');
  document.open();document.write(candidateHtml);document.close();
}catch(error){status.className='bad';status.textContent='Candidate failed closed: '+(error&&error.message?error.message:'unknown loader error');}
})();
</script>
</body>
</html>
