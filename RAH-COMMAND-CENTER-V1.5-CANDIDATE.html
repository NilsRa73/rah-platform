<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08090c">
<title>RAH Raven Command Center v1.5 Candidate</title>
<style>
html,body{margin:0;min-height:100%;background:#08090c;color:#f1efe7;font-family:Inter,Segoe UI,system-ui,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;padding:24px}.card{max-width:760px;border:1px solid #303640;border-radius:16px;background:#11141a;padding:24px}.gold{color:#f2d47d}.muted{color:#9da3ae}.bad{color:#ffb4b4}
</style>
</head>
<body>
<div class="boot"><div class="card"><strong class="gold">RAH RAVEN · CC 1.5 CANDIDATE</strong><h1>Loading Node-local approval proof Command Center…</h1><p class="muted" id="status">Stable 1.4 ephemeral browser approvals remain required. Mutating actions additionally wait for confirmation on the Node Agent host.</p></div></div>
<script>
(async function(){
'use strict';
const SOURCE='RAH-COMMAND-CENTER-V1.2.html';
const CORE_MARKER='<script src="rah-command-center-core.js"><\/script><script>';
const CORE_INJECTION='<script src="rah-command-center-core.js"><\/script><script src="rah-command-center-core-v1.3.js"><\/script><script src="rah-command-center-core-v1.4.js"><\/script><script src="rah-command-center-core-v1.5-candidate.js"><\/script><script>window.RAHCommandCenterCore=window.RAHCommandCenterLocalProofCandidate;<\/script><script>';
const LOAD_MARKER="function loadDevices(){try{const r=localStorage.getItem(core.DEVICE_STORAGE_KEY);return core.normalizeDeviceRegistry(r?JSON.parse(r):null)}catch(_){return core.normalizeDeviceRegistry(null)}}";
const LOAD_REPLACEMENT="function loadDevices(){try{const r=localStorage.getItem(core.DEVICE_STORAGE_KEY),loaded=core.normalizeDeviceRegistry(r?JSON.parse(r):null);if(r)localStorage.setItem(core.DEVICE_STORAGE_KEY,JSON.stringify(core.persistableDeviceRegistry(loaded)));return loaded}catch(_){return core.normalizeDeviceRegistry(null)}}";
const SAVE_MARKER="function saveDevices(){devices=core.normalizeDeviceRegistry(devices);localStorage.setItem(core.DEVICE_STORAGE_KEY,JSON.stringify(devices))}";
const SAVE_REPLACEMENT="function saveDevices(){localStorage.setItem(core.DEVICE_STORAGE_KEY,JSON.stringify(core.persistableDeviceRegistry(devices)))}";
const INSERT_MARKER="document.getElementById('continueBtn').onclick=()=>openRelative('RAH-RAVEN-NOW-V2.html')";
const RUN_BIND_MARKER="document.getElementById('runActionBtn').onclick=runApprovedAction";
const RUN_BIND_REPLACEMENT="document.getElementById('runActionBtn').onclick=runApprovedActionV5";
const HANDOFF_BIND_MARKER="document.getElementById('handoffBtn').onclick=runRustDeskHandoff";
const HANDOFF_BIND_REPLACEMENT="document.getElementById('handoffBtn').onclick=runRustDeskHandoffV5";
const V5_HELPERS=String.raw`
async function authRequestV5(url,token,method,body,extraHeaders,timeoutMs){const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),timeoutMs||5000),headers={Authorization:'Bearer '+token},allowed=[core.ACTION_CHALLENGE_HEADER,core.LOCAL_APPROVAL_HEADER,core.APPROVAL_ACTION_HEADER,core.APPROVAL_TARGET_HEADER],opts={method,headers,credentials:'omit',cache:'no-store',signal:ctl.signal};if(extraHeaders){for(const [k,v] of Object.entries(extraHeaders)){if(!allowed.includes(k)||typeof v!=='string'||!v)throw new Error('Invalid fixed v5 request header.');headers[k]=v}}if(body!==undefined){headers['Content-Type']='application/json';opts.body=JSON.stringify(body)}try{const r=await fetch(url,opts);let payload=null;try{payload=await r.json()}catch(_){}return{ok:r.ok,status:r.status,payload}}finally{clearTimeout(timer)}}
async function freshStorageChallengeV5(d,token){const pre=core.actionChallengeRequest(d,'storage-summary.read');if(!pre)return'';const res=await authRequestV5(pre.url,token,pre.method,undefined,pre.headers);if(!res.ok)throw new Error('Fresh storage catalog rejected ('+res.status+').');const catalog=core.sanitizeActionCatalog(res.payload,d.capabilities,d.agentSessionId),challenge=core.actionChallengeFromCatalog(res.payload,d.capabilities,'storage-summary.read',d.agentSessionId);if(!catalog)throw new Error('Node Agent v5 session changed or catalog is invalid. Re-check and re-enroll.');if(!catalog.actions.includes('storage-summary.read')||!challenge)throw new Error('Node did not return a valid fresh storage challenge.');return challenge}
async function freshLocalGrantV5(d,action,token,target){const pre=core.localApprovalIntentRequest(d,action,target);if(!pre)throw new Error('Node-local approval intent could not be built.');const res=await authRequestV5(pre.url,token,pre.method,undefined,pre.headers,35000);if(!res.ok){const e=res.payload&&typeof res.payload.error==='string'?res.payload.error:'local_confirmation_failed';throw new Error('Node-local approval rejected ('+res.status+'): '+e+'.')}const catalog=core.sanitizeActionCatalog(res.payload,d.capabilities,d.agentSessionId),grant=core.localApprovalGrantFromCatalog(res.payload,d.capabilities,action,d.agentSessionId);if(!catalog)throw new Error('Node Agent v5 session changed or catalog is invalid. Re-check and re-enroll.');if(!catalog.actions.includes(action)||!grant)throw new Error('Node did not return a valid locally confirmed challenge/proof pair.');return grant}
async function runApprovedActionV5(){const id=document.getElementById('actionDevice').value,action=document.getElementById('actionId').value,token=document.getElementById('actionToken').value.trim(),out=document.getElementById('actionResult'),d=devices.find(x=>x.id===id);if(!d||!core.canExecuteAction(d,action)||!token){out.className='result bad';out.textContent='Action is not both advertised and approved in this CC browser session, or token is missing.';return}try{if(action==='storage-summary.read'){out.className='result';out.textContent='Refreshing v5 catalog and acquiring one-time storage challenge…';const challenge=await freshStorageChallengeV5(d,token),req=core.actionExecutionRequest(d,action,challenge);if(!req)throw new Error('Storage request could not be built.');const res=await authRequestV5(req.url,token,req.method,undefined,req.headers);if(!res.ok)throw new Error('Node rejected challenged storage read ('+res.status+').');const p=core.sanitizeStorageSummary(res.payload);if(!p)throw new Error('Invalid storage summary.');out.className='result ok';out.textContent=p.volume+' · '+fmtBytes(p.usedBytes)+' used of '+fmtBytes(p.totalBytes)+' · '+fmtBytes(p.freeBytes)+' free · '+p.usedPercent+'% used. One-time challenge consumed.';return}if(action==='rustdesk.launch'){out.className='result';out.textContent='Waiting for local confirmation on the Node Agent host…';const grant=await freshLocalGrantV5(d,action,token),req=core.actionExecutionRequest(d,action,grant);if(!req)throw new Error('Locally confirmed RustDesk launch request could not be built.');const res=await authRequestV5(req.url,token,req.method,undefined,req.headers);if(!res.ok)throw new Error('Node rejected locally confirmed launch ('+res.status+').');const p=core.sanitizeLaunchResult(res.payload);if(!p)throw new Error('Invalid RustDesk launch response.');out.className='result ok';out.textContent='RustDesk launched on '+d.label+'. CC approval + Node-local confirmation + paired proof/challenge were consumed.';return}throw new Error('No Candidate renderer for action.')}catch(e){out.className='result bad';out.textContent=e.name==='AbortError'?'Action or local confirmation timed out.':e.message}finally{document.getElementById('actionToken').value=''}}
async function runRustDeskHandoffV5(){const nodeId=document.getElementById('handoffDevice').value,peerId=document.getElementById('handoffPeerId').value.trim(),token=document.getElementById('handoffToken').value.trim(),out=document.getElementById('handoffResult'),d=devices.find(x=>x.id===nodeId);if(!d||!core.canHandoffRustDesk(d)||!core.sanitizePeerId(peerId)||!token){out.className='result bad';out.textContent='Select an approved controller node, enter a valid RustDesk ID and current Node Agent token.';document.getElementById('handoffPeerId').value='';document.getElementById('handoffToken').value='';return}out.className='result';out.textContent='Waiting for local Node confirmation of this exact RustDesk target…';try{const grant=await freshLocalGrantV5(d,'rustdesk.connect',token,peerId),req=core.rustDeskHandoffRequest(d,peerId,grant);if(!req)throw new Error('Locally confirmed handoff request could not be built.');const res=await authRequestV5(req.url,token,req.method,req.body,req.headers);if(!res.ok)throw new Error('Node rejected locally confirmed handoff ('+res.status+').');const p=core.sanitizeHandoffResult(res.payload);if(!p)throw new Error('Invalid RustDesk handoff response.');out.className='result ok';out.textContent='RustDesk handoff started on '+d.label+'. The proof was bound to this validated target and consumed once; authentication stays inside RustDesk.'}catch(e){out.className='result bad';out.textContent=e.name==='AbortError'?'Handoff or local confirmation timed out.':e.message}finally{document.getElementById('handoffPeerId').value='';document.getElementById('handoffToken').value=''}}
`;
const status=document.getElementById('status');
try{
  const sourceUrl=new URL(SOURCE,window.location.href);
  if(sourceUrl.origin!==window.location.origin)throw new Error('Candidate source must be same-origin.');
  const response=await fetch(sourceUrl.href,{cache:'no-store',credentials:'same-origin',redirect:'follow'});
  if(!response.ok)throw new Error('Rollback v1.2 UI surface unavailable ('+response.status+').');
  if(new URL(response.url).origin!==window.location.origin)throw new Error('Cross-origin redirect rejected.');
  const sourceHtml=await response.text();
  const unique=(marker,label)=>{const first=sourceHtml.indexOf(marker);if(first<0||sourceHtml.indexOf(marker,first+marker.length)>=0)throw new Error('Expected unique '+label+' marker not found.');};
  unique(CORE_MARKER,'core');unique(LOAD_MARKER,'load');unique(SAVE_MARKER,'persistence');unique(INSERT_MARKER,'handler insertion');unique(RUN_BIND_MARKER,'run binding');unique(HANDOFF_BIND_MARKER,'handoff binding');
  let candidateHtml=sourceHtml.replace(CORE_MARKER,CORE_INJECTION).replace(LOAD_MARKER,LOAD_REPLACEMENT).replace(SAVE_MARKER,SAVE_REPLACEMENT).replace(INSERT_MARKER,V5_HELPERS+INSERT_MARKER).replace(RUN_BIND_MARKER,RUN_BIND_REPLACEMENT).replace(HANDOFF_BIND_MARKER,HANDOFF_BIND_REPLACEMENT);
  candidateHtml=candidateHtml.replace('<title>RAH Raven Command Center v1.2.0</title>','<title>RAH Raven Command Center v1.5 Candidate</title>');
  candidateHtml=candidateHtml.replace('CC v1.2.0 · Raven 2.0.32','CC v1.5 Candidate · Raven 2.0.32');
  candidateHtml=candidateHtml.replace('RAH AI STUDIOS · SESSION-BOUND ENROLLMENT','RAH AI STUDIOS · NODE-LOCAL APPROVAL PROOF CANDIDATE');
  candidateHtml=candidateHtml.replace('Enrollment is now bound to one Node Agent process session. Agent restart forces explicit re-verification before actions can run; no new action power is added.','Enrollment remains session/policy bound. Mutating fixed actions additionally require a short-lived Node-local human confirmation proof; no new action power is added.');
  candidateHtml=candidateHtml.replace('Each click first refreshes the authenticated action catalog, then consumes one action-bound 60-second challenge.','Storage consumes a fresh v5 challenge. Mutating actions also require a 30-second Node-local human confirmation proof paired to the challenge.');
  candidateHtml=candidateHtml.replace('The generic runner still excludes <code>rustdesk.connect</code>. A challenge is fetched only from the fixed <code>/actions</code> route, sent only in <code>X-RAH-Action-Challenge</code>, consumed once, and never persisted.','The generic runner still excludes <code>rustdesk.connect</code>. RustDesk launch requires CC-session approval plus local confirmation on the Node host; proof and challenge are consumed once and never persisted.');
  candidateHtml=candidateHtml.replace('Target ID, token and one-time challenge are transient; none are written to browser storage.','Target ID, token, challenge and Node-local proof are transient; none are written to browser storage.');
  candidateHtml=candidateHtml.replace('Only plain numeric IDs (6–20 digits) or conservative custom IDs are accepted. The click first gets a fresh <code>rustdesk.connect</code> challenge, then sends exact JSON <code>{peerId}</code> plus the fixed challenge header. Password, path, arguments, URL/server/key strings and extra fields are not supported.','Only validated RustDesk IDs are accepted. The exact target is shown locally on the Node host before a paired proof/challenge is issued; execution then sends only typed <code>{peerId}</code> plus the two fixed security headers. Password, path, arguments, URL/server/key strings and extra fields are not supported.');
  candidateHtml=candidateHtml.replace('RAH Raven Command Center v1.2 · session-bound enrollment + one-time challenge · no challenge/token/peer-ID/password storage · no arbitrary process · no shell · no installer · no native remote-control endpoint.','RAH Raven Command Center v1.5 Candidate · ephemeral CC approval + Node-local proof + v5 challenge · no proof/challenge/token/peer-ID/password storage · no arbitrary process · no shell · no native remote-control endpoint.');
  document.open();document.write(candidateHtml);document.close();
}catch(error){status.className='bad';status.textContent='Candidate failed closed: '+(error&&error.message?error.message:'unknown loader error');}
})();
</script>
</body>
</html>
